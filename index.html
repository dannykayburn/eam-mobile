<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--
    PWA tags belong HERE as well as on every screen (§31.6, added 2026-09-21).

    iOS captures a site's web-app configuration at the moment "Add to Home
    Screen" is tapped, from the page then displayed. This root page is the
    natural thing to add — it is what the shared URL resolves to — and until
    now it carried none of these tags, so adding it produced a plain Safari
    bookmark that opened with the browser toolbar visible. The 16 screens each
    had the tags; the entry point did not.

    Two consequences worth knowing:
      - An existing home-screen icon NEVER upgrades itself. After any change
        here, the icon has to be deleted and re-added.
      - The manifest lives at the REPO ROOT, not in prototypes/standalone/,
        precisely so this page is inside its `scope`. With the manifest one
        directory down, the root was out of scope and could not launch
        standalone at all. Don't move it back.
  -->
  <meta name="theme-color" content="#1A1A1F">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="EAM">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="prototypes/standalone/shared/img/icon-180.png">
  <title>HxGN EAM Mobile Prototype</title>
  <!--
    The redirect stays a meta refresh. It is bypassed entirely on a standalone
    launch, because the manifest's `start_url` points straight at the login
    screen — so this page is only ever seen by a browser visit.
  -->
  <meta http-equiv="refresh" content="0; url=prototypes/standalone/eam-login-prototype-v1.html">
  <style>
    html { -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      background: #1A1A1F; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      text-align: center; padding: 24px;
    }
    a { color: #16C130; }
  </style>
</head>
<body>
  <p>Redirecting to the <a href="prototypes/standalone/eam-login-prototype-v1.html">demo login screen</a>&hellip;</p>
</body>
</html>
