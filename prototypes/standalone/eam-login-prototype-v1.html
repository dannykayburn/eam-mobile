<!--
  LOGIN SCREEN — rebuilt 2026-10-20 onto the OCTAVE MOBILE SIGN-IN SCREEN
  (ux.octave.com › Shared Services › Sign In, Mobile tab; spec = that
  page's llms.md §7/§8). Replaces Danny's 2026-07-22 Attune EAM hero/card
  riff (dark swoosh hero over a light card): one sign-in serves every
  Octave product, so the screen never names a product — the title is
  "Sign in to Octave", not "Attune EAM" (llms.md §1).

  Layout (llms.md §7): full-screen dark page, pillar swirl lines at the
  bottom masked by the dark top shape, white Octave logo, 300px form,
  filled fields with no visible label, "Keep me signed in", white pill
  primary, "Don't have an account? Sign Up", footer Reset Password /
  Copyright Information / "English ⌄". The region is a kit dark theme
  root (data-uxt-theme="dark"), so it stays dark whatever the app theme.

  Flow (llms.md §8, Okta's, never changed): two steps — Identify
  (Username, Keep me signed in, Next) → Verify with your password
  (Password with show/hide, Verify). An empty submit shows "This field
  cannot be left blank" on the field.

  Every control is a real kit element: <uxt-input> fields (restyled to the
  spec's filled #3E4047 field, the one deliberate reach into the kit's
  input internals on this screen), <uxt-icon-button> eye toggle,
  <uxt-checkbox>, <uxt-button> primary / text links, and a
  <uxt-flyover-menu> language picker.

  KEPT FROM DANNY: BCAMPBELL / password are pre-filled ("bake in BCAMPBELL
  and PW") and stay live fields; Verify runs startLogin() unchanged —
  resetDemoState(), the ~2s branded loading take-over, then navigation to
  eam-home-screen-prototype-v1.html. The dev theme bar stays (Login has no
  header menu to host it, §31.6) so a theme picked here still carries to
  Home; this screen itself is always the dark sign-in.
-->
<style>
body{background:var(--uxt-theme-palette-ui-black-700,#1a1a1f);}
.app{background:var(--uxt-theme-palette-ui-black-700,#1a1a1f);}

/* ── OCTAVE MOBILE SIGN-IN (llms.md §7) ── */
.m-login{position:relative;flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;
  background:var(--uxt-theme-palette-ui-black-700,#1a1a1f);color:var(--uxt-theme-palette-common-white,#fff);
  font-family:var(--font-sans);}
/* Pillar swirl lines at the bottom, masked by the dark top shape. */
.m-login__swirl{position:absolute;left:-285px;top:260px;width:1240px;height:1240px;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.m-login__swirl svg{width:961px;height:793px;transform:rotate(45deg);flex:none;}
.m-login__mask{position:absolute;left:-13px;top:-9px;width:calc(100% + 26px);height:374px;pointer-events:none;}
.m-login__main{position:relative;z-index:1;flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;padding-top:var(--k-s6);}
.m-login__logo{width:107px;height:70px;display:block;}
.m-login__body{width:300px;display:flex;flex-direction:column;}
.m-login__title{height:40px;display:flex;align-items:center;justify-content:center;margin:0 0 var(--k-s2);font-size:var(--k-body2);font-weight:500;line-height:20px;}
.m-login__step{display:flex;flex-direction:column;}
.m-login__step[hidden]{display:none;}
.m-login__fields{display:flex;flex-direction:column;gap:var(--k-s4);}
.m-login__fields > uxt-input{display:block;width:100%;}
/* Spec field (llms.md §7): 40px, filled #3E4047, 8px radius, 16px side
   padding, no visible label, #A1A7B3 placeholder. Scoped to this screen. */
.m-login uxt-input .input-bar{background:var(--uxt-theme-palette-ui-black-400,#3e4047);border-color:transparent;padding:0 var(--k-s4);}
.m-login uxt-input .input-field:not(.state-error) .input-bar:focus-within{border-color:var(--uxt-theme-palette-ui-grey-300,#a1a7b3);}
.m-login uxt-input .input-value{color:var(--uxt-theme-palette-common-white,#fff);}
.m-login uxt-input .input-value::placeholder{color:var(--uxt-theme-palette-ui-grey-300,#a1a7b3);}
/* Password: the eye Icon Button sits at the field's end. */
.m-login__pass{position:relative;}
.m-login__pass uxt-input .input-bar{padding-right:48px;}
.m-login__pass > uxt-icon-button{position:absolute;right:0;top:0;}
.m-login__keep{margin-top:var(--k-s6);}
.m-login__primary{margin-top:var(--k-s6);}
/* Primary = the spec's white pill with #1A1A1F ink (llms.md §7), on the
   kit contained button. */
.m-login__primary .btn{background:var(--uxt-theme-palette-common-white,#fff) !important;color:var(--uxt-theme-palette-ui-black-700,#1a1a1f) !important;}
.m-login__signup{height:40px;margin-top:var(--k-s2);display:flex;align-items:center;justify-content:center;gap:var(--k-s1);font-size:var(--k-body2);line-height:20px;}
.m-login__footer{position:relative;z-index:1;width:300px;padding-bottom:20px;display:flex;flex-direction:column;align-items:center;}
.m-login__footer > uxt-button,.m-login__footer > uxt-flyover-menu{display:block;}

/* ── LOADING TAKE-OVER (Danny's, kept: the ~2s hand-off into Home) ── */
.login-loading{position:absolute;inset:0;z-index:20;background:var(--uxt-theme-palette-ui-black-700,#1a1a1f);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .35s;overflow:hidden;}
.login-loading.show{opacity:1;pointer-events:auto;}
.login-loading.fading{opacity:0;}
.loading-mark-wrap img{height:56px;width:auto;display:block;animation:loginPulse 1.3s ease-in-out infinite;}
@keyframes loginPulse{0%{transform:scale(.88);opacity:.7;}50%{transform:scale(1.06);opacity:1;}100%{transform:scale(.88);opacity:.7;}}
/* No kit progress component exists; the bar is the four pillar accents. */
.loading-bar-track{width:140px;height:4px;border-radius:var(--k-pill);background:color-mix(in srgb,var(--uxt-theme-palette-common-white,#fff) 18%,transparent);margin-top:var(--k-s6);overflow:hidden;}
.loading-bar-fill{height:100%;width:0%;border-radius:var(--k-pill);background:linear-gradient(90deg,var(--uxt-theme-palette-design-main,#00FFFF),var(--uxt-theme-palette-build-main,#FFF500),var(--uxt-theme-palette-operate-main,#FF00C7),var(--uxt-theme-palette-protect-main,#4FFF00));}
.login-loading.show .loading-bar-fill{animation:barFill 1.7s ease-out forwards;}
@keyframes barFill{from{width:0%;}to{width:100%;}}
.loading-status{margin-top:var(--k-sm);font-size:var(--k-caption);font-weight:500;color:var(--uxt-theme-palette-ui-grey-300,#a1a7b3);}

<body>

<script src="shared/eam-shared.js?v=202609211648"></script>
<script>
initThemeToggle();
// Kit buttons take their label from `text`; shared code writes the dev
// labels into the hidden #id spans by textContent, so mirror them across.
function kitMirrorProtoButtons() {
  document.querySelectorAll('uxt-button[data-mirror]').forEach(btn => {
    const src = document.getElementById(btn.dataset.mirror);
    if (!src) return;
    const sync = () => { if (btn.getAttribute('text') !== src.textContent) btn.setAttribute('text', src.textContent); };
    sync();
    if (typeof MutationObserver !== 'undefined') new MutationObserver(sync).observe(src, { childList: true, characterData: true, subtree: true });
  });
}
kitMirrorProtoButtons();

// Empty submit → the field's own error state + "This field cannot be left
// blank" (llms.md §8). The error clears on the next keystroke.
function loginFieldFilled(el) {
  const ok = !!String(el.value || '').trim();
  if (ok) { el.removeAttribute('state'); el.removeAttribute('show-helper-text'); }
  else { el.setAttribute('state', 'error'); el.setAttribute('show-helper-text', ''); el.focus(); }
  return ok;
}
['loginUser', 'loginPass'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('input', () => { if (el.getAttribute('state') === 'error' && String(el.value).trim()) { el.removeAttribute('state'); el.removeAttribute('show-helper-text'); } });
  el.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); id === 'loginUser' ? loginNext() : startLogin(); } });
});

// Step 1 → Step 2 (Okta's identify-first flow, llms.md §8).
function loginNext() {
  if (!loginFieldFilled(document.getElementById('loginUser'))) return;
  document.getElementById('loginStepIdentify').hidden = true;
  document.getElementById('loginStepVerify').hidden = false;
  document.getElementById('loginTitle').textContent = 'Verify with your password';
  setTimeout(() => document.getElementById('loginPass').focus(), 50);
}
function togglePasswordVisibility() {
  const pass = document.getElementById('loginPass');
  const eye = document.getElementById('loginPassEye');
  const show = pass.getAttribute('type') === 'password';
  pass.setAttribute('type', show ? 'text' : 'password');
  eye.setAttribute('icon', show ? 'visibility-off' : 'visibility');
  eye.setAttribute('label', show ? 'Hide password' : 'Show password');
  eye.setAttribute('aria-pressed', String(show));
}
// Language: the kit flyover reads its rows once, so a pick rebuilds them
// with the new `selected` row and relabels the trigger.
(function initLoginLang() {
  const fm = document.getElementById('loginLang');
  const LANGS = [['en', 'English'], ['de', 'Deutsch'], ['es', 'Español'], ['fr', 'Français'], ['ja', '日本語']];
  fm.addEventListener('select', (e) => {
    const v = e.detail && e.detail.value;
    const hit = LANGS.find(l => l[0] === v);
    if (!hit) return;
    fm.items = LANGS.map(([value, text]) => ({ value, text, selected: value === v, children: [] }));
    fm.setAttribute('trigger-text', hit[1]);
  });
})();

function startLogin() {
  const btn = document.getElementById('loginBtn');
  if (btn.hasAttribute('disabled')) return;
  if (!loginFieldFilled(document.getElementById('loginPass'))) return;
  btn.setAttribute('disabled', '');
  // Reset affordance for demo progress (added 2026-07-22, broadened
  // 2026-07-23 past just the sync outbox — see resetDemoState() in
  // eam-shared.js for the full list) — a fresh login is this app's one
  // real, always-present "start the demo over" moment, so resolving
  // errors/reordering tiles/etc. during a walkthrough doesn't strand a
  // later run with nothing left to demo. Theme is deliberately untouched
  // — it's a real preference, not demo progress, and survives a fresh
  // login same as it survives navigation. Reachable from anywhere via
  // the "Reset demo" row in every other screen's header menu
  // (injectProtoMenuGroup(), eam-shared.js) or the Profile menu's real
  // Log out item (goToLogin(), wired 2026-07-24, same shared function
  // both call) — either just navigates here; this is still the only
  // place the reset itself runs.
  resetDemoState();
  const overlay = document.getElementById('loginLoading');
  overlay.classList.add('show');
  setTimeout(() => {
    overlay.classList.add('fading');
    setTimeout(() => { location.href = 'eam-home-screen-prototype-v1.html'; }, 380);
  }, 1750);
}
</script>
