<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Checklist Redesign — Option B: Focused Stepper (v2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/eam-shared.css">
<!--
  DESIGN EXPLORATION — NOT A LOCKED SCREEN. Option B of 3 for the Activity
  Checklist redesign, v2 iteration (v1 had 4 small pills — Instructions/
  Attachments/Notes/Follow-up — that just showed a toast; this pass makes
  each one a real, standard-shaped piece of the screen instead of a stub):

  - Notes is now a real always-visible field, same shape as UDF01 in
    sample-screen-standard-model-prototype.html (§5.2): a .form-field
    with a .field-inline-input textarea, 255 chars, auto-grow — not
    hidden behind a tap target.
  - Attachments became a real "Documents" container, and a "Comments"
    container was added alongside it — both reuse the exact shared
    §7.2 data-driven pattern (.rv-section/.rv-toggle-row/.rv-collapse +
    renderCommentsExcerptMount()/renderDocumentsExcerptMount() from
    eam-shared.js) that Equipment/WO Record View already use. Since only
    one item is on screen at a time, the trick is rebinding the shared
    COMMENTS_DATA/DOCUMENTS_DATA globals to the focused item's own arrays
    on every render — the shared functions don't know or care that the
    "record" they're rendering for is actually one checklist item.
  - Follow-up moved from a small pill into its own full-width, orange-
    outlined button with real presence — "a healthy spot," not one of
    four competing pills.
  - The answer control now sits inside a .section-card instead of a
    bare dashed box, so the screen reads as an ordinary EAM record
    screen (cards, form-fields, collapsible containers) rather than a
    bespoke widget — while keeping the large tap targets that are this
    option's actual point.
  - Auto-advance on answering was removed. With Notes/Comments/Documents
    now real, persistent affordances on every item, snapping to the next
    item 220ms after an answer would yank the tech away before they could
    use any of them. Next is now always an explicit tap.
-->
<style>
.content { padding: 0 0 calc(var(--bar-height) + 16px); display: flex; flex-direction: column; }

.stepper-head { position: sticky; top: 0; z-index: 5; padding: 10px 16px 8px; background: var(--bg-card); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.stepper-head-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
.stepper-head-left { display: flex; align-items: baseline; gap: 5px; min-width: 0; }
.stepper-group-name { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stepper-group-name.g-safety { color: #854F0B; } .stepper-group-name.g-main { color: #6600CC; } .stepper-group-name.g-close { color: #007A0D; }
[data-theme="dark"] .stepper-group-name.g-safety { color: #FAC775; } [data-theme="dark"] .stepper-group-name.g-main { color: #CC77FF; } [data-theme="dark"] .stepper-group-name.g-close { color: #5DCAA5; }
/* Plain muted text, not a pill/badge — a second competing pill here was
   part of what read as "scrunched." Mono per 2026-07-21 follow-up — this
   is a count, same family as every other count/number in the app. */
.stepper-item-count { font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--gray-4); white-space: nowrap; }
.view-all-btn { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: var(--gray-4); background: var(--bg-section); border: 1px solid var(--border); border-radius: 100px; padding: 5px 11px; cursor: pointer; flex-shrink: 0; }
/* Checklist-wide completion bar — replaces the old per-item dot strip.
   Dots don't scale (a 100-item checklist would need ~3px slivers, neither
   readable nor tappable); a single proportional fill does, at any N. Not
   grouped visually anymore either — group context lives in the text above
   the bar instead. Position within the list is "View all" 's job now, not
   this bar's — at 100 items a plain scrollable row list (already how
   "View all" renders) is the only thing that actually scales for jumping
   to a specific item. */
.stepper-progress-bar { height: 4px; border-radius: 100px; background: var(--gray-1); overflow: hidden; }
[data-theme="dark"] .stepper-progress-bar { background: var(--gray-5); }
.stepper-progress-fill { height: 100%; background: var(--green); transition: width .3s; }

.focus-wrap { flex: 1; padding: 14px 0 4px; }
.focus-label-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 0 16px; margin-bottom: 10px; }
.focus-label { flex: 1; font-size: 19px; font-weight: 700; color: var(--octave-black); line-height: 1.3; }
[data-theme="dark"] .focus-label { color: var(--white); }
/* Required — back beside the item description (its original "up top"
   spot, not the rail) per 2026-07-21 follow-up; same org-corner-badge
   shape/font as before, just a touch smaller now that it sits next to
   text instead of alone in a header row. */
.focus-req-tag { flex-shrink: 0; margin-top: 2px; display: inline-flex; align-items: center; font-family: var(--font-sans); font-size: 11px; font-weight: 600; color: var(--orange); background: rgba(244,102,0,.1); border: 1px solid rgba(244,102,0,.3); border-radius: 999px; padding: 4px 9px; }
/* Dynamic checklist items — a trigger item's answer can insert new items
   right after it (§ new 2026-07-21). This tag marks a dynamically-added
   item's provenance; the hint marks the trigger item itself. Purple,
   same "linked content" language the app already uses elsewhere. */
.focus-dynamic-tag { display: flex; align-items: center; gap: 6px; margin: 0 16px 6px; font-size: 11px; font-weight: 600; color: var(--purple); }
.focus-dynamic-hint { display: flex; align-items: center; gap: 6px; margin: 8px 16px 0; font-size: 11.5px; color: var(--gray-4); }
.focus-dynamic-tag svg, .focus-dynamic-hint svg { color: var(--purple); flex-shrink: 0; }

.focus-control { padding: 18px 16px; }
.f-toggle { display: flex; flex-direction: column; gap: 10px; }
.f-opt { padding: 18px 0; text-align: center; font-size: 16px; font-weight: 700; border-radius: 10px; border: 2px solid var(--gray-2); color: var(--octave-black); background: var(--bg-page); cursor: pointer; transition: all .15s; }
[data-theme="dark"] .f-opt { border-color: var(--gray-5); color: var(--white); background: var(--bg-section); }
.f-opt.sel-green  { background: var(--green);  border-color: var(--green);  color: #fff; }
.f-opt.sel-red    { background: var(--red);    border-color: var(--red);    color: #fff; }
.f-opt.sel-orange { background: var(--orange); border-color: var(--orange); color: #fff; }
.f-opt.sel-gray   { background: var(--gray-4); border-color: var(--gray-4); color: #fff; }

.f-chk { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 22px 0; border-radius: 10px; border: 2px solid var(--gray-2); background: var(--bg-page); cursor: pointer; }
[data-theme="dark"] .f-chk { border-color: var(--gray-5); background: var(--bg-section); }
.f-chk.checked { border-color: var(--green); background: rgba(0,170,20,0.08); }
.f-chk-circle { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--gray-3); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.f-chk.checked .f-chk-circle { background: var(--green); border-color: var(--green); }
.f-chk-circle svg { display: none; }
.f-chk.checked .f-chk-circle svg { display: block; }
.f-chk-lbl { font-size: 15px; font-weight: 600; color: var(--octave-black); }
[data-theme="dark"] .f-chk-lbl { color: var(--white); }

.f-num-row { display: flex; align-items: center; gap: 12px; justify-content: center; }
.f-num-in { width: 150px; background: var(--bg-page); border: 2px solid var(--gray-2); border-radius: 10px; padding: 16px 14px; font-size: 22px; font-weight: 700; color: var(--octave-black); font-family: var(--font-mono); text-align: center; outline: none; }
[data-theme="dark"] .f-num-in { background: var(--bg-section); border-color: var(--gray-5); color: var(--white); }
.f-num-in:focus { border-color: var(--purple); }
.f-uom { font-size: 14px; color: var(--gray-4); font-weight: 600; }
.f-range-hint { text-align: center; font-size: 11px; color: var(--gray-4); font-family: var(--font-mono); margin-top: 10px; }
.f-textarea { width: 100%; min-height: 120px; background: var(--bg-page); border: 2px solid var(--gray-2); border-radius: 10px; padding: 12px 13px; font-size: 15px; color: var(--octave-black); font-family: var(--font-sans); resize: none; outline: none; line-height: 1.5; }
[data-theme="dark"] .f-textarea { background: var(--bg-section); border-color: var(--gray-5); color: var(--white); }

/* Follow-up — was a small pill among four; now its own full-width,
   deliberately loud button between the answer and Notes. */
.followup-btn-lg { margin: 12px 12px 0; display: flex; align-items: center; justify-content: center; gap: 8px; width: calc(100% - 24px); padding: 13px 0; border-radius: 10px; border: 1.5px solid var(--orange); background: var(--bg-card); color: var(--orange); font-size: 14px; font-weight: 700; cursor: pointer; transition: all .15s; font-family: var(--font-sans); }
.followup-btn-lg:hover { background: rgba(244,102,0,.08); }
.followup-btn-lg.on { background: var(--orange); color: #fff; }
[data-theme="dark"] .followup-btn-lg { background: var(--bg-section); }

/* Create Follow-up WO — hidden entirely until Follow-up is flagged, not
   just disabled, so it never reads as a dead button on every item. */
.create-fu-wo-btn { margin: 10px 12px 0; width: calc(100% - 24px); animation: fuBtnIn .2s ease; }
@keyframes fuBtnIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

.stepper-nav { position: absolute; bottom: 0; left: 0; right: 0; height: var(--bar-height); background: var(--bg-card); border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; padding: 0 14px; z-index: 50; }
.snav-btn { flex: 1; height: 46px; border-radius: 12px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
.snav-btn.prev { background: var(--bg-section); color: var(--octave-black); flex: 0 0 46px; }
[data-theme="dark"] .snav-btn.prev { color: var(--white); }
.snav-btn.next { background: var(--octave-black); color: #fff; }
[data-theme="dark"] .snav-btn.next { background: var(--white); color: var(--octave-black); }
.snav-btn:disabled { opacity: .35; cursor: default; }

/* Overview list (Option-A-style compact rows) reached via "View all" */
.overview-overlay { position: absolute; inset: 0; background: var(--bg-page); z-index: 90; display: none; flex-direction: column; }
.overview-overlay.open { display: flex; }
.overview-head { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: var(--bg-card); }
.overview-title { font-size: 15px; font-weight: 700; color: var(--octave-black); }
[data-theme="dark"] .overview-title { color: var(--white); }
.overview-body { flex: 1; overflow-y: auto; }
.ov-group-hdr { padding: 7px 16px; font-size: 12px; font-weight: 700; color: var(--gray-4); background: var(--bg-section); }
.ov-row { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-bottom: 1px solid var(--border); background: var(--bg-card); cursor: pointer; }
.ov-status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gray-2); flex-shrink: 0; }
.ov-status-dot.green { background: var(--green); } .ov-status-dot.red { background: var(--red); } .ov-status-dot.orange { background: var(--orange); }
.ov-label { flex: 1; font-size: 13.5px; font-weight: 500; color: var(--octave-black); }
[data-theme="dark"] .ov-label { color: rgba(255,255,255,0.9); }
.ov-close-btn { width: 30px; height: 30px; border-radius: 50%; background: var(--bg-section); border: none; display: flex; align-items: center; justify-content: center; color: var(--gray-4); cursor: pointer; }
/* Dynamic items in the overview — indented under their trigger, with a
   branch icon; the trigger itself gets a smaller branch cue so a scan of
   the list shows where branching can happen before it's happened. A
   ghost row (locked icon, italic, non-interactive) previews an
   as-yet-untriggered branch, and disappears once real items replace it. */
.ov-row-indent { padding-left: 40px; background: var(--bg-page); }
.ov-dynamic-icon, .ov-branch-cue, .ov-ghost-icon { display: flex; flex-shrink: 0; color: var(--purple); }
.ov-ghost-icon { color: var(--gray-4); }
.ov-row-ghost { cursor: default; }
.ov-label-ghost { font-style: italic; font-weight: 400; color: var(--gray-4); }

.toast { bottom: calc(var(--bar-height) + 10px); }
</style>
</head>
<body>

<div class="proto-theme-bar">
  <span class="proto-theme-label">Preview theme — OPTION B v2: Focused Stepper</span>
  <button class="theme-toggle" id="themeToggle">☀ Light</button>
</div>

<div class="app" id="app">

  <header class="nav" onclick="scrollFormToTop()">
    <div class="nav-left">
      <button class="nav-back" aria-label="Back" onclick="event.stopPropagation(); showToast('← Back to WO Record View')">
        <svg width="20" height="20" fill="none" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="prototype-label">PROTOTYPE</span>
    </div>
    <div class="nav-title">Work Orders</div>
    <div class="nav-actions"><span id="syncCtrl"></span></div>
  </header>

  <div class="rec-header" id="recHeader" onclick="scrollFormToTop()">
    <div class="rec-id-row">
      <div class="rec-id-text">
        <span class="rec-num" id="recNum">19257</span>
        <span class="rec-desc protected" id="recDesc">Pump Cavitating; lost head</span>
      </div>
    </div>
  </div>

  <div class="step-rail" id="stepRail">
    <div class="step-rail-collapsed">
      <div class="step-pill">2 of 5</div>
      <div class="step-name">Activity Checklist</div>
      <div class="step-rail-right">
        <div class="timer-pill" id="timerPill"><div class="timer-dot"></div><span id="timerText">00:00:00</span></div>
        <svg class="step-chevron" id="stepChevron" width="16" height="16" fill="none" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
    <div class="step-map" id="stepMap"></div>
  </div>

  <div class="content" id="content">
    <div class="stepper-head">
      <div class="stepper-head-row">
        <div class="stepper-head-left">
          <span class="stepper-group-name" id="curGroupName">Safety checks</span>
          <span class="stepper-item-count" id="stepperItemCount">· Item 01 of 07</span>
        </div>
        <button class="view-all-btn" onclick="openOverview()">
          <svg width="12" height="12" fill="none" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          View all
        </button>
      </div>
      <div class="stepper-progress-bar"><div class="stepper-progress-fill" id="stepperProgressFill" style="width:0%"></div></div>
    </div>

    <div class="focus-wrap" id="focusWrap"></div>
  </div>

  <div class="stepper-nav" id="stepperNav">
    <button class="snav-btn prev" id="prevBtn" onclick="goPrev()">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="snav-btn next" id="nextBtn" onclick="goNext()">Next<svg width="16" height="16" fill="none" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>

  <!-- fallback bottom bar shown only on the final item once all required answered -->
  <div class="bottom-bar" id="bottomBar" style="display:none;">
    <span class="bar-meta" id="barMeta">Required: 0 / 0</span>
    <button class="bar-pill" id="barBtn" onclick="showToast('Moving to next step…')" style="background:var(--green);color:#fff;">
      Continue
    </button>
  </div>

  <div class="overview-overlay" id="overviewOverlay">
    <div class="overview-head">
      <span class="overview-title">All items</span>
      <button class="ov-close-btn" onclick="closeOverview()"><svg width="14" height="14" fill="none" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    </div>
    <div class="overview-body" id="overviewBody"></div>
  </div>

  <!-- ── Shared Comments/Documents sheets (§7.2) — reused verbatim from
       Equipment/WO Record View; behavior lives entirely in eam-shared.js. ── -->
  <div class="sheet-overlay" id="sheetOverlay" onclick="closeAllSheets()"></div>

  <div class="bottom-sheet text-editor-sheet" id="textEditorSheet">
    <div class="text-editor-header">
      <div class="text-editor-left">
        <button class="text-editor-close" id="textEditorCloseBtn" onclick="textEditorCloseTap()">✕</button>
        <button class="text-editor-discard" id="textEditorDiscard" onclick="textEditorConfirmDiscard()">Discard unsaved changes</button>
      </div>
      <div class="text-editor-title" id="textEditorTitle">Edit</div>
      <div style="width:30px;flex-shrink:0;"></div>
    </div>
    <div class="text-editor-body"><textarea class="text-editor-textarea" id="textEditorTextarea" oninput="textEditorInputChanged()" placeholder="Type here…"></textarea></div>
    <div class="sheet-footer"><button class="btn-save" onclick="saveTextEditor()">Save</button></div>
  </div>

  <div class="bottom-sheet" id="commentActionsSheet">
    <div class="sheet-handle-row"><div class="sheet-handle"></div></div>
    <div class="sheet-header">
      <button class="sheet-close" onclick="closeAllSheets()">✕</button>
      <div class="sheet-title">Comment Actions</div>
      <div style="width:30px;flex-shrink:0;"></div>
    </div>
    <div class="sheet-body" id="commentActionsBody"></div>
  </div>

  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-modal">
      <div class="confirm-message" id="confirmMessage">Are you sure?</div>
      <div class="confirm-actions">
        <button class="confirm-btn confirm-cancel" onclick="closeConfirm()">Cancel</button>
        <button class="confirm-btn confirm-danger" id="confirmDangerBtn" onclick="confirmDangerAction()">Delete</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"><span id="toastMsg"></span></div>

</div>

<script src="../shared/eam-shared.js"></script>
<script>
const ITEMS = [
  { id:1, group:'safety', label:'Confirm LOTO applied to all energy sources', required:true, type:'check',
    documents:[], comments:[], note:'', followup:false, value:false },
  { id:2, group:'safety', label:'PPE check — gloves, goggles, steel-cap boots', required:true, type:'check',
    documents:[], comments:[], note:'', followup:false, value:false },
  { id:3, group:'main', label:'Bearing housing — visual condition', equipId:'A-00067333', equipDesc:'Pump, Centrifugal', required:true, type:'toggle3',
    options:[['Pass','sel-green'],['Fail','sel-red'],['N/A','sel-gray']],
    documents:[
      { icon:'pdf', name:'Bearing_Housing_Drawing_Rev4.pdf', meta:'PDF · 2.1 MB' },
      { icon:'img', name:'Inspection_Photo_Template.jpg', meta:'JPG · 640 KB' },
    ],
    comments:[
      { id:'sc1', mine:false, author:'Meera Kumar', time:'May 19 · 09:12', text:'Last inspection showed light surface corrosion near the seal groove — worth a close look this time.' },
    ],
    note:'', followup:false, value:null,
    // Dynamic checklist items (§ new 2026-07-21) — answering "Fail" loads
    // 2 new items right after this one. syncDynamicChildren() inserts/
    // removes them live as the answer changes, so this rule is the only
    // thing that needs to describe them.
    dynamicRules:[
      { when:'Fail', items:[
        { label:'Failure severity', type:'toggle3', options:[['Minor','sel-orange'],['Major','sel-red'],['Critical','sel-red']], required:true, value:null },
        { label:'Corrective action taken on-site?', type:'toggle2', options:[['Yes','sel-green'],['No','sel-red']], required:false, value:null },
      ] },
    ] },
  { id:4, group:'main', label:'Shaft alignment', equipId:'A-00067333', equipDesc:'Pump, Centrifugal', required:false, type:'toggle2',
    options:[['OK','sel-green'],['Adjusted','sel-orange']],
    documents:[], comments:[], note:'', followup:false, value:null },
  { id:5, group:'main', label:'Bearing temperature — post run', equipId:'A-00067333', equipDesc:'Pump, Centrifugal', required:true, type:'num', uom:'°F', range:'60 – 180 °F',
    documents:[], comments:[], note:'', followup:false, value:'' },
  { id:6, group:'close', label:'Area restored and barricades removed?', required:true, type:'toggle2',
    options:[['Yes','sel-green'],['No','sel-red']],
    documents:[], comments:[], note:'', followup:false, value:null },
  { id:7, group:'close', label:'Work completion notes', required:false, type:'textarea',
    documents:[], comments:[], note:'', followup:false, value:'' },
];
const GROUP_NAMES = { safety:'Safety checks', main:'Inspection', close:'Close-out' };
let cursor = 0;

const BRANCH_ICON = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="3" x2="6" y2="15"></line><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path></svg>';
const LOCK_ICON = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V7a4 4 0 018 0v4"></path></svg>';
let dynamicIdSeq = 100;

// Insert/remove a trigger item's dynamic follow-up items to match its
// current answer. Always removes this parent's existing children first —
// the answer may have changed away from the trigger value, which
// invalidates them — then re-inserts if the current value still matches
// a rule. Children land immediately after the parent, in the same group,
// which is what makes Next/the counter/"View all" pick them up for free.
function syncDynamicChildren(parent) {
  for (let i = ITEMS.length - 1; i >= 0; i--) {
    if (ITEMS[i].dynamicParentId === parent.id) ITEMS.splice(i, 1);
  }
  const rule = parent.dynamicRules.find(r => r.when === parent.value);
  if (!rule) return;
  const insertAt = ITEMS.indexOf(parent) + 1;
  const newItems = rule.items.map(cfg => ({
    documents: [], comments: [], note: '', followup: false,
    ...cfg,
    id: ++dynamicIdSeq,
    group: parent.group,
    equipId: parent.equipId, equipDesc: parent.equipDesc,
    dynamic: true,
    dynamicParentId: parent.id,
  }));
  ITEMS.splice(insertAt, 0, ...newItems);
}

// ─── Shared §7.2 Comments/Documents pattern — one item focused at a time,
// so the shared globals just get rebound to that item's own arrays on
// every render (see openItemCommentsDocuments below). ──────────────────
const CURRENT_USER_NAME = 'Bruce Campbell';
let commentIdSeq = 100;
let COMMENTS_DATA = [];
let DOCUMENTS_DATA = [];
const COMMENTS_EXCERPT_MOUNT = 'itemCommentsMount';
const COMMENTS_BADGE_ID = 'itemCommentsBadge';
const DOCUMENTS_EXCERPT_MOUNT = 'itemDocumentsMount';
const DOCUMENTS_BADGE_ID = 'itemDocumentsBadge';

function isDone(it) {
  if (it.type === 'check') return !!it.value;
  if (it.type === 'toggle2' || it.type === 'toggle3') return it.value != null;
  if (it.type === 'num' || it.type === 'textarea') return String(it.value).trim() !== '';
  return false;
}
function dotClass(it) {
  if (!isDone(it)) return '';
  if (it.type === 'check' || it.type === 'textarea' || it.type === 'num') return 'done-green';
  const opt = it.options.find(o => o[0] === it.value);
  return opt[1] === 'sel-green' ? 'done-green' : opt[1] === 'sel-red' ? 'done-red' : opt[1] === 'sel-orange' ? 'done-orange' : 'done-green';
}

// Checklist-wide rail — item counter, group name, Required tag, and a
// status strip spanning every item in the checklist (not just the
// current group; a group boundary just gets a wider gap, §"pop this up
// a level" per 2026-07-21 session).
function renderStepperHead() {
  const it = ITEMS[cursor];
  document.getElementById('curGroupName').textContent = GROUP_NAMES[it.group];
  document.getElementById('curGroupName').className = 'stepper-group-name g-' + it.group;
  // Position/total both read live off ITEMS, not a precomputed seq — a
  // dynamic item's insertion shifts everything after it, and the total
  // itself grows the moment a trigger fires. This is the honest answer to
  // "the denominator is tough": it always reflects known items so far,
  // not a hypothetical max the checklist could reach.
  document.getElementById('stepperItemCount').textContent = `· Item ${String(cursor+1).padStart(2,'0')} of ${String(ITEMS.length).padStart(2,'0')}`;
  const doneCount = ITEMS.filter(isDone).length;
  document.getElementById('stepperProgressFill').style.width = Math.round(doneCount / ITEMS.length * 100) + '%';
}

function controlHtml(it) {
  if (it.type === 'check') {
    return `<div class="f-chk ${it.value?'checked':''}" onclick="setCheck()">
      <div class="f-chk-circle"><svg width="18" height="18" fill="none" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <span class="f-chk-lbl">${it.value ? 'Confirmed' : 'Tap to confirm'}</span>
    </div>`;
  }
  if (it.type === 'toggle2' || it.type === 'toggle3') {
    return `<div class="f-toggle">` + it.options.map(([label,cls]) =>
      `<button class="f-opt ${it.value===label?cls:''}" onclick="setToggle('${label}','${cls}')">${label}</button>`).join('') + `</div>`;
  }
  if (it.type === 'num') {
    return `<div class="f-num-row"><input class="f-num-in" type="number" value="${it.value}" placeholder="—" oninput="setNum(this)"><span class="f-uom">${it.uom}</span></div>`
      + (it.range ? `<p class="f-range-hint">Acceptable range: ${it.range}</p>` : '');
  }
  if (it.type === 'textarea') {
    return `<textarea class="f-textarea" placeholder="Describe work performed and any findings…" oninput="setText(this)">${it.value}</textarea>`;
  }
  return '';
}

function renderFocus() {
  const it = ITEMS[cursor];
  const dynamicParent = it.dynamic ? ITEMS.find(x => x.id === it.dynamicParentId) : null;
  let html = `
    ${dynamicParent ? `<div class="focus-dynamic-tag">${BRANCH_ICON}<span>Added based on your "${dynamicParent.label}" response</span></div>` : ''}
    <div class="focus-label-row">
      <p class="focus-label">${it.label}</p>
      ${it.required ? '<span class="focus-req-tag">Required</span>' : ''}
    </div>

    <div class="section-card"><div class="focus-control">${controlHtml(it)}</div></div>
    ${it.dynamicRules ? `<div class="focus-dynamic-hint">${BRANCH_ICON}<span>This response may add follow-up items to the checklist</span></div>` : ''}

    <button class="followup-btn-lg ${it.followup?'on':''}" onclick="toggleFollowup()">
      <svg width="15" height="15" fill="none" viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 22V15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      ${it.followup ? 'Flagged for Follow-up' : 'Flag for Follow-up'}
    </button>

    ${it.followup ? `<button class="btn-contained create-fu-wo-btn" onclick="createFollowupWO()">
      <svg width="15" height="15" fill="none" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      Create Follow-up WO
    </button>` : ''}

    <div class="section-card">
      <div class="form-field" data-field="itemNotes" onclick="this.querySelector('textarea').focus()">
        <span class="field-label">Notes</span>
        <textarea class="field-inline-input" id="fv-itemNotes" rows="1" maxlength="255" placeholder="Add a note…" oninput="updateInlineFieldLayout(this); setNote(this)" onfocus="onInlineFocus()" onblur="onInlineBlur(this)">${it.note}</textarea>
      </div>
    </div>

    ${it.equipId ? `<div class="section-card">
      <div class="form-field protected" data-field="equipment">
        <span class="field-label">Equipment</span>
        <span class="field-value">${it.equipId} — ${it.equipDesc || ''}</span>
      </div>
    </div>` : ''}

    <div class="rv-section">
      <div class="rv-toggle-row" onclick="rvToggle('comments')">
        <div class="rv-toggle-left">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="rv-toggle-title">Comments</span>
        </div>
        <div class="rv-toggle-right">
          <span class="rv-badge" id="itemCommentsBadge">${it.comments.length}</span>
          <svg class="rv-chev" id="rv-chev-comments" width="14" height="14" fill="none" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
      <div class="rv-collapse" id="rv-comments"><div id="itemCommentsMount"></div></div>
    </div>

    <div class="rv-section">
      <div class="rv-toggle-row" onclick="rvToggle('documents')">
        <div class="rv-toggle-left">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.48-8.48l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="rv-toggle-title">Documents</span>
        </div>
        <div class="rv-toggle-right">
          <span class="rv-badge" id="itemDocumentsBadge">${it.documents.length}</span>
          <svg class="rv-chev" id="rv-chev-documents" width="14" height="14" fill="none" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
      <div class="rv-collapse" id="rv-documents"><div id="itemDocumentsMount"></div></div>
    </div>
    <div style="height:16px;"></div>`;

  document.getElementById('focusWrap').innerHTML = html;

  // Rebind the shared record-level Comments/Documents data to this item.
  COMMENTS_DATA = it.comments;
  DOCUMENTS_DATA = it.documents;
  renderCommentsExcerptMount();
  renderDocumentsExcerptMount();

  document.getElementById('prevBtn').disabled = cursor === 0;
  const isLast = cursor === ITEMS.length - 1;
  document.getElementById('nextBtn').innerHTML = isLast
    ? 'Finish'
    : 'Next <svg width="16" height="16" fill="none" viewBox="0 0 24 24" style="margin-left:4px"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  renderStepperHead();
  updateFooter();
}

function updateFooter() {
  const req = ITEMS.filter(i => i.required);
  const reqDone = req.filter(isDone).length;
  const allReqDone = reqDone === req.length;
  document.getElementById('barMeta').textContent = 'Required: ' + reqDone + ' / ' + req.length;
  document.getElementById('bottomBar').style.display = (allReqDone && cursor === ITEMS.length - 1) ? 'flex' : 'none';
  document.getElementById('stepperNav').style.display = (allReqDone && cursor === ITEMS.length - 1) ? 'none' : 'flex';
}

function jumpTo(idx) { closeAllSheets(); cursor = idx; renderFocus(); }
function goPrev() { if (cursor > 0) { closeAllSheets(); cursor--; renderFocus(); } }
function goNext() {
  closeAllSheets();
  if (cursor < ITEMS.length - 1) { cursor++; renderFocus(); }
  else { renderFocus(); showToast('All items reviewed'); }
}
function setCheck() { const it = ITEMS[cursor]; it.value = !it.value; if (it.dynamicRules) syncDynamicChildren(it); renderFocus(); }
function setToggle(label, cls) { const it = ITEMS[cursor]; it.value = label; if (it.dynamicRules) syncDynamicChildren(it); renderFocus(); }
function setNum(el) { const it = ITEMS[cursor]; it.value = el.value; if (it.dynamicRules) syncDynamicChildren(it); renderStepperHead(); updateFooter(); }
function setText(el) { const it = ITEMS[cursor]; it.value = el.value; if (it.dynamicRules) syncDynamicChildren(it); renderStepperHead(); updateFooter(); }
function setNote(el) { ITEMS[cursor].note = el.value; }
function toggleFollowup() { ITEMS[cursor].followup = !ITEMS[cursor].followup; renderFocus(); }
function createFollowupWO() { showToast('Creating follow-up work order — coming soon'); }

function openOverview() {
  let html = '';
  let lastGroup = null;
  ITEMS.forEach((it, idx) => {
    if (it.group !== lastGroup) { html += `<div class="ov-group-hdr">${GROUP_NAMES[it.group]}</div>`; lastGroup = it.group; }
    html += `<div class="ov-row ${it.dynamic ? 'ov-row-indent' : ''}" onclick="jumpTo(${idx}); closeOverview();">
      ${it.dynamic ? `<span class="ov-dynamic-icon" title="Added dynamically">${BRANCH_ICON}</span>` : ''}
      <span class="ov-status-dot ${dotClass(it).replace('done-','')}"></span>
      <span class="ov-label">${idx+1} — ${it.label}</span>
      ${it.required ? '<span style="color:var(--orange);font-weight:700;font-size:12px;">*</span>' : ''}
      ${it.dynamicRules ? `<span class="ov-branch-cue" title="May add follow-up items">${BRANCH_ICON}</span>` : ''}
    </div>`;
    // Ghost placeholder — previews an as-yet-untriggered branch. Only
    // shows while no children are currently active for this trigger;
    // disappears the instant a real answer inserts (or removes) them.
    if (it.dynamicRules && !ITEMS.some(x => x.dynamicParentId === it.id)) {
      html += `<div class="ov-row ov-row-indent ov-row-ghost">
        <span class="ov-ghost-icon">${LOCK_ICON}</span>
        <span class="ov-label ov-label-ghost">More items may appear based on your answer</span>
      </div>`;
    }
  });
  document.getElementById('overviewBody').innerHTML = html;
  document.getElementById('overviewOverlay').classList.add('open');
}
function closeOverview() { document.getElementById('overviewOverlay').classList.remove('open'); }

renderFocus();
startStepTimer();
initSharedApp({ contentSelector: '#content' });
</script>
</body>
</html>
