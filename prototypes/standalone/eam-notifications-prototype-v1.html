<!--
  NOTIFICATIONS SCREEN (v1, 2026-07-22) — the "quick and dirty" build
  called out as deferred backlog during the app-wide nav/palette rollout
  (see project_deferred_screens_backlog memory / CLAUDE.md). Bottom-nav's
  "Notifications" tab (Home, WO List) was a toast stub until this pass —
  both now do a real navigation here, same pattern as WO List's own "Work"
  tab pointing at itself.

  Source data (data/notifications.js, EAM_NOTIFICATIONS) is modeled on the
  real R5MAILEVENTS table — the same log that already drives this app's
  existing email + push notification system, not a new backend concept.
  One real gap, flagged rather than solved here: that table has no read/
  unread column in the real schema — `read` is invented client-side for
  this prototype. See design-decisions-v3-1.md §25 for the full write-up,
  including the `comment_mention` type, which is a forward reference to
  @mention tagging in Comments — NOT built yet anywhere in this prototype
  (circle-back item), modeled here anyway so this screen doesn't have to
  wait on that feature landing first.

  Tapping a notification with a `wo` opens 19257/19831/20450 as
  themselves; anything else defaults to the corrective (19257) flow —
  updated 2026-07-22 (punch-list item) from the old blanket "anything
  else opens as 20450" rule, which made every other WO look Free-Form/
  no-rail regardless of its real type. WO List's own openWO() does real
  Type-based routing instead, since it has each row's Type to route on;
  this screen doesn't, so it isn't worth building the same lookup twice.
  Per §24 rule 3, the WO Record View back arrow returns to WO List, not
  here — no special return-path override for this screen.

  Screen-local only (single consumer): card/section-label/dismiss/mark-
  all-read CSS below. Reused directly, no local re-definition: the shared
  .filter-chip-row/.filter-chip (All/Unread), .bottom-nav, .nav-avatar,
  .rec-actions-menu profile dropdown, sheet-overlay/syncPanelSheet,
  confirm-overlay, and toast — all copied verbatim from Home/WO List's own
  markup, behavior comes entirely from eam-shared.js.
-->
<style>
  /* ── Screen-local: the Octave mobile kit Notifications template (Minh,
     2026-11-03). kit Toggle Button Group (All / Unread n, matching Detailed/List), a text "Mark all read", then
     per day an overline label OUTSIDE a card of kit List Items: icon,
     subject, body, WO; trailing time + unread dot; swipe left to dismiss
     (Danny's interaction, kept). ── */
  .notif-tabs{display:block;flex-shrink:0;}
  .notif-actions{flex-shrink:0;}
  .notif-actions > uxt-button{margin-left:auto;}
  .notif-day{font-family:var(--uxt-theme-typography-overline-font-family,var(--font-sans));font-size:var(--uxt-theme-typography-overline-font-size,0.75rem);font-weight:var(--uxt-theme-typography-overline-font-weight,400);letter-spacing:var(--uxt-theme-typography-overline-letter-spacing,1px);line-height:var(--uxt-theme-typography-overline-line-height,2);text-transform:uppercase;color:var(--k-text-2);padding:var(--k-s2) var(--k-s6) var(--k-s1);}
  .notif-group{background:var(--k-card);border-radius:var(--k-r);box-shadow:var(--k-e1);margin:0 var(--k-s4) var(--k-s2);overflow:hidden;}
  /* Swipe to dismiss (Minh, 2026-11-03), replacing the ✕: drag a row left;
     past 35% of its width it slides out and is removed. The error-tone band
     under it says what the gesture does. */
  /* Breathing room + word limits (Minh, 2026-11-03): 16dp row padding, a
     12dp icon gap; subject one line, body two lines max. */
  uxt-list-item.notif-row > .uxt-li{padding-top:var(--k-s4) !important;padding-bottom:var(--k-s4) !important;}
  uxt-list-item.notif-row .uxt-li-content{gap:var(--k-s4);align-items:flex-start;}
  uxt-list-item.notif-row .uxt-li-text{gap:var(--k-s1);}
  uxt-list-item.notif-row .uxt-li-l1{font-weight:600;color:var(--k-text);}
  uxt-list-item.notif-row .uxt-li-l2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  uxt-list-item.notif-row .uxt-li-l1,uxt-list-item.notif-row .uxt-li-l3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  uxt-list-item.notif-row .uxt-li-icon{width:40px;height:40px;border-radius:var(--k-pill);display:flex;align-items:center;justify-content:center;flex:none;align-self:flex-start;margin-top:var(--k-s1);}
  uxt-list-item.notif-row .uxt-li-icon .ib{color:inherit !important;background:transparent !important;}
  uxt-list-item.notif-row.tone-info .uxt-li-icon{background:var(--k-info-bg);color:var(--k-info-fg);}
  uxt-list-item.notif-row.tone-ok .uxt-li-icon{background:var(--k-ok-bg);color:var(--k-ok-fg);}
  uxt-list-item.notif-row.tone-warn .uxt-li-icon{background:var(--k-warn-bg);color:var(--k-warn-fg);}
  uxt-list-item.notif-row.tone-err .uxt-li-icon{background:var(--k-err-bg);color:var(--k-err-fg);}
  uxt-list-item.notif-row.tone-purple .uxt-li-icon{background:var(--uxt-theme-palette-status-purple-50,#f5e9ff);color:var(--uxt-theme-palette-status-purple-900,#7a1fd1);}
  .notif-swipe{position:relative;overflow:hidden;touch-action:pan-y;}
  .notif-swipe + .notif-swipe{border-top:1px solid var(--k-divider);}
  .notif-swipe:not(.dragging) .notif-swipe-bg{visibility:hidden;}
  .notif-swipe-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding:0 var(--k-s6);background:var(--uxt-theme-palette-error-main,#f3434a);color:var(--uxt-theme-palette-error-contrast-text,#fff);font-size:var(--k-body2);font-weight:600;}
  .notif-swipe > uxt-list-item{display:block;position:relative;background:var(--k-card);will-change:transform;}
  .notif-swipe > uxt-list-item.settle{transition:transform .2s cubic-bezier(0.4,0,0.2,1);}
  .notif-swipe.leaving{transition:height .2s cubic-bezier(0.4,0,0.2,1);}
  /* Trailing column: time over the unread dot, as the kit template draws it. */
  uxt-list-item.notif-row .uxt-li-shortcut{display:flex;flex-direction:column;align-items:flex-end;gap:var(--k-s1);font-size:var(--k-caption);color:var(--k-text-2);}
  uxt-list-item.notif-row .uxt-li-shortcut::after{content:"";width:8px;height:8px;border-radius:var(--k-pill);background:transparent;}
  uxt-list-item.notif-row.unread .uxt-li-shortcut::after{background:var(--uxt-theme-palette-primary-main,#0050ff);}
  uxt-list-item.notif-row.unread .uxt-li-l1{font-weight:600;color:var(--k-text);}
  .notif-empty{background:var(--k-card);border-radius:var(--k-r);box-shadow:var(--k-e1);margin:var(--k-s2) var(--k-s4);padding:var(--k-s6) var(--k-s4);text-align:center;}
  .notif-empty-title{font-family:var(--font-display);font-size:var(--uxt-theme-typography-h-6-font-size,1.125rem);font-weight:var(--uxt-theme-typography-h-6-font-weight,600);color:var(--k-text);margin-bottom:var(--k-s1);}
  .notif-empty-sub{font-size:var(--k-body2);color:var(--k-text-2);}
</style>

<body>



<div class="app" id="app">

    </div>

  <div class="kit-mode-tog"><uxt-toggle-button-group id="notifTabs" density="m" value="all" options='[{"value":"all","label":"All"},{"value":"unread","label":"Unread"}]' onchange="setNotifFilter(event.detail.value)"></uxt-toggle-button-group></div>

  <nav class="bottom-nav">

    </button>
    <button class="bottom-nav-item" onclick="location.href='eam-wo-list-prototype-v5_1.html'">

    </button>
    <button class="bottom-nav-item active" onclick="showToast('Already on Notifications')">

    </button>

<script src="../../data/notifications.js?v=202611032018"></script>
<script src="shared/eam-shared.js?v=202611032018"></script>
<script>
const CURRENT_USER_NAME = 'Bruce Campbell';
let notifFilter = 'all';

function setNotifFilter(f) {
  notifFilter = f;
  syncNotifFilterChips();
  renderNotifList();
}
function syncNotifFilterChips() {
  const tabs = document.getElementById('notifTabs');
  if (!tabs) return;
  const unread = EAM_NOTIFICATIONS.filter(n => !n.read).length;
  tabs.setAttribute('options', JSON.stringify([{ value: 'all', label: 'All' }, { value: 'unread', label: 'Unread', count: unread }]));
  tabs.setAttribute('value', notifFilter);
  const c = document.getElementById('notifCount');
  if (c) c.textContent = unread ? `${unread} unread` : 'All caught up';
}

// Kit icon registry names per notification type.
function notifIcon(type) {
  const icons = {
    wo_assigned: 'person',
    wo_reassigned: 'person',
    wo_status: 'check-circle',
    comment_mention: 'chat-bubble',
    pm_due: 'calendar-month',
    follow_up_created: 'flag',
  };
  return icons[type] || icons.wo_status;
}

// Icon tone per type (Minh, 2026-11-03): a light tinted circle with the
// darker glyph, the Home row-icon treatment (status 50 / 900 pairs).
function notifTone(type) {
  return { wo_assigned: 'info', wo_reassigned: 'info', wo_status: 'ok', comment_mention: 'purple', pm_due: 'warn', follow_up_created: 'err' }[type] || 'info';
}
function notifGroup(n) {
  return n.time.startsWith('07/22/2026') ? 'Today' : 'Earlier';
}

// One notification = one kit List Item: subject, body, Work Order; trailing
// time (+ unread dot via CSS). Row tap fires the kit
// `select` event; a left swipe dismisses (wired once on #notifList).
function notifTime(n) {
  const [date, time] = n.time.split(' · ');
  return notifGroup(n) === 'Today' ? (time || date) : date.slice(0, 5);
}
function notifCard(n) {
  return `<div class="notif-swipe" data-id="${n.id}"><div class="notif-swipe-bg" aria-hidden="true"><span>Dismiss</span></div><uxt-list-item class="notif-row tone-${notifTone(n.type)}${n.read ? '' : ' unread'}" role="listitem" density="m" data-id="${n.id}"
    icon="${notifIcon(n.type)}" text="${kitEsc(n.subject)}" secondary="${kitEsc(n.body)}"${n.wo ? ` tertiary="Work Order ${kitEsc(n.wo)}"` : ''}
    shortcut="${kitEsc(notifTime(n))}" aria-label="${kitEsc(n.subject)}${n.read ? '' : ', unread'}"></uxt-list-item></div>`;
}

function renderNotifList() {
  const rows = notifFilter === 'unread' ? EAM_NOTIFICATIONS.filter(n => !n.read) : EAM_NOTIFICATIONS;
  const groups = { Today: [], Earlier: [] };
  rows.forEach(n => groups[notifGroup(n)].push(n));
  let html = '';
  ['Today', 'Earlier'].forEach(g => {
    if (!groups[g].length) return;
    html += `<div class="notif-day">${g}</div><div class="notif-group">`;
    groups[g].forEach(n => { html += notifCard(n); });
    html += '</div>';
  });
  document.getElementById('notifList').innerHTML = html || `<div class="notif-empty"><div class="notif-empty-title">${notifFilter === 'unread' ? 'No unread notifications' : 'No notifications'}</div><div class="notif-empty-sub">You’re all caught up.</div></div>`;
  const anyUnread = EAM_NOTIFICATIONS.some(n => !n.read);
  const markAll = document.getElementById('markAllBtn');
  if (anyUnread) markAll.removeAttribute('disabled'); else markAll.setAttribute('disabled', '');
  syncNotifFilterChips();
  updateNotifBadge();
}
(function wireNotifRows() {
  const list = document.getElementById('notifList');
  list.addEventListener('select', (e) => {
    const row = e.target.closest && e.target.closest('.notif-row');
    if (row) openNotification(row.dataset.id);
  });
  // Swipe left to dismiss. A swipe also swallows the row's own `select`.
  let drag = null, swiped = false;
  list.addEventListener('pointerdown', (e) => {
    const wrap = e.target.closest && e.target.closest('.notif-swipe');
    if (!wrap) return;
    drag = { wrap, row: wrap.querySelector('.notif-row'), x: e.clientX, y: e.clientY, dx: 0, on: false };
    swiped = false;
  });
  list.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = Math.min(0, e.clientX - drag.x), dy = Math.abs(e.clientY - drag.y);
    if (!drag.on) { if (Math.abs(dx) > 10 && Math.abs(dx) > dy) { drag.on = true; drag.wrap.classList.add('dragging'); drag.row.classList.remove('settle'); } else if (dy > 10) { drag = null; return; } else return; }
    drag.dx = dx;
    drag.row.style.transform = `translateX(${dx}px)`;
  });
  const end = () => {
    if (!drag) return;
    const d = drag; drag = null;
    if (!d.on) return;
    swiped = true;
    d.row.classList.add('settle');
    if (Math.abs(d.dx) > d.wrap.offsetWidth * 0.35) {
      d.row.style.transform = 'translateX(-100%)';
      setTimeout(() => {
        d.wrap.style.height = d.wrap.offsetHeight + 'px';
        d.wrap.classList.add('leaving');
        requestAnimationFrame(() => { d.wrap.style.height = '0px'; });
        setTimeout(() => dismissNotif(d.wrap.dataset.id), 200);
      }, 180);
    } else { d.row.style.transform = ''; setTimeout(() => d.wrap.classList.remove('dragging'), 200); }
  };
  list.addEventListener('pointerup', end);
  list.addEventListener('pointercancel', end);
  list.addEventListener('select', (e) => { if (swiped) { e.stopImmediatePropagation(); swiped = false; } }, true);
})();

// Punching into a WO from this screen (2026-07-22, punch-list item) —
// 19257/19831/20450 open as themselves; any other WO number just opens
// the corrective (BRKD/19257) flow rather than the Free-Form/no-rail
// fallback. WO List's own openWO() does real Type-based routing since it
// has each row's Type to route on; this screen doesn't carry that detail
// on a notification, so it isn't worth building the same lookup twice —
// defaulting to the full guided flow is the more useful "just works"
// behavior for a secondary entry point like this one.
function openNotification(id) {
  const n = EAM_NOTIFICATIONS.find(x => x.id === id);
  if (!n) return;
  if (!n.read) { n.read = true; renderNotifList(); }
  if (!n.wo) { showToast('No linked record for this notification'); return; }
  const demoWo = ['19257', '19831', '20450'].includes(n.wo) ? n.wo : '19257';
  // Opening a fresh WO from outside the workflow drops any MEC child identity
  // still held from a previous navigation (§16.10) — otherwise this parent WO
  // would render under the child's number/description.
  woIdentityClear();
  // A WO with a workflow run in progress opens at its cursor (§32.7).
  openDemoWoAtCursor(demoWo);
}

function dismissNotif(id) {
  const idx = EAM_NOTIFICATIONS.findIndex(n => n.id === id);
  if (idx > -1) EAM_NOTIFICATIONS.splice(idx, 1);
  showToast('Notification dismissed');
  renderNotifList();
}
function confirmDismissNotif(id) {
  openConfirm('Dismiss this notification? This won’t affect the source record.', () => {
    const idx = EAM_NOTIFICATIONS.findIndex(n => n.id === id);
    if (idx > -1) EAM_NOTIFICATIONS.splice(idx, 1);
    showToast('Notification dismissed');
    renderNotifList();
  }, 'Dismiss');
}

function markAllRead() {
  EAM_NOTIFICATIONS.forEach(n => n.read = true);
  renderNotifList();
}

renderNotifList();
initSharedApp({ contentSelector: '.content' });
</script>
</body>
