<!DOCTYPE html>
<html lang="en">
<head>
<script>/* guarded: localStorage throws in iOS Private Browsing, and this runs before eam-shared.js so lsGet() does not exist yet */document.documentElement.setAttribute('data-uxt-density','mobile');document.documentElement.setAttribute('data-uxt-theme','light');try{if(localStorage.getItem('eamTheme')==='dark'){document.documentElement.setAttribute('data-theme','dark');document.documentElement.setAttribute('data-uxt-theme','dark');}}catch(e){}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1A1A1F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="EAM">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="apple-touch-icon" href="shared/img/icon-180.png">
<meta name="format-detection" content="telephone=no">
<title>HxGN EAM Mobile — Sync Status</title>
<!-- Octave design kit: tokens, fonts and every <uxt-*> component (mobile density, set above). -->
<script type="module" src="https://octave-design-kit.vercel.app/latest/design-kit.js"></script>
<link rel="stylesheet" href="shared/eam-fonts.css?v=202610201808">
<link rel="stylesheet" href="shared/eam-shared.css?v=202610201808">
<!--
  Sync Status Screen (§4.5, design-decisions-v3-1.md) — drill-down reached
  from the sync panel's Review action (§4.4.2). Error triage only; the
  panel's own 4-bar hydration progress stays in the panel, not duplicated
  here (locked 2026-07-20). Demo data (SYNC_DEMO_ITEMS) lives in
  eam-shared.js since the sync panel is its 2nd real consumer — this file
  only adds its own card rendering/protection-rule presentation, which so
  far has exactly one consumer (this screen).
-->
<style>
  /* ── Screen-local (Octave kit restyle 2026-10-20): error-card content on
     the shared .ld-card shell (§8.3). Retry/Discard are kit buttons, the
     entity is a kit tag and the lock row's glyph a presentational kit Icon
     Button; only the layout of those hosts lives here. The outbox bar stays
     the shared .sync-hydrate-* bar (the kit has no progress component). ── */
  .sync-status-strip{padding:var(--k-s2) var(--k-s4) var(--k-s4);flex-shrink:0;}
  .sync-status-strip-row{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--k-body2);color:var(--k-text-2);margin-bottom:var(--k-s2);}
  .sync-status-strip-row b{color:var(--k-text);font-weight:500;}
  .sync-section-label{margin:0;padding:var(--k-s4) var(--k-s4) var(--k-s2);font-family:var(--font-display);font-size:var(--uxt-theme-typography-h-6-font-size,1.125rem);font-weight:var(--uxt-theme-typography-h-6-font-weight,500);color:var(--k-text);}
  .sync-error-card{position:relative;outline:2px solid transparent;transition:outline-color .2s;}
  .sync-error-card.flash{outline-color:var(--uxt-theme-palette-error-main,#f3434a);}
  .sync-error-card .ld-card-top > uxt-tag{flex-shrink:0;}
  .sync-card-error-text{font-size:var(--k-body2);color:var(--k-text-2);line-height:1.43;}
  .sync-card-lock{display:flex;align-items:center;gap:var(--k-s1);font-size:var(--k-caption);color:var(--k-text-2);margin-top:var(--k-s2);padding-top:var(--k-s2);border-top:1px solid var(--k-divider);}
  .sync-card-lock > uxt-icon-button{flex-shrink:0;}
  .sync-card-actions > uxt-button{flex:1;display:block;}
  .sync-empty-state{padding:70px var(--k-s6);text-align:center;}
  .sync-empty-state-title{font-family:var(--font-display);font-size:var(--uxt-theme-typography-h-6-font-size,1.125rem);font-weight:var(--uxt-theme-typography-h-6-font-weight,500);color:var(--k-text);margin-bottom:var(--k-s1);}
  .sync-empty-state-sub{font-size:var(--k-body2);color:var(--k-text-2);}
  /* Dev bar: kit buttons at desktop density keep the bar short. */
  .proto-theme-bar > uxt-button{flex-shrink:0;}
</style>
</head>
<body>

<div class="proto-theme-bar">
  <span class="proto-theme-label">Preview theme</span>
  <!-- Kit buttons; #themeToggle/#onlineToggle stay as the hidden label
       sources refreshThemeLabels()/updateOnlineToggleLabel() write. -->
  <uxt-button data-mirror="themeToggle" variant="outlined" density="s" text="☀ Light" onclick="toggleThemeDemo()"></uxt-button>
  <span id="themeToggle" hidden>☀ Light</span>
  <!-- Demo-only connectivity toggle (§4.5, 2026-07-20) — same one the
       Record View screens carry, so Retry's online-success path can be
       demoed straight from this list too, not just from inside a record. -->
  <uxt-button data-mirror="onlineToggle" variant="outlined" density="s" text="🌐 Offline" onclick="toggleDemoOnline()"></uxt-button>
  <span id="onlineToggle" hidden>🌐 Offline</span>
</div>

<div class="app" id="app">

  <header class="nav" onclick="scrollFormToTop()">
    <div class="nav-left">
      <uxt-icon-button class="kit-bar-btn" icon="arrow-back" label="Back" outlined density="m" onclick="event.stopPropagation();navBack()"></uxt-icon-button>
      <span class="prototype-label">PROTOTYPE</span>
    </div>
    <div class="nav-title">Sync Status</div>
    <div class="nav-actions"><span id="syncCtrl"></span></div>
  </header>

  <div class="content" id="syncContent">
    <div class="sync-status-strip">
      <div class="sync-status-strip-row"><span>Last sync</span><b id="lastSyncTime">2:11 PM</b></div>
      <div class="sync-hydrate-row">
        <div class="sync-hydrate-label"><span>Outbox</span><span id="outboxProgressLabel"></span></div>
        <div class="sync-hydrate-track"><div class="sync-hydrate-fill" id="outboxProgressFill" style="width:0%"></div></div>
      </div>
    </div>

    <h2 class="sync-section-label">Needs Attention</h2>
    <div id="syncErrorList"></div>
  </div>

  <!-- Sheet overlay + sync panel — this screen's own sync icon (nav-actions
       above) opens the same quick panel every other screen does; fixes a
       real crash, openSheet() previously found neither #sheetOverlay nor
       #syncPanelSheet here at all. -->
  <div class="sheet-overlay" id="sheetOverlay" onclick="closeAllSheets()"></div>
  <div class="bottom-sheet" id="syncPanelSheet">
    <div class="sheet-handle-row"><div class="sheet-handle"></div></div>
    <div class="sheet-header">
      <uxt-icon-button class="kit-sheet-close" icon="close" label="Close" density="m" onclick="closeAllSheets()"></uxt-icon-button>
      <div class="sheet-title">Sync Status</div>
      <div class="kit-sheet-spacer"></div>
    </div>
    <div class="sync-panel-state" id="syncPanelStateLabel"></div>
    <div class="sheet-body" id="syncPanelList"></div>
    <div class="sync-panel-hydrate" id="syncPanelHydrate"></div>
  </div>

  <!-- Legacy confirm: only the fallback when the kit is absent (DOM-shim
       tests); with the kit loaded openConfirm() shows a <uxt-dialog>. -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-modal">
      <div class="confirm-message" id="confirmMessage">Are you sure?</div>
      <div class="confirm-actions">
        <button class="confirm-btn confirm-cancel" onclick="closeConfirm()">Cancel</button>
        <button class="confirm-btn confirm-danger" id="confirmDangerBtn" onclick="confirmDangerAction()">Delete</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"><span id="toastMsg"></span></div>
</div>

<script src="shared/eam-shared.js?v=202610201808"></script>
<script>
/* ── screen-specific: card rendering + protection-label presentation only
   — the underlying data (SYNC_DEMO_ITEMS) and the open/retry/delete
   behavior all live in eam-shared.js, shared with the sync panel. ── */
const PROTECTION_LABEL = {
  'readonly': 'This type of transaction cannot be modified here',
  'delete-only': 'Only delete is available for this transaction',
  'locked-workflow': 'Status is protected — this Work Order’s workflow is Started',
};
const LOCK_ICON = '<uxt-icon-button presentational icon="lock" density="s"></uxt-icon-button>';

function renderSyncErrorCard(item) {
  const lockLabel = PROTECTION_LABEL[item.protection];
  const seqHint = item.protection === 'delete-from-end' && !syncItemDeletable(item)
    ? 'Part of a Start/Stop sequence — only the most recent can be discarded'
    : null;
  return `
    <div class="ld-card sync-error-card" id="syncCard-${item.id}" data-sync-id="${item.id}" onclick="onSyncCardTap(event,'${item.id}')">
      <div class="ld-card-top">
        <div class="ld-card-headline">${item.recordLabel}</div>
        <uxt-tag density="m" text="${kitEsc(item.entity)}"></uxt-tag>
      </div>
      <div class="ld-card-subline">${item.sub} · ${item.timestamp}</div>
      <div class="ld-card-attrs">
        <div class="sync-card-error-text">${syncErrorTierText(item)}</div>
      </div>
      ${lockLabel ? `<div class="sync-card-lock">${LOCK_ICON}<span>${lockLabel}</span></div>` : ''}
      ${seqHint ? `<div class="sync-card-lock">${LOCK_ICON}<span>${seqHint}</span></div>` : ''}
      <div class="sync-card-actions">
        <uxt-button variant="outlined" tone="error" text="Discard" onclick="event.stopPropagation();onSyncCardDiscard('${item.id}')"></uxt-button>
        <uxt-button variant="contained" text="Retry" onclick="event.stopPropagation();retrySyncItem('${item.id}')"></uxt-button>
      </div>
    </div>`;
}
function onSyncCardTap(event, id) {
  const item = SYNC_DEMO_ITEMS.find(i => i.id === id);
  if (item) openSyncErrorRecord(item);
}
function onSyncCardDiscard(id) {
  deleteSyncItem(id, renderSyncStatusScreen);
}
function renderSyncStatusScreen() {
  const errorItems = SYNC_DEMO_ITEMS.filter(i => i.state === 'error');
  const queuedCount = SYNC_DEMO_ITEMS.filter(i => i.state === 'queued').length;
  const total = SYNC_DEMO_ITEMS.length;
  const synced = total - errorItems.length - queuedCount;
  const pct = total ? Math.round((synced / total) * 100) : 100;
  document.getElementById('outboxProgressLabel').textContent = `${synced} of ${total} synced`;
  document.getElementById('outboxProgressFill').style.width = pct + '%';

  const listEl = document.getElementById('syncErrorList');
  const labelEl = document.querySelector('.sync-section-label');
  if (!errorItems.length) {
    labelEl.style.display = 'none';
    listEl.innerHTML = `<div class="sync-empty-state">
      <div class="sync-empty-state-title">No Transactions</div>
      <div class="sync-empty-state-sub">Last sync: <span id="lastSyncTimeEmpty"></span></div>
    </div>`;
    return;
  }
  labelEl.style.display = '';
  listEl.innerHTML = errorItems.map(renderSyncErrorCard).join('');

  const focusId = sessionStorage.getItem('eamSyncFocusItem');
  if (focusId) {
    sessionStorage.removeItem('eamSyncFocusItem');
    const card = document.getElementById('syncCard-' + focusId);
    if (card) {
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.classList.add('flash');
      setTimeout(() => card.classList.remove('flash'), 1400);
    }
  }
}
// Real navigation (2026-07-22 nav pass) — was a toast stub. This screen
// has no single natural parent list (it's reached from any screen's sync
// panel), so back goes to Home, the app's root.
function navBack() {
  location.href = 'eam-home-screen-prototype-v1.html';
}
// Kit buttons take their label from `text`; shared code writes the dev
// labels into the hidden #id spans by textContent, so mirror them across.
function kitMirrorProtoButtons() {
  document.querySelectorAll('uxt-button[data-mirror]').forEach(btn => {
    const src = document.getElementById(btn.dataset.mirror);
    if (!src) return;
    const sync = () => { if (btn.getAttribute('text') !== src.textContent) btn.setAttribute('text', src.textContent); };
    sync();
    if (typeof MutationObserver !== 'undefined') new MutationObserver(sync).observe(src, { childList: true, characterData: true, subtree: true });
  });
}
renderSyncStatusScreen();
initDemoOnlineToggle();
initSharedApp({ contentSelector: '.content' });
kitMirrorProtoButtons();
</script>
</body>
</html>
