<!DOCTYPE html>
<html lang="en">
<head>
<script>if(localStorage.getItem('eamTheme')==='dark')document.documentElement.setAttribute('data-theme','dark');</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>HxGN EAM Mobile — Equipment Record View (Standard)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/eam-shared.css">
<!--
  STANDARD RECORD VIEW — EQUIPMENT (rebuilt 2026-07-16 onto shared/eam-
  shared.css + shared/eam-shared.js, per docs/EAM-REBUILD-Strategy-and-
  Execution-Plan-v1.md Phase 0.4). See docs/design-decisions-v3-1.md §5–§9
  for the Standard Model this now conforms to directly (canonical reference
  files: screen-layout-field-behavior-prototype-v1.html and this one). This
  file only ever adds Equipment-specific data/config/markup — every shared
  component's CSS/JS lives in the two shared files, not here.

  [1] No Edit Mode — every field is tappable directly from this view.
      Any change marks the record dirty; autosave fires on leaving the
      screen or switching tabs, not per keystroke (§5.1).
  [2] Header + tab rail shell (§5.3/§8.1) — no sequence/gating, every tab
      always tappable.
  [3] Comments + Documents are ALWAYS present, using the shared record-
      level data-driven excerpt+tab pattern (§7.2/§8, D7–D9) — not a
      one-off Equipment accordion anymore.
  [4] Custom Fields (§22) — generic, admin-defined per Class+Class Org
      (data/custom_field_defs.js), rendered via eam-shared.js's
      applyCustomFields()/renderCustomFieldsSection(). Changing Class
      re-runs the lookup and re-renders the whole section via the shared
      LOV_ON_SELECT hook, since a different Class can mean a wholly
      different field set, not just show/hide of a fixed one.
-->
<style>
/* Structure Details tree CSS — was a full local duplicate of the shared
   tree component here (tree-wrap through tree-guide), predating the
   2026-07-21 "Equipment LOV" convergence that promoted it to
   eam-shared.css. Never cleaned up when that happened — same values, so
   it silently just doubled up harmlessly until the palette pass changed
   the shared version and this stale local copy (later in source order)
   kept winning. Removed 2026-07-22, found via live testing, not the
   original duplication sweep. Only .tree-indent-1/-2/-3 are still local
   (no shared equivalent existed for those, unrelated to the palette). */
.tree-indent-1 { margin-left: 20px; }
.tree-indent-2 { margin-left: 40px; }
.tree-indent-3 { margin-left: 60px; }
</style>
</head>
<body>

<div class="proto-theme-bar">
  <span class="proto-theme-label">Preview theme</span>
  <button class="theme-toggle" id="themeToggle">☀ Light</button>
  <!-- Demo-only connectivity toggle (§4.5, 2026-07-20) — this prototype has
       no real backend, so "online" is a flag a reviewer flips by hand to
       see both outcomes of the sync banner's Retry button. -->
  <button class="theme-toggle" id="onlineToggle" onclick="toggleDemoOnline()">🌐 Offline</button>
</div>

<div class="app" id="app">

  <header class="nav" onclick="scrollFormToTop()">
    <div class="nav-left">
      <button class="nav-back" aria-label="Back" onclick="event.stopPropagation();navBack()">
        <svg width="20" height="20" fill="none" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="prototype-label">PROTOTYPE</span>
    </div>
    <div class="nav-title">Equipment</div>
    <div class="nav-actions">
      <span id="syncCtrl"></span>
    </div>
  </header>

  <div class="rec-header" id="recHeader" onclick="onRecHeaderTap(event)">
    <!-- §7.5 A2 (2026-08-11): the photo slot sits left of code/description and
         stretches down beside the status row, then collapses away with status
         on scroll. .rec-id-split is what pairs the two; the slot itself is
         rendered by renderRecordPhotoMount() so the empty/populated states and
         the tap behaviour stay shared with WO Record View's own photo badge. -->
    <div class="rec-id-split">
    <span id="recPhotoMount"></span>
    <div class="rec-id-row">
      <div class="rec-id-text">
        <span class="rec-num" id="recNum">00067333</span>
        <span class="rec-desc" id="recDesc" onclick="openDescEditor(event)">Pump, Centrifugal</span>
      </div>
      <div class="rec-header-actions">
        <button class="rec-pin-btn" id="recPinBtn" onclick="event.stopPropagation(); toggleRecordPin()" aria-label="Pin record" title="Pin to my list">
          <svg class="pin-outline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/></svg>
          <svg class="pin-fill" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22h1v-5h-1z"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/></svg>
        </button>
        <button class="rec-ellipsis-btn" id="recEllipsisBtn" onclick="event.stopPropagation(); toggleRecActionsMenu()" aria-label="More actions">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
        </button>
        <div class="rec-actions-menu" id="recActionsMenu">
          <div class="rec-actions-group">
            <div class="rec-actions-item" onclick="recCopyLink()">Copy Link</div>
          </div>
          <div class="rec-actions-divider"></div>
          <div class="rec-actions-group">
            <div class="rec-actions-item" onclick="recCopyRecord()">Copy</div>
            <div class="rec-actions-item danger" onclick="recDeleteRecord()">Delete</div>
          </div>
          <div class="rec-actions-divider"></div>
          <div class="rec-actions-group" id="recActionsScreenSpecific">
            <div class="rec-actions-item" onclick="closeRecActionsMenu(); showToast('Create/Insert Mode popup coming soon')">Create WO</div>
          </div>
        </div>
      </div>
    </div>
    </div><!-- /.rec-id-split -->
    <div class="rec-status-row" id="recStatusRow">
      <div class="rec-status-row-inner">
        <button class="rec-status-btn st-operational" id="recStatusBtn" onclick="openLov('__status')">
          <span id="recStatusBtnText">Installed</span>
          <svg width="13" height="13" fill="none" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <!-- Organization pill (§5.2 D1, moved into the header 2026-07-16) —
             always protected, justified opposite the status button, and
             collapses with it on scroll since it's inside the same
             .rec-status-row. -->
        <button class="org-pill protected in-header" data-field="organization">
          <span class="field-value" id="fv-organization-code">FBPP</span>
          <svg class="org-pill-chevron" width="12" height="12" fill="none" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- List/Detail header (§8.1) — every sibling tab except Record View. -->
  <div class="rec-header" id="listDetailHeader" onclick="scrollFormToTop()">
    <div class="rec-id-row">
      <div class="rec-id-text">
        <span class="rec-num" id="listDetailNum">00067333</span>
        <span class="rec-desc protected" id="listDetailDesc">Pump, Centrifugal</span>
      </div>
      <div class="rec-header-actions">
        <button class="rec-ellipsis-btn" id="listDetailPlusBtn" onclick="event.stopPropagation(); onListDetailPlusTap()" aria-label="Add">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="rec-ellipsis-btn" id="listDetailSearchBtn" onclick="event.stopPropagation(); onListDetailSearchTap()" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        </button>
        <button class="rec-ellipsis-btn" onclick="event.stopPropagation(); toggleListDetailMenu()" aria-label="More actions">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
        </button>
        <div class="rec-actions-menu" id="listDetailMenu">
          <div class="rec-actions-group"><div class="rec-actions-item" onclick="closeListDetailMenu(); showToast('Sort — coming soon')">Sort</div></div>
          <div class="rec-actions-divider"></div>
          <div class="rec-actions-group"><div class="rec-actions-item" onclick="closeListDetailMenu(); showToast('Detailed/List view toggle — coming soon')">View: Detailed</div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="tab-rail" id="tabRail">
    <div class="tab-rail-collapsed">
      <div class="tab-rail-name" id="tabRailName">Record View</div>
      <svg class="tab-chevron" id="tabChevron" width="16" height="16" fill="none" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="tab-map" id="tabMap"></div>
  </div>

  <div class="content">
    <div class="tab-content active" data-tab="record"></div>
    <div class="tab-content" data-tab="comments"></div>
    <div class="tab-content" data-tab="documents"></div>
    <div class="tab-content" data-tab="events"></div>
    <div class="tab-content" data-tab="costs"></div>
    <div class="tab-content" data-tab="pm"></div>
    <div class="tab-content" data-tab="structure"></div>
    <div class="tab-content" data-tab="depr"></div>
    <div class="tab-content" data-tab="meters"></div>
    <div class="tab-content" data-tab="warranty"></div>
    <div class="tab-content" data-tab="parts"></div>
  </div>

  <!-- ── SHEETS (shared component markup — behavior lives in eam-shared.js) ── -->
  <div class="sheet-overlay" id="sheetOverlay" onclick="closeAllSheets()"></div>

  <!-- Sync panel (§4.4.2) — opened from the sync icon in the header
       above. Content rendered by openSyncPanel() in eam-shared.js
       (shared markup, same shell every screen carries). Review navigates
       to eam-sync-status-prototype-v1.html. Fixes a real crash: openSheet()
       previously found no #syncPanelSheet on this screen at all. -->
  <div class="bottom-sheet" id="syncPanelSheet">
    <div class="sheet-handle-row"><div class="sheet-handle"></div></div>
    <div class="sheet-header">
      <button class="sheet-close" onclick="closeAllSheets()">✕</button>
      <div class="sheet-title">Sync Status</div>
      <div style="width:30px;flex-shrink:0;"></div>
    </div>
    <div class="sync-panel-state" id="syncPanelStateLabel"></div>
    <div class="sheet-body" id="syncPanelList"></div>
    <div class="sync-panel-hydrate" id="syncPanelHydrate"></div>
  </div>

  <div class="bottom-sheet" id="lovSheet">
    <div class="sheet-handle-row"><div class="sheet-handle"></div></div>
    <div class="sheet-header">
      <button class="sheet-close" onclick="closeAllSheets()">✕</button>
      <div class="sheet-title" id="lovSheetTitle">Select value</div>
      <button class="sheet-clear-btn" id="lovClearBtn" onclick="clearLov()">Clear</button>
    </div>
    <div class="lov-search-row" id="lovSearchRow">
      <svg width="15" height="15" fill="none" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input class="lov-search-input" id="lovSearchInput" placeholder="Search" oninput="filterLovOptions(this.value)">
    </div>
    <div class="sheet-body" id="lovSheetBody"></div>
  </div>

  <div class="bottom-sheet" id="dataspySheet">
    <div class="sheet-handle-row"><div class="sheet-handle"></div></div>
    <div class="sheet-header">
      <button class="sheet-close" onclick="closeAllSheets()">✕</button>
      <div class="sheet-title">Select dataspy</div>
      <div style="width:30px;flex-shrink:0;"></div>
    </div>
    <div class="sheet-body" id="dataspySheetBody"></div>
  </div>

  <div class="bottom-sheet" id="editSheet">
    <div class="sheet-handle-row"><div class="sheet-handle"></div></div>
    <div class="sheet-header">
      <button class="sheet-close" onclick="closeAllSheets()">✕</button>
      <div class="sheet-title" id="editSheetTitle">Edit field</div>
      <button class="sheet-clear-btn" id="editClearBtn" onclick="clearEdit()">Clear</button>
    </div>
    <div class="edit-input-wrap"><input class="edit-input" id="editSheetInput" type="text" oninput="sanitizeCurrencyInput(this)"></div>
    <div class="sheet-footer"><button class="btn-save" onclick="saveEdit()">Save</button></div>
  </div>

  <div class="bottom-sheet" id="dateSheet">
    <div class="sheet-handle-row"><div class="sheet-handle"></div></div>
    <div class="sheet-header">
      <button class="sheet-close" onclick="closeAllSheets()">✕</button>
      <div class="sheet-title" id="dateSheetTitle">Select date</div>
      <button class="sheet-clear-btn" id="dateClearBtn" onclick="clearDate()">Clear</button>
    </div>
    <div class="sheet-body">
      <div class="cal-header">
        <button class="cal-nav-btn" onclick="calNavMonth(-1)">‹</button>
        <span class="cal-month-label" id="calMonthLabel">July 2026</span>
        <button class="cal-nav-btn" onclick="calNavMonth(1)">›</button>
      </div>
      <div class="cal-weekdays"><span class="cal-weekday">Sun</span><span class="cal-weekday">Mon</span><span class="cal-weekday">Tue</span><span class="cal-weekday">Wed</span><span class="cal-weekday">Thu</span><span class="cal-weekday">Fri</span><span class="cal-weekday">Sat</span></div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </div>

  <div class="bottom-sheet text-editor-sheet" id="textEditorSheet">
    <div class="text-editor-header">
      <div class="text-editor-left">
        <button class="text-editor-close" id="textEditorCloseBtn" onclick="textEditorCloseTap()">✕</button>
        <button class="text-editor-discard" id="textEditorDiscard" onclick="textEditorConfirmDiscard()">Discard unsaved changes</button>
      </div>
      <div class="text-editor-title" id="textEditorTitle">Edit</div>
      <div style="width:30px;flex-shrink:0;"></div>
    </div>
    <div class="text-editor-body"><textarea class="text-editor-textarea" id="textEditorTextarea" oninput="textEditorInputChanged()" placeholder="Type here…"></textarea></div>
    <div class="sheet-footer"><button class="btn-save" onclick="saveTextEditor()">Save</button></div>
  </div>

  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-modal">
      <div class="confirm-message" id="confirmMessage">Are you sure?</div>
      <div class="confirm-actions">
        <button class="confirm-btn confirm-cancel" onclick="closeConfirm()">Cancel</button>
        <button class="confirm-btn confirm-danger" id="confirmDangerBtn" onclick="confirmDangerAction()">Delete</button>
      </div>
    </div>
  </div>

  <div class="bottom-sheet" id="commentActionsSheet">
    <div class="sheet-handle-row"><div class="sheet-handle"></div></div>
    <div class="sheet-header">
      <button class="sheet-close" onclick="closeAllSheets()">✕</button>
      <div class="sheet-title">Comment Actions</div>
      <div style="width:30px;flex-shrink:0;"></div>
    </div>
    <div class="sheet-body" id="commentActionsBody"></div>
  </div>


  <div class="toast" id="toast"><span id="toastMsg"></span></div>
</div>

<script src="../../data/custom_field_defs.js"></script>
<script src="../../data/equipment.js"></script>
<script src="shared/eam-shared.js"></script>
<script>

/* ═══════════════════════════════════════════════════════════════════════
   DATA — RECORD (renamed from EQUIP), LOV_DATA (renamed from LOV_OPTIONS)
   ═══════════════════════════════════════════════════════════════════════ */
// Insert Mode "After Save" (§9.2, built 2026-07-20) — reachable only via
// Home's Create bar (no Equipment List screen exists yet, per this
// session's scope decision). Same sessionStorage hand-off as
// eam-wo-record-view-prototype-v1.html; see navigateToNewRecord() in
// eam-shared.js. Empty optional fields use this file's own existing
// {code:'',desc:''} unset convention (already the shape pmWoDepartment
// uses below). Consume-once, not a `?new=1` query flag — see the matching
// comment in eam-wo-record-view-prototype-v1.html for why (`npx serve`
// drops query strings on its clean-URL redirect).
const NEW_RECORD_RAW = sessionStorage.getItem('eamNewEquipRecord');
const NEW_RECORD = NEW_RECORD_RAW ? JSON.parse(NEW_RECORD_RAW) : null;
if (NEW_RECORD) sessionStorage.removeItem('eamNewEquipRecord');
const RECORD = NEW_RECORD ? {
  asset: NEW_RECORD.asset, desc: NEW_RECORD.desc || '',
  department: NEW_RECORD.department || { code: '', desc: '' },
  pmWoDepartment: NEW_RECORD.pmWoDepartment || { code: '', desc: '' },
  criticality: NEW_RECORD.criticality || { code: '', desc: '' },
  commissionDate: '',
  assignedTo: NEW_RECORD.assignedTo || { code: '', desc: '' },
  organization: NEW_RECORD.organization || { code: 'ORG1', desc: '' },
  status: { code: '', desc: '' }, // Operational Status (Asset Details) — distinct from the header's __status pill below; not collected by Insert Mode
  class: NEW_RECORD.class || { code: 'PUMP', desc: 'Pump' },
  category: NEW_RECORD.category || { code: '', desc: '' },
  costCode: NEW_RECORD.costCode || { code: '', desc: '' },
  outOfService: false,
  alias: '', equipmentValue: '',
  dormantStart: '', dormantEnd: '',
  reuseDormantPeriod: false,
  originalInstallDate: '', latestInstallDate: '',
  manufacturer: NEW_RECORD.manufacturer || { code: '', desc: '' },
  serialNumber: '', model: '',
  xCoord: '', yCoord: '',
  revisionControl: false,
  equipmentRevision: '',
  rcOnGeneration: false,
} : {
  asset: '00067333', desc: 'Pump, Centrifugal',
  department: {code:'ENG', desc:'Engineering'},
  pmWoDepartment: {code:'', desc:''},
  criticality: {code:'3', desc:'3 - High'},
  commissionDate: '2021-07-20',
  assignedTo: {code:'BCAMPBELL', desc:'Bruce Campbell'},
  organization: {code:'FBPP', desc:'Field-Based Plant & Production'},
  status: {code:'PENDING', desc:'Pending'},

/* ══ PER-RECORD ROUTING (2026-08-11) ══════════════════════════════════════
   Equipment List hands over the tapped row (eamOpenEquipment, consume-once,
   same pattern as eamNewEquipRecord above); this overlays that row's identity
   onto the canonical demo record. Previously every card opened 00067333, so
   the app looked like it ignored which row you tapped.

   Placed here deliberately — after LOV_DATA (so a code can be resolved to its
   real description) and before LOV_CURRENT below (which seeds from RECORD, so
   the LOV sheets pre-check the right option). Moving it either side breaks one
   of those two. Identity + header fields only; deep content (comments,
   documents, child tabs) stays the demo record's.
   ══════════════════════════════════════════════════════════════════════════ */
const OPEN_EQUIP_RAW = sessionStorage.getItem('eamOpenEquipment');
if (OPEN_EQUIP_RAW) sessionStorage.removeItem('eamOpenEquipment');
(function applyOpenedEquipment() {
  if (NEW_RECORD || !OPEN_EQUIP_RAW) return;
  let e;
  try { e = JSON.parse(OPEN_EQUIP_RAW); } catch (err) { return; }
  if (!e || !e.assetId) return;
  const lov = (key, code) => {
    const hit = (LOV_DATA[key] || []).find(o => o.code === code);
    return { code: code || '', desc: hit ? hit.desc : '' };
  };
  const master = (typeof EAM_EQUIPMENT !== 'undefined' && EAM_EQUIPMENT[e.assetId]) || {};
  RECORD.asset = e.assetId;
  RECORD.desc = e.desc || master.desc || '';
  RECORD.organization = lov('organization', e.organization || master.organization);
  RECORD.class = lov('class', e.class || master.class);
  RECORD.category = lov('category', e.category || master.category);
  RECORD.assignedTo = lov('assignedTo', e.assignedTo || master.assignedTo);
  if (master.department) RECORD.department = lov('department', master.department);
  if (master.costCode) RECORD.costCode = lov('costCode', master.costCode);
  // Nameplate/identity values that belong to 00067333 specifically and would
  // read as flatly wrong on a valve or a building. Cleared rather than faked.
  if (e.assetId !== '00067333') {
    RECORD.alias = ''; RECORD.serialNumber = ''; RECORD.model = '';
    RECORD.equipmentValue = ''; RECORD.manufacturer = { code: '', desc: '' };
  }
})();

// Header Fields box row (§5.2 D2) — plain-LOV style, description only, no
// code (revised 2026-07-16). Uses the same id (fv-{key}-desc) fieldRowLov()/
// selectLov() already expect, so selection updates this row the same way
// it would any other LOV field — no special-casing needed in eam-shared.js.
// `required` gets the same red left-bar marker as a .form-field.required
// row (§5.2, revised 2026-07-16 — Header Fields membership no longer
// implies required on its own).
// Stacked Code + Description (description over code), not description-
// only — swept 2026-07-24 onto the decided Grid LOV rule (§5.2's "LOV —
// Code + Description" row): plain Grid LOVs show a code again now,
// reversing the 2026-07-16 "description only" default this function
// originally implemented.
function fieldRowAttr(key, fullWidth, required) {
  const v = RECORD[key];
  return `<div class="attr-item${fullWidth ? ' full-width' : ''}${required ? ' required' : ''}" data-field="${key}" onclick="openLov('${key}')">
    <span class="attr-label">${FIELD_LABELS[key]}</span>
    <div class="attr-lov-stack">
      <span class="attr-text" id="fv-${key}-desc">${v.desc}</span>
      <span class="attr-lov-stack-code" id="fv-${key}-code">${v.code}</span>
    </div>
  </div>`;
}

/* ── COSTS — a version of the same standard shell, not a plain instance of
   it: rows are work orders carrying their own cost breakdown, and an
   aggregate footer sums material/labor/tool/overall cost across whatever
   the active dataspy has in view. No Plus — costs are derived from labor/
   parts/tool transactions recorded elsewhere, never inserted directly
   here. Uses the same listDetailState/openDataspySheet/setListDetailMode/
   toggleListDetailSearch mechanism as every other List/Detail tab. ── */
function renderCostsTab() {
  const cfg = LIST_DETAIL_TABS.costs;
  const state = listDetailState.costs || {};
  const dsKey = state.dataspy || cfg.dataspies[0].key;
  const mode = state.mode || 'detailed';
  const ds = cfg.dataspies.find(d => d.key === dsKey) || cfg.dataspies[0];
  const rows = cfg.rows.filter(r => r.ds.includes(dsKey));
  const sums = rows.reduce((s, r) => ({ material: s.material + r.material, labor: s.labor + r.labor, tool: s.tool + r.tool, total: s.total + r.total }), { material: 0, labor: 0, tool: 0, total: 0 });
  return `
    ${state.searchOpen ? `
    <div class="ld-search-bar">
      <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input class="ld-search-input" type="text" placeholder="Search Costs" value="${(state.search||'').replace(/"/g,'&quot;')}" oninput="onListDetailSearchInput('costs', this.value)" autocomplete="off">
      <button class="ld-search-close" onclick="toggleListDetailSearch('costs')" aria-label="Close search"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>` : ''}
    <div class="ds-bar" onclick="openDataspySheet('costs')">
      <div class="ds-icon-w"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg></div>
      <div class="ds-body"><div class="ds-name">${ds.name}</div><div class="ds-count">${rows.length} work order${rows.length===1?'':'s'}</div></div>
      <svg class="ds-chevron" width="16" height="16" fill="none" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="mode-tog">
      <button class="mode-btn ${mode==='detailed'?'active':''}" onclick="setListDetailMode('costs','detailed')">Detailed</button>
      <button class="mode-btn ${mode==='list'?'active':''}" onclick="setListDetailMode('costs','list')">List</button>
    </div>
    <div class="res-row">
      <span class="res-count">${rows.length} work order${rows.length===1?'':'s'}</span>
      <button class="sort-btn" onclick="showToast('Sort — coming soon')"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="14" y2="6"/><line x1="4" y1="12" x2="11" y2="12"/><line x1="4" y1="18" x2="8" y2="18"/><path d="M17 4v16m0 0l3-3m-3 3l-3-3"/></svg>Total cost</button>
    </div>
    <div class="plain-list">${rows.map(r => `
      <div class="plain-row" data-search="${('wo '+r.wo+' '+r.type+' '+r.status).toLowerCase()}" onclick="showToast('Opens this record in Update Mode — code/PK protected there (coming soon)')">
        <div class="plain-row-body">
          <div class="plain-row-title">WO ${r.wo} · ${r.type}</div>
          ${mode==='detailed' ? `<div class="plain-row-sub">${r.status}${r.labor?' · Labor '+formatCurrency(r.labor):''}${r.material?' · Material '+formatCurrency(r.material):''}${r.tool?' · Tool '+formatCurrency(r.tool):''}</div>` : ''}
        </div>
        <div class="plain-row-trailing">${formatCurrency(r.total)}</div>
      </div>`).join('')}</div>
    <div class="cost-summary">
      <div class="cost-summary-row"><span>Total Material Cost</span><span class="cost-summary-value">${formatCurrency(sums.material)}</span></div>
      <div class="cost-summary-row"><span>Total Labor Cost</span><span class="cost-summary-value">${formatCurrency(sums.labor)}</span></div>
      <div class="cost-summary-row"><span>Total Tool Cost</span><span class="cost-summary-value">${formatCurrency(sums.tool)}</span></div>
      <div class="cost-summary-row total"><span>Total Overall Cost</span><span class="cost-summary-value">${formatCurrency(sums.total)}</span></div>
    </div>
    <div style="height:16px;"></div>`;
}

/* ── STRUCTURE DETAILS — untouched tree content (§7.3), not a List/Detail

const TAB_RENDERERS = {
  comments: () => renderCommentsTabContent(),
  documents: () => renderDocumentsTabContent(),
  events: renderEventsTab, costs: renderCostsTab, pm: renderPmTab,
  structure: renderStructureTab, depr: renderDeprTab, meters: renderMetersTab,
  warranty: renderWarrantyTab, parts: renderPartsTab,
  // no 'record' entry — that tab is static, rendered once below.
};

/* ── init ── */
currentTab = 'record';
renderTabRail();
applyCustomFields('equipment', RECORD.class.code, RECORD_CLASS_ORG, EAM_EQUIPMENT[RECORD.asset] ? EAM_EQUIPMENT[RECORD.asset].customFieldValues : {});
document.querySelector('.tab-content[data-tab="record"]').innerHTML = renderRecordViewTab();
applySyncErrorBanner();
/* Header photo slot (§7.5 A2, 2026-08-11). A freshly-created record has no
   photo, so the slot renders its camera/empty state — which is the point of
   having an empty state at all. equipPhotoOnSet is the shared hook the source
   picker calls once a source is chosen; without defining it here, tapping the
   slot on this screen would fall back to eam-shared.js's "coming soon" toast
   the way Insert Mode's own does. */
RECORD.photoUrl = NEW_RECORD ? '' : EQUIP_PHOTO_DEMO_URL;
renderRecordPhotoMount('recPhotoMount', RECORD.photoUrl);
equipPhotoOnSet = (url) => {
  RECORD.photoUrl = url;
  renderRecordPhotoMount('recPhotoMount', url);
};
renderCommentsExcerptMount();
renderDocumentsExcerptMount();
['comments','documents','events','costs','pm','structure','depr','meters','warranty','parts'].forEach(k => {
  document.querySelector(`.tab-content[data-tab="${k}"]`).innerHTML = TAB_RENDERERS[k]();
});
initDemoOnlineToggle();
initSharedApp({ contentSelector: '.content' });
</script>
