function setWfField(k, v){
  const w = wf(); if(!w) return;
  w[k] = v; w.updated = todayStr(); saveWFS();
  if(k === 'woType'){ renderBanner(); renderCvBar(); }
  if(k === 'desc') renderCrumb();
}
/* Changing the function can leave steps the new function cannot render.
   REPORTED, never auto-removed (§26.5.1): silently dropping a step would hide
   a dead end, and the fix belongs in Screen Designer or Function Permissions.
   Switching FAMILY is the destructive case — WO steps are meaningless on the
   Equipment screen — so that one confirms. */
function setWfFunction(code){
  const w = wf(); if(!w) return;
  const next = fnByCode(code); if(!next) return;
  const prev = fnByCode(w.fn);
  const familyChange = prev && next.family !== prev.family;
  const apply = () => {
    w.fn = code; w.updated = todayStr(); saveWFS(); render();
    const gaps = capabilityGaps(w);
    toast(gaps.length
      ? fnLabel(w) + ' — ' + gaps.length + ' step' + (gaps.length>1?'s':'') + ' this function cannot render'
      : 'Base screen set to ' + fnLabel(w));
  };
  if(familyChange && w.nodes.length){
    confirmBox({
      title:'Switch to the ' + (next.family === 'equip' ? 'Equipment' : 'Work Order') + ' screen?',
      sub:'This workflow has ' + w.nodes.length + ' step' + (w.nodes.length===1?'':'s') + ' placed against ' + esc(prev.code) + '.',
      body:'<div style="font-size:var(--uxt-theme-typography-body-2-font-size);line-height:1.6">' +
        'The steps are <b>kept</b>, not deleted — but most of them do not exist on the other family\'s screen, ' +
        'so they will be reported as capability gaps until you remove them.</div>' +
        '<ul class="bullets"><li>Nothing is removed automatically. A step the function cannot render is a ' +
        '<b>dead end to report</b>, not something for this screen to quietly tidy away (§26.5.1).</li></ul>',
      ok:'Switch screen', danger:true, onOk:apply,
    });
    return;
  }
  apply();
}
/* Switching entity re-bases both statuses: an EVST code is not an AAST code,
   so carrying them over would leave a status that does not exist. */
function setCompletionEntity(val){
  const w = wf(); if(!w) return;
  w.completionEntity = val;
  const d = COMPLETION_DEFAULTS[val] || COMPLETION_DEFAULTS.wo;
  w.startWorkStatus = d.start;
  w.completionStatus = d.complete;
  w.updated = todayStr(); saveWFS(); renderBanner();
  toast('Completion drives ' + (val === 'activity' ? 'Activities (AAST)' : 'Work Orders (EVST)'));
}

function saveWf(){
  const w = wf(); if(!w) return;
  if(!(w.desc||'').trim()){ toast('A description is required before saving'); return; }
  const cleared = validateForks(w);
  w.updated = todayStr(); saveWFS(); render();
  toast(cleared ? 'Saved — ' + cleared + ' dangling fork target reset' : 'Workflow saved');
}

/* ── THE FREE FORM CONVERSION (the user's item 10) ──
   Turning Free Form ON is destructive in one specific way — the ORDER and
   the FORKS go — so it confirms and says exactly what happens, including
   the dedupe. Turning it OFF is not: the cards already have a display
   order, so they become a sequence in that order and nothing is lost. An
   unnecessary confirm on the way back would teach people to dismiss the
   one that matters. ── */
function toggleFreeForm(){
  const w = wf(); if(!w) return;
  if(!w.freeForm){
    const forks = w.nodes.filter(isForkKind).length;
    const seen = {}; const dupes = [];
    w.nodes.filter(n=>n.kind==='step').forEach(n=>{
      if(seen[n.step]) dupes.push(n); else seen[n.step] = n;
    });
    const refs = refNodes(w).length;
    if(!w.nodes.length){ applyFreeForm(w); return; }
    confirmBox({
      title:'Switch to Free Form?',
      sub:'Free Form has no order, so the flow you have defined cannot be kept.',
      body:
        '<div style="font-size:12.5px;line-height:1.6">Steps are kept, <b>in the order defined</b>. What goes:</div>' +
        '<ul class="bullets">' +
          (dupes.length
            ? '<li><b>' + dupes.length + ' duplicate step' + (dupes.length===1?'':'s') + ' reduced to one</b> — ' +
              dupes.map(n=>esc(n.name)).join(', ') + '. Free Form has one tab per step, so a second instance has nowhere to be.</li>'
            : '<li>No duplicate steps to reduce.</li>') +
          (forks
            ? '<li><b>' + forks + ' question fork' + (forks===1?'':'s') + ' removed</b> — a fork routes forward through a sequence, and there is no sequence to route through.</li>'
            : '<li>No question forks to remove.</li>') +
          '<li><b>Gates and Required flags are cleared</b> — nothing gates anything when the technician can open any tab at any time.</li>' +
          (refs ? '<li>The <b>More group merges into the canvas</b> — in Free Form the whole canvas already is the More group.</li>' : '') +
        '</ul>' +
        '<div class="pop__note" style="margin-top:12px">Switching back rebuilds a sequence from the card order shown. It does not bring the forks or gates back.</div>',
      ok:'Switch to Free Form', danger:true,
      onOk:function(){ applyFreeForm(w); },
    });
    return;
  }
  /* Free Form OFF — everything becomes one ordered flow, in display order.
     Record View instance 1, if present, is re-pinned to step 1 (§14). */
  w.freeForm = false;
  w.nodes.forEach(n => { n.zone = 'flow'; });
  const rv = w.nodes.find(n=>n.kind==='step' && n.step==='recordview' && n.inst===1);
  if(rv){ rv.pinned = true; w.nodes.splice(w.nodes.indexOf(rv),1); w.nodes.unshift(rv); }
  w.updated = todayStr();
  state.dsnOpen = false; state.selNid = null;
  saveWFS(); render();
  toast('Sequenced from the card order · gates and forks were not restored');
}
function applyFreeForm(w){
  const seen = {};
  w.nodes = w.nodes.filter(n => {
    /* Forks AND status actions are positional, and Free Form has no
       positions — so both go, not just the fork. */
    if(isForkKind(n) || n.kind === 'action') return false;
    if(seen[n.step]) return false;
    seen[n.step] = true; return true;
  });
  w.nodes.forEach(n => {
    n.zone = 'flow'; n.required = false; n.reqComment = false; n.reqDoc = false;
    n.pinned = false;
    /* Instance collapses to 1 along with the dedupe, so the layout key goes
       back to the bare tab id — the surviving instance keeps ITS layout, it
       just stops being variant #n. */
    n.inst = 1;
    if(!n.renamed) n.name = stepLabel(n.step);
  });
  w.freeForm = true; w.updated = todayStr();
  state.dsnOpen = false; state.selNid = null;
  saveWFS(); render();
  toast('Free Form — ' + w.nodes.length + ' tab' + (w.nodes.length===1?'':'s') + ', no order');
}

/* ═══════════════════════════════════════════════════════════════════════
   STEP LIBRARY (left panel)
   ═══════════════════════════════════════════════════════════════════════ */
function renderLib(){
  const w = wf(); if(!w) return;
  $('libHint').innerHTML = w.freeForm
    ? 'Drag a step onto the canvas. Free Form allows one of each.'
    : 'Drag a step onto the canvas. Drop it anywhere in the flow — the arrows re-point themselves.';

  /* ONE flat list of screens. The old Execution / Record-tabs headings were
     a browsing aid that read as a rule — and §14.8 already says step-vs-More
     placement is configuration, not a property of the screen. Grouping them
     by where they "usually" go was the same mistake one level up. */
  let html = '<div class="lib__grp">Available screens</div>';
  STEP_LIB.forEach(e => {
    const used = w.nodes.filter(nd => nd.kind === 'step' && nd.step === e.id).length;
    /* Two independent reasons an entry is unavailable, and they say different
       things: Free Form allows one of each, while a capability gap means the
       function cannot render it at all (§26.2). */
    const noCap = !fnHasTab(w, e.id);
    const blocked = noCap || (w.freeForm && used > 0);
    const why = noCap ? (w.fn + ' has no ' + e.label + ' tab') : 'Free Form allows one of each screen';
    html += '<div class="lib__item" ' +
      (blocked ? 'style="opacity:.42;cursor:not-allowed" title="' + why + '"'
               : 'draggable="true" ondragstart="libDragStart(event,\'' + e.id + '\')" ondragend="dragEnd()"') + '>' +
      '<span class="lib__ico">' + ic(e.icon,16) + '</span>' +
      '<span class="lib__item-t">' + esc(e.label) + '</span>' +
      (noCap ? '<span class="lib__used" title="' + why + '">' + ic('block',14) + '</span>'
             : (used ? '<span class="lib__used">' + used + '</span>' : '')) +
      '</div>';
  });
  /* User Defined Screens are screens too, so they sit in the same list —
     marked by their icon, not by a heading. Placed, never authored
     (§27.4 role 1 / §29.5). */
  UDS_DEFS.forEach(d => {
    const usedU = w.nodes.filter(nd => nd.kind === 'uds' && nd.uds === d.id).length;
    html += '<div class="lib__item lib__item--uds" draggable="true" ' +
      'ondragstart="libDragStart(event,\'uds:' + d.id + '\')" ondragend="dragEnd()">' +
      '<span class="lib__ico">' + ic('uds',16) + '</span>' +
      '<span class="lib__item-t">' + esc(d.label) + '</span>' +
      (usedU ? '<span class="lib__used">' + usedU + '</span>' : '') +
      '</div>';
  });

  /* ── ACTIONS ──
     Not screens. An action is something the workflow DOES at a point in the
     sequence, so it is placed positionally like a step but never numbered and
     never in the step rail — the technician does not visit it.

     Absent entirely while Free Form is on: both actions are positional, and
     Free Form has no positions. */
  if(!w.freeForm){
    html += '<div class="lib__grp">Actions</div>' +
      '<div class="lib__item lib__item--fork" draggable="true" ondragstart="libDragStart(event,\'fork\')" ondragend="dragEnd()">' +
        '<span class="lib__ico">' + ic('split',16) + '</span>' +
        '<span class="lib__item-t">Question fork</span></div>' +
      '<div class="lib__item lib__item--fork" style="' + accentStyleFor('blue') + '" draggable="true" ' +
        'ondragstart="libDragStart(event,\'cond\')" ondragend="dragEnd()">' +
        '<span class="lib__ico">' + ic('rule',16) + '</span>' +
        '<span class="lib__item-t">Condition fork</span></div>' +
      '<div class="lib__item lib__item--act" style="' + accentStyleFor('orange') + '" draggable="true" ' +
        'ondragstart="libDragStart(event,\'status\')" ondragend="dragEnd()">' +
        '<span class="lib__ico">' + ic('flag',16) + '</span>' +
        '<span class="lib__item-t">Status update</span></div>' +
      '<div class="lib__item lib__item--act" style="' + accentStyleFor('green') + '" draggable="true" ' +
        'ondragstart="libDragStart(event,\'timer\')" ondragend="dragEnd()">' +
        '<span class="lib__ico">' + ic('timer',16) + '</span>' +
        '<span class="lib__item-t">Start Timer</span></div>' +
      '<div class="lib__item lib__item--act" style="' + accentStyleFor('red') + '" draggable="true" ' +
        'ondragstart="libDragStart(event,\'stoptimer\')" ondragend="dragEnd()">' +
        '<span class="lib__ico">' + ic('timerOff',16) + '</span>' +
        '<span class="lib__item-t">Stop Timer</span></div>';
  }
  $('libBody').innerHTML = html;
}
function libDragStart(ev, stepId){
  drag = {from:'lib', stepId:stepId};
  ev.dataTransfer.effectAllowed = 'copy';
  try{ ev.dataTransfer.setData('text/plain', stepId); }catch(e){}
  ev.currentTarget.classList.add('dragging');
}
function dragEnd(){
  drag = null; dropIdx = null; dropZone = null;
  document.querySelectorAll('.dragging').forEach(e=>e.classList.remove('dragging'));
  document.querySelectorAll('.dragover').forEach(e=>e.classList.remove('dragover'));
  renderCanvas();
}

/* ═══════════════════════════════════════════════════════════════════════
   CANVAS BAR
   ═══════════════════════════════════════════════════════════════════════ */
/* Reported at the top of the canvas, because a gap is about the WORKFLOW's
   choice of function rather than any one step — though each offending node is
   marked too, so it is findable. */
/* REMOVED 2026-09-16 — the capability roll-up is gone. capabilityGaps() is
   NOT removed and the gap is still unmissable on the canvas: the node
   itself outlines in error red, and its library entry is disabled with the
   reason on it. The finding is on the step that has the problem, which is
   also the only place it can be acted on (§26.5.1 — reported, never
   auto-fixed). Kept as a no-op so the call site reads as deliberate. */
function capabilityBannerHtml(){ return ''; }

function renderCvBar(){
  const w = wf(); if(!w) return;
  const nSeq = seqNodes(w).length, nRef = refNodes(w).length, nFork = w.nodes.filter(isForkKind).length;
  $('cvbar').innerHTML =
    '<span class="cvbar__t">' + (w.freeForm ? 'Free Form canvas' : 'Flow canvas') + '</span>' +
    '<span class="chip chip--dense chip--static" title="Base screen this workflow is authored against">' +
      ic('layout',16) + esc(w.fn) + '</span>' +
    '<span class="cvbar__d">' +
      (w.freeForm
        ? w.nodes.length + ' tab' + (w.nodes.length===1?'':'s') + ' · unordered'
        : nSeq + ' step' + (nSeq===1?'':'s') + (nFork?' · ' + nFork + ' fork' + (nFork===1?'':'s'):'') + (nRef?' · ' + nRef + ' in More':'')) +
    '</span>' +
    /* ONE CLOSE AFFORDANCE (2026-09-17). This used to carry a "Close
       designer" pill while the panel itself already had an ✕ in its header —
       two controls for one action, over two different columns, and the one
       further from the panel was the more prominent of the two. The ✕ won:
       it is where the thing being closed is. */
    '<span class="cvbar__r">' +
      '<span class="cvbar__d">' + (state.dsnOpen
        ? 'Screen Designer is open on the right — close it with its own ✕'
        : 'A step\'s ⋯ menu ▸ Screen Designer lays out its fields') + '</span>' +
    '</span>';
}

/* ═══════════════════════════════════════════════════════════════════════
   CANVAS
   ═══════════════════════════════════════════════════════════════════════ */
function renderCanvas(){
  const w = wf(); if(!w) return;
  const cv = $('cv');
  if(w.freeForm){ cv.innerHTML = freeFormHtml(w); wireCanvas(); return; }

  const flow = flowNodes(w), ref = refNodes(w);
  if(!w.nodes.length){
    cv.innerHTML =
      '<div class="cv-empty" ondragover="flowDragOver(event)" ondrop="flowDrop(event)">' +
        '<div class="cv-empty__i">' + ic('route',21) + '</div>' +
        '<div class="cv-empty__t">Empty canvas</div>' +
        '<div class="cv-empty__d">Drag a step from the Step Library on the left. The first one drops straight in; ' +
          'after that, where you drop decides the order and the arrows draw themselves.</div>' +
      '</div>';
    wireCanvas(); return;
  }

  let flowHtml = '';
  flow.forEach((n, i) => {
    if(dropZone === 'flow' && dropIdx === i) flowHtml += '<div class="dropline"></div>';
    flowHtml += nodeHtml(w, n, false);
    const isLast = i === flow.length - 1;
    if(!isLast) flowHtml += connHtml(w, i);
  });
  if(dropZone === 'flow' && dropIdx === flow.length) flowHtml += '<div class="dropline"></div>';

  /* The reference zone is hidden until something is in it — until then it
     is a region with no contents explaining a feature nobody has used. Once
     present it stays, and it is a live drop target (the user's 7.3.3). */
  const showRef = ref.length > 0 || (drag && dropZone === 'ref');
  const refHtml = showRef ? refZoneHtml(w, ref) : '';

  /* An "End of workflow" terminal, but only when a fork actually routes to
     it — otherwise it is a box explaining a feature nobody used. It is a
     wire destination, which is why it lives inside .flow. */
  if(flow.some(x => isForkKind(x) && forkBranches(x).some(b => x[b[1]] === '__end'))){
    flowHtml += '<div class="conn" style="height:10px"></div><div class="fork-end">End of workflow</div>';
  }

  cv.innerHTML =
    capabilityBannerHtml(w) +
    '<div class="cv-col" ondragover="flowDragOver(event)" ondrop="flowDrop(event)">' +
      '<div class="flow">' + flowHtml + '</div>' +
    '</div>' +
    refHtml;
  wireCanvas();
}

function refZoneHtml(w, ref){
  return '<div class="refzone' + (dropZone==='ref'?' dragover':'') + '" id="refzone" ' +
      'ondragover="refDragOver(event)" ondragleave="refDragLeave(event)" ondrop="refDrop(event)">' +
    '<div class="refzone__head">' +
      '<div class="refzone__t">' + ic('layers',13) + 'More group</div>' +
      '<div class="refzone__d">Reference steps, outside the flow. Reachable at any point, never gated, never in the Next sequence. ' +
        'The app calls this group <b>More</b> (§14.8).</div>' +
    '</div>' +
    '<div class="refzone__body">' +
      (ref.length ? ref.map(n=>nodeHtml(w,n,true)).join('') : '<div class="refzone__empty">Drop a step here</div>') +
    '</div>' +
  '</div>';
}

function freeFormHtml(w){
  if(!w.nodes.length){
    return '<div class="cv-empty" ondragover="ffDragOver(event)" ondrop="ffDrop(event)">' +
      '<div class="cv-empty__i">' + ic('grid',21) + '</div>' +
      '<div class="cv-empty__t">Empty Free Form canvas</div>' +
      '<div class="cv-empty__d">Drag tabs in from the left. Order does not matter here — the technician opens whichever one they need.</div>' +
    '</div>';
  }
  return capabilityBannerHtml(w) +
    '<div class="ffzone' + (dropZone==='ff'?' dragover':'') + '" id="ffzone" ' +
      'ondragover="ffDragOver(event)" ondragleave="ffDragLeave(event)" ondrop="ffDrop(event)">' +
    '<div class="ffzone__head">' +
      '<div class="refzone__t">' + ic('grid',13) + 'All tabs · no order</div>' +
      '<div class="refzone__d">Free Form is the More-group paradigm applied to everything: every tab is reachable at any time, ' +
        'and nothing gates anything. The card order below is display order only.</div>' +
    '</div>' +
    '<div class="ffzone__body">' + w.nodes.map(n=>nodeHtml(w,n,true)).join('') + '</div>' +
  '</div>';
}

/* ── A NODE ── */
function nodeHtml(w, n, inZone){
  const sel = state.selNid === n.nid ? ' sel' : '';
  if(n.kind === 'action'){
    const glyph = actionIcon(n);
    /* The MODE is on the card, because it is the difference between an
       action the technician never notices and one that stops them. */
    const asks = actionAsks(n);
    /* The eyebrow already names the kind, so the main line carries the thing
       that DIFFERS between two of the same kind. It read "Start Timer ·
       Start Timer · Ask the technician" before this. */
    const line = actionNodeLine(n);
    return '<div class="node node--act' + sel + '" style="' + nodeAccentStyle(n) + '" draggable="true" data-nid="' + n.nid + '" ' +
        'ondragstart="nodeDragStart(event,\'' + n.nid + '\')" ondragend="dragEnd()" ' +
        'onclick="selectNode(\'' + n.nid + '\')">' +
      '<span class="node__seq node__seq--act">' + ic(glyph,14) + '</span>' +
      '<div class="node__b">' +
        '<span class="node__orig">' + ic(glyph,14) + esc(actionKindLabel(n)) + '</span>' +
        '<div class="node__name">' + esc(line) + '</div>' +
        (asks
          ? '<div class="node__sub"><span class="node__tag">' + ic('message',11) +
            (n.action === 'status' ? 'Technician picks the status'
              : n.action === 'stoptimer' ? 'Technician confirms the hours'
              : 'Asks the technician') + '</span></div>'
          : '') +
      '</div>' +
      '<div class="node__acts">' +
        '<button class="IconButton IconButton--sm IconButton--muted" onclick="event.stopPropagation();nodeMenu(event,\'' + n.nid + '\')">' + ic('dots',18) + '</button>' +
      '</div>' +
    '</div>';
  }
  if(n.kind === 'cond'){
    const f = condFieldMeta(w, n);
    const broken = !!n.field && !f;
    const unset = !n.field || !n.op;
    const out = (br, label) =>
      '<button class="fork__ans" data-fork="' + n.nid + '" data-branch="' + br + '" ' +
        'onclick="event.stopPropagation();openCondEditor(\'' + n.nid + '\')">' + label + '</button>';
    return '<div class="node node--fork node--cond' + sel + '" style="' + nodeAccentStyle(n) + '" draggable="true" data-nid="' + n.nid + '" ' +
        'ondragstart="nodeDragStart(event,\'' + n.nid + '\')" ondragend="dragEnd()" ' +
        'onclick="selectNode(\'' + n.nid + '\')">' +
      '<span class="node__seq">' + ic('rule',13) + '</span>' +
      '<div class="node__b">' +
        '<div class="fork__q' + (unset || broken ? ' fork__q--empty' : '') + '">' +
          esc(condSummary(w, n)) + '</div>' +
        /* The error sits ON the node, which is the only place it can be
           fixed — no summary band anywhere (2026-09-16). */
        (broken
          ? '<div class="node__sub"><span class="node__tag node__tag--nocap">' + ic('block',14) +
            'The step in front of this changed — pick a field again</span></div>'
          : (!condSourceStep(w, n)
            ? '<div class="node__sub"><span class="node__tag node__tag--nocap">' + ic('block',14) +
              'No step in front of this, so there is no form to read</span></div>'
            : '')) +
        '<div class="fork__ans-row">' + out('true','True') + out('false','False') + '</div>' +
      '</div>' +
      '<div class="node__acts">' +
        '<button class="IconButton IconButton--sm IconButton--muted" onclick="event.stopPropagation();nodeMenu(event,\'' + n.nid + '\')">' + ic('dots',16) + '</button>' +
      '</div>' +
    '</div>';
  }
  if(n.kind === 'fork'){
    const ans = (br, label) =>
      '<button class="fork__ans" data-fork="' + n.nid + '" data-branch="' + br + '" ' +
        'onclick="event.stopPropagation();openForkEditor(\'' + n.nid + '\')">' +
        esc(label || (br === 'yes' ? 'Yes' : 'No')) + '</button>';
    return '<div class="node node--fork' + sel + '" style="' + nodeAccentStyle(n) + '" draggable="true" data-nid="' + n.nid + '" ' +
        'ondragstart="nodeDragStart(event,\'' + n.nid + '\')" ondragend="dragEnd()" ' +
        'onclick="selectNode(\'' + n.nid + '\')">' +
      '<span class="node__seq">' + ic('fork',13) + '</span>' +
      '<div class="node__b">' +
        '<div class="fork__q' + (tx(n.question,BASE_LANG)?'':' fork__q--empty') + '">' +
          (tx(n.question,BASE_LANG) ? esc(tx(n.question,BASE_LANG)) : 'No question yet') + '</div>' +
        '<div class="fork__ans-row">' + ans('yes', tx(n.yesLabel,BASE_LANG)) + ans('no', tx(n.noLabel,BASE_LANG)) + '</div>' +
      '</div>' +
      '<div class="node__acts">' +
        '<button class="IconButton IconButton--sm IconButton--muted" onclick="event.stopPropagation();nodeMenu(event,\'' + n.nid + '\')">' + ic('dots',16) + '</button>' +
      '</div>' +
    '</div>';
  }

  const num = (!w.freeForm && !inZone) ? seqNo(w, n) : null;
  const isUds = n.kind === 'uds';
  const glyph = isUds ? 'uds' : stepIcon(n.step);
  const seqHtml = num
    ? '<span class="node__seq' + (isUds?' node__seq--uds':'') + '">' + num + '</span>'
    : '<span class="node__seq node__seq--dot">' + ic(glyph,16) + '</span>';
  const noCap = !isUds && !fnHasTab(w, n.step);
  const tags = [];
  if(isUds) tags.push('<span class="node__tag node__tag--uds">' + ic('uds',14) + 'User defined screen</span>');
  if(noCap) tags.push('<span class="node__tag node__tag--nocap">' + ic('block',14) + w.fn + ' has no such tab</span>');
  if(n.kind === 'step' && n.step === 'booklabor' && n.timeEntry)
    tags.push('<span class="node__tag">' + ic('clock',14) +
      (n.timeEntry === 'direct' ? 'Direct hours' : 'Start / end time') + '</span>');
  if(n.pinned) tags.push('<span class="node__tag node__tag--pin">' + ic('pin',11) + 'Step 1, pinned</span>');
  if(n.required) tags.push('<span class="node__tag node__tag--req">' + ic('flag',11) + 'Required</span>');
  if(n.reqComment) tags.push('<span class="node__tag node__tag--gate">' + ic('message',11) + 'Comment gate</span>');
  if(n.reqDoc) tags.push('<span class="node__tag node__tag--gate">' + ic('clip',11) + 'Document gate</span>');
  const sub = tags.length ? '<div class="node__sub">' + tags.join('') + '</div>' : '';

  return '<div class="node' + (isUds?' node--uds':'') + (noCap?' node--nocap':'') + sel + '" draggable="true" data-nid="' + n.nid + '" ' +
      'ondragstart="nodeDragStart(event,\'' + n.nid + '\')" ondragend="dragEnd()" ' +
      'onclick="selectNode(\'' + n.nid + '\')">' +
    seqHtml +
    '<div class="node__b">' +
      /* THE RENAME RULE — the delivered label only appears once the name has
         diverged from it. Showing it always would be noise on the common
         case; never showing it loses which step you are configuring. */
      (n.renamed ? '<span class="node__orig">' + ic(glyph,14) + esc(isUds ? (udsDefOf(n.uds)||{label:'UDS'}).label : stepLabel(n.step)) + '</span>' : '') +
      '<div class="node__name">' + esc(n.name) + '</div>' +
      sub +
    '</div>' +
    '<div class="node__acts">' +
      '<button class="IconButton IconButton--sm IconButton--muted" onclick="event.stopPropagation();nodeMenu(event,\'' + n.nid + '\')">' + ic('dots',16) + '</button>' +
    '</div>' +
  '</div>';
}
function shortLabel(s){
  s = String(s||''); const cut = s.split('—')[0].trim();
  return cut.length > 14 ? cut.slice(0,13) + '…' : (cut || '—');
}
/* Used by the PREVIEW only, now that the canvas card draws wires instead of
   naming its destinations. Not dead code — don't remove it with the chips. */
function forkTargetLabel(w, n, t){
  if(t === '__end') return {text:'End the workflow', dflt:false};
  if(!t) return {text:'Continue to the next step', dflt:true};
  const tgt = nodeById(w, t);
  return tgt ? {text:tgt.name, dflt:false} : {text:'(target no longer exists)', dflt:true};
}

/* ── A CONNECTOR, with its '+' ── */
function connHtml(w, i){
  const flow = flowNodes(w);
  const nextIsFork = isForkKind(flow[i+1]);
  const thisIsFork = isForkKind(flow[i]);
  /* A fork's outbound routing is drawn as wires, so the straight connector
     below it is suppressed — showing both claims the flow continues straight
     AND branches. The inbound connector above a fork stays: something does
     lead into it. */
  if(thisIsFork) return '<div class="conn"></div>';
  return '<div class="conn' + (nextIsFork?' conn--fork':'') + '">' +
    '<span class="conn__line"></span><span class="conn__head"></span>' +
    (nextIsFork ? '' :
      '<button class="conn__plus" title="Insert a question fork here" ' +
        'onclick="insertForkAt(' + (i+1) + ')">' + ic('plus',12) + '</button>') +
  '</div>';
}
function insertForkAt(flowIdx){
  const w = wf(); if(!w) return;
  const flow = flowNodes(w);
  const anchor = flow[flowIdx];
  const abs = anchor ? w.nodes.indexOf(anchor) : w.nodes.length;
  const n = mkNode('fork', {});
  w.nodes.splice(abs, 0, n);
  state.selNid = n.nid;
  saveWFS(); render();
  openForkEditor(n.nid);
}

function selectNode(id){
  state.selNid = id;
  /* Selecting does NOT open the designer — the panel is opened explicitly
     from the node menu. A click that also took a third of the screen would
     make selection unaffordable, and forks have no layout to show anyway. */
  if(state.dsnOpen){
    const w = wf(); const n = nodeById(w, id);
    /* Neither a fork nor an action has a layout, so the panel has nothing
       to show for them. */
    if(n && (isForkKind(n) || n.kind === 'action')) state.dsnOpen = false;
  }
  render();
}
function wireCanvas(){ drawForkArrows(); }

/* ═══════════════════════════════════════════════════════════════════════
   FORK WIRES — the routing, drawn
   ═══════════════════════════════════════════════════════════════════════
   Each answer pill gets a wire to the step it actually reaches. The card
   used to NAME its destinations in text, which made the admin hold the
   mapping in their head — the thing a canvas exists to avoid.

   Measured after render rather than computed from the model, because the
   only reliable source of "where did that card end up" is the layout
   itself. Two guards matter:

     · A zero-width box means there is no layout yet (first paint, a hidden
       panel, or a headless test run). Bail silently — do not draw a
       degenerate wire at 0,0, and do not throw.
     · Wires route OUTSIDE the column, in .cv's side padding, and sit at
       z-index 0 behind the cards. A wire crossing the cards would fight
       the text it is explaining.

   Resolution mirrors §29.4's three target kinds exactly: a named step, the
   end of the workflow, or nothing at all — which means "continue", and
   therefore points at the next step after the fork rather than nowhere.
   ═══════════════════════════════════════════════════════════════════════ */
/* WHICH NODE A BRANCH REACHES — pure, and separated from the DOM lookup on
   purpose. Resolution has a real edge case worth pinning in a test, and the
   element lookup it used to be tangled with cannot be tested headlessly.
   Returns a nid, the '__end' sentinel, or null when there is nothing to
   point at. Mirrors §29.4's three target kinds. */
function forkBranchTargetNid(w, flow, f, target){
  if(target === '__end') return '__end';
  if(target) return nodeById(w, target) ? target : null;
  /* No target = CONTINUE, which means the next STEP — not merely the next
     node. The next node can be another fork, and a fork is a screen the
     technician passes through, never a destination a branch lands on. */
  const i = flow.indexOf(f);
  const nxt = flow.slice(i + 1).find(isStepKind);
  return nxt ? nxt.nid : null;
}
function forkWireTargetEl(w, flow, f, target){
  const id = forkBranchTargetNid(w, flow, f, target);
  if(!id) return null;
  if(id === '__end') return document.querySelector('.flow .fork-end');
  return document.querySelector('.flow .node[data-nid="' + id + '"]');
}
function drawForkArrows(){
  /* CAPABILITY GUARD, not just a geometry one. This function is a
     measured-layout enhancement: it needs createElementNS, a real
     querySelector and real rects. A headless run has some of those and not
     others — the test harness hands back a synthetic rect with a non-zero
     width, so checking the box size alone let execution reach
     createElementNS and throw, taking the whole render down with it. Check
     for what is actually used, up front, and no-op cleanly without it. */
  if(typeof document.createElementNS !== 'function') return;
  const w = wf();
  const flowEl = document.querySelector('.flow');
  if(!flowEl || typeof flowEl.querySelector !== 'function') return;
  const existing = flowEl.querySelector('.forkwires');
  if(existing && existing.remove) existing.remove();
  if(!w || w.freeForm) return;

  const flow = flowNodes(w);
  const forks = flow.filter(isForkKind);
  if(!forks.length) return;
  if(!flowEl.getBoundingClientRect) return;
  const box = flowEl.getBoundingClientRect();
  if(!box.width) return;                 // no layout — nothing to measure
  const W = box.width, LANE = 62;

  let paths = '';
  forks.forEach(f => {
    forkBranches(f).map(function(p, k){ return [p[0], f[p[1]], k ? 1 : -1]; }).forEach(function(br){
      const branch = br[0], target = br[1], dir = br[2];
      const src = flowEl.querySelector('.fork__ans[data-fork="' + f.nid + '"][data-branch="' + branch + '"]');
      const dst = forkWireTargetEl(w, flow, f, target);
      if(!src || !dst) return;
      const sr = src.getBoundingClientRect(), dr = dst.getBoundingClientRect();
      if(!sr.width || !dr.width) return;
      const sx = sr.left - box.left + sr.width / 2;
      const sy = sr.bottom - box.top;
      const dy = dr.top - box.top + dr.height / 2;
      const dx = dir < 0 ? -3 : W + 3;
      const lane = dir < 0 ? -LANE : W + LANE;
      /* A wire that would run upward is a backward route, which
         validateForks() already refuses — so if one is ever measured, the
         model and the guard have diverged and it is worth seeing rather
         than hiding. Drawn dashed instead of skipped. */
      const suspect = dy <= sy ? ' class="dashed"' : '';
      paths += '<path' + suspect + ' d="M ' + sx + ' ' + sy +
        ' C ' + lane + ' ' + (sy + 34) + ', ' + lane + ' ' + (dy - 34) + ', ' + dx + ' ' + dy + '"' +
        ' marker-end="url(#fw-head)" />';
    });
  });
  if(!paths) return;

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'forkwires');
  svg.innerHTML =
    '<defs><marker id="fw-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" ' +
      'orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--wo-type-routine)" stroke="none"/>' +
    '</marker></defs>' + paths;
  flowEl.appendChild(svg);
}
/* The wires are measured, so anything that changes the layout has to redraw
   them. A resize is the obvious one; the designer panel's own drag is
   handled in startDsnResize(). */
window.addEventListener('resize', function(){ if(state.view === 'edit') drawForkArrows(); });

/* ═══════════════════════════════════════════════════════════════════════
   DESIGNER PANEL WIDTH — resizable and persisted
   ═══════════════════════════════════════════════════════════════════════
   40% by default. Persisted because an admin who widened the panel to read
   a grid container properly should not have to do it again on the next
   step. Clamped below at the width of a real 390px emulator plus padding —
   under that the panel stops previewing anything (§30.3).
   ═══════════════════════════════════════════════════════════════════════ */
const DSN_W_KEY = 'eamWfpDsnWidth';
const DSN_MIN = 436;
function dsnMax(){ return Math.max(DSN_MIN, Math.round((window.innerWidth || 1600) * 0.72)); }
function applyDsnWidth(){
  const p = $('dsn'); if(!p || !p.style) return;
  let v = 0;
  try{ v = parseInt(localStorage.getItem(DSN_W_KEY) || '0', 10) || 0; }catch(e){}
  /* No stored value leaves the CSS 40% in charge, rather than hard-coding a
     pixel default that would stop being 40% on a different monitor. */
  p.style.flex = v ? ('0 0 ' + Math.min(dsnMax(), Math.max(DSN_MIN, v)) + 'px') : '';
}
function startDsnResize(ev){
  ev.preventDefault();
  const p = $('dsn'), grip = ev.currentTarget;
  const startX = ev.clientX, startW = p.getBoundingClientRect().width;
  let live = startW;
  if(grip && grip.classList) grip.classList.add('dragging');
  document.body.style.cursor = 'col-resize';
  function move(e){
    /* Dragging left widens: the panel is on the right, so its width grows as
       the pointer moves toward the canvas. */
    live = Math.min(dsnMax(), Math.max(DSN_MIN, Math.round(startW - (e.clientX - startX))));
    p.style.flex = '0 0 ' + live + 'px';
  }
  function up(){
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', up);
    document.body.style.cursor = '';
    if(grip && grip.classList) grip.classList.remove('dragging');
    try{ localStorage.setItem(DSN_W_KEY, String(live)); }catch(e){}
    /* The canvas just changed width, so every measured wire is stale. */
    drawForkArrows();
  }
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
}

/* ═══════════════════════════════════════════════════════════════════════
   DRAG AND DROP
   ═══════════════════════════════════════════════════════════════════════
   One flow column, auto-laid-out, means the drop only ever has to decide an
   INDEX — there is no free position for a node to sit at, so "dropped above
   the second card" and "is the new second card" are the same statement. The
   arrows are recomputed from the array on every render, which is why
   re-pointing them needs no code of its own.
   ═══════════════════════════════════════════════════════════════════════ */
function nodeDragStart(ev, id){
  const w = wf(); const n = nodeById(w, id);
  if(n && n.pinned){ ev.preventDefault(); toast('Record View is pinned as step 1 (§14) — it can be duplicated, not moved'); return; }
  drag = {from:'canvas', nid:id};
  ev.dataTransfer.effectAllowed = 'move';
  try{ ev.dataTransfer.setData('text/plain', id); }catch(e){}
  ev.currentTarget.classList.add('dragging');
  ev.stopPropagation();
}

function flowDragOver(ev){
  if(!drag) return;
  ev.preventDefault();
  const w = wf(); const flow = flowNodes(w);
  const col = ev.currentTarget.querySelector('.flow') || ev.currentTarget;
  const cards = Array.from(col.querySelectorAll('.node'));
  let idx = flow.length;
  for(let i=0;i<cards.length;i++){
    const r = cards[i].getBoundingClientRect();
    if(ev.clientY < r.top + r.height/2){ idx = i; break; }
  }
  /* Record View instance 1 is pinned as step 1, so index 0 is not a legal
     drop target while it is present. Clamping is quieter than rejecting the
     drop after the fact. */
  const pinnedFirst = flow[0] && flow[0].pinned;
  if(pinnedFirst && idx === 0) idx = 1;
  if(dropIdx !== idx || dropZone !== 'flow'){ dropIdx = idx; dropZone = 'flow'; renderCanvas(); }
}
function flowDrop(ev){
  ev.preventDefault();
  const w = wf(); if(!w || !drag) return;
  const flow = flowNodes(w);
  /* Record View instance 1 is pinned as step 1 (§14), so index 0 is not a
     legal insertion point while it is present. flowDragOver() clamps as the
     pointer moves, but the invariant is enforced HERE as well, at the only
     place that mutates the array — the connector + and any future caller
     reach this function without having gone through the dragover geometry. */
  let idx = dropIdx == null ? flow.length : dropIdx;
  if(flow[0] && flow[0].pinned && idx === 0) idx = 1;
  const anchor = flow[idx];
  const abs = anchor ? w.nodes.indexOf(anchor) : w.nodes.length;

  if(drag.from === 'lib'){
    const node = addNodeToWf(w, drag.stepId, abs, 'flow');
    state.selNid = node.nid;
    drag = null; dropIdx = null; dropZone = null;
    afterStructuralChange(isForkKind(node) ? 'Fork inserted'
      : (node.kind === 'action' ? actionKindLabel(node) + ' inserted' : 'Added ' + node.name));
    if(node.kind === 'fork') openForkEditor(node.nid);
    else if(node.kind === 'cond') openCondEditor(node.nid);
    else if(node.kind === 'action') openActionEditor(node.nid);
    return;
  }
  const n = nodeById(w, drag.nid); if(!n){ dragEnd(); return; }
  const wasRef = n.zone === 'ref';
  w.nodes.splice(w.nodes.indexOf(n), 1);
  const anchor2 = flow.filter(x=>x!==n)[idx > flow.indexOf(n) && flow.indexOf(n) !== -1 ? idx-1 : idx];
  const abs2 = anchor2 ? w.nodes.indexOf(anchor2) : w.nodes.length;
  n.zone = 'flow';
  w.nodes.splice(abs2 < 0 ? w.nodes.length : abs2, 0, n);
  drag = null; dropIdx = null; dropZone = null;
  afterStructuralChange(wasRef ? (n.name + ' moved into the flow') : null);
}

function refDragOver(ev){
  if(!drag) return;
  ev.preventDefault(); ev.stopPropagation();
  if(dropZone !== 'ref'){ dropZone = 'ref'; dropIdx = null; renderCanvas(); }
}
function refDragLeave(ev){
  if(dropZone === 'ref' && !ev.currentTarget.contains(ev.relatedTarget)){ dropZone = null; renderCanvas(); }
}
function refDrop(ev){
  ev.preventDefault(); ev.stopPropagation();
  const w = wf(); if(!w || !drag) return;
  if(drag.from === 'lib'){
    if(['fork','cond','status','timer','stoptimer'].indexOf(drag.stepId) > -1){ drag=null; dropZone=null; renderCanvas(); toast('Forks and actions are positional — none of them can sit in the More group'); return; }
    const node = addNodeToWf(w, drag.stepId, w.nodes.length, 'ref');
    state.selNid = node.nid;
    drag=null; dropZone=null; dropIdx=null;
    afterStructuralChange('Added ' + node.name + ' to the More group');
    return;
  }
  const n = nodeById(w, drag.nid);
  drag=null; dropZone=null; dropIdx=null;
  if(!n){ renderCanvas(); return; }
  if(isForkKind(n) || n.kind === 'action'){ renderCanvas(); toast('A fork and an action are positional — neither can sit in the More group'); return; }
  moveToRef(n.nid, true);
}

function ffDragOver(ev){
  if(!drag) return;
  ev.preventDefault();
  if(dropZone !== 'ff'){ dropZone='ff'; renderCanvas(); }
}
function ffDragLeave(ev){
  if(dropZone === 'ff' && !ev.currentTarget.contains(ev.relatedTarget)){ dropZone=null; renderCanvas(); }
}
function ffDrop(ev){
  ev.preventDefault();
  const w = wf(); if(!w || !drag) return;
  if(drag.from === 'lib'){
    if(w.nodes.some(n=>n.step===drag.stepId)){ drag=null; dropZone=null; renderCanvas(); toast('Free Form allows one of each step'); return; }
    const node = addNodeToWf(w, drag.stepId, w.nodes.length, 'flow');
    state.selNid = node.nid;
    drag=null; dropZone=null;
    saveWFS(); render(); toast('Added ' + node.name);
    return;
  }
  drag=null; dropZone=null; renderCanvas();
}

/* ── THE CONDITION EDITOR ──
   Four controls, in the order the sentence reads: field, operator, value,
   then a destination per outcome. The operator list is derived from the
   FIELD'S OWN declared type, so "is greater than" is never offered on a
   checkbox and "contains" is never offered on a number.

   Two states it refuses to paper over, both rendered as errors in place
   rather than collected into a banner: no step in front of the fork (so
   there is no form to read), and a field that no longer exists on the step
   that IS in front of it. */
function openCondEditor(id){
  const w = wf(); const nd = nodeById(w, id); if(!nd || nd.kind !== 'cond') return;
  const src = condSourceStep(w, nd);
  const fields = condFieldsFor(w, nd);
  const f = condFieldMeta(w, nd);
  const ops = f ? condOpsFor(f.type) : [];
  const opM = f ? condOpMeta(f.type, nd.op) : null;

  const flow = flowNodes(w);
  const i = flow.indexOf(nd);
  const later = flow.slice(i + 1).filter(isStepKind);
  const tsel = (key, cur) =>
    '<select class="tinput" onchange="setCondTarget(\'' + id + '\',\'' + key + '\',this.value)">' +
      '<option value=""' + (!cur ? ' selected' : '') + '>Continue to the next step</option>' +
      later.map(t => '<option value="' + t.nid + '"' + (cur === t.nid ? ' selected' : '') + '>' +
        esc(t.name) + '</option>').join('') +
      '<option value="__end"' + (cur === '__end' ? ' selected' : '') + '>End the workflow</option>' +
    '</select>';

  openModal('narrow',
    '<div class="mbox__head"><div class="mbox__head-b">' +
      '<div class="mbox__title">Condition fork</div>' +
      '<div class="mbox__sub">Evaluated when the technician taps <b>Next</b> on ' +
        (src ? '<b>' + esc(src.name) + '</b>' : 'the previous step') +
        ' \u2014 online or offline, on that screen\'s own values. No tap, no question: ' +
        'the system routes.</div>' +
    '</div></div>' +
    '<div class="mbox__body mbox__body--plain">' +

      (!src
        ? '<div class="Banner Banner--critical" style="margin:0 0 var(--s-3)">' +
            '<span class="ms ms-24 Banner__icon">block</span>' +
            '<div class="Banner__body"><div class="Banner__title">Nothing in front of this fork</div>' +
            '<div class="Banner__text">It reads the form the technician is <b>currently on</b>, so it needs a ' +
              'step before it. Move it after one.</div></div></div>'
        : (nd.field && !f
          ? '<div class="Banner Banner--critical" style="margin:0 0 var(--s-3)">' +
              '<span class="ms ms-24 Banner__icon">block</span>' +
              '<div class="Banner__body"><div class="Banner__title">That field is not on ' + esc(src.name) + '</div>' +
              '<div class="Banner__text">The step in front of this fork changed, so the field it read is gone. ' +
                'Pick one from this step.</div></div></div>'
          : '')) +

      '<label class="pop__l">Field on ' + esc(src ? src.name : 'the previous step') + '</label>' +
      '<select class="tinput" onchange="setCondField(\'' + id + '\',this.value)"' + (src ? '' : ' disabled') + '>' +
        '<option value="">' + (fields.length ? 'Pick a field' : 'No testable fields on that step') + '</option>' +
        condFieldOptions(fields, nd.field) +
      '</select>' +
      '<div class="pop__note">Grouped by the <b>container</b> the field sits in, because that is how the ' +
        'technician sees the screen \u2014 the container is a heading here, not a value to pick. Only fields on ' +
        'the screen they just left, and never a <b>Hidden</b> one \u2014 routing on something they cannot see ' +
        'is invisible logic. Buttons are excluded: a control has no value to test.</div>' +

      '<label class="pop__l">Operator</label>' +
      '<select class="tinput" onchange="setCondOp(\'' + id + '\',this.value)"' + (f ? '' : ' disabled') + '>' +
        '<option value="">' + (f ? 'Pick an operator' : 'Pick a field first') + '</option>' +
        ops.map(o => '<option value="' + o.k + '"' + (nd.op === o.k ? ' selected' : '') + '>' +
          esc(o.label) + '</option>').join('') +
      '</select>' +
      (f ? '<div class="pop__note">Offered for a <b>' + esc(f.type) + '</b> field. A different type offers ' +
        'different operators \u2014 the list comes from the field, not from a fixed set.</div>' : '') +

      (opM && opM.val
        ? '<label class="pop__l">Value</label>' +
          '<input class="tinput" id="cdVal" type="' +
            (f.type === 'num' ? 'number' : f.type === 'date' ? 'date' : f.type === 'time' ? 'time' : 'text') +
            '" value="' + esc(String(nd.value === undefined ? '' : nd.value)) + '" ' +
            'oninput="setCondValue(\'' + id + '\',this.value)">' +
          (f.type === 'date' || f.type === 'time'
            ? '<div class="pop__note">A literal date/time. <b>Relative dates</b> (today, today + 7, start of ' +
              'shift) are deliberately not offered \u2014 they carry their own evaluation-time semantics and are ' +
              'their own feature (\u00a720).</div>'
            : '')
        : '') +

      '<div class="pop__sep"></div>' +
      '<label class="pop__l">If true</label>' + tsel('tTrue', nd.tTrue) +
      '<label class="pop__l">If false</label>' + tsel('tFalse', nd.tFalse) +
      '<div class="pop__note">Forward only, same as a question fork (\u00a729.4): a target is drawn from steps ' +
        '<b>after</b> this fork, everything skipped is marked <b>N/A</b> and stays in the rail, and both are ' +
        're-checked on every reorder.<br><b>If the field is empty</b> \u2014 an Optional field the technician left ' +
        'blank \u2014 the condition cannot be evaluated and the workflow <b>continues in sequence</b>. It does not ' +
        'take the false branch, because empty is not false.</div>' +
    '</div>' +
    '<div class="mbox__foot">' +
      btn('Done', {cls:'Button--contained Button--primary', on:'closeModal()'}) +
    '</div>');
}
function setCondField(id, v){
  const w = wf(); const nd = nodeById(w, id); if(!nd) return;
  nd.field = v;
  /* An operator only means something against a type, so changing the field
     clears both \u2014 the same reason switching a status entity re-bases the
     status (\u00a730.11). Silently keeping "is greater than" on a checkbox is
     how an unevaluable rule gets saved. */
  nd.op = ''; nd.value = '';
  saveWFS(); render(); openCondEditor(id);
}
function setCondOp(id, v){
  const w = wf(); const nd = nodeById(w, id); if(!nd) return;
  const f = condFieldMeta(w, nd);
  if(!f || !condOpMeta(f.type, v)){ toast('That operator does not apply to this field type'); return; }
  nd.op = v;
  if(!condOpMeta(f.type, v).val) nd.value = '';
  saveWFS(); render(); openCondEditor(id);
}
function setCondValue(id, v){
  const w = wf(); const nd = nodeById(w, id); if(!nd) return;
  nd.value = v; saveWFS();
  /* No re-render: this is a text input and re-rendering would steal focus
     mid-typing. The card refreshes on close. */
}
/* Forward-only, guarded AT THE MUTATION. The dropdown only offers later
   steps, but a direct call must be refused too \u2014 the house rule. */
function setCondTarget(id, key, v){
  const w = wf(); const nd = nodeById(w, id); if(!nd) return;
  const flow = flowNodes(w);
  if(v && v !== '__end'){
    const ti = flow.findIndex(x => x.nid === v);
    const mi = flow.indexOf(nd);
    if(ti === -1 || ti <= mi){ toast('A fork can only route forward'); return; }
  }
  nd[key] = v || null;
  saveWFS(); render(); openCondEditor(id);
}

/* ═══════════════════════════════════════════════════════════════════════
   NODE MENU
   ═══════════════════════════════════════════════════════════════════════ */
function nodeMenu(ev, id){
  const w = wf(); const n = nodeById(w, id); if(!n) return;
  state.selNid = id; renderCanvas();

  if(n.kind === 'action'){
    openMenu(ev,
      '<div class="menu__label">' + esc(actionKindLabel(n)) + '</div>' +
      '<div class="menu__item" onclick="closeMenu();openActionEditor(\'' + id + '\')">' +
        ic(actionIcon(n),16) +
        (n.action === 'status' ? 'Edit status' : 'Edit behaviour') + '</div>' +
      '<div class="menu__sep"></div>' +
      '<div class="menu__item menu__item--danger" onclick="closeMenu();deleteNode(\'' + id + '\')">' + ic('trash',16) + 'Delete action</div>');
    return;
  }
  /* BOTH fork kinds, through isForkKind() — never a bare kind==='fork' test
     (§30.19). A condition fork used to fall through to the STEP menu below,
     which offered it Screen Designer, Rename, Step settings and Move to
     More: four controls on a node that has no layout, no rail entry and no
     gates. Every one of them was either dead or actively wrong. */
  if(isForkKind(n)){
    const isCond = n.kind === 'cond';
    openMenu(ev,
      '<div class="menu__label">' + (isCond ? 'Condition fork' : 'Question fork') + '</div>' +
      '<div class="menu__item" onclick="closeMenu();' +
        (isCond ? 'openCondEditor' : 'openForkEditor') + '(\'' + id + '\')">' +
        ic(isCond ? 'fork' : 'split',14) +
        (isCond ? ' Edit condition and routing' : ' Edit question and routing') + '</div>' +
      '<div class="menu__sep"></div>' +
      '<div class="menu__item menu__item--danger" onclick="closeMenu();deleteNode(\'' + id + '\')">' + ic('trash',14) + ' Delete fork</div>');
    return;
  }

  const inRef = n.zone === 'ref';
  const ff = w.freeForm;
  openMenu(ev,
    '<div class="menu__label">' + esc(n.name) + '</div>' +
    /* FIRST, because it is why this menu gets opened most of the time. */
    '<div class="menu__item" onclick="closeMenu();openDsn(\'' + id + '\')">' + ic('layout',16) + 'Screen Designer' +
      '<span class="menu__meta">' + esc(layoutKey(n)) + '</span></div>' +
    '<div class="menu__sep"></div>' +
    '<div class="menu__item" onclick="closeMenu();openRename(\'' + id + '\')">' + ic('pencil',16) + 'Rename' +
      (n.renamed ? '<span class="menu__meta">renamed</span>' : '') + '</div>' +
    (ff ? '' :
      '<div class="menu__sep"></div>' +
      (inRef
        ? '<div class="menu__item" onclick="closeMenu();moveToRef(\'' + id + '\',false)">' + ic('route',14) + ' Move into the flow</div>'
        : (n.pinned
            ? '<div class="menu__item is-disabled" title="Record View is pinned as step 1 (§14)">' + ic('lock',14) + ' Move to More (reference)</div>'
            : '<div class="menu__item" onclick="closeMenu();moveToRef(\'' + id + '\',true)">' + ic('layers',14) + ' Move to More (reference)</div>')) +
      '<div class="menu__item' + (inRef?' is-disabled':'') + '" ' +
        (inRef ? 'title="A More entry is never gated — nothing routes the technician there (§14.8)"' :
          'onclick="closeMenu();openStepSettings(\'' + id + '\')"') + '>' +
        ic('sliders',14) + ' Step settings…' +
        '<span class="menu__meta">' + (n.required?'req':'opt') + (n.reqComment||n.reqDoc?' · gated':'') + '</span></div>') +
    '<div class="menu__sep"></div>' +
    '<div class="menu__item' + (ff?' is-disabled':'') + '" ' +
      (ff ? 'title="Free Form allows one of each step"' : 'onclick="closeMenu();duplicateNode(\'' + id + '\')"') + '>' +
      ic('copy',14) + ' Duplicate step' + (ff?'':'<span class="menu__meta">' + n.step + '#' + mintInst(w,n.step) + '</span>') + '</div>' +
    '<div class="menu__item' + (n.pinned?' is-disabled':' menu__item--danger') + '" ' +
      (n.pinned ? 'title="Record View is pinned as step 1 (§14)"' : 'onclick="closeMenu();deleteNode(\'' + id + '\')"') + '>' +
      ic(n.pinned?'lock':'trash',14) + ' Remove from workflow</div>');
}

function moveToRef(id, toRef){
  const w = wf(); const n = nodeById(w, id); if(!n) return;
  if(toRef && n.pinned){ toast('Record View is pinned as step 1 (§14)'); return; }
  /* Guarded HERE, at the mutation, not only in refDrop(). A fork and a
     status update are both positional — neither is a place the technician
     visits — so neither can live in a group that is reachable at any time.
     The drag handler refused it already; this is the same rule at the only
     place that actually moves a node, so a future caller cannot route
     around it (same lesson as the pinned-step clamp). */
  if(toRef && (isForkKind(n) || n.kind === 'action')){
    toast('A fork and an action are positional — neither can sit in the More group');
    return;
  }
  n.zone = toRef ? 'ref' : 'flow';
  if(toRef){
    /* A More entry can never be Required and never carries a gate: nothing
       routes the technician there, so the flag would be unenforceable
       (§14.8 / §29's `required` note). Cleared on the move rather than
       merely disabled in the UI, so the stored row can't hold a state the
       runtime would have to ignore. */
    const had = n.required || n.reqComment || n.reqDoc;
    n.required = false; n.reqComment = false; n.reqDoc = false;
    /* Moving it to the end keeps the More group's own display order
       predictable — it appends, the way the rail renders it. */
    w.nodes.splice(w.nodes.indexOf(n), 1); w.nodes.push(n);
    afterStructuralChange(n.name + ' → More group' + (had ? ' · Required and gates cleared (a More entry is never gated)' : ''));
  } else {
    afterStructuralChange(n.name + ' → flow, as the last step');
  }
}

function duplicateNode(id){
  const w = wf(); const src = nodeById(w, id); if(!src || isForkKind(src)) return;
  const inst = mintInst(w, src.step);
  const dup = deepCopy(src);
  dup.nid = nid();
  dup.inst = inst;
  dup.pinned = false;
  /* THE (2) RULE — a copy whose original still carries the delivered name
     gets the numbered suffix; a copy of a RENAMED step keeps the admin's
     words and numbers those instead, because the admin's name is the one
     the technician reads. */
  dup.name = src.renamed ? (src.name + ' (' + inst + ')') : mintName(w, src.step, inst);
  dup.renamed = src.renamed;
  /* THE LOAD-BEARING LINE. deepCopy above already gave this instance its
     own layout object; if it were a shared reference the two instances
     would render identically until one was edited, and then both would
     change. §29.2 exists for exactly this, and it is the one way to break
     the feature while everything still looks right. */
  w.nodes.splice(w.nodes.indexOf(src)+1, 0, dup);
  state.selNid = dup.nid;
  afterStructuralChange('Duplicated as ' + dup.name + ' · layout key ' + layoutKey(dup));
}

function deleteNode(id){
  const w = wf(); const n = nodeById(w, id); if(!n) return;
  if(n.pinned){ toast('Record View is pinned as step 1 (§14)'); return; }
  /* Every fork pointing AT this node is cleared, not left dangling — §29.4
     names a dangling id that silently falls through as the failure nobody
     notices until a technician is standing in front of the asset.
     validateForks() re-runs below and catches it either way; doing it here
     too means the count reported to the user is right. */
  w.nodes.filter(isForkKind).forEach(f=>{
    forkBranches(f).forEach(p => { if(f[p[1]] === id) f[p[1]] = null; });
  });
  w.nodes.splice(w.nodes.indexOf(n), 1);
  if(state.selNid === id){ state.selNid = null; state.dsnOpen = false; }
  afterStructuralChange('Removed ' + (isForkKind(n) ? 'the fork' : n.name));
}

/* ═══════════════════════════════════════════════════════════════════════
   RENAME
   ═══════════════════════════════════════════════════════════════════════ */
function openRename(id){
  const w = wf(); const n = nodeById(w, id); if(!n) return;
  openPopAt(lastMenuEv,
    '<div class="pop__head">' +
      '<div class="pop__title">Rename step</div>' +
      '<div class="pop__sub">This is the name the technician reads in the step rail. The delivered label ' +
        '<b>' + esc(stepLabel(n.step)) + '</b> stays visible on the card as a pill.</div>' +
    '</div>' +
    '<div class="pop__body">' +
      '<label class="pop__l">Step name</label>' +
      '<input class="tinput" id="renameIn" value="' + esc(n.name) + '" placeholder="' + esc(stepLabel(n.step)) + '">' +
      '<div class="pop__note">Clearing it puts the delivered label back and removes the pill.</div>' +
    '</div>' +
    '<div class="pop__foot">' +
      '<button class="Button" onclick="closePop()">Cancel</button>' +
      '<button class="Button Button--contained Button--primary" onclick="applyRename(\'' + id + '\')">Rename</button>' +
    '</div>');
  const el = $('renameIn');
  if(el){ el.focus(); el.select();
    el.onkeydown = function(e){ if(e.key==='Enter') applyRename(id); if(e.key==='Escape') closePop(); }; }
}
function applyRename(id){
  const w = wf(); const n = nodeById(w, id); if(!n) return;
  const el = $('renameIn'); if(!el) return;
  const v = el.value.trim();
  const base = n.inst > 1 ? mintName(w, n.step, n.inst) : stepLabel(n.step);
  if(!v){ n.name = base; n.renamed = false; }
  else { n.name = v; n.renamed = (v !== stepLabel(n.step) && v !== base); }
  closePop(); saveWFS(); render();
  toast(n.renamed ? 'Renamed — delivered label kept as a pill' : 'Back to the delivered label');
}

/* ═══════════════════════════════════════════════════════════════════════
   STEP SETTINGS — Required + the two §29.3 gates
   ═══════════════════════════════════════════════════════════════════════
   These three live together because they are one thing from the
   technician's side: what stands between them and the Next button. Three
   separate menu items would have implied three separate mechanics.
   ═══════════════════════════════════════════════════════════════════════ */
function openStepSettings(id){
  const w = wf(); const n = nodeById(w, id); if(!n) return;
  const row = (key, title, desc, on) =>
    '<div class="menu__row" onclick="toggleStepFlag(\'' + id + '\',\'' + key + '\')">' +
      '<div class="menu__row-b"><div class="menu__row-t">' + title + '</div>' +
        '<div class="menu__row-d">' + desc + '</div></div>' +
      '<span class="uxt-switch' + (on?' is-on':'') + '"><span class="uxt-switch__thumb"></span></span></div>';
  openPopAt(lastMenuEv,
    '<div class="pop__head"><div class="pop__title">Step settings — ' + esc(n.name) + '</div>' +
      '<div class="pop__sub">What has to be true before the technician can move on.</div></div>' +
    '<div class="pop__body">' +
      row('required','Required step','Next stays locked until this step is complete (§14.7).', n.required) +
      row('reqComment','Require a comment','Next stays locked until a comment is entered on the work order (§29.3).', n.reqComment) +
      row('reqDoc','Require a document','Next stays locked until a document is attached (§29.3).', n.reqDoc) +
      /* Book Labor only, and PER INSTANCE (§29): Book Labor can be placed
         twice, and two placements sharing one mode would be a coupling
         nothing on screen explains. */
      (n.kind === 'step' && n.step === 'booklabor'
        ? '<label class="pop__l">Time entry mode</label>' +
          '<div class="seg seg--sm">' +
            '<button class="seg__btn' + ((n.timeEntry||'startend')==='startend'?' is-active':'') + '" ' +
              'onclick="setTimeEntry(\'' + id + '\',\'startend\')">Start / end time</button>' +
            '<button class="seg__btn' + (n.timeEntry==='direct'?' is-active':'') + '" ' +
              'onclick="setTimeEntry(\'' + id + '\',\'direct\')">Direct hours</button>' +
          '</div>'
        : '') +
      '<div class="pop__note">A completed step is always reopenable — gating is forward-only (§14.10). These flags lock the way forward, never the way back.</div>' +
    '</div>' +
    '<div class="pop__foot"><button class="Button Button--contained Button--primary" onclick="closePop()">Done</button></div>');
}
function setTimeEntry(id, mode){
  const w = wf(); const n = nodeById(w, id); if(!n) return;
  n.timeEntry = mode; w.updated = todayStr(); saveWFS();
  renderCanvas(); renderDsn(); openStepSettings(id);
}
function toggleStepFlag(id, key){
  const w = wf(); const n = nodeById(w, id); if(!n) return;
  n[key] = !n[key]; w.updated = todayStr(); saveWFS();
  renderCanvas(); renderDsn();
  openStepSettings(id);
}

/* ═══════════════════════════════════════════════════════════════════════
   FORK EDITOR (§29.4)
   ═══════════════════════════════════════════════════════════════════════
   Two answers, hard-capped. Targets come only from steps AFTER the fork,
   plus the two special values. A fork appended last renders an empty target
   list AND SAYS WHY, rather than a quietly empty dropdown.
   ═══════════════════════════════════════════════════════════════════════ */
function forkTargets(w, n){
  const flow = flowNodes(w);
  const i = flow.indexOf(n);
  return flow.slice(i+1).filter(isStepKind);
}
/* Which language the fork editor is currently typing in. Editor state, not
   workflow data — the stored text is a map, and this only picks a slot. */
let authorLang = BASE_LANG;
function setAuthorLang(code){ authorLang = code; const id = state.selNid; if(id) openForkEditor(id); }

function openForkEditor(id){
  const w = wf(); const n = nodeById(w, id); if(!n || n.kind!=='fork') return;
  state.selNid = id; renderCanvas();
  const later = forkTargets(w, n);
  const sel = (key, val) =>
    '<select class="tinput" onchange="setForkTarget(\'' + id + '\',\'' + key + '\',this.value)">' +
      '<option value=""' + (!val?' selected':'') + '>Continue to the next step</option>' +
      later.map(t=>'<option value="' + t.nid + '"' + (val===t.nid?' selected':'') + '>Jump to ' + esc(t.name) + '</option>').join('') +
      '<option value="__end"' + (val==='__end'?' selected':'') + '>End the workflow</option>' +
    '</select>';
  /* The RAW slot, not the fallback — an editor that showed the fallback would
     make an untranslated field look translated the moment you looked at it. */
  const txRaw = m => (m && typeof m === 'object' ? (m[authorLang] || '') : (authorLang === BASE_LANG ? (m||'') : ''));
  const missing = txMissing(n.question);
  const baseEmpty = !tx(n.question, BASE_LANG).trim();
  const langSuffix = authorLang === BASE_LANG ? '' : ' · ' + langLabel(authorLang);
  const noTargets = !later.length
    ? '<div class="pop__warn">' + ic('alert',14) +
      '<span>This fork is the last thing in the flow, so it has nothing to route to. Both answers can only continue ' +
      'or end the workflow until a step is added after it.</span></div>'
    : '';
  openModal('narrow',
    '<div class="mbox__head"><div class="mbox__head-b">' +
      '<div class="mbox__title">Question fork</div>' +
      '<div class="mbox__sub">Two answers, each routing forward.</div>' +
    '</div>' +
      iconBtn('x', {on:'closeModal()', cls:'IconButton--muted', title:'Close'}) +
    '</div>' +
    '<div class="mbox__body mbox__body--plain">' +
      /* THE TRANSLATION SURFACE (§29.4). It lives here and nowhere else,
         because a fork is the only place an ADMIN types prose a TECHNICIAN
         reads — every other mobile string is a delivered label or record
         data. The base language is the only one that can be required
         non-empty, and a missing translation FALLS BACK rather than blanking:
         an empty question on a gated step is unanswerable. */
      '<div class="langbar">' +
        '<div class="seg seg--sm">' +
          LANGUAGES.map(l => '<button class="seg__btn' + (authorLang===l.code?' is-active':'') + '" ' +
            'onclick="setAuthorLang(\'' + l.code + '\')" title="' + esc(l.label) + '">' + l.code +
            (l.code===BASE_LANG?' ·':'') + '</button>').join('') +
        '</div>' +
        (authorLang === BASE_LANG
          ? '<span class="langbar__miss">' + langLabel(BASE_LANG) + ' is the authoring language.</span>'
          : '<span class="langbar__miss">Empty falls back to ' + langLabel(BASE_LANG) + '.</span>') +
      '</div>' +
      (missing.length
        ? '<div class="dsn__note" style="margin-bottom:var(--s-3)">' + ic('translate',14) +
          ' No translation yet for <b>' + missing.join(', ') + '</b>. The technician sees the ' +
          langLabel(BASE_LANG) + ' text instead — never a blank question.</div>'
        : '') +
      (baseEmpty
        ? '<div class="pop__warn">' + ic('alert',14) + '<span><b>' + langLabel(BASE_LANG) + ' is empty.</b> ' +
          'It is the fallback for every other language, so an empty base language means every technician ' +
          'sees nothing — this is the one thing the editor refuses to treat as fine (§29.4).</span></div>'
        : '') +
      '<label class="pop__l">Question the technician is asked' + langSuffix + '</label>' +
      '<textarea class="tinput tinput--ta" placeholder="e.g. Did the inspection find a defect?" ' +
        'oninput="setForkText(\'' + id + '\',\'question\',this.value)">' + esc(txRaw(n.question)) + '</textarea>' +
      noTargets +
      '<label class="pop__l">Answer 1' + langSuffix + '</label>' +
      '<input class="tinput" value="' + esc(txRaw(n.yesLabel)) + '" placeholder="' + esc(tx(n.yesLabel,BASE_LANG) || 'Yes') + '" ' +
        'oninput="setForkText(\'' + id + '\',\'yesLabel\',this.value)">' +
      '<div style="height:7px"></div>' + sel('yesTarget', n.yesTarget) +
      '<label class="pop__l">Answer 2' + langSuffix + '</label>' +
      '<input class="tinput" value="' + esc(txRaw(n.noLabel)) + '" placeholder="' + esc(tx(n.noLabel,BASE_LANG) || 'No') + '" ' +
        'oninput="setForkText(\'' + id + '\',\'noLabel\',this.value)">' +
      '<div style="height:7px"></div>' + sel('noTarget', n.noTarget) +
    '</div>' +
    '<div class="mbox__foot mbox__foot--split">' +
      '<button class="Button Button--error" onclick="closeModal();deleteNode(\'' + id + '\')">' + ic('trash',14) + ' Delete fork</button>' +
      '<button class="Button Button--contained Button--primary" onclick="closeModal()">Done</button>' +
    '</div>');
}
function setForkText(id, key, v){
  const w = wf(); const n = nodeById(w, id); if(!n) return;
  /* Writes the CURRENT LANGUAGE's slot. The map is the stored shape, so a
     translation can never overwrite the base language by accident. */
  n[key] = toTx(n[key]);
  n[key][authorLang] = v;
  w.updated = todayStr(); saveWFS(); renderCanvas();
}
function setForkTarget(id, key, v){
  const w = wf(); const n = nodeById(w, id); if(!n) return;
  n[key] = v === '' ? null : v;
  w.updated = todayStr(); saveWFS(); renderCanvas();
}

/* ═══════════════════════════════════════════════════════════════════════
   STATUS UPDATE EDITOR — placed, not declared
   ═══════════════════════════════════════════════════════════════════════
   Two controls and nothing else: which entity, and which one of its statuses.
   Both dropdowns are DESCRIPTION-ONLY (§5.2) — a status code is an
   identifier, and this is a picker.

   Switching entity re-bases the status, because an EVST code is not an AAST
   code; carrying it over would leave a status that does not exist in the new
   domain.
   ═══════════════════════════════════════════════════════════════════════ */
/* A two-way mode switch, as a SEGMENTED CONTROL rather than a Switch or a
   radio pair. Octave's `.uxt-switch` is on/off of one named thing, and
   neither of these modes is the absence of the other — "System action" and
   "User selected" are two named behaviours, which is exactly what `.seg` is
   for. Used identically by both action editors so they cannot drift. */
function actionModeSeg(opts){
  return '<div class="seg" style="width:100%">' +
    opts.options.map(o => '<button class="seg__btn' + (opts.value === o.v ? ' is-active' : '') + '" ' +
      'style="flex:1;justify-content:center" onclick="' + opts.on.replace('%v', o.v) + '">' +
      ic(o.icon, 14) + esc(o.label) + '</button>').join('') +
  '</div>';
}

/* ONE DOOR. Three action kinds and a fourth is plausible, so the callers
   (the node menu, the drop handler) route by `action` in one place rather
   than each growing its own if-chain. */
function openActionEditor(id){
  const w = wf(); const nd = nodeById(w, id);
  if(!nd || nd.kind !== 'action') return;
  if(nd.action === 'timer') return openTimerEditor(id);
  if(nd.action === 'stoptimer') return openStopTimerEditor(id);
  return openStatusEditor(id);
}
/* The mode control every action editor opens with, so the three cannot
   describe the same choice three ways. */
function actionModeField(nd, setter, copy){
  return '<label class="pop__l">' + esc(copy.label) + '</label>' +
    actionModeSeg({value:nd.mode, on:setter + '(\'' + nd.nid + '\',\'%v\')', options:[
      {v:'system', label:'System action', icon:copy.icon},
      {v:'user',   label:'User selected', icon:'users'},
    ]}) +
    '<div class="pop__note">' + (actionAsks(nd) ? copy.user : copy.system) + '</div>';
}

function openStatusEditor(id){
  const w = wf(); const nd = nodeById(w, id);
  if(!nd || nd.action !== 'status') return;
  state.selNid = id; renderCanvas();
  const isUser = nd.mode === 'user';
  openModal('narrow',
    '<div class="mbox__head"><div class="mbox__head-b">' +
      '<div class="mbox__title">Status update</div>' +
      '<div class="mbox__sub">Applied when the workflow reaches this point \u2014 on the technician\'s ' +
        '<b>Next</b> tap, before the following step opens.</div>' +
    '</div>' + iconBtn('x', {on:'closeModal()', cls:'IconButton--muted', title:'Close'}) + '</div>' +
    '<div class="mbox__body mbox__body--plain">' +

      actionModeField(nd, 'setActionMode', {label:'Who decides the new status', icon:'flag',
        system:'The workflow sets the status below and the technician never sees it. No prompt, no tap.',
        user:'The technician is asked. A <b>pull-up</b> opens with the record\'s current status shown ' +
          '<b>protected</b>, and they pick the new one from a dropdown.'}) +

      '<label class="pop__l">Status entity</label>' +
      '<select class="tinput" onchange="setStatusEntity(\'' + id + '\',this.value)">' +
        '<option value="wo"' + (nd.entity==='wo'?' selected':'') + '>Work Order</option>' +
        '<option value="activity"' + (nd.entity==='activity'?' selected':'') + '>Activity</option>' +
      '</select>' +
      (isUser
        ? '<div class="pop__note">Which record the pull-up is about, and therefore which status domain ' +
            'it draws from \u2014 ' + esc(nd.entity === 'activity' ? 'AAST' : 'EVST') + '.</div>'
        : '') +

      (isUser
        /* NOTHING IS AUTHORED HERE. The list comes from base EAM's own
           user-group status authorisation at runtime (answered 2026-09-17):
           an authored subset would be a fifth place a status list lives, and
           the first one free to disagree with the other four. Stated in the
           editor rather than left as an absence, so the admin knows the
           control is missing on purpose. */
        ? '<div class="pop__sep"></div>' +
          '<label class="pop__l">What the technician can pick</label>' +
          '<div class="input input--prot">' +
            '<span class="input__v">Resolved on the device \u2014 base EAM status authorisation</span>' +
            '<span class="input__lock">' + ic('lock',16) + '</span>' +
          '</div>' +
          '<div class="pop__note">Not authored here, on purpose. The dropdown holds whatever <b>this user ' +
            'group is authorised to set from the record\'s current status</b>, which base EAM already owns ' +
            '\u2014 same boundary a UDS definition (\u00a727.4) and a dataspy (\u00a730.14) sit behind. A subset ' +
            'authored in this portal would be a fifth copy of a status list, and the first one free to ' +
            'disagree with the other four.</div>' +
          '<div class="pop__note"><b>Cancel returns, it does not advance.</b> Nothing is set and the ' +
            'technician is back on the step they were on. That is what keeps an empty authorisation set a ' +

            'through.</div>'
        : '<label class="pop__l">Status</label>' +
          '<select class="tinput" onchange="setStatusValue(\'' + id + '\',this.value)">' +
            statusListForEntity(nd.entity).map(st => '<option value="' + st.code + '"' +
              (nd.status===st.code?' selected':'') + '>' + esc(st.desc) + '</option>').join('') +
          '</select>') +
    '</div>' +
    '<div class="mbox__foot mbox__foot--split">' +
      '<button class="Button Button--error" onclick="closeModal();deleteNode(\'' + id + '\')">' +
        ic('trash',16) + 'Delete action</button>' +
      '<button class="Button Button--contained Button--primary" onclick="closeModal()">Done</button>' +
    '</div>');
}
/* Kept as a thin alias: the authored status is preserved across a flip to
   `user` (nothing to re-base \u2014 the entity has not changed), and the
   mode itself is written by the one setter every action shares. */
function setStatusMode(id, val){ setActionMode(id, val); }

/* ── THE STOP TIMER EDITOR ──
   Most of it is the DERIVED BOOKING, rendered protected. That is the whole

   shown filled in and locked at authoring time, none of it needs asking at

function openStopTimerEditor(id){
  const w = wf(); const nd = nodeById(w, id);

  openModal('narrow',
