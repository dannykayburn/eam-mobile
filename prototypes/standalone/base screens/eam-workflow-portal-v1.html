/* ONE setter for all three actions, matching the one field. Re-opens through
   openActionEditor() so it does not need to know which editor it came from. */
function setActionMode(id, val){
  const w = wf(); const nd = nodeById(w, id); if(!nd) return;
  nd.mode = ACTION_MODES.indexOf(val) > -1 ? val : 'system';
  w.updated = todayStr(); saveWFS(); renderCanvas();
  openActionEditor(id);
}
function setStatusEntity(id, val){
  const w = wf(); const nd = nodeById(w, id); if(!nd) return;
  nd.entity = val;
  /* Re-base: an EVST code is not an AAST code, so keeping it would leave a
     status that does not exist in the entity now selected. */
  nd.status = (COMPLETION_DEFAULTS[val] || COMPLETION_DEFAULTS.wo).complete;
  w.updated = todayStr(); saveWFS(); renderCanvas();
  openStatusEditor(id);
}
function setStatusValue(id, val){
  const w = wf(); const nd = nodeById(w, id); if(!nd) return;
  nd.status = val; w.updated = todayStr(); saveWFS(); renderCanvas();
}

/* ── THE NEAREST STEP IN FRONT OF A NODE ──
   Shared by the condition fork (whose form it READS, §30.19) and by both
   actions (whose pull-up opens OVER it). One accessor rather than three
   loops, because all three mean the same thing by "in front of": the
   screen the technician is actually on when this node fires. */
function prevStepOf(w, n){
  const flow = flowNodes(w);
  const i = flow.indexOf(n);
  if(i < 0) return null;
  for(let j = i - 1; j >= 0; j--) if(isStepKind(flow[j])) return flow[j];
  return null;
}

/* ═══════════════════════════════════════════════════════════════════════
   EMBEDDED SCREEN DESIGNER PANEL
   ═══════════════════════════════════════════════════════════════════════ */
function openDsn(id){
  const w = wf(); const n = nodeById(w, id); if(!n) return;
  /* A fork has no layout at all (§29.4) — it routes, it does not collect —
     so the panel would have nothing to show and the fork editor is the real
     destination. A UDS DOES open the panel, but read-only. */
  if(n.kind === 'fork'){ openForkEditor(id); return; }
  if(n.kind === 'cond'){ openCondEditor(id); return; }
  state.selNid = id; state.dsnOpen = true;
  render();
}
function closeDsn(){ state.dsnOpen = false; $('fldbar').classList.add('closed'); render(); }

function renderDsn(){
  const w = wf(); const panel = $('dsn');
  const n = state.dsnOpen && state.selNid ? nodeById(w, state.selNid) : null;
  if(n && n.kind === 'uds'){ renderDsnUds(w, n); return; }
  /* Every layoutless kind, through the accessor — a condition fork, a status
     update and a timer all have nothing to lay out, and each of the three
     was added after this line was first written. */
  if(!n || isForkKind(n) || n.kind === 'action'){
    panel.classList.add('closed');
    $('fldbar').classList.add('closed');
    /* Closing it widens the canvas, so the wires need re-measuring. */
    drawForkArrows();
    return;
  }
  panel.classList.remove('closed');
  applyDsnWidth();
  renderFldBar();

  $('dsnHead').innerHTML =
    '<div class="dsn__head-b">' +
      '<div class="dsn__eyebrow">Screen Designer · this step</div>' +
      '<div class="dsn__title">' + esc(n.name) + '</div>' +
      /* The layout key is shown, not hidden — an admin editing "Record View
         (2)" needs to see it is a different R5PAGELAYOUT variant and not the
         same rows they edited a minute ago (§29.2). */
      '<div class="dsn__key">' + esc(stepLabel(n.step)) + ' · layout key ' + esc(layoutKey(n)) +
        (n.inst > 1 ? ' · variant ' + n.inst : ' · base variant') + '</div>' +
    '</div>' +
    '<button class="Button Button--text Button--icon" onclick="closeDsn()" title="Close">' + ic('x',14) + '</button>';

  const cands = (FIELD_CANDIDATES[n.step] || []).filter(c =>
    !n.layout.some(s=>s.fields.some(f=>f.api===c.api)));

  $('dsnBody').innerHTML =
    (n.inst > 1
      ? '<div class="dsn__note">This is <b>variant ' + n.inst + '</b> of ' + esc(stepLabel(n.step)) +
        '. It carries its own layout — editing it does not touch the other instance' +
        (w.nodes.filter(x=>x.step===n.step).length > 2 ? 's' : '') + '.</div>'
      : '') +
    emulatorHtml(w, n, null, true);
}

/* ── THE UDS PANEL — placement, never authoring (§27.4 role 1) ──
   Deliberately NOT an editable field grid. The whole §27.4 split is that base
   EAM's UDS setup owns the definition and this surface only PLACES it, so the
   fields render as a read-only preview WITH THE REASON STATED, rather than as
   something that looks draggable and silently is not.

   Building field authoring in here is the mistake that retired the old
   Workflow Designer (§27.2) — which is why this panel has no Add-field
   button, no container list and no property menu. ── */
function renderDsnUds(w, n){
  const panel = $('dsn');
  panel.classList.remove('closed');
  applyDsnWidth();
  /* No field sidebar: a UDS's fields belong to base EAM's UDS setup, not to
     this surface (§27.4 role 1). Offering fields to add would be the exact
     mistake the read-only panel exists to avoid. */
  $('fldbar').classList.add('closed');
  const d = udsDefOf(n.uds);
  $('dsnHead').innerHTML =
    '<div class="dsn__head-b">' +
      '<div class="dsn__eyebrow">User defined screen · this step</div>' +
      '<div class="dsn__title">' + esc(n.name) + '</div>' +
      '<div class="dsn__key">' + esc(n.uds) + (n.inst > 1 ? ' · placement ' + n.inst : '') + '</div>' +
    '</div>' +
    iconBtn('x', {on:'closeDsn()', cls:'IconButton--muted', title:'Close'});

  const required = n.placement !== 'more' && n.zone !== 'ref' && n.required;
  $('dsnBody').innerHTML =
    '<div class="dsn__note dsn__note--lock">' + ic('lock',14) + ' <b>Read-only here, on purpose.</b> ' +
      'Fields, types, LOVs, labels and required-ness belong to base EAM\'s own UDS setup (§27.4 role 1). ' +
      'This surface <b>places</b> the tab and never edits the definition — rebuilding that authoring here is ' +
      'the mistake that retired the old Workflow Designer (§27.2).</div>' +
    '<div class="dsn__meta">' +
      '<div class="dsn__meta-i"><div class="dsn__meta-l">Definition</div>' +
        '<div class="dsn__meta-v mono">' + esc(n.uds) + '</div></div>' +
      '<div class="dsn__meta-i"><div class="dsn__meta-l">Fields</div>' +
        '<div class="dsn__meta-v">' + (d ? d.fields : '—') + '</div></div>' +
      '<div class="dsn__meta-i"><div class="dsn__meta-l">Modified</div>' +
        '<div class="dsn__meta-v mono">' + (d ? esc(d.modified) : '—') + '</div></div>' +
      '<div class="dsn__meta-i"><div class="dsn__meta-l">Placement</div>' +
        '<div class="dsn__meta-v">' + (n.zone === 'ref' ? 'More entry' : 'Numbered step') + '</div></div>' +
    '</div>' +
    '<div class="dsn__note">' + ic('info',14) + ' On the device this renders through <b>one generic ' +
      'definition-driven tab renderer</b> (§27.3), never a screen per UDS.</div>' +
    (required
      ? '<div class="dsn__note dsn__note--err">' + ic('alert',14) + ' <b>Required + UDS</b> is the combination ' +
        'that needs checking against the group\'s tab permissions: a group without permission to this tab gets a ' +
        'step it can neither complete nor skip — a hard dead end, not a warning (§27.4). It also needs §14.7 ' +
        'bar-locking evaluated over fields the app has never seen, which is one of the two independent arguments ' +
        'for the declared-vs-effective field-state split (§13.3 item 2).</div>'
      : '') +
    udsEmulatorHtml(w, n, d);
}
/* The same emulator chrome as a tab step, so a UDS previews in its real
   place in the rail — it IS a step (§29.5). Only the body differs, and it
   differs by being placeholders: this surface does not know the field names. */
function udsEmulatorHtml(w, n, d){
  const seq = seqNodes(w);
  const inRef = n.zone === 'ref';
  const pos = inRef ? 0 : seq.indexOf(n) + 1;
  let rail;
  if(w.freeForm){
    rail = '<div class="emu-rail"><div class="emu-rail-row">' +
      '<span class="emu-rail-n">' + esc(n.name) + '</span>' + typeCircleHtml(w) + '</div></div>';
  } else if(inRef){
    rail = '<div class="emu-rail"><div class="emu-rail-row">' +
      '<span class="emu-rail-pill" style="background:var(--d-gray-4)">More</span>' +
      '<span class="emu-rail-n">' + esc(n.name) + '</span>' + typeIconHtml(w) + '</div></div>';
  } else {
    let segs = '';
    seq.forEach((x,i) => { segs += '<span class="emu-seg ' + (i+1<pos?'done':(i+1===pos?'active':'')) + '"></span>'; });
    rail = '<div class="emu-rail"><div class="emu-rail-row">' +
      '<span class="emu-rail-pill">' + pos + ' of ' + seq.length + '</span>' +
      '<span class="emu-rail-n">' + esc(n.name) + '</span>' +
      '<span class="emu-rail-segs">' + segs + '</span>' + typeIconHtml(w) + '</div></div>';
  }
  const rows = d
    ? Array.from({length:d.fields}).map((_,i) =>
        '<div class="emu-uds-row"><span class="emu-uds-l">Field ' + (i+1) + '</span>' +
        '<span class="emu-uds-v">—</span></div>').join('')
    : '<div class="emu-uds-row"><span class="emu-uds-l">Definition not found</span></div>';
  const gates =
    (n.reqComment ? '<div class="emu-gate"><div class="emu-gate-l">' + ic('message',16) +
      'Comment required<span class="emu-gate-r">gate</span></div></div>' : '') +
    (n.reqDoc ? '<div class="emu-gate"><div class="emu-gate-l">' + ic('clip',16) +
      'Document required<span class="emu-gate-r">gate</span></div></div>' : '');
  return '<div class="emu">' +
    '<div class="emu-nav">' + ic('chevL',20) + '<span class="emu-nav-t">' + esc(n.name) + '</span>' +
      '<span class="emu-nav-c">19257</span></div>' + rail +
    '<div class="emu-uds">' + rows + '</div>' +
    (gates ? '<div class="emu-body">' + gates + '</div>' : '') +
    (inRef ? '' : '<div class="emu-bar' + ((n.required||n.reqComment||n.reqDoc)?' locked':'') + '">' +
      ((n.required||n.reqComment||n.reqDoc) ? ic('lock',18) : '') +
      (pos === seq.length ? 'Complete Work Order' : 'Next') + '</div>') +
  '</div>';
}

/* ── AVAILABLE FIELDS ──
   THE LIST IS THE COMPLEMENT OF THE SCREEN: a candidate leaves the moment it
   is placed and comes back when removed, so the question it answers is "what
   is left to add" rather than "what exists" — which the layout already shows.

   It shows the field TYPE, not its function code. A type tells an admin what
   control they are about to place; the code tells them nothing they can act
   on from here (same call as the field right-click menu, 2026-09-16). ── */
let fldBarMin = false;
function toggleFldBar(){
  fldBarMin = !fldBarMin;
  $('fldbar').classList.toggle('fldbar--min', fldBarMin);
  drawForkArrows();
}
function availableFields(w, nd){
  if(!nd || nd.kind !== 'step') return [];
  const placed = new Set();
  (nd.layout || []).forEach(sec => sec.fields.forEach(f => placed.add(f.api)));
  return (FIELD_CANDIDATES[nd.step] || []).filter(c => !placed.has(c.api));
}
function renderFldBar(){
  const w = wf();
  const bar = $('fldbar');
  const nd = state.dsnOpen && state.selNid ? nodeById(w, state.selNid) : null;
  /* A fork has no fields and a UDS's fields are not ours to author
     (§27.4), so neither gets the sidebar. */
  if(!nd || nd.kind !== 'step'){ bar.classList.add('closed'); return; }
  bar.classList.remove('closed');
  bar.classList.toggle('fldbar--min', fldBarMin);

  const all = availableFields(w, nd);
  const q = (($('fldSearch') && $('fldSearch').value) || '').trim().toLowerCase();
  const list = q ? all.filter(c => c.name.toLowerCase().indexOf(q) > -1) : all;
  const nEl = $('fldbarN'); if(nEl) nEl.textContent = all.length;

  $('fldbarBody').innerHTML = list.length
    ? list.map(c =>
        '<div class="fldbar__item" draggable="true" ondragstart="fldBarDragStart(event,\'' + c.api + '\')" ' +
          'ondragend="fldBarDragEnd()" title="Drag into a container">' +
          '<span class="ms ms-16">drag_indicator</span>' +
          '<span class="fldbar__item-t">' + esc(c.name) + '</span>' +
          '<span class="fldbar__item-k">' + esc(c.type) + '</span>' +
        '</div>').join('')
    : '<div class="fldbar__empty">' + (all.length
        ? 'Nothing matches “' + esc(q) + '”.'
        : 'Every candidate field for this step is on the screen. Removing one puts it back here.') + '</div>';
}

/* ── EMULATOR ──
   `forPreview` false = the designer panel's editable emulator (draggable
   fields, right-click menus). true = the Preview modal's read-only one.
   One renderer for both, so the thing you author and the thing you preview
   cannot drift. ── */
function emulatorHtml(w, n, answers, editable){
  const flow = flowNodes(w);
  const seq = seqNodes(w);
  const na = naSet(w, answers);
  const inRef = n.zone === 'ref';
  const pos = inRef ? 0 : seq.indexOf(n) + 1;
  const total = seq.length;

  let rail = '';
  if(w.freeForm){
    /* §11's fallback / Free Form rail: a name and a Type circle, no
       position pill and no segment bar — the absence of a sequence
       indicator is the cue, which is why renderFlatStepRail() in the app
       draws a filled circle instead of a number. */
    rail = '<div class="emu-rail"><div class="emu-rail-row">' +
      '<span class="emu-rail-n">' + esc(n.name) + '</span>' +
      typeCircleHtml(w) +
      '<span style="color:var(--d-gray-4);display:flex">' + ic('chevD',20) + '</span>' +
    '</div></div>';
  } else if(inRef){
    rail = '<div class="emu-rail"><div class="emu-rail-row">' +
      '<span class="emu-rail-pill" style="background:var(--d-gray-4)">More</span>' +
      '<span class="emu-rail-n">' + esc(n.name) + '</span>' +
      typeIconHtml(w) +
      '<span style="color:var(--d-gray-4);display:flex">' + ic('chevD',20) + '</span>' +
    '</div></div>';
  } else {
    let segs = '';
    seq.forEach((s,i) => {
      const cls = na.has(s.nid) ? 'na' : (i+1 < pos ? 'done' : (i+1 === pos ? 'active' : ''));
      segs += '<span class="emu-seg ' + cls + '"></span>';
    });
    rail = '<div class="emu-rail"><div class="emu-rail-row">' +
      '<span class="emu-rail-pill">' + pos + ' of ' + total + '</span>' +
      '<span class="emu-rail-n">' + esc(n.name) + '</span>' +
      '<span class="emu-rail-segs">' + segs + '</span>' +
      typeIconHtml(w) +
      '<span style="color:var(--d-gray-4);display:flex">' + ic('chevD',20) + '</span>' +
    '</div></div>';
  }

  /* Record View carries the identity header, which §5.3 locks out of Screen
     Designer entirely. Drawn so its space is accounted for and labelled so
     nobody hunts for its fields in the container list. */
  const lock = n.step === 'recordview'
    ? '<div class="emu-lock">' + ic('lock',11) +
      'Identity header — icon, number, description, status, pin. Locked out of Screen Designer (§5.3).</div>'
    : '';

  let body = '';
  n.layout.forEach((sec, cIdx) => {
    const pinned = cIdx === 0;
    const hidden = sec.display === 'hidden';
    const collapsed = sec.display === 'collapsed' && sec.layout !== 'grid';
    body += '<div class="emu-sec' +
        (pinned ? ' emu-sec--pinned' : '') +
        (hidden ? ' emu-sec--hidden' : '') +
        (sec.std === false ? ' emu-sec--nonstd' : '') + '"' +
      (editable
        ? ' data-cont="' + cIdx + '"' +
          (pinned ? '' : ' draggable="true" ondragstart="contDragStart(event,' + cIdx + ')" ondragend="contDragEnd()"') +
          /* The header forwards a FIELD drop to its own container: it is the
             edge the pointer crosses on the way in, and a drop that lands
             there used to do nothing at all. */
          ' ondragover="contHeadDragOver(event,' + cIdx + ')" ondrop="contHeadDrop(event,' + cIdx + ')"' +
          /* RIGHT-CLICK ONLY. It used to be bound to onclick as well, which
             made clicking away from the menu land on the container and
             immediately reopen it — indistinguishable from "the menu will
             not close". */
          ' oncontextmenu="containerMenu(event,\'' + n.nid + '\',' + cIdx + ')"' +
          ' title="Right-click for display, grid/list, rename"'
        : '') + '>' +
      /* The non-standard marker comes FIRST, because it changes what the
         container is before anything else about it matters (§15.2). */
      (sec.std === false ? '<span class="emu-sec-nonstd" title="Non-standard container — special handling (§15.2)">' + ic('alert',14) + '</span>' : '') +
      '<span class="emu-sec-n">' + esc(sec.container) + '</span>' +
      (editable && pinned ? '<span class="emu-sec-pin" title="Pinned — nothing goes above the field grid (§5.2)">' + ic('lock',14) + '</span>' : '') +
      (collapsed ? '<span class="emu-sec-state" title="Renders collapsed">' + ic('chevR',14) + '</span>' : '') +
      (hidden ? '<span class="emu-sec-state" title="Hidden for this group">' + ic('na',14) + '</span>' : '') +
      '</div>';
    /* A collapsed container keeps its header and drops its body — that is
       the whole point of a collapsible container (§5.2). */
    const bodyCls = collapsed ? ' emu-secbody--collapsed' : '';
    if(sec.layout === 'grid'){
      /* A grid container's buttons sit in their own full-width row beneath
         the cells — a button is not a labelled value, so it has no business
         in a 2-up value grid. */
      const cells = sec.fields.map((f,fIdx)=> f.type === 'button' ? '' : cellHtml(n,cIdx,fIdx,f,editable)).join('');
      const btns = sec.fields.map((f,fIdx)=> f.type === 'button' ? buttonFieldHtml(n,cIdx,fIdx,f,editable) : '').join('');
      body += '<div class="emu-secbody' + bodyCls + '" ondragover="fldDragOverSec(event)" ondrop="fldDropSec(event,' + cIdx + ')">' +
        '<div class="emu-grid">' + cells + '</div>' +
        (btns ? '<div class="emu-btnrow">' + btns + '</div>' : '') +
        (editable && !sec.fields.length ? '<div class="emu-dropzone">Drop a field here</div>' : '') +
      '</div>';
    } else {
      body += '<div class="emu-secbody' + bodyCls + '" ondragover="fldDragOverSec(event)" ondrop="fldDropSec(event,' + cIdx + ')">' +
        rowsWithButtonGroups(n, cIdx, sec, editable) +
        (editable && !sec.fields.length ? '<div class="emu-dropzone">Drop a field here</div>' : '') +
      '</div>';
    }
  });

  if(!n.layout.length) body = '<div class="emu-sec"><span class="emu-sec-n">No containers yet</span></div>';

  /* Gates, drawn (§29.3). Never on a More entry — nothing routes the
     technician there, so a gate there would be unenforceable (§14.8). */
  let gates = '';
  if(!w.freeForm && !inRef){
    if(n.reqComment) gates += '<div class="emu-gate"><div class="emu-gate-l">' + ic('message',12) +
      'Comment required<span class="emu-gate-r">gate</span></div>' +
      '<div class="emu-gate-i">Enter a comment…</div></div>';
    if(n.reqDoc) gates += '<div class="emu-gate"><div class="emu-gate-l">' + ic('clip',12) +
      'Document required<span class="emu-gate-r">gate</span></div>' +
      '<div class="emu-gate-i">Attach a document…</div></div>';
  }

  let bar = '';
  if(w.freeForm){
    bar = '<div class="emu-bar">' + ic('save',15) + ' Save</div>';
  } else if(inRef){
    bar = '';  /* No bottom bar on a More destination — the rail is the way back (§16.10). */
  } else {
    const locked = n.reqComment || n.reqDoc || n.required;
    const isLast = pos === total;
    bar = '<div class="emu-bar' + (locked?' locked':'') + '">' +
      (locked ? ic('lock',15) : '') + (isLast ? 'Complete Work Order' : 'Next') +
      (locked ? '' : ic('arrowR',15)) + '</div>';
  }

  return '<div class="emu">' +
    '<div class="emu-nav">' + ic('chevL',15) + '<span class="emu-nav-t">' + esc(n.name) + '</span>' +
      '<span class="emu-nav-c">19257</span></div>' +
    lock + rail +
    '<div class="emu-body">' + body + gates + '</div>' +
    bar +
  '</div>';
}
function typeIconHtml(w){
  const fam = w.woType ? TYPECODE_TO_WOTYPE_FAMILY[w.woType] : null;
  if(!fam) return '';
  return '<span style="color:' + WO_TYPE_PALETTE[fam].color + ';display:flex;flex-shrink:0">' + woTypeIconSvg(fam,15) + '</span>';
}
function typeCircleHtml(w){
  const fam = w.woType ? TYPECODE_TO_WOTYPE_FAMILY[w.woType] : null;
  if(!fam) return '<span class="emu-rail-type" style="background:var(--d-gray-4)">' + ic('grid',14) + '</span>';
  return '<span class="emu-rail-type" style="background:' + WO_TYPE_PALETTE[fam].color + '">' + woTypeIconSvg(fam,12) + '</span>';
}

function sampleValue(f){
  if(f.behavior === 'hid') return '';
  if(f.behavior === 'na') return 'Not Available';
  const s = {lov:'Select…', text:'—', num:'0', bool:'No', date:'—', time:'--:--'};
  return s[f.type] || '—';
}
function buttonFieldHtml(n, cIdx, fIdx, f, editable){
  const drag = editable
    ? ' draggable="true" ondragstart="fieldDragStart(event,' + cIdx + ',' + fIdx + ')" ondragend="fieldDragEnd()" ' +
      'ondragover="fieldDragOver(event,this)" ondragleave="fieldDragLeave(this)" ondrop="fieldDrop(event,' + cIdx + ',' + fIdx + ')" ' +
      'oncontextmenu="fieldMenu(event,\'' + n.nid + '\',' + cIdx + ',' + fIdx + ')" ' +
      'onclick="fieldMenu(event,\'' + n.nid + '\',' + cIdx + ',' + fIdx + ')"'
    : ' style="cursor:default"';
  return '<span class="emu-btn' + (f.variant === 'outlined' ? ' emu-btn--out' : '') +
    (f.behavior === 'hid' ? ' hid' : '') + '"' + drag + '>' +
    (f.icon ? ic(f.icon,16) : '') + esc(f.name) + '</span>';
}
function fieldRowHtml(n, cIdx, fIdx, f, editable){
  if(f.type === 'button') return buttonFieldHtml(n, cIdx, fIdx, f, editable);
  const bm = behaviorMeta(f.behavior);
  const cls = 'emu-f' + (f.behavior==='hid'?' hid':'') + (f.behavior==='na'?' na':'');
  const drag = editable
    ? ' draggable="true" ondragstart="fieldDragStart(event,' + cIdx + ',' + fIdx + ')" ondragend="fieldDragEnd()" ' +
      'ondragover="fieldDragOver(event,this)" ondragleave="fieldDragLeave(this)" ondrop="fieldDrop(event,' + cIdx + ',' + fIdx + ')" ' +
      'oncontextmenu="fieldMenu(event,\'' + n.nid + '\',' + cIdx + ',' + fIdx + ')" ' +
      'onclick="fieldMenu(event,\'' + n.nid + '\',' + cIdx + ',' + fIdx + ')"'
    : ' style="cursor:default"';
  return '<div class="' + cls + '"' + drag + '>' +
    '<span class="emu-f-bar ' + bm.bar + '"></span>' +
    '<span class="emu-f-l">' + esc(f.name) + (f.behavior==='req'?'<span class="emu-f-star">*</span>':'') + '</span>' +
    '<span class="emu-f-v">' + esc(sampleValue(f)) + '</span>' +
    (f.behavior==='prot' ? ic('lock',16)
      : (f.behavior==='na' ? '' : ic('chevR',16))) +
  '</div>';
}
function cellHtml(n, cIdx, fIdx, f, editable){
  const bm = behaviorMeta(f.behavior);
  const span = f.span || 1;
  const cls = 'emu-cell' + (f.behavior==='hid'?' hid':'') + (f.behavior==='na'?' na':'');
  const drag = editable
    ? ' draggable="true" ondragstart="fieldDragStart(event,' + cIdx + ',' + fIdx + ')" ondragend="fieldDragEnd()" ' +
      'ondragover="fieldDragOver(event,this)" ondragleave="fieldDragLeave(this)" ondrop="fieldDrop(event,' + cIdx + ',' + fIdx + ')" ' +
      'oncontextmenu="fieldMenu(event,\'' + n.nid + '\',' + cIdx + ',' + fIdx + ')" ' +
      'onclick="fieldMenu(event,\'' + n.nid + '\',' + cIdx + ',' + fIdx + ')"'
    : ' style="cursor:default"';
  return '<div class="' + cls + '" style="grid-column:span ' + span + '"' + drag + '>' +
    '<span class="emu-f-bar ' + bm.bar + '"></span>' +
    '<span class="emu-cell-l">' + esc(f.name) + (f.behavior==='req'?'<span class="emu-f-star">*</span>':'') + '</span>' +
    '<span class="emu-cell-v">' + esc(sampleValue(f)) + '</span>' +
    (editable ? '<span class="grid-grip" title="Drag to stretch to full width" ' +
      'onmousedown="startGridResize(event,' + cIdx + ',' + fIdx + ')" ' +
      'ondragstart="event.stopPropagation();return false;"></span>' : '') +
  '</div>';
}

/* ── THE FIELD GRID SECTION's resize (§5.2's Grid container) ──
   A cell is 1 or 2 columns; there is no third state, so the drag RESOLVES to
   a span rather than tracking a width. Resolving on a 45px threshold and then
   detaching is what makes it feel like a switch instead of a slider — the
   grid only has two positions, so a continuous drag would be lying.

   autoBalanceGrid then widens a lone trailing cell, because a single 1-span
   field dangling in the last row reads as a layout mistake. */
function autoBalanceGrid(sec){
  if(!sec || sec.layout !== 'grid' || !sec.fields.length) return;
  let nextCol = 0;
  sec.fields.forEach(f => { const sp = f.span || 1; nextCol = sp >= 2 ? 0 : (nextCol === 0 ? 1 : 0); });
  if(nextCol === 1){
    const last = sec.fields[sec.fields.length - 1];
    if((last.span || 1) === 1) last.span = 2;
  }
}
function setFieldSpan(nodeId, cIdx, fIdx, span){
  const w = wf(); const nd = nodeById(w, nodeId); if(!nd) return;
  const sec = nd.layout && nd.layout[cIdx]; if(!sec) return;
  const f = sec.fields[fIdx]; if(!f) return;
  f.span = span;
  autoBalanceGrid(sec);
  saveWFS(); renderDsn();
}
function startGridResize(ev, cIdx, fIdx){
  ev.preventDefault(); ev.stopPropagation();
  const nodeId = state.selNid;
  const w = wf(); const nd = nodeById(w, nodeId); if(!nd) return;
  const f = nd.layout && nd.layout[cIdx] && nd.layout[cIdx].fields[fIdx]; if(!f) return;
  const startX = ev.clientX, startSpan = f.span || 1;
  let resolved = false;
  function move(e){
    if(resolved) return;
    const dx = e.clientX - startX;
    if(dx > 45 && startSpan === 1){ resolved = true; setFieldSpan(nodeId, cIdx, fIdx, 2); done(); }
    else if(dx < -45 && startSpan === 2){ resolved = true; setFieldSpan(nodeId, cIdx, fIdx, 1); done(); }
  }
  function done(){ document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', done); }
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', done);
}

/* ── CONTAINER DRAG ──
   The header is the drag handle. Index 0 never starts a drag and never
   accepts a drop above itself — moveContainer() clamps too, so the rule
   survives a caller that skips the geometry. ── */
let contDragFrom = null;
let contDropMark = null; // {nid, idx} — the insertion indicator
function contDragStart(ev, cIdx){
  if(cIdx === 0){ ev.preventDefault(); return; }
  contDragFrom = cIdx;
  ev.dataTransfer.effectAllowed = 'move';
  try{ ev.dataTransfer.setData('text/plain','c'); }catch(e){}
  if(ev.currentTarget.classList) ev.currentTarget.classList.add('dragging');
  ev.stopPropagation();
}
function clearContMarks(){
  document.querySelectorAll('.emu-sec').forEach(e => e.classList.remove('over-top','over-bot'));
}
function contDragEnd(){
  contDragFrom = null; contDropMark = null;
  clearContMarks();
  document.querySelectorAll('.emu-sec.dragging').forEach(e => e.classList.remove('dragging'));
  /* One render at the END, never during. */
  renderDsn();
}
function contDragOver(ev, cIdx){
  if(contDragFrom === null && !newCont) return;
  ev.preventDefault(); ev.stopPropagation();
  const el = ev.currentTarget;
  const r = el.getBoundingClientRect();
  const above = ev.clientY < r.top + r.height / 2;
  /* Nothing above the pinned first container, so hovering the top half of
     container 0 still means "after it". */
  const idx = (above && cIdx > 0) ? cIdx : cIdx + 1;
  const nd = nodeById(wf(), state.selNid);
  contDropMark = {nid: nd ? nd.nid : null, idx: idx};
  /* CLASS TOGGLE ONLY — see the note above. Re-rendering here destroys the
     drag source and the gesture dies. */
  clearContMarks();
  el.classList.add(idx === cIdx ? 'over-top' : 'over-bot');
}
/* One entry point for both things that can be dragged over a header: a
   container being reordered, or a field looking for a home. */
function contHeadDragOver(ev, cIdx){
  if(fldDrag){ ev.preventDefault(); ev.stopPropagation(); return; }
  contDragOver(ev, cIdx);
}
function contHeadDrop(ev, cIdx){
  if(fldDrag){ fldDropSec(ev, cIdx); return; }
  contDrop(ev, cIdx);
}
function contDrop(ev, cIdx){
  ev.preventDefault(); ev.stopPropagation();
  clearContMarks();
  const nd = nodeById(wf(), state.selNid); if(!nd){ contDragEnd(); return; }
  const idx = contDropMark ? contDropMark.idx : cIdx;
  if(newCont){ newCont = false; contDropMark = null; insertContainerAt(nd.nid, idx); return; }
  if(contDragFrom !== null){ const from = contDragFrom; contDragFrom = null; contDropMark = null; moveContainer(nd.nid, from, idx); return; }
  contDragEnd();
}
/* ADD CONTAINER is a drag source: you place it, you do not just append it. */
let newCont = false;
function newContDragStart(ev){
  newCont = true;
  ev.dataTransfer.effectAllowed = 'copy';
  try{ ev.dataTransfer.setData('text/plain','newcont'); }catch(e){}
  ev.currentTarget.classList.add('dragging');
}
function newContDragEnd(ev){
  newCont = false; contDropMark = null;
  if(ev && ev.currentTarget && ev.currentTarget.classList) ev.currentTarget.classList.remove('dragging');
  renderDsn();
}

/* ── AVAILABLE FIELD DRAG → a container body ── */
let fldDrag = null;      // the candidate's api
function fldBarDragStart(ev, api){
  fldDrag = api;
  ev.dataTransfer.effectAllowed = 'copy';
  try{ ev.dataTransfer.setData('text/plain', api); }catch(e){}
  ev.currentTarget.classList.add('dragging');
}
function fldBarDragEnd(){
  fldDrag = null;
  document.querySelectorAll('.fldbar__item').forEach(e=>e.classList.remove('dragging'));
}
function fldDragOverSec(ev){ if(fldDrag) { ev.preventDefault(); ev.stopPropagation(); } }
function fldDropSec(ev, cIdx){
  if(!fldDrag) return;
  ev.preventDefault(); ev.stopPropagation();
  const w = wf(); const nd = nodeById(w, state.selNid); if(!nd){ fldBarDragEnd(); return; }
  const sec = nd.layout && nd.layout[cIdx];
  const c = (FIELD_CANDIDATES[nd.step] || []).find(x => x.api === fldDrag);
  fldBarDragEnd();
  if(!sec || !c) return;
  const f = {name:c.name, api:c.api, type:c.type, behavior:'opt'};
  if(sec.layout === 'grid'){ f.span = 1; }
  sec.fields.push(f);
  if(sec.layout === 'grid') autoBalanceGrid(sec);
  saveWFS(); renderDsn();
  toast(c.name + ' added to "' + sec.container + '"');
}

/* Buttons collect into one trailing row; value rows keep their order. */
function rowsWithButtonGroups(n, cIdx, sec, editable){
  const rows = sec.fields.map((f,fIdx)=> f.type === 'button' ? '' : fieldRowHtml(n,cIdx,fIdx,f,editable)).join('');
  const btns = sec.fields.map((f,fIdx)=> f.type === 'button' ? buttonFieldHtml(n,cIdx,fIdx,f,editable) : '').join('');
  return rows + (btns ? '<div class="emu-btnrow">' + btns + '</div>' : '');
}

/* ── FIELD DRAG (inside one step's layout) ── */
function fieldDragStart(ev, cIdx, fIdx){
  fieldDrag = {cIdx:cIdx, fIdx:fIdx};
  ev.dataTransfer.effectAllowed = 'move';
  try{ ev.dataTransfer.setData('text/plain','f'); }catch(e){}
  ev.currentTarget.classList.add('dragging');
  ev.stopPropagation();
}
function fieldDragEnd(){
  fieldDrag = null;
  document.querySelectorAll('.emu-f,.emu-cell').forEach(e=>e.classList.remove('dragging','over-top','over-bot'));
}
function fieldDragOver(ev, el){
  if(!fieldDrag) return;
  ev.preventDefault(); ev.stopPropagation();
  const r = el.getBoundingClientRect();
  const top = ev.clientY < r.top + r.height/2;
  el.classList.toggle('over-top', top);
  el.classList.toggle('over-bot', !top);
}
function fieldDragLeave(el){ el.classList.remove('over-top','over-bot'); }
function fieldDrop(ev, cIdx, fIdx){
  ev.preventDefault(); ev.stopPropagation();
  if(!fieldDrag) return;
  const w = wf(); const n = nodeById(w, state.selNid); if(!n){ fieldDragEnd(); return; }
  const src = n.layout[fieldDrag.cIdx];
  const dst = n.layout[cIdx];
  if(!src || !dst){ fieldDragEnd(); return; }
  const el = ev.currentTarget;
  const r = el.getBoundingClientRect();
  const before = ev.clientY < r.top + r.height/2;
  const [moved] = src.fields.splice(fieldDrag.fIdx, 1);
  if(!moved){ fieldDragEnd(); return; }
  let target = fIdx;
  if(fieldDrag.cIdx === cIdx && fieldDrag.fIdx < fIdx) target--;
  dst.fields.splice(before ? target : target+1, 0, moved);
  fieldDragEnd(); saveWFS(); renderDsn();
}

/* ── CONTAINER MENU — right-click the header ──
   Display state, grid/list, rename, remove. The grid/list toggle moved here
   from a button in a list below the emulator: it is a property of the
   container, so it belongs on the container, and the list it lived in was a
   second place to manage the same thing. ── */
function containerMenu(ev, nodeId, cIdx){
  ev.preventDefault(); ev.stopPropagation();
  const w = wf(); const nd = nodeById(w, nodeId); if(!nd) return;
  const sec = nd.layout && nd.layout[cIdx]; if(!sec) return;
  const pinned = cIdx === 0;
  const items = containerStates(sec).map(([val, label]) =>
    '<div class="menu__item" onclick="setContainerDisplay(\'' + nodeId + '\',' + cIdx + ',\'' + val + '\')">' +
      ic(val === 'hidden' ? 'na' : (val === 'collapsed' ? 'chevR' : 'chevD'), 16) + label +
      (sec.display === val ? ic('check',16) : '') + '</div>').join('');
  openMenu(ev,
    '<div class="menu__label">' + esc(sec.container) + '</div>' +
    items +
    '<div class="menu__sep"></div>' +
    '<div class="menu__item" onclick="toggleContainerLayout(\'' + nodeId + '\',' + cIdx + ')">' +
      ic(sec.layout === 'grid' ? 'list' : 'grid', 16) +
      (sec.layout === 'grid' ? 'To list' : 'To grid') + '</div>' +
    '<div class="menu__item" onclick="closeMenu();renameContainer(\'' + nodeId + '\',' + cIdx + ')">' +
      ic('pencil',16) + 'Rename</div>' +
    '<div class="menu__sep"></div>' +
    (sec.std === false
      ? '<div class="menu__item is-disabled" title="Activity can only be hidden, never removed (§15.2)">' +
        ic('lock',16) + 'Remove container</div>'
      : pinned
      ? '<div class="menu__item is-disabled" title="The first container is pinned (§5.2)">' +
        ic('lock',16) + 'Remove container</div>'
      : '<div class="menu__item menu__item--danger" onclick="closeMenu();delContainer(\'' + nodeId + '\',' + cIdx + ')">' +
        ic('trash',16) + 'Remove container</div>'));
}
function renameContainer(nodeId, cIdx){
  const w = wf(); const nd = nodeById(w, nodeId); if(!nd) return;
  const sec = nd.layout && nd.layout[cIdx]; if(!sec) return;
  openPopAt(lastMenuEv,
    '<div class="pop__head"><div class="pop__title">Rename container</div></div>' +
    '<div class="pop__body pop__body--pad">' +
      '<input class="tinput" id="contNameIn" value="' + esc(sec.container) + '">' +
    '</div>' +
    '<div class="pop__foot">' +
      '<button class="Button" onclick="closePop()">Cancel</button>' +
      '<button class="Button Button--contained Button--primary" onclick="applyContainerRename(\'' + nodeId + '\',' + cIdx + ')">Rename</button>' +
    '</div>');
  const el = $('contNameIn');
  if(el){ el.focus(); el.select();
    el.onkeydown = e => { if(e.key === 'Enter') applyContainerRename(nodeId, cIdx); if(e.key === 'Escape') closePop(); }; }
}
function applyContainerRename(nodeId, cIdx){
  const w = wf(); const nd = nodeById(w, nodeId); if(!nd) return;
  const sec = nd.layout && nd.layout[cIdx]; if(!sec) return;
  const el = $('contNameIn'); if(!el) return;
  const v = el.value.trim();
  if(v) sec.container = v;
  /* Renaming can make — or unmake — the Activities exception, so re-derive
     it rather than leaving a flag that no longer matches the name. */
  normalizeWf(w);
  closePop(); saveWFS(); renderDsn();
}
function delContainer(nodeId, cIdx){
  const w = wf(); const nd = nodeById(w, nodeId); if(!nd) return;
  const sec = nd.layout && nd.layout[cIdx]; if(!sec) return;
  if(cIdx === 0){ toast('The first container is pinned (§5.2)'); return; }
  /* DESIGN DECISION (§15.2): the Activity container cannot be DELETED, only
     HIDDEN. It is not an ordinary field container — it is a single-select
     record list with its own add/edit affordances and a per-row completion
     state — so the screen's code depends on it existing. Removing it is not a
     layout choice, it is a broken screen; hiding it is the supported way to
     take it away from a group. */
  if(sec.std === false){
    toast('The Activity container can only be hidden, never removed (§15.2)');
    return;
  }
  const done = () => {
    nd.layout.splice(cIdx, 1);
    saveWFS(); renderDsn();
    toast('Container removed — its fields are back in Available fields');
  };
  if(sec.fields.length){
    confirmBox({title:'Remove this container?', sub:esc(sec.container), danger:true, ok:'Remove',
      body:'<div style="font-size:var(--uxt-theme-typography-body-2-font-size);line-height:1.6">It holds <b>' +
        sec.fields.length + '</b> field' + (sec.fields.length===1?'':'s') +
        ', which go with it — and reappear in <b>Available fields</b> to re-place.</div>',
      onOk:done});
    return;
  }
  done();
}

/* ── FIELD PROPERTY MENU — the §12/§13 field state ── */
function fieldMenu(ev, nodeId, cIdx, fIdx){
  ev.preventDefault(); ev.stopPropagation();
  const w = wf(); const n = nodeById(w, nodeId); if(!n) return;
  const f = n.layout[cIdx] && n.layout[cIdx].fields[fIdx]; if(!f) return;
  /* No function code and no per-option prose (direct instruction,
     2026-09-16). The code is not something an admin can act on from here,
     and five explanatory sentences in a menu of five options is longer than
     the options. The colour bar carries the state; the legend above the
     emulator is the key. */
  openMenu(ev,
    '<div class="menu__label">' + esc(f.name) + '</div>' +
    behaviorsFor(f).map(b =>
      '<div class="menu__item" onclick="setFieldBehavior(\'' + nodeId + '\',' + cIdx + ',' + fIdx + ',\'' + b.k + '\')">' +
        '<span class="dsn__lg-bar ' + b.bar + '" style="height:15px"></span>' +
        '<span class="menu__row-t" style="flex:1">' + b.t + '</span>' +
        (f.behavior===b.k ? ic('check',16) : '') + '</div>').join('') +
    '<div class="menu__sep"></div>' +
    '<div class="menu__item menu__item--danger" onclick="removeField(\'' + nodeId + '\',' + cIdx + ',' + fIdx + ')">' +
      ic('trash',16) + 'Remove field</div>');
}
function setFieldBehavior(nodeId, cIdx, fIdx, b){
  const w = wf(); const n = nodeById(w, nodeId); if(!n) return;
  const f = n.layout[cIdx] && n.layout[cIdx].fields[fIdx]; if(!f) return;
  /* Guard rather than trust the menu: a button can only be visible or
     hidden, and a stored Required button would be a state nothing renders. */
  if(f.type === 'button' && BUTTON_BEHAVIORS.indexOf(b) === -1){
    toast('A button can only be shown or hidden'); closeMenu(); return;
  }
  f.behavior = b; closeMenu(); saveWFS(); renderDsn();
}
function removeField(nodeId, cIdx, fIdx){
  const w = wf(); const n = nodeById(w, nodeId); if(!n) return;
  const sec = n.layout[cIdx]; if(!sec) return;
  const f = sec.fields.splice(fIdx,1)[0];
  if(sec.layout === 'grid') autoBalanceGrid(sec);
  closeMenu(); saveWFS(); renderDsn();
  /* It returns to Available fields — that list is the complement of the
     screen, so a removal is not a loss. */
  if(f) toast(f.name + ' removed — back in Available fields');
}
/* ── CONTAINER DISPLAY (§5.2) ──
   Grid offers Expanded / Hidden; List offers all three. The menu simply does
   not show Collapsed for a grid, rather than showing it disabled — there is
   no state to explain, the container just has no such mode. ── */
function containerStates(sec){
  return sec.layout === 'grid'
    ? [['expanded','Expanded'], ['hidden','Hidden']]
    : [['expanded','Expanded'], ['collapsed','Show collapsed'], ['hidden','Hidden']];
}
function setContainerDisplay(nodeId, cIdx, val){
  const w = wf(); const nd = nodeById(w, nodeId); if(!nd) return;
  const sec = nd.layout && nd.layout[cIdx]; if(!sec) return;
  if(sec.layout === 'grid' && val === 'collapsed'){ toast('A field grid has no collapsed state (§5.2)'); return; }
  sec.display = val;
  closeMenu(); saveWFS(); renderDsn();
  toast('"' + sec.container + '" → ' + val);
}

/* ── CONTAINER REORDER ──
   Index 0 is PINNED: nothing may be placed above the first container, which
   by convention is the field grid (§5.2). Clamped at the mutation rather than
   only in the drag geometry — the same lesson as the pinned Record View step,
   and for the same reason: a future caller that never ran the dragover would
   walk straight past a geometry-only guard. ── */
function moveContainer(nodeId, from, to){
  const w = wf(); const nd = nodeById(w, nodeId); if(!nd || !nd.layout) return;
  const L = nd.layout;
  if(from === to || from < 0 || from >= L.length) return;
  if(from === 0){ toast('The first container is pinned — nothing goes above the field grid (§5.2)'); return; }
  let dest = Math.max(1, Math.min(L.length - 1, to));
  const [moved] = L.splice(from, 1);
  L.splice(dest > from ? dest - 1 : dest, 0, moved);
  saveWFS(); renderDsn();
}
function insertContainerAt(nodeId, idx){
  const w = wf(); const nd = nodeById(w, nodeId); if(!nd) return;
  if(!nd.layout) nd.layout = [];
  const at = nd.layout.length ? Math.max(1, Math.min(nd.layout.length, idx)) : 0;
  nd.layout.splice(at, 0, {
    container:'New Container', layout:'list', display:'expanded', std:true, fields:[],
  });
  saveWFS(); renderDsn();
  toast(at === 0 ? 'Container added' : 'Container added at position ' + (at + 1));
}

function toggleContainerLayout(nodeId, cIdx){
  const w = wf(); const n = nodeById(w, nodeId); if(!n) return;
  const sec = n.layout[cIdx]; if(!sec) return;
  sec.layout = sec.layout === 'grid' ? 'list' : 'grid';
  if(sec.layout === 'grid'){
    sec.fields.forEach(f => { if(!f.span) f.span = 1; });
    autoBalanceGrid(sec);
    /* Becoming a grid drops a collapsed state it can no longer honour. */
    if(sec.display === 'collapsed') sec.display = 'expanded';
  }
  closeMenu(); saveWFS(); renderDsn();
  toast('"' + sec.container + '" → ' + (sec.layout === 'grid' ? 'Grid' : 'List'));
}
/* addContainer() folded into insertContainerAt() 2026-09-16: a container
   that always appended could not honour "cannot go above the field grid"
   because it never chose a position at all. */
/* openAddField()/addField() removed 2026-09-16 — the Available fields
   sidebar replaced them. A menu that listed candidates and dropped them into
   "the first container" could not express WHERE a field goes, which is the
   only interesting part of placing one. Dragging says it. */

/* ═══════════════════════════════════════════════════════════════════════
   PREVIEW — the workflow as the technician meets it
   ═══════════════════════════════════════════════════════════════════════
   Same emulator the designer panel draws, plus the one thing the panel
   cannot show: the EXPANDED step rail for the whole workflow. That is
   where numbering, gating, the More group and N/A propagation all become
   visible at once, and it is the only place §29.4's "a skipped step stays
   visible" is something you can look at rather than read about.

   Fork answers are switchable, because the whole point of a fork is that
   two technicians see two different rails.
   ═══════════════════════════════════════════════════════════════════════ */
let pv = null;   // {wfId, nid, answers, railOpen}

function previewWf(id){
  const w = WFS.find(x=>x.id===id); if(!w) return;
  const first = w.freeForm ? w.nodes[0] : (flowNodes(w)[0] || w.nodes[0]);
  pv = {wfId:id, nid:first ? first.nid : null, answers:{}, railOpen:true};
  closeMenu(); renderPreview();
}
function pvWf(){ return WFS.find(x=>x.id===(pv && pv.wfId)) || null; }
function pvSet(k,v){ if(!pv) return; pv[k]=v; renderPreview(); }
function pvAnswer(forkNid, ans){
  if(!pv) return;
  pv.answers[forkNid] = ans;
  /* If the current screen just became N/A because of this answer, move to
     the first step that is still applicable — leaving the technician parked
     on a screen the flow no longer reaches would be a lie about the flow. */
  const w = pvWf();
  const na = naSet(w, pv.answers);
  if(pv.nid && na.has(pv.nid)){
    const next = flowNodes(w).find(n=>n.kind==='step' && !na.has(n.nid));
    if(next) pv.nid = next.nid;
  }
  renderPreview();
}

function renderPreview(){
  const w = pvWf(); if(!w){ closeModal(); return; }
  const flow = flowNodes(w), ref = refNodes(w), seq = seqNodes(w);
  const na = naSet(w, pv.answers);
  const cur = nodeById(w, pv.nid) || flow[0] || w.nodes[0];
  if(!cur){
    openModal('narrow',
      '<div class="mbox__head"><div class="mbox__head-b"><div class="mbox__title">Nothing to preview</div>' +
      '<div class="mbox__sub">' + esc(w.desc || 'This workflow') + ' has no steps yet.</div></div></div>' +
      '<div class="mbox__foot"><button class="Button Button--contained Button--primary" onclick="closeModal()">Close</button></div>');
    return;
  }

  const tabList = (w.freeForm ? w.nodes : flow).map(n => {
    const isNa = na.has(n.nid);
    /* An action has no `name` — it was rendering as a blank tab that threw
       on click, because emulatorHtml() dereferences a layout it has not
       got. Both actions name themselves here and get their own emulator
       below. */
    const label = isForkKind(n) ? (n.kind === 'cond' ? 'Condition' : 'Fork')
      : (n.kind === 'action' ? actionKindLabel(n) : n.name);
    const num = (!w.freeForm && n.kind==='step') ? '<span class="prev-tab__n">' + (seq.indexOf(n)+1) + '</span>' : '';
    return '<button class="prev-tab' + (n.nid===cur.nid?' is-active':'') + '" ' +
      (isNa ? 'style="opacity:.45"' : '') + ' onclick="pvSet(\'nid\',\'' + n.nid + '\')">' +
      num + esc(label) + (isNa?' · N/A':'') + '</button>';
  }).join('') + (!w.freeForm ? ref.map(n =>
      '<button class="prev-tab' + (n.nid===cur.nid?' is-active':'') + '" onclick="pvSet(\'nid\',\'' + n.nid + '\')">' +
      ic('layers',12) + esc(n.name) + '</button>').join('') : '');

  const forks = flow.filter(isForkKind);
  const answerBar = forks.length
    ? '<div class="Banner Banner--info" style="margin-bottom:' + 'var(--s-4)">' +
        '<span class="ms ms-24 Banner__icon">alt_route</span>' +
        '<div class="Banner__body">' +
          '<div class="Banner__title">Fork outcomes</div>' +
          '<div class="Banner__text">Switch one to see the rail change. A <b>question</b> fork is answered by the ' +
            'technician; a <b>condition</b> fork is answered by the field, at the Next tap.</div>' +
          '<div class="Banner__rows">' +
          forks.map(f => {
            /* Both kinds route the same way, so one switcher reads both —
               the labels differ because the ANSWERER differs. */
            const brs = forkBranches(f);
            const a = pv.answers[f.nid] || brs[0][0];
            const title = f.kind === 'cond'
              ? condSummary(pvWf(), f) + ' ?'
              : (tx(f.question,BASE_LANG) || 'No question set');
            return '<div class="Banner__row">' +
              '<div class="Banner__row-b">' +
                (f.kind === 'cond' ? '<b>System</b> \u00b7 ' : '') + esc(title) + '</div>' +
              '<div class="seg seg--sm">' +
                brs.map(p => '<button class="seg__btn' + (a===p[0]?' is-active':'') + '" ' +
                  'onclick="pvAnswer(\'' + f.nid + '\',\'' + p[0] + '\')">' +
                  esc(shortLabel(forkBranchLabel(f, p[0]))) + '</button>').join('') +
              '</div>' +
            '</div>';
          }).join('') +
          '</div>' +
        '</div>' +
      '</div>'
    : '';

  /* A condition fork has no screen: the technician never sees it, which is
     the whole point. So the preview shows the form it READS \u2014 the step
     whose Next tap triggers it \u2014 rather than an empty phone. */
  const condSrc = cur.kind === 'cond' ? condSourceStep(w, cur) : null;
  const phone = cur.kind === 'fork'
    ? forkEmulatorHtml(w, cur)
    : cur.kind === 'action'
    ? actionEmulatorHtml(w, cur)
    : emulatorHtml(w, condSrc || cur, pv.answers, false);
  const railHtml = pv.railOpen ? '<div class="emu" style="margin-top:13px">' + stepMapHtml(w, cur, na) + '</div>' : '';

  openModal('wide',
    '<div class="mbox__head">' +
      '<div class="mbox__head-b">' +
        '<div class="mbox__title">' + esc(w.desc || 'Untitled workflow') + '</div>' +
        '<div class="mbox__sub">' +
          (w.freeForm ? 'Free Form — every tab reachable, nothing gated. ' : seq.length + ' steps, in order. ') +
          (w.woType ? esc(woTypeName(w.woType)) : 'Any WO Type') +
          (na.size ? ' · ' + na.size + ' step' + (na.size===1?'':'s') + ' skipped by the current answers' : '') +
        '</div>' +
      '</div>' +
      iconBtn('x', {on:'closeModal()', cls:'IconButton--muted', title:'Close'}) +
    '</div>' +
    '<div class="mbox__body" style="min-width:460px">' +
      answerBar +
      '<div class="prev-tabs" style="margin-bottom:13px">' + tabList + '</div>' +
      phone +
      railHtml +
    '</div>' +
    '<div class="mbox__foot mbox__foot--split">' +
      '<button class="Button Button--sm" onclick="pvSet(\'railOpen\',' + (!pv.railOpen) + ')">' +
        ic(pv.railOpen?'chevD':'chevR',13) + ' ' + (pv.railOpen?'Hide':'Show') + ' expanded step rail</button>' +
      '<span style="display:flex;gap:9px">' +
        '<button class="Button" onclick="closeModal();openWf(\'' + w.id + '\')">' + ic('pencil',14) + ' Edit this workflow</button>' +
        '<button class="Button Button--contained Button--primary" onclick="closeModal()">Close</button>' +
      '</span>' +
    '</div>');
}

/* ── AN ACTION, PREVIEWED ──
   The two modes are the whole point of both actions, and they are invisible
   on a card, so the preview draws the actual difference:

     system  — nothing. No screen, no sheet, no tap. Said as an absence
               rather than drawn as an empty phone, because an empty phone
               reads as "unfinished".
     user    — the step the technician is ON, faded, with the pull-up over
               it. That fade is what distinguishes a sheet from a fork: a
               fork is a screen of its own and replaces what was there.

   The status sheet shows the CURRENT status protected (the same orange
   protected bar §5.2 uses on a field) and the new one as a dropdown whose
   contents are resolved on the device, so the preview says where they come
   from instead of inventing a plausible list. */
function actionEmulatorHtml(w, n){
  const seq = seqNodes(w);
  const src = prevStepOf(w, n);
  const asks = actionAsks(n);
  const pos = src ? seq.indexOf(src) + 1 : 0;

  let segs = '';
  seq.forEach((x,k)=>{ segs += '<span class="emu-seg ' + (k+1<pos?'done':(k+1===pos?'active':'')) + '"></span>'; });
  const head = '<div class="emu-nav">' + ic('chevL',15) +
      '<span class="emu-nav-t">' + esc(src ? src.name : actionKindLabel(n)) + '</span>' +
      '<span class="emu-nav-c">19257</span></div>' +
    '<div class="emu-rail"><div class="emu-rail-row">' +
      (src ? '<span class="emu-rail-pill">' + pos + ' of ' + seq.length + '</span>' : '') +
      '<span class="emu-rail-n">' + esc(src ? src.name : 'No step in front of this') + '</span>' +
      '<span class="emu-rail-segs">' + segs + '</span>' + typeIconHtml(w) +
    '</div></div>';

  const onNext = 'as they tap <b>Next</b>' + (src ? ' on <b>' + esc(src.name) + '</b>' : '');
  if(!asks){
    const why = n.action === 'timer'
      ? 'The timer starts ' + onNext + '. They see it already running on the rail.'
      : n.action === 'stoptimer'
      ? 'The timer stops and the hours are booked ' + onNext + '. The row is waiting for them the next ' +
        'time they open Book Labor \u2014 which is why it can sit in <b>More</b>.'
      : esc(statusEntityLabel(n.entity)) + ' moves to <b>' + esc(statusDesc(n.entity, n.status)) + '</b> ' +
        onNext + '. Nothing is shown and nothing is asked.';
    return '<div class="emu">' + head +
      '<div class="emu-silent">' +
        '<div class="emu-silent__i">' + ic(actionIcon(n),22) + '</div>' +
        '<div class="emu-silent__t">No screen at all</div>' +
        '<div class="emu-silent__d">' + why + '</div>' +
      '</div>' +
    '</div>';
  }

  const sheet = n.action === 'timer'
    ? '<div class="emu-sheet">' +
        '<div class="emu-sheet__grab"></div>' +
        '<div class="emu-sheet__t">Start the timer?</div>' +
        '<div class="emu-sheet__d">Time on this work order will be tracked from now until you stop it.</div>' +
        '<div class="emu-sheet__note"><b>Not now</b> leaves it stopped and still moves on \u2014 nothing on ' +
          'the record depends on the timer.</div>' +
        '<div class="emu-sheet__acts">' +
          '<div class="emu-sheet__b emu-sheet__b--out">Not now</div>' +
          '<div class="emu-sheet__b">Start timer</div>' +
        '</div>' +
      '</div>'
    /* THE ONE SHEET WITH AN EDITABLE ROW. Hours first and editable; the
       derived rows protected beneath it, in \u00a718.4's own order, so an
       admin can see the whole booking and a technician can see that only one
       number is theirs to change. */
    : n.action === 'stoptimer'
    ? '<div class="emu-sheet">' +
        '<div class="emu-sheet__grab"></div>' +
        '<div class="emu-sheet__t">Book 2:15 to this work order?</div>' +
        '<div class="emu-sheet__d">The timer stopped. Check the hours before they are booked.</div>' +
        '<div class="emu-sheet__in">' +
          '<span class="emu-sheet__in-l">Hours Worked</span>' +
          '<span class="emu-sheet__in-v">2.25</span>' + ic('pencil',15) +
        '</div>' +
        STOP_TIMER_BOOKING.slice(0,4).map(r =>
          '<div class="emu-f"><span class="emu-f-bar prot"></span>' +
            '<span class="emu-f-l">' + esc(r.label) + '</span>' +
            '<span class="emu-f-v">' + esc(stopTimerSampleValue(r.label)) + '</span>' +
            ic('lock',14) + '</div>').join('') +
        '<div class="emu-sheet__note">Only the hours are yours to change \u2014 elapsed time is not always ' +
          'worked time. <b>Discard</b> leaves the timer running.</div>' +
        '<div class="emu-sheet__acts">' +
          '<div class="emu-sheet__b emu-sheet__b--out">Discard</div>' +
          '<div class="emu-sheet__b">Book time</div>' +
        '</div>' +
      '</div>'
    : '<div class="emu-sheet">' +
        '<div class="emu-sheet__grab"></div>' +
        '<div class="emu-sheet__t">Update ' + esc(statusEntityLabel(n.entity).toLowerCase()) + ' status</div>' +
        '<div class="emu-sheet__d">Pick the status this ' + esc(statusEntityLabel(n.entity).toLowerCase()) +
          ' moves to.</div>' +
        '<div class="emu-f"><span class="emu-f-bar prot"></span>' +
          '<span class="emu-f-l">Current status</span>' +
          '<span class="emu-f-v">' + esc(statusDesc(n.entity, (COMPLETION_DEFAULTS[n.entity] ||
            COMPLETION_DEFAULTS.wo).start)) + '</span>' +
          ic('lock',14) + '</div>' +
        '<div class="emu-sheet__sel">New status' + ic('chevD',18) + '</div>' +
        '<div class="emu-sheet__note">The list holds what <b>this user group is authorised to set</b> from ' +
          'that current status \u2014 resolved on the device, not authored in the portal.</div>' +
        '<div class="emu-sheet__acts">' +
          '<div class="emu-sheet__b emu-sheet__b--out">Cancel</div>' +
          '<div class="emu-sheet__b">Set status</div>' +
        '</div>' +
      '</div>';

  /* The screen behind, faded. Named rather than drawn in full: the point of
     the fade is that the sheet is over SOMETHING, and re-rendering the whole
     step's field list here would make the sheet the smaller half of the
     picture. */
  const behind = '<div class="emu-behind">' +
      '<div class="emu-sec"><span class="emu-sec-n">' +
        esc(src ? src.name + ' \u2014 still underneath' : 'Nothing in front of this action') + '</span></div>' +
      '<div class="emu-f"><span class="emu-f-bar"></span><span class="emu-f-l">\u2026the step they were on</span>' +
        '<span class="emu-f-v">\u2014</span></div>' +
    '</div>';

  return '<div class="emu">' + head + behind + '<div class="emu-scrim"></div>' + sheet + '</div>';
}

/* Plausible values for the emulated booking. Demo data — every one of these
   is derived at runtime (STOP_TIMER_BOOKING says from where), so this exists
   only so the sheet looks like a filled-in form rather than a schema. */
const STOP_TIMER_SAMPLES = {
  'Employee':'A. Okafor', 'Trade':'Technician', 'Department':'Maintenance',
  'Activity':'10 — Repair', 'Date Worked':'09/17/2026', 'Start / End':'08:30 – 10:45',
  'Type of Hours':'Normal',
};
function stopTimerSampleValue(label){ return STOP_TIMER_SAMPLES[label] || '\u2014'; }

function forkEmulatorHtml(w, n){
  const seq = seqNodes(w);
  const flow = flowNodes(w);
  const i = flow.indexOf(n);
  /* A fork sits BETWEEN steps, so it borrows the position of the step it
     precedes rather than claiming one of its own — it is a screen, not a
     step the technician completes. */
  const nextStep = flow.slice(i+1).find(x=>x.kind==='step');
  const pos = nextStep ? seq.indexOf(nextStep)+1 : seq.length;
  let segs = '';
  seq.forEach((s,k)=>{ segs += '<span class="emu-seg ' + (k+1<pos?'done':(k+1===pos?'active':'')) + '"></span>'; });
  const yes = forkTargetLabel(w, n, n.yesTarget);
  const no  = forkTargetLabel(w, n, n.noTarget);
  return '<div class="emu">' +
    '<div class="emu-nav">' + ic('chevL',15) + '<span class="emu-nav-t">Question</span>' +
      '<span class="emu-nav-c">19257</span></div>' +
    '<div class="emu-rail"><div class="emu-rail-row">' +
      '<span class="emu-rail-pill">' + pos + ' of ' + seq.length + '</span>' +
      '<span class="emu-rail-n">Question</span>' +
      '<span class="emu-rail-segs">' + segs + '</span>' + typeIconHtml(w) +
    '</div></div>' +
    '<div class="emu-q' + (tx(n.question,BASE_LANG)?'':' empty') + '">' +
      (tx(n.question,BASE_LANG) ? esc(tx(n.question,BASE_LANG)) : 'No question set — the technician would see an empty screen') + '</div>' +
    '<div class="emu-ans">' +
      '<div class="emu-ans-b">' + esc(tx(n.yesLabel,BASE_LANG) || 'Yes') + '</div>' +
      '<div class="emu-ans-s">' + esc(yes.text) + '</div>' +
      '<div class="emu-ans-b">' + esc(tx(n.noLabel,BASE_LANG) || 'No') + '</div>' +
      '<div class="emu-ans-s">' + esc(no.text) + '</div>' +
    '</div><div style="height:16px"></div>' +
  '</div>';
}

/* The expanded step rail — .step-map's real recipe, including the trailing
   chevron on a completed row (§14.10: a done step is always reopenable, and
   cursor:pointer says nothing on a touch screen) and the More group pinned
   after the last numbered step (§14.8). */
function stepMapHtml(w, cur, na){
  const seq = seqNodes(w), flow = flowNodes(w), ref = refNodes(w);
  if(w.freeForm){
    return '<div class="emu-map">' +
      w.nodes.map(n =>
        '<div class="emu-mi' + (n.nid===cur.nid?' is-active':'') + '" onclick="pvSet(\'nid\',\'' + n.nid + '\')" style="cursor:pointer">' +
          '<span class="emu-mi-dot"></span>' +
          '<span class="emu-mi-l">' + esc(n.name) + '</span>' +
          '<span class="emu-mi-ch">' + ic('chevR',14) + '</span>' +
        '</div>').join('') +
      '<div class="emu-mgrp">Free Form — no sequence, no gating</div>' +
    '</div>';
  }
  const curIdx = cur.kind === 'step' && cur.zone !== 'ref' ? seq.indexOf(cur) : -1;
  let rows = '';
  seq.forEach((n,i) => {
    const isNa = na.has(n.nid);
    const done = !isNa && curIdx > -1 && i < curIdx;
    const active = n.nid === cur.nid;
    const icoCls = isNa ? 'smi-na' : (active ? 'smi-active' : (done ? 'smi-done' : 'smi-locked'));
    const gate = (n.reqComment?'<span class="sgate">'+ic('message',11)+'</span>':'') +
                 (n.reqDoc?'<span class="sgate">'+ic('clip',11)+'</span>':'');
    rows += '<div class="emu-mi' + (active?' is-active':'') + (isNa?' naRow':'') + '" ' +
        'onclick="pvSet(\'nid\',\'' + n.nid + '\')" style="cursor:pointer">' +
      '<span class="emu-mi-ico ' + icoCls + '">' + (isNa ? '–' : (done ? ic('check',12,2.4) : (i+1))) + '</span>' +
      '<span class="emu-mi-l">' + esc(n.name) + '</span>' + gate +
      (n.required && !isNa ? '<span class="sreq">*</span>' : '') +
      (isNa ? '<span class="emu-mi-tag">N/A</span>' : '') +
      /* Trailing chevron on a COMPLETED row only — the current row is the
         screen you are on, and a locked row must not look like it leads
         anywhere (§14.10). */
      (done ? '<span class="emu-mi-ch">' + ic('chevR',14) + '</span>' : '') +
    '</div>';
  });
  const forks = flow.filter(isForkKind);
  const forkNote = forks.length
    ? '<div class="emu-mgrp" style="border-top:none;margin-top:0;padding-top:8px;text-transform:none;letter-spacing:0;font-weight:500;font-size:10.5px">' +
      forks.length + ' question fork' + (forks.length===1?'':'s') + ' route through this rail — a fork is a screen, not a numbered step.</div>'
    : '';
  const refRows = ref.length
    ? '<div class="emu-mgrp">More</div>' +
      ref.map(n =>
        '<div class="emu-mi' + (n.nid===cur.nid?' is-active':'') + '" onclick="pvSet(\'nid\',\'' + n.nid + '\')" style="cursor:pointer">' +
          '<span class="emu-mi-ch" style="width:22px">' + ic(stepIcon(n.step),16) + '</span>' +
          '<span class="emu-mi-l">' + esc(n.name) + '</span>' +
          '<span class="emu-mi-ch">' + ic('chevR',14) + '</span>' +
        '</div>').join('')
    : '';
  return '<div class="emu-map">' + rows + forkNote + refRows + '</div>';
}

/* ═══════════════════════════════════════════════════════════════════════
   UTILITIES — menu / popover / modal / confirm / toast / theme
   ═══════════════════════════════════════════════════════════════════════ */
let lastMenuEv = null;
function openMenu(ev, html){
  lastMenuEv = {clientX:ev.clientX, clientY:ev.clientY};
  const m = $('menu');
  m.innerHTML = html;
  m.classList.add('open');
  placeFloating(m, ev.clientX, ev.clientY);
}
function closeMenu(){ $('menu').classList.remove('open'); }
function openPopAt(ev, html){
  if(ev && ev.clientX != null) lastMenuEv = {clientX:ev.clientX, clientY:ev.clientY};
  closeMenu();
  const p = $('pop');
  p.innerHTML = html;
  p.classList.add('open');
  const x = ev ? ev.clientX : window.innerWidth/2;
  const y = ev ? ev.clientY : window.innerHeight/3;
  placeFloating(p, x, y);
}
function closePop(){ $('pop').classList.remove('open'); }
function placeFloating(el, x, y){
  el.style.left = '0px'; el.style.top = '0px';
  const r = el.getBoundingClientRect();
  let L = x, T = y + 6;
  if(L + r.width  > window.innerWidth  - 10) L = window.innerWidth  - r.width  - 10;
  if(T + r.height > window.innerHeight - 10) T = Math.max(10, y - r.height - 6);
  el.style.left = Math.max(10, L) + 'px';
  el.style.top  = Math.max(10, T) + 'px';
}
document.addEventListener('mousedown', function(e){
  /* NO FIELD EXCEPTION HERE. A mousedown outside the menu always closes it,
     including on another field — the click that follows reopens the menu for
     the field actually under the pointer, so the net effect is correct and
     clicking empty canvas dismisses. An exception for `.emu-f,.emu-cell` used
     to sit here and made the menu undismissable inside the designer, where
     nearly every pixel is a field. */
  if(!$('menu').contains(e.target)) closeMenu();
  if(!$('pop').contains(e.target)) closePop();
});
document.addEventListener('keydown', function(e){
  if(e.key !== 'Escape') return;
  if($('modal').classList.contains('open')){ closeModal(); return; }
  closeMenu(); closePop();
});

function openModal(size, html){
  const b = $('mbox');
  b.className = 'mbox ' + (size||'narrow');
  b.innerHTML = html;
  $('modal').classList.add('open');
}
function closeModal(){ $('modal').classList.remove('open'); pv = null; }
function confirmBox(o){
  openModal('narrow',
    '<div class="mbox__head"><div class="mbox__head-b">' +
      '<div class="mbox__title">' + o.title + '</div>' +
      (o.sub ? '<div class="mbox__sub">' + o.sub + '</div>' : '') +
    '</div></div>' +
    '<div class="mbox__body mbox__body--plain">' + (o.body||'') + '</div>' +
    '<div class="mbox__foot">' +
      '<button class="Button" onclick="closeModal()">Cancel</button>' +
      '<button class="Button ' + (o.danger?'Button--contained Button--primary':'Button--contained Button--primary') + '" id="confOk">' + (o.ok||'Continue') + '</button>' +
    '</div>');
  $('confOk').onclick = function(){ closeModal(); if(o.onOk) o.onOk(); };
}
let toastT = null;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(()=>t.classList.remove('on'), 3400);
}
/* Octave switches themes with data-uxt-theme, and uxt-tokens.css resolves
   every token off it — including nested regions, which is why the attribute
   goes on <html> rather than a class on <body>. Light is the default here:
   the base product's own app-bar/drawer tokens are the light set. */
function toggleTheme(){
  const dark = document.documentElement.getAttribute('data-uxt-theme') === 'dark';
  document.documentElement.setAttribute('data-uxt-theme', dark ? 'light' : 'dark');
  $('themeBtn').textContent = dark ? 'Dark' : 'Light';
  /* The fork wires are measured, and a theme change can reflow type. */
  if(state.view === 'edit') drawForkArrows();
}

/* ── RAIL WIDTH — resizable and persisted, same contract as the designer
   panel. AppShell ships a rail resize handle; this is that, with the width
   remembered so a wide rail survives a reload. ── */
const RAIL_W_KEY = 'eamWfpRailWidth';
const RAIL_MIN = 190, RAIL_MAX = 340;
function applyRailWidth(){
  const r = $('rail'); if(!r || !r.style) return;
  let v = 0;
  try{ v = parseInt(localStorage.getItem(RAIL_W_KEY) || '0', 10) || 0; }catch(e){}
  r.style.width = v ? Math.min(RAIL_MAX, Math.max(RAIL_MIN, v)) + 'px' : '';
}
function startRailResize(ev){
  ev.preventDefault();
  const r = $('rail');
  const startX = ev.clientX, startW = r.getBoundingClientRect().width;
  let live = startW;
  document.body.style.cursor = 'ew-resize';
  function move(e){
    live = Math.min(RAIL_MAX, Math.max(RAIL_MIN, Math.round(startW + (e.clientX - startX))));
    r.style.width = live + 'px';
  }
  function up(){
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', up);
    document.body.style.cursor = '';
    try{ localStorage.setItem(RAIL_W_KEY, String(live)); }catch(e){}
    drawForkArrows();
  }
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
}
function toggleNotes(){ $('notes').classList.toggle('open'); }
