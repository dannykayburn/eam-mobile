/* ═══════════════════════════════════════════════════════════════════════
   ARTIFACT TYPES — one registry, so every area behaves the same way
   ═══════════════════════════════════════════════════════════════════════
   `cardinality` is not a style choice: it follows WHAT THE RUNTIME RESOLVES
   ON. §11 resolves a workflow from (WO Type, user group), so a group may
   have one per Type. Everything else resolves on the group alone, so a group
   has exactly one. That is why the rule generalises instead of needing a
   special case per area.

   `create` follows SIZE: an artifact fully definable in one form gets a
   modal; one that needs a canvas gets a blank editor. Both end in the same
   gallery, so the artifact model is identical either way.
   ═══════════════════════════════════════════════════════════════════════ */
const ARTIFACT_TYPES = {
  workflow: {label:'Workflow',       plural:'Workflows',       icon:'route',
             cardinality:'per-wotype', create:'canvas', area:'workflows'},
  offline:  {label:'Offline profile', plural:'Offline Profiles', icon:'cloudoff',
             cardinality:'per-group',  create:'modal',  area:'offline'},
  home:     {label:'Home layout',    plural:'Home Layouts',    icon:'dashboard',
             cardinality:'per-group',  create:'canvas', area:'home'},
};
function artType(t){ return ARTIFACT_TYPES[t] || null; }

/* ── THE MEMBERSHIP TABLE ── */
let ASSIGN = [];
const LS_ASSIGN = 'eamPortalAssign';

/* Every read goes through these. Nothing else touches ASSIGN, which is what
   keeps the two views from drifting. */
function groupsOf(type, artifactId){
  return ASSIGN.filter(r => r.type === type && r.artifactId === artifactId).map(r => r.group);
}
function artifactsForGroup(group, type){
  return ASSIGN.filter(r => r.group === group && (!type || r.type === type));
}
function isAssigned(type, artifactId, group){
  return ASSIGN.some(r => r.type === type && r.artifactId === artifactId && r.group === group);
}
function setAssigned(type, artifactId, group, on){
  const i = ASSIGN.findIndex(r => r.type === type && r.artifactId === artifactId && r.group === group);
  if(on && i === -1) ASSIGN.push({type:type, artifactId:artifactId, group:group});
  if(!on && i > -1) ASSIGN.splice(i, 1);
  saveAssign();
}
/* Dropping an artifact takes its membership with it — a row pointing at a
   deleted artifact is a group silently provisioned with nothing. */
function dropAssignmentsFor(type, artifactId){
  for(let i = ASSIGN.length - 1; i >= 0; i--){
    if(ASSIGN[i].type === type && ASSIGN[i].artifactId === artifactId) ASSIGN.splice(i, 1);
  }
  saveAssign();
}
function saveAssign(){ try{ localStorage.setItem(LS_ASSIGN, JSON.stringify(ASSIGN)); }catch(e){} }


/* ═══════════════════════════════════════════════════════════════════════
   OFFLINE — §2.7's declared per-entity registry
   ═══════════════════════════════════════════════════════════════════════
   Built 2026-09-16 against the real product's User Group ▸ Mobile Settings
   tab (screenshots supplied), reshaped by the offline decisions we actually
   made. Four structural differences from that screen, all of them locked
   rules rather than preferences:

     1. IT IS A PROFILE, NOT PER-GROUP FIELDS (§2.10). A named bundle,
        assigned to groups. The current screen edits settings directly on the
        group, so 40 groups means 40 hand-maintained copies — and §29.6 had
        already ruled that editing shared config from one group's side
        re-provisions every other member.
     2. A CHECKBOX CANNOT EXPRESS §2.7. We locked FIVE policy classes, not a
        boolean. "Download Employees ✓" really means "Employees =
        offline-read, read-only, bounded by a dataspy".
     3. CAPS ARE MANDATORY (§2.7) — a device ceiling, a per-entity row cap
        and a traversal depth/breadth cap, enforced at authoring time. The
        current screen has none.
     4. "ALL RECORDS" IS REFUSED (§2.7). Most `For Dataspy` fields in that
        screen are empty, which is exactly the state we rejected.

   THE HONEST PART: this scope is not finished, and the registry says so per
   row. `status` is one of:
     'in'        — a policy we have decided (§2.7/§2.8 name it)
     'server'    — decided OUT: §2.7 puts it in server-only
     'phase2'    — §28, GIS / external-replica
     'open'      — NOT DECIDED. Offerable, but flagged, because pretending
                   otherwise is how an undecided entity becomes a commitment
                   nobody made.
   ═══════════════════════════════════════════════════════════════════════ */
/* ── THE FOUR §2.7 CLASSES, NAMED FOR WHAT THE APP CAN DO ──
   Reworded 2026-09-18, then MERGED FROM FIVE TO FOUR the same day (user
   direction, twice). Two separate changes worth keeping separate:

   THE WORDING. The old labels each answered a DIFFERENT question:
   "Server only" named a location, "Reference" named a kind of data, "On
   demand" named a timing, "Work set" named a scope, "External replica" named
   a mechanism. Five names on five axes are not comparable with one another,
   and "On demand" was worse than unclear — it is inverted against the
   industry's dominant usage, where OneDrive's Files On-Demand means the file
   is NOT on the device. Every label now answers one question — WHAT CAN THE
   APP DO WITH THIS OFFLINE — and the line under it answers the second one an
   author needs: WHO PUT IT THERE.

   THE MERGE. `reference` and `on-demand` were never two policies. A record
   the technician keeps lands in the same local schema a dataspy-matched row
   would, which is §2.6's punch-list mechanism generalised: ONE STORE, TWO
   POPULATION SOURCES, and a SOURCE RECORDED ON THE ROW so a dataspy
   re-evaluation cannot evict a manual pin. Provenance is a column, not a
   class. What made them look different was a reliability difference, and
   that survives as a sentence rather than as a policy.

   AND WHAT `reference` WAS REALLY CARRYING WAS TIER 0. Its own §2.7 examples
   were page layouts, UDS definitions and code domains — none of which are
   records, all of which are Tier 0 (§2.3) and already render above this
   editor as never-switchable. "Ships whole, unfiltered" is a Tier 0 property.
   What was left behind (Employees, Crews, Stores, Task Plans) are record
   tables with row counts, so they take a dataspy and a ceiling like every
   other record — and whether that dataspy is REQUIRED or merely available is
   arithmetic against the caps, never a description (see wholeDomainFits).

   THE THREE SURVIVING KEYS ARE UNCHANGED (server-only / work-set /
   external-replica); the merged one is `offline-read`, and POLICY_MIGRATE
   maps both retired keys onto it so no stored profile is lost. */
const OFFLINE_POLICIES = [
  {k:'server-only', label:'Online only', read:false, write:false,
   who:'Nobody — it is never replicated',
   def:'Nothing local. Opening it without a connection renders the screen and says why, rather than showing an empty one.',
   why:'The cost of holding it beats the value: history and cost are unbounded and grow forever, and a technician executing work does not read them.'},

  {k:'offline-read', label:'Offline read', read:true, write:false,
   who:'The admin by dataspy, the technician by keeping — one store either way',
   def:'A bounded population of records held on the device and readable without a connection. Its rows arrive from a dataspy, from the technician keeping individual records, or from both at once.',
   why:'Read-only is a property of the ENTITY, not of how a row arrived — which is why this is one class and not two. Its real job is often not reading at all but being the PICK LIST BEHIND AN OFFLINE WRITE: Book Labor choosing an employee, Issue Parts choosing a store. The reliability caveat that used to be its own policy still holds — rows the technician kept can be MISSING AT THE MOMENT OF NEED, so an entity populated only by keeping behaves as Online only for anything nobody thought to keep before signal dropped.'},

  {k:'work-set', label:'Offline read/write', read:true, write:true,
   who:'The work — pinned WOs and everything hanging off them',
   def:'The live job. Auto-replicated from the punch list and TRAVERSED to its children: checklist results, parts lines, labor lines.',
   why:'THE ONLY EAM-WRITABLE CLASS, which is the sharpest line in this table — everything a technician changes offline is in the work set, and everything else is readable at best. Writes go to the outbox and sync in order (§2.4).'},

  {k:'external-replica', label:'Offline read/write — external', read:true, write:true,
   who:'Another system, on its own schedule',
   def:'A foreign sync engine holding its own copy with its own lifecycle. GIS features today (§28), Phase 2.',
   why:'Writable, but through a DIFFERENT QUEUE — a geometry edit syncs through ESRI and never rides the EAM outbox. Different queue, different download unit (per map area), different schedule. It is a policy class rather than an exception so the next foreign engine has a slot to go in.'},
];
/* The two retired keys. Kept as a MIGRATION rather than deleted, because a
   stored profile in localStorage still holds them and normalizeProfile's
   illegal-policy guard would otherwise pull every one of those rows back to
   its default — silently un-shipping an entity the admin had switched on. */
const POLICY_MIGRATE = {reference:'offline-read', 'on-demand':'offline-read'};
function policyMeta(k){ return OFFLINE_POLICIES.find(p => p.k === k) || OFFLINE_POLICIES[0]; }
/* A dataspy is required on the two policies whose contents are a FILTERED
   population of records. Online only ships nothing, and external-replica
   brings its own download unit (per map area), so neither takes one. */
const POLICY_NEEDS_FILTER = ['offline-read','work-set'];
function policyNeedsFilter(k){ return POLICY_NEEDS_FILTER.indexOf(k) > -1; }

/* ── THE MEMBERSHIP EXCEPTION (§2.6, locked 2026-09-23) ──
   One entity's dataspy answers a second, different question. On Work Orders
   the dataspy is BOTH the replication bound AND the punch list — and the punch
   list is a MEMBERSHIP question, answered server-side, which is true of an
   online-only group too. So this row's dataspy is NOT a property of its
   policy, and it is the only row where that holds.

   Two things followed from getting this wrong, both of which rendered
   perfectly and said nothing: normalizeProfile() wiped the dataspy whenever
   the policy stopped needing a filter, so an online-only Work Orders row lost
   its punch list on the next reload; and the control collapsed to a dash, so
   there was nowhere to set one in the first place. A flag on the entity rather
   than an `id === 'wo'` test at each site, so a second membership entity (if
   one is ever found) cannot half-work. */
function isMembershipEntity(e){ return !!(e && e.membership); }

/* ── MEASURED, NOT DESCRIBED (2026-09-18, user direction) ──
   "Whether this entity can ship whole" is ARITHMETIC AGAINST THE CAPS, and
   nothing else. It is not a per-entity flag, it is not derived from whether
   somebody happened to author a dataspy, and it is not read off prose calling
   a domain "small and slow-changing". Two earlier attempts at this rule were
   both description-reliant and both are gone:

     · a hand-maintained `bounded` column — a description, and free to
       disagree with the data;
     · `entityBounded(e) = no dataspy is authored` — subtler, but it still
       rested on an authoring judgement rather than a measurement, and it
       inherited its justification from §2.8 row 1's prose.

   THE RULE: an entity may replicate its whole domain when the whole domain
   FITS — under the per-entity row cap AND within the volume budget. When it
   does not fit, a dataspy is REQUIRED, and the dataspy's own count has to fit
   too. §2.7's caps stop being a number an author looks at and become the thing
   the rule is computed from.

   WHY BOTH DIMENSIONS (§2.7 — "# of records and/or data size"). Neither alone
   is sufficient, and this registry demonstrates both: Parts exceeds the 50,000
   row cap outright, while Equipment FITS it at ~40,000 rows (§2.3's own figure
   for this customer) and blows the volume budget instead, because equipment
   rows carry nameplate data and custom fields. A records-only rule ships 625 MB
   onto a device with a 500 MB ceiling and calls it compliant.

   WHERE THE COUNTS COME FROM. The server, which is the only thing that knows.
   They are a measurement refreshed on demand, not a live subscription — the
   same shape as §30.16's tile counts, deliberately, so this is an established
   pattern rather than a new one. The numbers below are demo values standing in
   for that round-trip; the MECHANISM is what is being prototyped. */

/* Rows a dataspy resolves to. Demo values for the server-supplied count. */
const DATASPY_ROWS = {
  'My Open WOs':120, 'All Open WOs':8400, 'Breakdowns Only':2100,
  'This Week':3200, 'DC-OPS Open':1450,
  'My Route Assets':180, 'Critical Assets':2400, 'DC Rack Units':6800,
  'Stocked Parts':12000, 'Van Stock':340,
  'My Crew':12, 'All Technicians':260,
  'Main Store':1, 'Van Stores':18,
  'Active Bins':640,
  'Open Inspections':95, 'Active Permits':40,
};
function dataspyRows(name){ return DATASPY_ROWS[name] != null ? DATASPY_ROWS[name] : null; }

/* The rows this entity would actually replicate under its current policy and
   filter. A traversed entity has no count of its own — its rows arrive with
   the parent and are budgeted against the work set, not against this entity. */
function entityRows(e, row){
  if(e.traversed) return null;
  if(row && row.dataspy){
    const r = dataspyRows(row.dataspy);
    if(r != null) return r;
  }
  return e.rows != null ? e.rows : null;
}
/* Volume in MB. `kb` is the average row size — the second cap dimension, and
   the one that catches an entity whose row count looks harmless. */
function entityMb(e, row){
  const r = entityRows(e, row);
  if(r == null || e.kb == null) return null;
  return (r * e.kb) / 1024;
}
/* WHICH CAP a count violates, or '' when it fits. Returned as a reason rather
   than a boolean so the row can say WHY, which is the whole point of making
   the rule measured — "does not fit" is another description. */
function capBreach(e, row, p){
  const r = entityRows(e, row), mb = entityMb(e, row);
  if(r == null) return '';
  if(r > p.caps.rowCap) return 'rows';
  if(mb != null && mb > p.caps.volumeMb) return 'volume';
  return '';
}
/* Would the UNFILTERED domain fit? This is the question that decides whether a
   dataspy is required or merely available. */
function wholeDomainFits(e, p){
  return !capBreach(e, {policy:'offline-read', dataspy:''}, p);
}

/* ONE predicate for "this row must name a dataspy", called by the control that
   renders it AND by the validator that reports it. They used to be two
   expressions in two functions that agreed by luck. */
function rowNeedsDataspy(e, row, p){
  if(!policyNeedsFilter(row.policy) || e.traversed) return false;
  return !wholeDomainFits(e, p);
}

   pill it fed. An undecided entity is no longer in the grid at all (see
   undecidedHtml), and for everything that remains the pill restated what the
   policy control already showed — a locked "Online only" chip whose title is
   the §2.7 note. Don't reintroduce it: a decided row saying "Decided" is
   chrome, and it competed with the one chip on that row worth reading. */

/* Dataspies are the ONE artifact authored outside this portal — on the
   record list screen, which is where EAM dataspies have always been made.
   The portal SELECTS one; it never edits one. Same boundary as UDS
   definitions (§27.4 role 1). */
const DATASPIES = {
  wo:         ['My Open WOs','All Open WOs','Breakdowns Only','This Week','DC-OPS Open'],
  equipment:  ['My Route Assets','Critical Assets','DC Rack Units'],
  parts:      ['Stocked Parts','Van Stock'],
  employees:  ['My Crew','All Technicians'],
  stores:     ['Main Store','Van Stores'],
  bins:       ['Active Bins'],
  inspection: ['Open Inspections'],
  permit:     ['Active Permits'],
};
function dataspiesFor(entityId){ return DATASPIES[entityId] || []; }

/* Profile-level caps. Defaults are the market figures §2.7 cites, so the
   numbers are traceable rather than invented. */
/* volumeMb is the design doc's SLO-8 (≤ 500 MB local store, hard enforced
   ceiling) expressed as a §2.7 cap. It was always a requirement; it was never
   a number any authoring surface computed against, which is how a registry
   passes a records-only check and still overflows the device. */
const OFFLINE_CAP_DEFAULTS = {deviceCeiling:200000, rowCap:50000, volumeMb:500, depth:15, toMany:1};

function mkOfflineProfile(name, desc){
  const p = {
    id:'op-' + Math.random().toString(36).slice(2,8),
    name:name || '', desc:desc || '', updated:todayStr(),
    caps:Object.assign({}, OFFLINE_CAP_DEFAULTS),
    entities:{},
  };
  OFFLINE_ENTITIES.forEach(e => {
    p.entities[e.id] = {policy:e.dflt, dataspy:'', rowCap:''};
  });
  return p;
}
function normalizeProfile(p){
  if(!p) return p;
  if(!p.caps) p.caps = Object.assign({}, OFFLINE_CAP_DEFAULTS);
  if(!p.entities) p.entities = {};
  OFFLINE_ENTITIES.forEach(e => {
    if(!p.entities[e.id]) p.entities[e.id] = {policy:e.dflt, dataspy:'', rowCap:''};
    const row = p.entities[e.id];
    /* Migrate the two keys the five-to-four merge retired, BEFORE the guard
       below — otherwise a stored `reference` reads as illegal and resets to
       the default, which for most entities means server-only. That failure
       renders perfectly: the screen just quietly stops shipping things. */
    if(POLICY_MIGRATE[row.policy]) row.policy = POLICY_MIGRATE[row.policy];
    /* A policy the entity does not allow is not a preference to preserve —
       §2.7's non-offline list is enforced AT AUTHORING TIME, so a stored
       illegal policy gets pulled back to the default rather than shipped. */
    if(e.allow.indexOf(row.policy) === -1) row.policy = e.dflt;
    /* A membership dataspy survives a policy that replicates nothing — see
       isMembershipEntity(). Every other row's dataspy is meaningless without
       a filtered policy, so it is still cleared rather than left to resurface
       if the policy is switched back. */
    if(!policyNeedsFilter(row.policy) && !isMembershipEntity(e)) row.dataspy = '';
  });
  return p;
}

/* ── VALIDATION — §2.7's authoring-time enforcement, not device discovery ──
   The two that matter most: "at least one filter per entity; all records is
   refused", and a traversed entity taking its rows from the parent rather
   than a filter of its own. Reported, never auto-fixed. */
function profileIssues(p){
  if(!p) return [];
  const out = [];
  OFFLINE_ENTITIES.forEach(e => {
    const row = p.entities[e.id]; if(!row) return;
    if(rowNeedsDataspy(e, row, p) && !row.dataspy){
      const why = capBreach(e, {policy:row.policy, dataspy:''}, p);
      out.push({sev:'error', entity:e,
        msg:'needs a dataspy — the whole domain does not fit: ' + (why === 'volume'
          ? Math.round(entityMb(e, {policy:row.policy, dataspy:''})).toLocaleString() +
            ' MB against a ' + p.caps.volumeMb + ' MB budget (§2.7).'
          : (entityRows(e, {policy:row.policy, dataspy:''}) || 0).toLocaleString() +
            ' rows against a ' + p.caps.rowCap.toLocaleString() + ' row cap (§2.7).')});
    }
    /* A dataspy that is itself over cap is the failure the first check invites
       somebody to fix by picking the nearest filter. Measured the same way. */
    if(policyNeedsFilter(row.policy) && row.dataspy){
      const why2 = capBreach(e, row, p);
      if(why2){
        out.push({sev:'error', entity:e,
          msg:'its dataspy is still over cap — ' + (why2 === 'volume'
            ? Math.round(entityMb(e, row)).toLocaleString() + ' MB against ' + p.caps.volumeMb + ' MB'
            : (entityRows(e, row) || 0).toLocaleString() + ' rows against ' + p.caps.rowCap.toLocaleString()) +
            ' (§2.7).'});
      }
    }
    if(e.status === 'open' && row.policy !== 'server-only'){
      out.push({sev:'warn', entity:e,
        msg:'is offline-enabled but its policy was never decided. Shipping it makes a commitment nobody made (§20).'});
    }
    if(e.status === 'phase2' && row.policy !== 'server-only'){
      out.push({sev:'error', entity:e,
        msg:'is Phase 2 (§28) — GIS is a second sync engine and cannot ride this profile.'});
    }
  });
  return out;
}
function profileEnabledCount(p){
  if(!p) return 0;
  return OFFLINE_ENTITIES.filter(e => p.entities[e.id] && p.entities[e.id].policy !== 'server-only').length;
}

/* ═══════════════════════════════════════════════════════════════════════
   HOME — tiles are reusable artifacts, layouts are what gets assigned
   ═══════════════════════════════════════════════════════════════════════
   Decided 2026-09-16: a TILE is a global artifact created once and pulled
   into any layout BY REFERENCE, not copied. So editing a tile changes every
   layout using it — powerful, and it needs the same impact reporting a
   workflow collision gets, which is why tileUsage() exists.

   TWO LEVELS, and only one of them is assignable. A tile is a component; a
   LAYOUT is the artifact a user group gets. That is the difference from
   workflows, whose steps come from a fixed delivered catalogue rather than
   being user-created.

   ⚠ CONTENT IS STILL UNLOCKED. CLAUDE.md is explicit that Home's own content
   — which dataspies, which tiles, which counts — is an open design riff. So
   this builds the AUTHORING MECHANICS and deliberately does not lock any
   particular tile set. The demo tiles are a demo.
   ═══════════════════════════════════════════════════════════════════════ */
/* ── ONE TILE RECORD, NOT FOUR KINDS (reworked 2026-09-16) ──
   Read off EAM.DUX.REQ.DigitalWorkHome: a tile is a "Digital Work Home
   record" carrying Screen + dataspy/filter + an INSERT MODE CHECKBOX + a
   SQL statement for the count. So:

     · A "Create" is NOT a different kind of tile. It is the same record
       with insertMode set, which the device draws with a + badge. Keeping
       it as a flag is what lets a customer's existing Digital Work Home
       records migrate with no transform.
     · THE COUNT IS NOT DERIVED FROM THE DATASPY. The requirement is
       explicit: the dataspy is where the tile GOES, the SQL statement is
       what the badge SAYS. They are two fields. The old model conflated
       them, which made "a shortcut that shows a count" unauthorable.
     · KPI is gone. It had no renderer on the device at all — its own
       note admitted it was a count with "different emphasis". Authoring a
       component the runtime cannot draw is the failure mode this surface
       exists to prevent.

   The two count rules are the requirement's, not ours: >= 1000 renders as
   999+, and a statement returning 0 renders NO BADGE AT ALL. A zero badge
   reads as "nothing to do"; no badge reads as "no counter here", and the
   product deliberately picked the second. */
const TILE_CAP = {countHigh:1000};
/* The glyphs a tile can carry. Curated, like NAV_ICONS — the whole icon set
   is how a Home screen ends up with a shopping trolley on it. */
const TILE_ICONS = ['list','route','wrench','box','clipboard','grid','bell','message','clock','alert','flag','checkc','file','sliders'];

/* Derived label — kind is a READING of the record, never stored, so the
   two can never disagree. */
function tileKindLabel(t){
  if(!t) return '—';
  if(t.insertMode) return 'Create action';
  return t.countSql ? 'Screen + count' : 'Screen link';
}
/* The badge the device would draw. Returns '' for "no badge". */
function tileCountBadge(t, raw){
  if(!t || t.insertMode || !t.countSql) return '';
  const v = typeof raw === 'number' ? raw : (t.demoCount === undefined ? 12 : t.demoCount);
  if(!v) return '';                                   /* 0 → no badge */
  return v >= TILE_CAP.countHigh ? '999+' : String(v);
}

/* Tile targets — what a tile can point at. Deliberately the screens that
   exist, so a tile cannot be authored against a destination the app has no
   route to. */
const TILE_TARGETS = [
  /* `entity` is what DRIVES THE DATASPY LIST (§30.25). A dataspy belongs to a
     record list, so offering all of them pooled let a Work Order tile be
     filtered by "Van Stock". Notifications and Sync carry none at all, which
     is a real answer and not an empty dropdown. */
  {id:'wolist',    label:'Work Order list',   screen:'wolist',    entity:'wo'},
  {id:'equiplist', label:'Equipment list',    screen:'equiplist', entity:'equipment'},
  {id:'notif',     label:'Notifications',     screen:'notif'},
  {id:'sync',      label:'Sync status',       screen:'sync'},
  /* A create target is an INSERT MODE OF a screen, not a screen of its
     own — so it resolves to the same menu entry as the list it inserts
     into. Getting this wrong makes every create tile report as hidden. */
  {id:'createwo',  label:'Create Work Order', screen:'wolist',    entity:'wo'},
  {id:'createeq',  label:'Create Equipment',  screen:'equiplist', entity:'equipment'},
];
/* The menu entry a target needs. Falls back to the target id so a target
   added without a screen is caught by the gate rather than exempted. */
function targetScreen(id){
  const t = tileTarget(id);
  return (t && t.screen) || id;
}
function tileTarget(id){ return TILE_TARGETS.find(t => t.id === id) || null; }

/* ═════ THE COLOUR BADGES — ONE SET, USED EVERYWHERE (§30.25) ═════
   Six values, and they are **Octave's own status hues** rather than a
   hand-picked palette: neutral plus blue / green / orange / red / purple, at
   the 700 step so a glyph on a 13% tint of itself stays legible. Yellow is
   deliberately left out — status-yellow-500 is #ffdd00 and fails as a glyph
   colour on a light tint, which is the one job this set has.

   WHY ONE SET RATHER THAN A PALETTE PER FEATURE. It previously offered the
   four §23.3 WO Type tokens, on the argument that "an exception is not a
   licence to invent hues" — which was right about not inventing, and wrong
   about the source: a Home tile is not a WO Type, so borrowing that badge's
   four hues made the tile read as a Type it has nothing to do with. Octave's
   status ramp is the portal's own palette, so taking the set from there
   invents nothing AND says nothing false.

   The value is a TOKEN, not a hex, so it resolves identically in portal
   chrome and inside the .emu device frame. That is legitimate rather than a
   §30.8 seam violation: the colour here is the artifact's DATA, not this
   screen's styling, and the device renders the value the admin picked. */
const BADGE_COLORS = [
  {k:'none',   label:'Neutral', v:''},
  {k:'blue',   label:'Blue',    v:'var(--uxt-theme-palette-status-blue-700)'},
  {k:'green',  label:'Green',   v:'var(--uxt-theme-palette-status-green-700)'},
  {k:'orange', label:'Orange',  v:'var(--uxt-theme-palette-status-orange-700)'},
  {k:'red',    label:'Red',     v:'var(--uxt-theme-palette-status-red-700)'},
  {k:'purple', label:'Purple',  v:'var(--uxt-theme-palette-status-purple-700)'},
];
function badgeColor(k){
  const c = BADGE_COLORS.filter(x => x.k === k)[0];
  return (c && c.v) || '';
}
/* Stored colours from before 2026-09-23 were WO Type keys. Mapped by hue so
   a seeded or stored tile keeps the colour it had rather than falling back to
   neutral — same load-bearing job as POLICY_MIGRATE (§30.14). */
const COLOR_MIGRATE = {breakdown:'orange', ppm:'blue', routine:'purple', corrective:'orange'};

/* THE DEVICE'S OWN RULE, in one place: background is the colour at 13%, the
   glyph is the colour at full strength (eam-home-screen-prototype-v1.html
   draws background:<color>22 with the glyph in <color>). Every face that
   shows a tile calls one of these two, so the catalogue chip, the library
   row and the editor square cannot drift apart. */
function tileSquareStyle(t){
  const c = badgeColor(t && t.color);
  return c ? 'background:color-mix(in srgb, ' + c + ' 13%, transparent);color:' + c : '';
}
function tileGlyphStyle(t){
  const c = badgeColor(t && t.color);
  return c ? 'color:' + c : '';
}

function mkTile(o){
  o = o || {};
  return {
    id:'tl-' + Math.random().toString(36).slice(2,8),
    label:o.label || '', icon:o.icon || 'list',
    target:o.target || 'wolist',
    dataspy:o.dataspy || '',        /* where it GOES (optional) */
    countSql:o.countSql || '',      /* what the badge SAYS (optional, separate) */
    insertMode:!!o.insertMode,      /* the product's checkbox — this is a Create */
    demoCount:o.demoCount,          /* prototype only: lets 0 and 999+ be shown */
    color:o.color || 'none',
    updated:todayStr(),
  };
}
/* Migration off the old four-kind model. Runs on read so stored layouts
   from before 2026-09-16 keep working rather than rendering as blanks. */
function normalizeTile(t){
  if(!t) return t;
  if(t.kind !== undefined){
    if(t.insertMode === undefined) t.insertMode = (t.kind === 'create');
    if(!t.countSql && (t.kind === 'count' || t.kind === 'kpi')){
      t.countSql = 'SELECT COUNT(*) — ' + (t.dataspy || 'unfiltered');
    }
    delete t.kind;
  }
  if(t.insertMode === undefined) t.insertMode = false;
  if(t.countSql === undefined) t.countSql = '';
  /* §30.25: WO Type colour keys migrate to the badge set by hue. */
  if(COLOR_MIGRATE[t.color]) t.color = COLOR_MIGRATE[t.color];
  if(!BADGE_COLORS.some(c => c.k === t.color)) t.color = 'none';
  /* A Create opens a screen in insert mode; it can carry no counter. */
  if(t.insertMode) t.countSql = '';
  return t;
}
function tileById(id){ return TILES.find(t => t.id === id) || null; }
/* WHICH LAYOUTS USE THIS TILE. A tile is a reference, so an edit reaches
   every one of them — this is what makes that blast radius visible before
   the edit rather than after. */
function tileUsage(tileId){
  return HOMES.filter(h => homeTileIds(h).indexOf(tileId) > -1);
}
/* Every tile id on a layout, across every section AND the create tray —
   one accessor, so usage/pruning/counting can never drift from placement.
   Same discipline as ASSIGN's accessors (§30.13). */
function homeTileIds(h){
  if(!h) return [];
  const secs = Array.isArray(h.sections) ? h.sections : [];
  const out = secs.reduce((a, sec) => a.concat(Array.isArray(sec.tiles) ? sec.tiles : []), []);
  return out.concat(Array.isArray(h.creates) ? h.creates : []);
}

/* ── SECTIONS BELONG TO THE LAYOUT (locked 2026-09-16, user direction) ──
   "It's just home screen code, available sections with titles, and then
   subsequent tile locations and sequence." Three levels, all inside the
   Home domain and touching nothing else:

     layout  (home screen code)
       └ section  (title + sequence)
           └ tile placement  (tile id + sequence)

   THE SECTION IS NOT A PROPERTY OF THE TILE, and that is the load-bearing
   part. A section enum on the tile record would pin one tile to one
   section everywhere it appears — which contradicts §30.13's by-reference
   decision, where the same tile is meant to be reusable across layouts.
   Placement is a property of the LAYOUT, so "My Open Work" can sit under
   "Today" in one layout and "Work" in another. */
function mkSection(title){
  return {id:'sc-' + Math.random().toString(36).slice(2,8), title:title || '', tiles:[]};
}
function mkHome(name, desc){
  return {
    id:'hl-' + Math.random().toString(36).slice(2,8),
    name:name || '', desc:desc || '', updated:todayStr(),
    /* Ordered sections, each an ordered list of TILE IDS — references,
       never embedded copies. */
    sections:[mkSection('My Work')],
    /* The pinned Create control's contents. NOT a section: on the device
       the create bar sits outside the scroll container (§9.4/§9.4.1). */
    creates:[],
    /* Favorites is TECHNICIAN-OWNED (see normalizeHome). Toggle only. */
    showFavorites:true,
    /* The app's navigation bar (§30.24) — §4.2's three by default. */
    nav:defaultNav(),
  };
}
function normalizeHome(h){
  if(!h) return h;

  /* Migration: the pre-sections model was a flat h.tiles array. Fold it
     into one section rather than dropping it, and split the Creates out
     to where they now belong. */
  if(Array.isArray(h.tiles)){
    const flat = h.tiles.filter(id => !!tileById(id));
    const isCreate = id => { const t = tileById(id); return !!(t && normalizeTile(t).insertMode); };
    if(!Array.isArray(h.sections)){
      const screens = flat.filter(id => !isCreate(id));
      h.sections = screens.length ? [{id:'sc-mig01', title:'My Work', tiles:screens}] : [mkSection('My Work')];
    }
    if(!Array.isArray(h.creates)) h.creates = flat.filter(isCreate);
    delete h.tiles;
  }
  if(!Array.isArray(h.sections)) h.sections = [];
  if(!Array.isArray(h.creates)) h.creates = [];
  if(h.showFavorites === undefined) h.showFavorites = true;
  /* The app's navigation bar (§30.24) — defaulted, deduped and clamped on
     read, so a stored layout from before 2026-09-23 gets §4.2's three. */
  normalizeNav(h);

  /* A reference to a deleted tile is a hole in a layout nobody can see the
     cause of, so prune on read — now per section and on the tray. */
  h.sections.forEach(sec => {
    if(!Array.isArray(sec.tiles)) sec.tiles = [];
    sec.tiles = sec.tiles.filter(id => {
      const t = tileById(id);
      return !!t && !normalizeTile(t).insertMode;   /* a Create cannot live in a section */
    });
  });
  h.creates = h.creates.filter(id => {
    const t = tileById(id);
    return !!t && normalizeTile(t).insertMode;      /* and a screen link cannot live in the tray */
  });
  return h;
}

/* ── HOW MANY TILES ARE VISIBLE WITHOUT SCROLLING ──
   The device section is a horizontally-scrolling row (.home-tilegrid:
   display:flex; overflow-x:auto), chosen there precisely because there is
   no cap on tiles and a scroll row absorbs growth without the page
   getting taller. The EDITOR cannot reproduce that, for a functional
   reason rather than an ergonomic one: HTML5 drag-and-drop DOES NOT
   AUTO-SCROLL A CONTAINER, so any tile past the fold would be
   undroppable. So the editor WRAPS.

   Wrapping destroys exactly one fact — where the fold is — so the editor
   draws it. The arithmetic, from eam-home-screen-prototype-v1.html:
     390px device − 14px padding × 2      = 362px usable
     100px tile + 10px gap                = 110px per tile after the first
     100 → 210 → 320 → (430 > 362)        = 3 fit, the 4th shows 42px
   That 4th peeking tile is the device's only signal that a row scrolls,
   which is why a section of 4+ is fine and a section of exactly 4 is the
   one worth looking at twice. */
const HOME_FOLD = 3;
/* ── THE MENU CAPABILITY GATE ──
   The single highest-value rule in EAM.DUX.REQ.DigitalWorkHome, and the
   reason this area belongs in THIS portal rather than anywhere else:

     "The system will check to see if the screen exists in the menu. If the
      screen does not exist in the menu, that Digital Work Home record
      will NOT BE DISPLAYED."

   So a tile pointing at a screen the group's menu does not carry is
   silently dropped — no error, no placeholder, no trace. An admin
   configures a tile, assigns the layout, and for that group it simply is
   not there. That is the same failure shape as §27.4's Required-UDS-step-
   without-permission, and it is computable ONLY where the layout and its
   assignments are both known, which is here.

   Reported, never auto-fixed (§26.5.1). Removing the tile would be wrong
   for the other groups that CAN see the screen. */
const GROUP_MENUS = {
  '*':           ['wolist','equiplist','notif','sync'],
  'DK':          ['wolist','equiplist','notif','sync'],
  'MAINT-TECH':  ['wolist','equiplist','notif','sync'],
  'SUPERVISOR':  ['wolist','equiplist','notif','sync'],
  /* Deliberately capability-limited, so the gap path is LIVE ON LOAD
     rather than only reachable by hand-editing demo data — same technique
     as ZJ1000 in the workflow area. */
  'TRANSPORT':   ['wolist','notif','sync'],              /* no Equipment screen */
  'CONTRACTOR':  ['wolist'],                             /* no Notifications, no Sync */
  'SALES-ENG':   ['wolist','equiplist','notif','sync'],
  'DC-OPS':      ['wolist','equiplist','notif','sync'],
  'STORES':      ['equiplist','notif','sync'],           /* no WO list */
};
function groupMenu(g){ return GROUP_MENUS[g] || GROUP_MENUS['*']; }
/* Which of this layout's tiles this group would never see. */
function homeTileGaps(h, group){
  const menu = groupMenu(group);
  return homeTileIds(h).map(tileById).filter(Boolean)
    .filter(t => menu.indexOf(targetScreen(t.target)) === -1);
}

/* ═════ THE APP'S NAVIGATION BAR — A PROPERTY OF THE LAYOUT ═════
   §30.24, added 2026-09-23 (user direction). The mobile app's bottom
   navigation bar (§4.2) is configured HERE, on the Home layout, and each
   item carries exactly three authorable things: its LABEL, the SCREEN it
   opens, and its ICON. Colour is not one of them — the bar is white-on-dark
   glass chrome and §23 keeps it monochrome (Home's colour exception is for
   TILES, and the bar is not a tile).

   WHY IT BELONGS ON THE LAYOUT rather than being a fifth artifact type:
   §30.13 says cardinality follows what the runtime resolves on, and the bar
   resolves on the user group alone — exactly like a Home layout. Putting it
   on the layout therefore gets assignment, cardinality and the "one per
   group" rule for free, with no new membership type and no second thing to
   assign. It is also the literal bottom edge of the same picture: this
   editor already draws everything the technician sees on Home except this.

   THE ONE HONEST CAVEAT, printed in the editor: the bar is NOT part of Home.
   It persists across every browsing screen and hides the moment a record
   opens (§4.2). A group with no layout assigned falls back to the standard
   menu (§30.16) and, with it, to §4.2's default three items. */
const NAV_MAX = 5;                 /* user direction: "max of 5 icons" */
const NAV_FLOOR_PX = 320;          /* §31's narrowest supported width */
const NAV_GAP_PX  = 14;            /* .bottom-nav's own gap */
const NAV_SLOT_PX = 84;            /* .bottom-nav-item's locked slot width */
const NAV_CHAR_PX = 5.8;           /* avg advance at 10.5px/600 Inter */

/* WHAT A NAV ITEM CAN OPEN. Screens only — there is no create target here,
   and that is structural rather than a guarded rule: a nav item is a
   destination you return to, while a create is an action, and §9.4.1 put
   creates behind the Create control. So the refusal is that the option does
   not exist, which is the cheapest guard there is. `shell` marks a
   destination that is the app's own chrome rather than a menu screen, so the
   capability gate below cannot report it as missing. */
const NAV_TARGETS = [
  {id:'home',      label:'Home',            screen:'home', shell:true},
  {id:'wolist',    label:'Work Order list', screen:'wolist'},
  {id:'equiplist', label:'Equipment list',  screen:'equiplist'},
  {id:'notif',     label:'Notifications',   screen:'notif'},
  {id:'sync',      label:'Sync status',     screen:'sync'},
];
function navTarget(id){ return NAV_TARGETS.find(t => t.id === id) || null; }
/* The glyphs offered. A curated list, not the whole icon set: an authorable
   icon is still app chrome, and 40 choices is how a nav bar ends up with a
   shopping-trolley on it. */
const NAV_ICONS = ['home','list','route','wrench','box','clipboard','grid','bell','message','sync','sliders','clock','alert','flag'];

/* ── THE SLOT ARITHMETIC, AND WHY 5 COSTS SOMETHING ──
   .bottom-nav is `justify-content:center; gap:14px` over fixed 84px items,
   so n items measure 98n − 14:
       3 → 280   fits the 320px floor
       4 → 378   overflows the floor (fits a 390px device, just)
       5 → 476   overflows every phone, 390 and 430 alike
   So past three the locked 84px slot HAS TO YIELD, and what it yields to is
   an equal share of the floor: (320 − 14(n−1))/n — 69.5px at four, 52.8px at
   five. 52.8 still clears §31.5's 48px hit target, so five is feasible; what
   pays for it is the LABEL, and that is the part an admin cannot see without
   being told. Same shape as HOME_FOLD: arithmetic, drawn in the editor. */
function navSlotPx(n){
  n = Math.max(1, n || 1);
  return Math.min(NAV_SLOT_PX, (NAV_FLOOR_PX - NAV_GAP_PX * (n - 1)) / n);
}
function navLabelBudget(n){ return Math.max(1, Math.floor(navSlotPx(n) / NAV_CHAR_PX)); }

function mkNavItem(o){
  o = o || {};
  return {target:o.target || 'wolist', label:o.label || '', icon:o.icon || 'list'};
}
/* §4.2's locked three, now as the DEFAULT rather than the rule — including
   its "Work Orders" → "Work" shortening, which was the first thing the label
   budget above ever bought. */
function defaultNav(){
  return [
    mkNavItem({target:'home',   label:'Home',          icon:'home'}),
    mkNavItem({target:'wolist', label:'Work',          icon:'list'}),
    mkNavItem({target:'notif',  label:'Notifications', icon:'bell'}),
  ];
}
/* Three rules, all enforced on read as well as at the mutation, so stored
   data cannot carry a violation either (the §30.16 discipline):
     · HOME IS SLOT 1 and cannot be removed or moved. It is the only route
       back to Home while browsing, so a bar without it is a dead end — the
       same pinning as Record View instance 1 being step 1 (§29.2).
     · ONE ITEM PER SCREEN. A nav item carries no dataspy, so two items on
       one screen would be two identical destinations.
     · NEVER MORE THAN NAV_MAX. */
function normalizeNav(h){
  if(!h) return h;
  if(!Array.isArray(h.nav) || !h.nav.length){ h.nav = defaultNav(); return h; }
  const seen = {};
  h.nav = h.nav.filter(it => {
    if(!it || !navTarget(it.target)) return false;
    if(seen[it.target]) return false;
    seen[it.target] = 1;
    return true;
  }).map(it => mkNavItem(it));
  /* Re-seat Home at the front, or put it back if a stored bar lost it. */
  const hi = h.nav.findIndex(it => it.target === 'home');
  if(hi === -1) h.nav.unshift(mkNavItem({target:'home', label:'Home', icon:'home'}));
  else if(hi > 0) h.nav.unshift(h.nav.splice(hi, 1)[0]);
  if(h.nav.length > NAV_MAX) h.nav = h.nav.slice(0, NAV_MAX);
  return h;
}
/* THE SAME CAPABILITY GATE AS A TILE (§30.17), and it bites harder here: a
   tile that gets dropped leaves a gap in a scrolling row, while a nav item
   that gets dropped leaves a hole in three-to-five slots of permanent
   chrome. Keyed on the target's SCREEN, never the raw id — and the shell
   target is exempt because the app's own Home is not a menu entry. */
function navGaps(h, group){
  const menu = groupMenu(group);
  return (h && h.nav || []).filter(it => {
    const t = navTarget(it.target);
    return !!t && !t.shell && menu.indexOf(t.screen) === -1;
  });
}

/* Every (layout, group, tile) the product would silently drop. Flat, so
   the area banner can count them without re-walking the model. */
function allHomeGaps(){
  const out = [];
  HOMES.forEach(h => {
    normalizeHome(h);
    groupsOf('home', h.id).forEach(g => {
      homeTileGaps(h, g).forEach(t => out.push({home:h.id, homeName:h.name, group:g, tile:t.label, target:t.target}));
    });
  });
  return out;
}

/* ── WHAT IS WORTH REPORTING ON A LAYOUT ──
   Note what is NOT here any more: "no tiles → a blank Home screen" was
   wrong. The requirement is explicit that a group with no Digital Work
   Home records gets THE STANDARD MENU, not a blank screen — the same
   shape as §11's flat-rail fallback for a WO Type with no workflow. So an
   empty layout is INFORMATIONAL, and the copy says where the user
   actually lands. Reporting a fallback as a fault is how an admin learns
   to ignore the banner. */
function homeIssues(h){
  const out = [];
  if(!h) return out;
  normalizeHome(h);

  if(!homeTileIds(h).length){
    out.push({sev:'info', msg:'has no tiles — a group assigned this falls back to the standard menu, not a blank screen.'});
  }
  h.sections.forEach((sec, i) => {
    if(!(sec.title || '').trim()){
      out.push({sev:'error', msg:'section ' + (i+1) + ' has no title — it would render as a row of tiles with nothing naming it.'});
    }
    if(!sec.tiles.length){
      out.push({sev:'warn', msg:'"' + (sec.title || 'section ' + (i+1)) + '" is empty — a title with no tiles under it.'});
    }
  });
  /* ── THE NAVIGATION BAR (§30.24) ──
     An unlabelled slot is an error rather than a warning: the bar is
     icon-and-label, and a slot carrying only an icon is unreadable at 23px.
     An over-budget label is a WARNING, because the device does not truncate
     — .bottom-nav-item has no nowrap rule, so it wraps to a second line,
     which is ugly rather than broken. */
  const navBudget = navLabelBudget(h.nav.length);
  h.nav.forEach((it, i) => {
    const nt = navTarget(it.target);
    if(!(it.label || '').trim()){
      out.push({sev:'error', msg:'navigation slot ' + (i+1) + ' (' +
        ((nt||{}).label || it.target) + ') has no label — the bar would show an icon with nothing naming it.'});
    } else if(it.label.trim().length > navBudget){
      out.push({sev:'warn', msg:'navigation label "' + it.label + '" is ' + it.label.trim().length +
        ' characters against a ' + navBudget + '-character slot at ' + h.nav.length +
        ' items — it wraps to a second line at 320px.'});
    }
  });
  if(h.nav.length < 2){
    out.push({sev:'warn', msg:'the navigation bar carries only Home — permanent chrome that navigates nowhere the technician is not already.'});
  }

  /* The gate, per assigned group. Only computable once assignment exists,
     which is exactly why it lives in this portal. */
  groupsOf('home', h.id).forEach(g => {
    /* Same gate one level up, and it bites harder: a dropped tile leaves a
       gap in a scrolling row, a dropped nav item leaves a hole in permanent
       chrome. */
    navGaps(h, g).forEach(it => out.push({sev:'error',
      msg:'navigation item "' + it.label + '" opens ' + ((navTarget(it.target)||{}).label || it.target) +
        ', which is not in ' + g + "'s menu — that slot is dead for that group."}));
    homeTileGaps(h, g).forEach(t => out.push({sev:'error',
      msg:'"' + t.label + '" needs the ' + ((tileTarget(targetScreen(t.target))||{label:targetScreen(t.target)}).label) +
        ' screen, which is not in ' + g + "'s menu — the product SILENTLY HIDES that tile for that group."}));
  });
  return out;
}

const LS_KEY = 'eamWorkflowDefs';
let WFS = [];
let PROFILES = [];   // offline profiles  (assignable)
let TILES = [];      // home tiles        (components, NOT assignable)
let HOMES = [];      // home layouts      (assignable)
const LS_PROFILES = 'eamOfflineProfiles';
const LS_TILES = 'eamHomeTiles';
const LS_HOMES = 'eamHomeLayouts';
let state = {
  area:'workflows',   // 'workflows' | 'groups' (groups is a declared stub)
  view:'gallery',     // 'gallery' | 'edit'
  wfId:null,
  openProfile:null,   // offline profile being edited
  openHome:null,      // home layout being edited
  selGroup:null,      // the group shown in the User Groups area
  filter:'all',       // 'all' | 'flow' | 'free'
  q:'',
  selNid:null,        // the node whose designer panel is open
  dsnOpen:false,
};
/* Drag state. `from` distinguishes a library drag (creates) from a canvas
   drag (moves) — the same drop handler serves both, which is why the two
   cases have to be told apart at the source rather than at the target. */

/* ── MIGRATION / NORMALISATION ──
   Called on every load and every create. Persisted workflows predate the
   function picker, the §12 completion trio and §29.4's language maps, so
   they are filled in here rather than guarded at every read site. Doing it
   in one place is what makes the rest of the file able to assume the shape. */
function normalizeWf(w){
  if(!w) return w;
  if(!w.fn) w.fn = 'WSJOBS';
  if(!fnByCode(w.fn)){ const alias = fnByAnyCode(w.fn); w.fn = alias ? alias.code : 'WSJOBS'; }
  if(!w.completionEntity) w.completionEntity = 'wo';
  const d = COMPLETION_DEFAULTS[w.completionEntity] || COMPLETION_DEFAULTS.wo;
  if(!w.startWorkStatus) w.startWorkStatus = d.start;
  if(!w.completionStatus) w.completionStatus = d.complete;
  (w.nodes || []).forEach(nd => {
    if(nd.kind === 'fork'){
      nd.question = toTx(nd.question);
      nd.yesLabel = toTx(nd.yesLabel);
      nd.noLabel  = toTx(nd.noLabel);
    }
    if(nd.kind === 'step' && nd.step === 'booklabor' && !nd.timeEntry) nd.timeEntry = 'startend';
    /* EVERY action carries `mode`, filled in here rather than guarded at
       each read site. Start Timer shipped with a boolean `ask` for a few
       hours; it migrates rather than being read in two shapes forever. */
    if(nd.kind === 'action'){
      if(nd.ask !== undefined){ if(!nd.mode) nd.mode = nd.ask ? 'user' : 'system'; delete nd.ask; }
      if(ACTION_MODES.indexOf(nd.mode) === -1) nd.mode = 'system';
    }
    (nd.layout || []).forEach(sec => {
      /* A grid container's cells need a span before one can be resized. */
      if(sec.layout === 'grid') sec.fields.forEach(f => { if(!f.span) f.span = 1; });
      /* DISPLAY STATE (§5.2, revised 2026-09-16): expanded | collapsed |
         hidden. A GRID container has no collapsed state — a two-up field
         grid collapsing to a header strip loses the thing it exists for —
         so grid + collapsed normalises to expanded rather than being
         rejected somewhere further downstream. */
      if(!sec.display) sec.display = 'expanded';
      if(sec.layout === 'grid' && sec.display === 'collapsed') sec.display = 'expanded';
      /* THE ONE NON-STANDARD CONTAINER (§15.2). WO Record View's Activities
         is not a field container at all: it is a single-select record list
         with its own + affordance, its own Add/Edit popup and a per-row
         completion state. Flagged on the data so the designer can refuse to
         treat it as ordinary, rather than relying on a name match at every
         render site. */
      if(nd.step === 'recordview' && /^activit/i.test(sec.container || '')) sec.std = false;
      else if(sec.std === undefined) sec.std = true;
    });
  });
  return w;
}
function fnLabel(w){
  const f = fnByCode(w && w.fn);
  return f ? f.code + ' — ' + f.desc : (w && w.fn) || '';
}

/* ═══════════════════════════════════════════════════════════════════════
   DERIVED VIEWS OF A WORKFLOW
   ═══════════════════════════════════════════════════════════════════════ */
function flowNodes(w){ return w.nodes.filter(n=>n.zone!=='ref'); }
function refNodes(w){ return w.nodes.filter(n=>n.zone==='ref'); }
function nodeById(w, id){ return w.nodes.find(n=>n.nid===id) || null; }
/* The numbered sequence excludes forks and reference nodes: a fork is a
   screen the technician sees but not a step they complete, and a reference
   node is outside the sequence by definition (§14.8). */
/* A UDS is a real step, not a special case — §29.5's whole point is that it
   takes an ordinary tier-2 row, so it numbers, gates and skips like a tab. */
function isStepKind(n){ return n.kind === 'step' || n.kind === 'uds'; }
function seqNodes(w){ return flowNodes(w).filter(isStepKind); }
function seqNo(w, n){ return seqNodes(w).indexOf(n) + 1; }

/* ── FORK TARGET VALIDATION (§29.4, "enforced twice") ──
   Re-runs after EVERY structural change, not only when a target is picked.
   Two failure modes, both invisible until a technician hits them:
     · dangling — the target step was deleted
     · backward — the fork moved later in the sequence, or the target moved
                  earlier, turning a valid forward route into a loop
   Both get cleared to null (= continue to the next step) and counted, so
   the caller can say what it did instead of silently rewriting the flow. ── */
function validateForks(w){
  const flow = flowNodes(w);
  let cleared = 0;
  flow.forEach((n, i) => {
    if(!isForkKind(n)) return;
    forkBranches(n).forEach(pair => {
      const k = pair[1];
      const t = n[k];
      if(!t || t === '__end') return;
      const tgt = nodeById(w, t);
      const ti = tgt ? flow.indexOf(tgt) : -1;
      if(ti === -1 || ti <= i){ n[k] = null; cleared++; }
    });
    /* THIRD FAILURE MODE, and it only exists for a condition fork: its
       field belongs to whatever STEP now precedes it. Reorder the flow and
       a different step is in front of it; delete that step and there is no
       form at all. Either way the field reference silently stops resolving
       and the fork would evaluate to "cannot tell" forever. Cleared and
       counted for the same reason a dangling target is — §29.4's "enforced
       twice" applies to the input as well as the output. */
    if(n.kind === 'cond' && n.field){
      const ok = condFieldsFor(w, n).some(f => f.api === n.field);
      if(!ok){ n.field = ''; n.op = ''; n.value = ''; cleared++; }
    }
  });
  return cleared;
}
function afterStructuralChange(msg){
  const w = wf(); if(!w) return;
  const cleared = validateForks(w);
  saveWFS(); render();
  if(cleared) toast((msg? msg+' — ' : '') + cleared + ' fork target' + (cleared>1?'s':'') + ' no longer routed forward, reset to "continue"');
  else if(msg) toast(msg);
}

/* ── N/A PROPAGATION (§29.4) ──
   Which steps a given set of fork answers would skip. Returns a Set of
   nids. Used by the Preview so "what did this answer skip" is answerable
   from the rail, which is reason 2 of the three §29.4 gives for marking
   skipped steps N/A instead of hiding them.
   `answers` maps a fork nid to 'yes' | 'no'. ── */
function naSet(w, answers){
  const flow = flowNodes(w);
  const na = new Set();
  if(w.freeForm) return na;
  let i = 0;
  while(i < flow.length){
    const n = flow[i];
    if(isForkKind(n)){
      /* The preview supplies an outcome per fork nid; the default is the
         first branch, which is the "nothing chosen yet" reading for both
         kinds (yes / true). */
      const brs = forkBranches(n);
      const ans = (answers && answers[n.nid]) || brs[0][0];
      const pair = brs.find(b => b[0] === ans) || brs[0];
      const tgt = n[pair[1]];
      if(tgt === '__end'){
        for(let j=i+1;j<flow.length;j++) if(isStepKind(flow[j])) na.add(flow[j].nid);
        break;
      }
      if(tgt){
        const ti = flow.findIndex(x=>x.nid===tgt);
        if(ti > i){
          for(let j=i+1;j<ti;j++) if(isStepKind(flow[j])) na.add(flow[j].nid);
          i = ti; continue;
        }
      }
    }
    i++;
  }
  return na;
}

/* ── THE ASSIGNMENT RULE ──
   One workflow per (group, WO Type), and one Free Form per group. Computed
   across every workflow, because a collision is BETWEEN two artifacts and
   neither one can see it alone — the same reason User Group Setup's
   cross-domain strip exists (§26.5). Reported, never auto-resolved:
   un-assigning the wrong one is the admin's call, not the screen's. ── */
function assignmentConflicts(){
  const out = [];
  const byKey = {};
  WFS.forEach(w => groupsOf('workflow', w.id).forEach(g => {
    const key = g + '|' + (w.freeForm ? 'FREEFORM' : (w.woType || 'ANY'));
    (byKey[key] = byKey[key] || []).push(w);
  }));
  Object.keys(byKey).forEach(key => {
    const list = byKey[key];
    if(list.length < 2) return;
    const [g, kind] = key.split('|');
    out.push({
      group:g,
      kind:kind,
      wfs:list,
      msg: kind === 'FREEFORM'
        ? 'is assigned ' + list.length + ' Free Form workflows. A group may have only one.'
        : 'is assigned ' + list.length + ' workflows for WO Type ' + kind + '. A group may have only one per Type.',
    });
  });
  return out;
}
function wfHasConflict(w){
  return assignmentConflicts().some(c => c.wfs.indexOf(w) !== -1);
}

function createForArea(){
  if(state.area === 'offline') return createProfile();

  if(state.area === 'groups') return toast('Groups are created in Security ▸ User Groups, never here');
  return createWf();
}

/* ═══════════════════════════════════════════════════════════════════════
   AREAS — one shell, four of them, and a shared assignment popover
   ═══════════════════════════════════════════════════════════════════════
   Every area is a gallery of named artifacts plus an editor, and every
   artifact assigns from the same popover into the same membership table.
   That sameness is the point: §30.6 made this one portal with areas, so an
   area that invented its own assignment control would undo the reason for
   having areas at all.
   ═══════════════════════════════════════════════════════════════════════ */

/* ── The one assignment control, shared by every artifact type ──
   Reads and writes ASSIGN and nothing else, which is what keeps the
   gallery side and the group side from drifting. */
function openAssign(ev, type, artifactId){
  const t = artType(type); if(!t) return;
  const art = artifactOf(type, artifactId); if(!art) return;
  openPopAt(ev || lastMenuEv,
    '<div class="pop__head">' +
      '<div class="pop__title">Assign ' + esc(artifactName(type, art)) + '</div>' +
      '<div class="pop__sub">' + assignRuleText(type) + '</div>' +
    '</div>' +
    '<div class="pop__body">' +
      GROUPS.map(g => {
        const on = isAssigned(type, artifactId, g);
        /* The COLLISION is computed live, so the control tells you the
           consequence before the click rather than reporting it after. */
        const clash = !on && wouldClash(type, artifactId, g);
        return '<div class="menu__item' + (clash ? ' is-warn' : '') + '" ' +
          'onclick="toggleAssign(\'' + type + '\',\'' + artifactId + '\',\'' + g + '\')">' +
          '<span class="cbx' + (on ? ' is-on' : '') + '">' + ic('check',14) + '</span>' +
          '<span class="menu__row-b"><span class="menu__row-t">' + esc(g) +
            (g === '*' ? ' <span class="chip__count">default</span>' : '') + '</span>' +
            (clash ? '<span class="menu__row-d" style="color:var(--critical)">' + esc(clash) + '</span>' : '') +
          '</span></div>';
      }).join('') +
    '</div>' +
    '<div class="pop__foot"><button class="Button Button--contained Button--primary" onclick="closePop()">Done</button></div>');
}
function toggleAssign(type, artifactId, group){
  setAssigned(type, artifactId, group, !isAssigned(type, artifactId, group));
  openAssign(lastMenuEv, type, artifactId);
  render();
}
/* ONE rule, parameterised by cardinality — which follows what the runtime
   resolves on (see ARTIFACT_TYPES). A workflow resolves on (WO Type, group)
   so a group may hold one per Type; everything else resolves on the group
   alone, so a group holds exactly one. */
function assignRuleText(type){
  const t = artType(type);
  return t.cardinality === 'per-wotype'
    ? 'A group may have one workflow per WO Type, and one Free Form.'
    : 'A group may have exactly one ' + t.label.toLowerCase() + '.';
}
function wouldClash(type, artifactId, group){
  const t = artType(type);
  if(t.cardinality === 'per-group'){
    const other = ASSIGN.find(r => r.type === type && r.group === group && r.artifactId !== artifactId);
    if(other){
      const o = artifactOf(type, other.artifactId);
      return 'already has ' + (o ? artifactName(type, o) : 'another') + '';
    }
    return null;
  }
  /* per-wotype */
  const w = artifactOf('workflow', artifactId); if(!w) return null;
  const key = w.freeForm ? 'FREEFORM' : (w.woType || 'ANY');
  const other = ASSIGN.filter(r => r.type === 'workflow' && r.group === group && r.artifactId !== artifactId)
    .map(r => artifactOf('workflow', r.artifactId)).filter(Boolean)
    .find(o => (o.freeForm ? 'FREEFORM' : (o.woType || 'ANY')) === key);
  return other ? 'already has ' + esc(other.desc) + ' for this ' + (w.freeForm ? 'Free Form slot' : 'WO Type') : null;
}
function artifactOf(type, id){
  if(type === 'workflow') return WFS.find(x => x.id === id) || null;
  if(type === 'offline') return PROFILES.find(x => x.id === id) || null;
  if(type === 'home') return HOMES.find(x => x.id === id) || null;
  return null;
}
function artifactName(type, art){
  if(!art) return '';
  return type === 'workflow' ? (art.desc || 'Untitled workflow') : (art.name || 'Untitled');
}
function allArtifacts(type){
  return type === 'workflow' ? WFS : type === 'offline' ? PROFILES : type === 'home' ? HOMES : [];
}

/* ── Collisions across EVERY type, one function ──
   A collision is between two artifacts and neither can see it alone, which
   is why it is computed at portal level and reported at the top of an area
   (§26.5's own reason for existing). */
function allConflicts(){
  const out = [];
  Object.keys(ARTIFACT_TYPES).forEach(type => {
    const t = ARTIFACT_TYPES[type];
    const byKey = {};
    ASSIGN.filter(r => r.type === type).forEach(r => {
      const art = artifactOf(type, r.artifactId); if(!art) return;
      const slot = t.cardinality === 'per-wotype'
        ? (art.freeForm ? 'FREEFORM' : (art.woType || 'ANY'))
        : 'ONE';
      const key = r.group + '|' + slot;
      (byKey[key] = byKey[key] || []).push(art);
    });
    Object.keys(byKey).forEach(k => {
      const list = byKey[k];
      if(list.length < 2) return;
      const [group, slot] = k.split('|');
      out.push({type:type, group:group, slot:slot, arts:list,
        msg: t.cardinality === 'per-wotype'
          ? (slot === 'FREEFORM'
              ? 'is assigned ' + list.length + ' Free Form workflows. A group may have only one.'
              : 'is assigned ' + list.length + ' workflows for WO Type ' + slot + '. A group may have only one per Type.')
          : 'is assigned ' + list.length + ' ' + t.plural.toLowerCase() + '. A group may have exactly one.'});
    });
  });
  return out;
}
function conflictsFor(type){ return allConflicts().filter(c => c.type === type); }
function artHasConflict(type, id){
  return allConflicts().some(c => c.type === type && c.arts.some(a => a.id === id));
}

/* ── Shared gallery chrome, so four areas cannot drift apart visually ── */
/* NO SUMMARY BAND (2026-09-16). This used to lead with an assignment-
   collision roll-up. A clash is now refused where it is made — the
   assignment popover predicts it before the click and says which artifact
   it would collide with — which is the house idiom and is what a dev will
   actually wire up. `o.conflicts` is still accepted and ignored so the
   callers did not all have to change in the same pass; allConflicts() is
   untouched if a roll-up is ever wanted again. */
function galleryShell(o){
  return '<div class="wrapw">' +
    '<div class="tbar">' +
      '<div><div class="tbar__t">' + esc(o.title) + '</div>' +
        '<div class="tbar__d">' + o.desc + '</div></div>' +
      '<div class="tbar__r">' + (o.actions || '') + '</div>' +
    '</div>' + o.body + '</div>';
}

/* ── AREA ROUTER ── */
function renderArea(){
  const a = state.area;
  if(a === 'offline') return renderOfflineArea();
  if(a === 'home')    return renderHomeArea();
  if(a === 'groups')  return renderGroupsArea();
  return renderGallery();
}

/* ═══════════════════════════════════════════════════════════════════════
   AREA — OFFLINE PROFILES
   ═══════════════════════════════════════════════════════════════════════ */
function renderOfflineArea(){
  if(state.openProfile) return renderProfileEditor();
  const cards = PROFILES.map(p => {
    const groups = groupsOf('offline', p.id);
    const issues = profileIssues(p);
    const errs = issues.filter(i => i.sev === 'error').length;
    const on = profileEnabledCount(p);
    return '<div class="wfc' + (on === 0 ? ' wfc--ff' : '') + '" onclick="openProfile(\'' + p.id + '\')">' +
      '<div class="wfc__head">' +
        '<div class="wfc__title">' + esc(p.name || 'Untitled profile') + '</div>' +
        iconBtn('dots', {on:'event.stopPropagation();profileMenu(event,\'' + p.id + '\')', cls:'IconButton--sm IconButton--muted'}) +
      '</div>' +
      '<div class="wfc__pills">' +
        (on === 0
          /* "None" is the OFF state and it is VALID, not a fault (§2.10/§29.6)
             — an online-only user group is a deliberate provisioning choice. */
          ? '<span class="chip chip--dense chip--lead chip--static">' + ic('na',16) + 'No replication</span>'
          : '<span class="chip chip--dense chip--lead chip--static">' + ic('cloudoff',16) + on + ' entities offline</span>') +
        '<span class="chip chip--dense chip--lead chip--static">' + ic('layers',16) +
          'cap ' + Number(p.caps.rowCap).toLocaleString() + '/entity</span>' +
      '</div>' +
      '<div class="wfc__body">' +
        '<div class="eyebrow">' + esc(p.desc || '—') + '</div>' +
        '<div class="wfc__chips">' + policySummaryChips(p) + '</div>' +
      '</div>' +
      '<div class="wfc__foot">' + ic('users',16) +
        '<span class="mono">' + groups.length + '</span> group' + (groups.length===1?'':'s') +
        '<span class="wfc__foot-r">' +
          /* No "to fix" / "collision" chips — the error belongs on the
             control that can fix it, not on a card that cannot. */
          '<span class="mono">' + esc(p.updated || '') + '</span>' +
        '</span>' +

  }).join('');

  $('gallery').innerHTML = galleryShell({

    conflicts:conflictsFor('offline'),

    body:'<div class="galgrid">' + cards +
      '<button class="wfc-new" onclick="createProfile()">' + ic('plus',26) +
        '<span class="wfc-new__t">Create a profile</span>' +
        '<span class="wfc-new__d">Name it, then set a policy per entity.</span></button>' +

  });
}
function policySummaryChips(p){
  const by = {};
  OFFLINE_ENTITIES.forEach(e => {
    const k = p.entities[e.id] ? p.entities[e.id].policy : 'server-only';
    by[k] = (by[k] || 0) + 1;

    '<span class="sstep">' + esc(pol.label) + ' <span class="mono">' + by[pol.k] + '</span></span>').join('');
}

/* CREATE IS A MODAL — an offline profile's identity is two fields, and the
   registry below only makes sense once it has a name to belong to. */
function createProfile(){
  openModal('narrow',
    '<div class="mbox__head"><div class="mbox__head-b">' +
      '<div class="mbox__title">New offline profile</div>' +
      '<div class="mbox__sub">One profile serves many groups, so name it for the ROLE rather than the group.</div>' +
    '</div></div>' +
    '<div class="mbox__body mbox__body--plain">' +

function commitCreateProfile(){
  const nm = ($('npName') && $('npName').value || '').trim();
  if(!nm){ toast('A profile needs a name'); return; }
  const p = normalizeProfile(mkOfflineProfile(nm, ($('npDesc') && $('npDesc').value || '').trim()));

  state.openProfile = p.id; render();
}
function copyProfile(id){
  const src = artifactOf('offline', id); if(!src) return;
  const dup = JSON.parse(JSON.stringify(src));
  dup.id = 'op-' + Math.random().toString(36).slice(2,8);
  dup.name = src.name + ' (copy)';
  dup.updated = todayStr();
  /* No membership — §30.2's rule, and with one profile per group an
     inheriting copy would collide with its source on every group at once. */
  PROFILES.splice(PROFILES.indexOf(src) + 1, 0, dup);
  savePortal(); render(); toast('Copied — no groups assigned to the copy');
}
function deleteProfile(id){
  const p = artifactOf('offline', id); if(!p) return;
  const g = groupsOf('offline', id);
  confirmBox({title:'Delete this profile?', sub:esc(p.name), danger:true, ok:'Delete profile',
    body: g.length
      ? '<div style="font-size:var(--uxt-theme-typography-body-2-font-size);line-height:1.6">It is assigned to <b>' +
        g.length + '</b> group' + (g.length===1?'':'s') + ' (' + g.map(esc).join(', ') + ').</div>' +
        '<ul class="bullets"><li>Those groups fall back to <b>no replication</b> — Tier 0 and the outbox still apply, ' +
        'so the app still works; it stops being able to load work without a connection (§2.10).</li></ul>'
      : '<div style="font-size:var(--uxt-theme-typography-body-2-font-size);line-height:1.6">No groups are assigned to it.</div>',

}
function openProfile(id){ state.openProfile = id; closeMenu(); render(); }

/* ── THE UNDECIDED ENTITIES, OUT OF THE GRID (2026-09-18, user direction) ──

function undecidedHtml(p){
