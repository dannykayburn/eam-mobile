<title>HxGN EAM — Workflow Designer Portal (Base) v1</title>

<!--
  ═══════════════════════════════════════════════════════════════════════
  WORKFLOW DESIGNER PORTAL — BASE SCREENS TRACK — v1
  ═══════════════════════════════════════════════════════════════════════
  A workflow is an ARTIFACT you author, name and then APPLY to user groups.
  That is the whole idea, and it is a different one from what this programme
  had before: until now a workflow existed only as the side-effect of saving
  a Screen Designer configuration to a group, so there was no object to
  point at, copy, or preview on its own.

  ── WHAT THIS REVERSES, SAID OUT LOUD ────────────────────────────────
  design-decisions-v3-1.md §21 retired `eam-workflow-designer-v1_1.html`
  on 2026-08-25 and §26.5.1 made Screen Designer the only workflow-
  authoring surface. This file reverses the FIRST half of that and keeps
  the second half's actual concern intact:

    WHY THE OLD ONE DIED — it rebuilt field-level authoring and UDS field
      definition in a second place, so two surfaces could each author a
      layout and disagree. That is still forbidden.
    WHAT THIS ONE DOES INSTEAD — it authors SEQUENCE, PLACEMENT, GATES and
      ROUTING, and opens SCREEN DESIGNER AS A PANEL on the selected node's
      own layout. One layout, one editor, two zoom levels — and, since
      2026-09-16, ONE SURFACE: Screen Designer has no standalone
      destination, it is only ever invoked from the workflow configurator.

  So the split is by GRAIN, not by feature:

    THE CANVAS (this file)             SCREEN DESIGNER PANEL (right 40%)
    ────────────────────────────────   ──────────────────────────────────────
    Which steps, in what order         Which fields, in what container
    Step vs. More placement (§14.8)    Required / Protected / Hidden / N/A
    Completion gates (§29.3)           Grid vs. List container (§5.2)
    Question forks + routing (§29.4)   Field order inside a container
    Free Form on/off (§14.10)
    Which user groups get this

  ── THE ONE NEW RULE THIS SCREEN INTRODUCES ───────────────────────────
  A user group may be assigned AT MOST ONE workflow per WO Type, and AT
  MOST ONE Free Form workflow. That is what makes "apply a workflow to a
  group" resolvable at runtime: §11's resolution reads (WO Type, user
  group) and must land on exactly one row. The assignment EDITOR is
  deliberately not built here yet — the user is still deciding where it
  lives. What IS built is the rule's enforcement surface: the gallery
  computes collisions across the demo assignments and reports them, so the
  constraint is visible before the editor exists rather than after.

  ── STYLING ───────────────────────────────────────────────────────────
  SUPERSEDED BY THE OCTAVE BLOCK ABOVE — kept because it records where these
  components came from. The first pass was Inter / JetBrains Mono with tokens
  copied from eam-shared.css and every component lifted from
  old versions/eam-base-desktop-ui-prototype-v1.html and
  old versions/eam-user-group-setup-prototype-v1.html (rail, flyout, crumb,
  tab capsule, .fd field system, .pop, .card, .iss strip, .sw, .cbx, .toast).
  Both source files are now retired — Desktop UI went OUT OF SCOPE 2026-09-16
  ("just the Mobile App and this portal now"), so this is the last trace of
  its component set and there is nothing to restyle back onto.

  It was DELIBERATELY NOT eam-screen-designer-v1.html's DM Sans / teal-purple
  system, even for the embedded designer panel: a new file gets the
  destination, not the thing being migrated away from. That reasoning held
  and then went further — the whole screen moved to Octave / OUX, which is
  now the only visual language on this track.

  Colour discipline (§23): no new hue is invented here.
    · WO Type pill        — the four §23.3 --wo-type-* tokens and nothing
                            else; a Type outside that set reads as an
                            outline pill, it does not get a fifth colour.
    · Free Form vs. Flow  — SHAPE, not hue. Dashed card edge + icon.
    · More/reference zone  — the teal wash already used for the `*` default
                            row in User Group Setup (rgba(0,123,135,.06)),
                            reused rather than re-hued.
    · Gate marker         — --wo-type-breakdown, exactly as .sgate already
                            does on User Group Setup's step chips.
    · Forks and actions    — BADGE_COLORS (§30.25): six Octave status hues,
                            one per kind. These used to borrow
                            --wo-type-routine and --wo-type-corrective, which
                            made both fork kinds one purple and all three
                            actions one yellow — so "asked vs. evaluated" and
                            "start vs. stop" were not drawn at all. Nothing
                            is invented: the set is Octave's own ramp.
    · Home tile icon       — the same six. It borrowed the four WO Type
                            tokens, which made a tile read as a Type it has
                            nothing to do with.

  ── NAMING COLLISION, FLAGGED NOT PAPERED OVER ────────────────────────
  The zone for steps taken out of the flow is called "More" in the app:
  §14.8 renamed it from "Reference" on 2026-08-25 and .step-map-group-label
  in eam-shared.css renders that word to the technician. This screen labels
  the zone "More" with "reference steps" as its explanation, so an admin
  reads the same word the technician sees. If the intent is to rename it
  back to Reference app-wide, that is a §14.8 edit, not a local override.

  ── THIS IS THE SINGLE BASE-SCREEN ENTRY POINT (2026-09-16) ───────────
  Decided after the first build: mobile configuration is ONE portal with
  areas, not a folder of sibling admin screens linking to each other.

  `eam-user-group-setup-prototype-v1.html` is therefore retired to
  `old versions/` — the retirement convention, one live version per screen.
  What is retired is the PROTOTYPE, not §26: its model is still locked and
  gets rebuilt as this portal's User Groups area. The parts worth carrying
  over are listed in that area's own panel, not in a comment here, so an
  admin opening the screen reads the same brief.

  One consequence that is easy to miss, and it RESOLVED on 2026-09-16:
  `sessionStorage.eamDesignerEntry` was a handoff INTO a standalone Screen
  Designer. It lost its producer when User Group Setup was retired, and it
  has now lost its destination too — Screen Designer is only ever invoked
  from a step node, which already knows its function, WO Type and layout key,
  so there is nothing left to hand over. The contract dies with the
  standalone surface rather than needing a new producer (§20, closed).

  ── WHAT IS REAL vs. WHAT IS DEMO ─────────────────────────────────────
  Real: drag/drop with auto-layout and insertion, instance minting with
  per-instance layout COPIES (§29.2 — the one thing that breaks the whole
  feature while everything still renders), fork target validation on every
  reorder and delete (§29.4), the Free Form conversion with its dedupe,
  gate authoring, the embedded designer's field property model, the step
  rail preview including N/A propagation.
  Demo: the workflow list itself, group assignments, and the field
  candidate lists. Persisted to localStorage.eamWorkflowDefs.
  ═══════════════════════════════════════════════════════════════════════
-->

<!-- ══ OCTAVE DESIGN SYSTEM ══
  Tokens come from the real generated package, linked rather than copied:
  DESIGN_FILES/uxt-tokens.css is uxt-dsp@2.4.0's light.css + dark.css exposed
  as CSS custom properties, switched by `data-uxt-theme` on <html>. Linking it
  means re-pulling the package updates this screen, and there is no second
  copy of a hex to drift. Tag-based loading works under file:// (only
  fetch()/XHR is blocked), same reason eam-shared.css is a <link>.

  ⚠ DESIGN_FILES IS NOW A RUNTIME DEPENDENCY, not just a design input. It has
  to be committed, and moving it breaks this screen.

  Fonts: Noto Sans. Octave Sans / Octave Display are not public web fonts, and
  Noto Sans is the design system's own declared fallback — the component
  previews in octave-components.md load exactly this from Google Fonts, so
  this screen renders with the same face they were designed against. Mono
  stays JetBrains Mono, which is what Octave's own --font-mono resolves to.

  Icons: Material Symbols Outlined at 'FILL' 0, 'wght' 300, 'GRAD' 0,
  'opsz' 20 — the system-wide icon rule. The one exception is the four WO
  Type glyphs; see the WO TYPE block below.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,300,0,0&display=swap" rel="stylesheet">
<link rel="stylesheet" href="DESIGN_FILES/uxt-tokens.css">

<style>
/* ══════════════════════════════════════════════════════════════════════
   ALIAS LAYER
   ══════════════════════════════════════════════════════════════════════
   Copied from AppShell.html's own alias block, which is how the Octave
   product previews consume the raw tokens: never reference a `ui.*` /
   `status.*` / `accent.*` primitive in a component, always go through a
   semantic token, and give the local shorthand a name. Same discipline,
   same names, so a rule lifted from a component preview drops in unchanged.
   ══════════════════════════════════════════════════════════════════════ */
:root{
  /* The light half of the pair below — <html> ships data-uxt-theme="light",
     so this is the default the UA paints its widgets with. */
  color-scheme:light;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px;
  --radius-xs:4px; --radius-sm:6px; --radius-md:8px; --radius-lg:12px;
  --radius-xl:16px; --radius-xxl:24px; --radius-pill:100px; --radius-full:9999px;
  --elev-1:inset 0 0 0 1px rgba(0,0,0,.08);
  --elev-2:0 1px 1px rgba(0,0,0,.04),0 2px 2px rgba(0,0,0,.04),inset 0 0 0 1px rgba(0,0,0,.06);
  --elev-3:0 2px 2px rgba(0,0,0,.04),0 8px 8px -8px rgba(0,0,0,.06),inset 0 0 0 1px rgba(0,0,0,.06);
  --elev-4:0 2px 2px rgba(0,0,0,.04),0 8px 16px -4px rgba(0,0,0,.06),inset 0 0 0 1px rgba(0,0,0,.06);
  --font-display:"Octave Display","Noto Sans",ui-sans-serif,system-ui,sans-serif;
  --font-sans:"Octave Sans","Noto Sans",ui-sans-serif,system-ui,sans-serif;
  --font-mono:"JetBrains Mono","IBM Plex Mono",ui-monospace,Menlo,monospace;

  --bg-app:var(--uxt-theme-palette-background-default);
  --bg-panel:var(--uxt-theme-palette-background-paper);
  --bg-surface:var(--uxt-theme-palette-background-card);
  --bg-hover:var(--uxt-theme-palette-background-drawer);
  --fg-default:var(--uxt-theme-palette-text-primary);
  --fg-muted:var(--uxt-theme-palette-text-secondary);
  --fg-faint:var(--uxt-theme-palette-text-hint);
  --border-subtle:var(--uxt-theme-palette-border-divider);
  --border-default:var(--uxt-theme-palette-border-control);
  --accent:var(--uxt-theme-palette-primary-main);
  --on-accent:var(--uxt-theme-palette-primary-contrast-text);
  --critical:var(--uxt-theme-palette-error-main);
  --warning:var(--uxt-theme-palette-warning-main);
  --success:var(--uxt-theme-palette-success-main);
  /* SEVERITY NOTE (DESIGN-2026-08-11 → Severity Semantics): in this system
     "on track / approved / good" is INFO (blue), not success (green). Green
     exists as a severity but is not the default healthy state. So --info is
     the accent, and --success is reserved for genuine completion. */
  --info:var(--uxt-theme-palette-primary-main);
}
[data-uxt-theme="dark"]{
  /* Tells the UA to paint its OWN widgets dark — select popups, scrollbars,
     date pickers, spinners. See the note above .input>select. */
  color-scheme:dark;
  --elev-1:inset 0 0 0 1px rgba(255,255,255,.06);
  --elev-2:0 1px 2px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.06);
  --elev-3:0 8px 24px -8px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.06);
  --elev-4:0 16px 40px -12px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.08);
}

/* ══════════════════════════════════════════════════════════════════════
   WO TYPE — the one sanctioned primitive exception (§23.3)
   ══════════════════════════════════════════════════════════════════════
   Octave forbids referencing raw primitives in a component, with exactly one
   sanctioned exception of its own (New Chat Button's pillar fills). This is
   the second, and it is declared here rather than inlined so it stays
   countable.

   WHY IT HAS TO BE AN EXCEPTION: §23.3 requires the WO Type badge to render
   IDENTICALLY across the Type field, the WO List row, the mobile step rail
   and this screen. Re-mapping Breakdown onto an Octave severity would make
   the admin screen and the technician's device disagree about what
   "Breakdown" looks like — and WO Type is not a severity at all, it is
   record data. Four hexes, copied from eam-shared.css, and a fifth Type gets
   no colour rather than a new one.
   ══════════════════════════════════════════════════════════════════════ */
:root{
  --wo-type-breakdown:#F5821F; --wo-type-ppm:#2563EB;
  --wo-type-routine:#7C3AED; --wo-type-corrective:#F2C94C;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font-sans);
  font-size:var(--uxt-theme-typography-body-2-font-size);
  background:var(--bg-app);color:var(--fg-default);
  -webkit-font-smoothing:antialiased;overflow:hidden;
  display:flex;flex-direction:column;height:100vh;height:100dvh;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
svg{display:block;}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--uxt-theme-palette-background-thumb);border-radius:6px;border:3px solid transparent;background-clip:content-box;}
::-webkit-scrollbar-track{background:transparent;}

/* Material Symbols — the system-wide icon rule. One class, one axis set. */
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;
  font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;
  white-space:nowrap;direction:ltr;-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;
  font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 20;flex-shrink:0;user-select:none;}
.ms-14{font-size:14px;font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 20;}
.ms-16{font-size:16px;}
.ms-18{font-size:18px;}
.ms-20{font-size:20px;}
.ms-24{font-size:24px;}

/* ══════════════════════════════════════════════════════════════════════
   BUTTON — Octave `.Button`, lifted from Button.html
   ══════════════════════════════════════════════════════════════════════
   Stadium only. `capitalize` on the label is Octave's own spec and is NOT
   the all-caps this screen removed — capitalize is title-case, and the
   Status Dot spec independently says labels are "not uppercase".
   Hover/active are an OVERLAY over the base colour, not a colour swap,
   which is why every button carries an __actionStateOverlay span.
   ══════════════════════════════════════════════════════════════════════ */
.Button{position:relative;display:inline-flex;flex-direction:row;align-items:center;justify-content:center;
  gap:var(--s-1);height:36px;min-width:64px;padding:0 var(--s-4);overflow:hidden;cursor:pointer;
  border:1px solid var(--border-default);border-radius:var(--radius-full);
  background-color:transparent;color:var(--fg-default);
  font-family:var(--font-sans);font-size:var(--uxt-theme-typography-button-font-size);
  font-weight:var(--uxt-theme-typography-button-font-weight);
  letter-spacing:var(--uxt-theme-typography-button-letter-spacing);
  line-height:var(--uxt-theme-typography-button-line-height);white-space:nowrap;}
/* DEVIATION FROM OCTAVE'S MARKUP, not its visuals: uxt-react renders the
   action-state overlay as a child <span>, which React can guarantee and
   hand-written HTML cannot. Same two overlay colours via ::after instead, so
   a Button is complete with nothing inside it. */
.Button::after{content:"";position:absolute;inset:0;border-radius:inherit;background-color:transparent;pointer-events:none;transition:background-color .1s ease-out;}
.Button:hover::after{background-color:var(--uxt-theme-palette-action-hover);}
.Button:active::after{background-color:var(--uxt-theme-palette-action-active);}
.Button:focus-visible{border-color:var(--uxt-theme-palette-ui-blue-500);outline:0;}
/* Octave: the Button label is capitalized (title case, NOT the all-caps
   this screen removed — the Status Dot spec independently says labels are
   "not uppercase"). Set on .Button so a button written with inline text gets
   it too; .ms sets text-transform:none, so icon ligatures are unaffected. */
.Button{text-transform:capitalize;}
.Button__label{position:relative;z-index:2;}
.Button>*{position:relative;z-index:2;}
.Button .ms{position:relative;z-index:2;}
.Button--primary{border-color:var(--accent);color:var(--accent);}
.Button--contained.Button--primary{background-color:var(--accent);color:var(--on-accent);}
.Button--contained.Button--primary:hover::after{background-color:var(--uxt-theme-palette-action-dark-hover);}
.Button--error{border-color:var(--critical);color:var(--critical);}
.Button--text{border-color:transparent;background:transparent;padding:0 var(--s-2);min-width:0;}
.Button--sm{height:28px;padding:0 var(--s-3);min-width:0;font-size:var(--uxt-theme-typography-caption-font-size);}
.Button--icon{width:36px;min-width:36px;padding:0;}
.Button--icon.Button--sm{width:28px;min-width:28px;}
.Button[disabled],.Button.is-disabled{opacity:.5;cursor:not-allowed;pointer-events:none;}

/* ══ ICON BUTTON — Octave `.IconButton`, circular, overlay-based ══ */
.IconButton{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  width:32px;height:32px;border:none;border-radius:50%;background:transparent;cursor:pointer;
  color:var(--uxt-theme-palette-glyph-default);}
.IconButton::after{content:"";position:absolute;inset:0;border-radius:100%;background-color:transparent;pointer-events:none;transition:background-color .1s ease-out;}
.IconButton:hover::after{background-color:var(--uxt-theme-palette-action-hover);}
.IconButton:active::after{background-color:var(--uxt-theme-palette-action-active);}
.IconButton:focus-visible{outline:2px solid var(--uxt-theme-palette-ui-blue-300);outline-offset:-1px;}
.IconButton>*{position:relative;z-index:2;}
.IconButton--sm{width:28px;height:28px;}
.IconButton--muted{color:var(--fg-muted);}
.IconButton--danger{color:var(--critical);}

/* ══════════════════════════════════════════════════════════════════════
   CHIP — Octave Chip. 36px canonical, 32px in dense bars.
   ══════════════════════════════════════════════════════════════════════
   DESIGN-2026-08-11 specifies 36px to match Button; AppShell's own app-bar
   chip ships 32px. Both are kept: 36px is the canonical component, --dense
   is the 32px bar variant AppShell itself uses. Icon-side padding tightens
   to 8px because the icon carries its own weight.
   ══════════════════════════════════════════════════════════════════════ */
.chip{display:inline-flex;align-items:center;gap:var(--s-2);height:36px;padding:0 var(--s-4);
  border:1px solid var(--border-subtle);border-radius:var(--radius-full);background:transparent;
  color:var(--fg-default);font-size:var(--uxt-theme-typography-button-font-size);font-weight:500;
  white-space:nowrap;cursor:pointer;}
.chip:hover{background:var(--uxt-theme-palette-action-hover);}
.chip--lead{padding-left:var(--s-2);}
.chip--trail{padding-right:var(--s-2);}
.chip--dense{height:32px;padding:0 var(--s-3);font-size:var(--uxt-theme-typography-body-2-font-size);}
.chip--static{cursor:default;}
.chip--static:hover{background:transparent;}
.chip.is-active{background:var(--uxt-theme-palette-action-selected);border-color:var(--uxt-theme-palette-action-selected);}
.chip__dot{width:6px;height:6px;border-radius:var(--radius-full);flex-shrink:0;background:var(--fg-faint);}
.chip__caret{transition:transform 160ms ease;color:var(--fg-faint);}
.chip__count{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:16px;
  padding:0 5px;border-radius:var(--radius-full);background:var(--bg-hover);color:var(--fg-muted);
  font-family:var(--font-mono);font-size:var(--uxt-theme-typography-caption-font-size);font-weight:600;}

/* chip-status-fill — pale [50] fill, dark [900] text, no border. The four
   severity sets and their exact pairs come from DESIGN-2026-08-11, including
   warning's cross-hue text (yellow cannot pass contrast at any step of its
   own scale, so warning text uses orange[900]). */
.chip--fill{border-color:transparent;}
.chip--fill.sev-critical{background:var(--uxt-theme-palette-status-red-50);color:var(--uxt-theme-palette-status-red-900);}
.chip--fill.sev-critical .chip__dot{background:var(--uxt-theme-palette-status-red-500);}
.chip--fill.sev-warning{background:var(--uxt-theme-palette-status-yellow-50);color:var(--uxt-theme-palette-status-orange-900);}
.chip--fill.sev-warning .chip__dot{background:var(--uxt-theme-palette-status-orange-500);}
.chip--fill.sev-info{background:var(--uxt-theme-palette-ui-blue-50);color:var(--uxt-theme-palette-ui-blue-900);}
.chip--fill.sev-info .chip__dot{background:var(--uxt-theme-palette-ui-blue-500);}
.chip--fill.sev-success{background:var(--uxt-theme-palette-status-green-50);color:var(--uxt-theme-palette-status-green-900);}
.chip--fill.sev-success .chip__dot{background:var(--uxt-theme-palette-status-green-500);}
.chip--fill.sev-neutral{background:var(--uxt-theme-palette-ui-white-300);color:var(--uxt-theme-palette-ui-grey-900);}
.chip--fill.sev-neutral .chip__dot{background:var(--uxt-theme-palette-ui-grey-500);}

/* ══ STATUS CHIP / STATUS DOT — 22px bar-height severity marker ══ */
.status-chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 var(--s-2);
  border-radius:var(--radius-full);font-size:var(--uxt-theme-typography-caption-font-size);font-weight:500;}
.status-dot{display:inline-flex;align-items:center;gap:var(--s-2);font-size:var(--uxt-theme-typography-body-2-font-size);color:var(--fg-default);}
.status-dot__dot{width:6px;height:6px;border-radius:var(--radius-full);flex-shrink:0;}
.sev-critical>.status-dot__dot,.status-dot--critical .status-dot__dot{background:var(--critical);}
.sev-warning>.status-dot__dot,.status-dot--warning .status-dot__dot{background:var(--warning);}
.sev-info>.status-dot__dot,.status-dot--info .status-dot__dot{background:var(--info);}
.sev-success>.status-dot__dot,.status-dot--success .status-dot__dot{background:var(--success);}
.sev-neutral>.status-dot__dot,.status-dot--neutral .status-dot__dot{background:var(--uxt-theme-palette-ui-grey-100);}

/* ══ WO TYPE PILL — a Chip whose leading slot is the §23.3 badge ══ */
.tpill{display:inline-flex;align-items:center;gap:var(--s-2);height:36px;padding:0 var(--s-4) 0 var(--s-1);
  border:1px solid var(--border-subtle);border-radius:var(--radius-full);color:var(--fg-default);
  font-size:var(--uxt-theme-typography-button-font-size);font-weight:500;white-space:nowrap;}
.tpill--dense{height:28px;padding:0 var(--s-3) 0 3px;font-size:var(--uxt-theme-typography-caption-font-size);}
.tpill__badge{width:26px;height:26px;border-radius:var(--radius-full);flex-shrink:0;display:flex;
  align-items:center;justify-content:center;color:#fff;background:var(--uxt-theme-palette-ui-grey-500);}
.tpill--dense .tpill__badge{width:22px;height:22px;}
/* THE SAME BADGE, INSIDE AN INPUT (2026-09-17). The WO Type select used to be
   a bare dropdown, so the one thing §23.3 makes instantly recognisable — the
   colour and the glyph the technician sees on the rail, the list row and the
   Type field — was absent from the control that SETS it. Same four hexes and
   same four SVG glyphs as the pill: one of §30.7's five declared Octave
   exceptions, not a second badge recipe. */
.input__wt{width:24px;height:24px;flex-shrink:0;border-radius:var(--radius-full);
  display:flex;align-items:center;justify-content:center;color:#fff;}
.input__wt--none{background:var(--bg-hover);color:var(--fg-faint);}

/* ══════════════════════════════════════════════════════════════════════
   SHELL — Octave AppShell: labelled rail + inset rounded main panel
   ══════════════════════════════════════════════════════════════════════
   This replaces the 76px icon rail + slide-out flyout + dark topbar. No
   locked rule governs base-screen navigation — §4.2/§4.3 lock the MOBILE
   nav shell only — and a labelled rail says §30.6's "areas of one portal,
   not links to sibling screens" far better than an icon rail plus a flyout
   full of links ever did. The flyout is gone entirely: the rail IS the nav.
   ══════════════════════════════════════════════════════════════════════ */
.shell{flex:1;min-height:0;display:flex;width:100%;background:var(--bg-app);}
.rail{width:232px;flex-shrink:0;display:flex;flex-direction:column;gap:2px;
  padding:var(--s-3);position:relative;background:transparent;}
.rail__resize{position:absolute;top:0;right:-3px;width:6px;height:100%;cursor:ew-resize;z-index:5;}
.rail__resize::after{content:"";position:absolute;top:50%;right:2px;width:2px;height:32px;border-radius:2px;
  background:transparent;transform:translateY(-50%);transition:background 120ms ease;}
.rail__resize:hover::after{background:var(--border-default);}
.rail__brand{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-1) 0;margin-bottom:var(--s-2);}
.rail__brand-mark{width:34px;height:34px;border-radius:var(--radius-md);flex-shrink:0;display:inline-flex;
  align-items:center;justify-content:center;border:0;padding:0;cursor:pointer;
  background:var(--uxt-theme-palette-octave-main);color:var(--uxt-theme-palette-octave-contrast-text);
  box-shadow:var(--elev-1);transition:transform 120ms ease,box-shadow 120ms ease;}
.rail__brand-mark:hover{transform:scale(1.04);box-shadow:var(--elev-2);}
.rail__brand-name{font-family:var(--font-display);font-weight:600;letter-spacing:-.02em;
  font-size:var(--uxt-theme-typography-body-1-font-size);color:var(--fg-default);}
.rail__brand-sub{font-size:var(--uxt-theme-typography-caption-font-size);color:var(--fg-faint);margin-top:-2px;}
.rail__section{padding:var(--s-2) var(--s-2) var(--s-1);color:var(--fg-faint);
  font-size:var(--uxt-theme-typography-caption-font-size);font-weight:500;letter-spacing:.02em;}
.rail__row{display:flex;align-items:center;gap:var(--s-2);padding:6px 10px;border:0;width:100%;
  border-radius:var(--radius-full);background:transparent;color:var(--fg-muted);cursor:pointer;
  font-family:var(--font-sans);font-size:var(--uxt-theme-typography-body-2-font-size);text-align:left;}
.rail__row:hover{background:var(--bg-hover);color:var(--fg-default);}
.rail__row .ms{opacity:.72;}
.rail__row--active{background:var(--bg-surface);color:var(--fg-default);box-shadow:var(--elev-1);}
.rail__row--active .ms{opacity:1;}
.rail__row-label{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.rail__row-count{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;min-width:22px;
  height:18px;padding:0 5px;border-radius:var(--radius-full);background:var(--bg-hover);color:var(--fg-muted);
  font-family:var(--font-mono);font-size:var(--uxt-theme-typography-caption-font-size);font-weight:500;
  font-variant-numeric:tabular-nums;box-shadow:var(--elev-1);}
.rail__row-hint{margin-left:auto;font-size:var(--uxt-theme-typography-caption-font-size);color:var(--fg-faint);}
.rail__row--soon{cursor:default;}
.rail__row--soon:hover{background:transparent;color:var(--fg-muted);}
/* The rail's primary row — AppShell's create affordance. The one place a
   filled accent lives in the rail, so Create reads as the rail's verb. */
.rail__row--primary{background:var(--accent);color:var(--on-accent);font-weight:500;
  justify-content:center;margin-bottom:var(--s-2);}
.rail__row--primary:hover{background:var(--accent);color:var(--on-accent);opacity:.92;}
.rail__row--primary .ms{opacity:1;}
.rail__divider{height:1px;background:var(--border-subtle);margin:var(--s-2) 4px;flex-shrink:0;}
.rail__spacer{flex:1;min-height:var(--s-2);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;margin:var(--s-3) var(--s-3) var(--s-3) 0;
  background:var(--bg-panel);border-radius:var(--radius-xl);
  box-shadow:-1px 0 0 rgba(0,0,0,.04),-2px 0 6px rgba(0,0,0,.03),var(--elev-1);overflow:hidden;}

/* ══ APP BAR — 44px, crumb left, actions right ══ */
.app-bar{height:var(--uxt-theme-height-app-bar);flex-shrink:0;display:flex;align-items:center;gap:var(--s-2);
  padding:0 var(--s-2) 0 var(--s-4);border-bottom:1px solid var(--border-subtle);background:var(--bg-panel);
  font-size:var(--uxt-theme-typography-body-2-font-size);}
.app-bar__crumb{display:flex;align-items:center;gap:var(--s-2);min-width:0;color:var(--fg-muted);}
.app-bar__crumb-link{background:0;border:0;padding:0;font:inherit;color:var(--fg-muted);cursor:pointer;}
.app-bar__crumb-link:hover{color:var(--fg-default);text-decoration:underline;}
.app-bar__crumb-sep{color:var(--border-default);}
.app-bar__crumb-current{color:var(--fg-default);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.app-bar__actions{margin-left:auto;display:flex;align-items:center;gap:var(--s-2);}
.app-bar__avatar{width:32px;height:32px;border-radius:var(--radius-full);border:1px solid var(--border-subtle);
  background:var(--uxt-theme-palette-ui-blue-700);color:#fff;display:inline-flex;align-items:center;
  justify-content:center;font-size:var(--uxt-theme-typography-caption-font-size);font-weight:600;cursor:pointer;flex-shrink:0;}
.app-bar__avatar:hover{box-shadow:var(--elev-2);}
.app-bar__env{font-size:var(--uxt-theme-typography-caption-font-size);color:var(--fg-faint);white-space:nowrap;}

/* ══ TOGGLE BUTTON GROUP — segmented control ══
   Active item: white/card pill + ACCENT text + real shadow, in both
   selection modes. DESIGN-2026-08-11 flags this as a deliberate override of
   uxt-react's own Storybook rendering; this follows the doc, not Storybook. */
.seg{display:inline-flex;align-items:center;gap:var(--s-1);padding:3px;
  border:1px solid var(--border-subtle);border-radius:var(--radius-full);background:transparent;}
.seg__btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 var(--s-3);border:0;
  border-radius:var(--radius-full);background:transparent;color:var(--fg-muted);cursor:pointer;
  font-family:var(--font-sans);font-size:var(--uxt-theme-typography-button-font-size);font-weight:500;white-space:nowrap;}
.seg__btn:hover{background:var(--uxt-theme-palette-action-hover);color:var(--fg-default);}
.seg__btn.is-active{background:var(--bg-surface);color:var(--accent);
  box-shadow:0 2px 1px -1px rgba(0,0,0,.2),0 1px 1px 0 rgba(0,0,0,.14),0 1px 3px 0 rgba(0,0,0,.12);}
.seg__btn:focus-visible{outline:0;box-shadow:0 0 0 2px var(--accent);}
.seg--sm .seg__btn{height:26px;padding:0 var(--s-2);font-size:var(--uxt-theme-typography-caption-font-size);}

/* ══ TEXT INPUT — outline only, 40px, radius-md ══ */
.field{min-width:0;display:flex;flex-direction:column;gap:5px;}
.field__label{font-size:var(--uxt-theme-typography-caption-font-size);color:var(--fg-muted);font-weight:500;}
.field__req{color:var(--uxt-theme-palette-text-error);font-weight:700;}
.input{display:flex;align-items:center;gap:var(--s-2);min-height:var(--uxt-theme-height-input);
  padding:0 var(--s-3);border:1px solid var(--border-default);border-radius:var(--radius-md);
  background:transparent;color:var(--fg-default);transition:border-color .15s,box-shadow .15s;}
.input:hover{border-color:var(--uxt-theme-palette-text-link);}
.input:focus-within{border-color:var(--uxt-theme-palette-action-focus);border-width:2px;padding:0 11px;}
.input.is-error{border-color:var(--uxt-theme-palette-text-error);}
.input>input,.input>select,.input>textarea{flex:1;min-width:0;border:0;background:0;outline:0;padding:0;
  font-size:var(--uxt-theme-typography-body-1-font-size);color:inherit;}
.input>select{cursor:pointer;appearance:none;}
/* THE DROP-DOWN PANEL IS THE UA'S, NOT OURS. `color-scheme` on the themed
   root is what makes it dark; this rule is the belt-and-braces for engines
   that paint the option list themselves and would otherwise inherit our
   near-white `color` onto their own light panel. The symptom of losing it is
   a control that looks correct closed and has no readable values open.

   DELIBERATELY UNSCOPED. This file has two select shapes — a bare `.tinput`
   and an unclassed `select` inside an `.input` wrapper — and `.tinput` is
   the large majority. A first pass scoped this to `.input>select` and so
   missed 14 of 17 selects, the New tile modal's "Opens" among them. There is
   no version of this rule that should know about a wrapper class: every
   option list in the document wants the same treatment, so match on the
   element. */
option,optgroup{
  background:var(--uxt-theme-palette-background-card);
  color:var(--uxt-theme-palette-text-primary);}
.input>textarea{resize:none;padding:10px 0;line-height:1.5;
  font-size:var(--uxt-theme-typography-body-2-font-size);}
.input--ta{min-height:64px;align-items:flex-start;}
.input>input::placeholder,.input>textarea::placeholder{color:var(--fg-faint);}
.input .ms{color:var(--fg-faint);}
/* Octave text-input as a single element, for popovers where a wrapper would
   add nothing. Same border/radius/height spec as .input. */
.tinput{width:100%;min-height:var(--uxt-theme-height-input);padding:0 var(--s-3);
  border:1px solid var(--border-default);border-radius:var(--radius-md);background:transparent;
  color:var(--fg-default);font-family:var(--font-sans);font-size:var(--uxt-theme-typography-body-1-font-size);outline:0;}
.tinput:hover{border-color:var(--uxt-theme-palette-text-link);}
.tinput:focus{border-color:var(--uxt-theme-palette-action-focus);border-width:2px;padding:0 11px;}
.tinput::placeholder{color:var(--fg-faint);}
.tinput--ta{min-height:76px;padding:10px var(--s-3);line-height:1.55;resize:vertical;
  font-size:var(--uxt-theme-typography-body-2-font-size);}
.tinput--ta:focus{padding:9px 11px;}
/* Node status tags — a Status Dot per §23's severity, inline under the name. */
.node__tag{display:inline-flex;align-items:center;gap:5px;font-size:var(--uxt-theme-typography-caption-font-size);
  font-weight:500;color:var(--fg-muted);}
.node__tag--gate{color:var(--uxt-theme-palette-warning-dark);}
.node__tag--req{color:var(--critical);}
.node__tag--pin{color:var(--fg-faint);}
.node__tag--uds{color:var(--wo-type-ppm);}
/* A capability gap is an ERROR, not a warning: it is a step the technician
   can neither complete nor skip — a dead end, not an inconvenience (§27.4's
   own severity call, applied to the function's own missing tabs). */
.node__tag--nocap{color:var(--critical);font-weight:600;}

/* ══ SWITCH ══ */
.uxt-switch{position:relative;flex-shrink:0;width:36px;height:20px;padding:0;border:0;
  border-radius:var(--radius-full);background:var(--border-default);cursor:pointer;transition:background 160ms ease;}
.uxt-switch__thumb{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform 180ms cubic-bezier(.16,1,.3,1);}
.uxt-switch.is-on{background:var(--accent);}
.uxt-switch.is-on .uxt-switch__thumb{transform:translateX(16px);}

/* ══ RADIO ══
   ONE-OF-MANY IS NOT A CHECKBOX (2026-09-17). Three of the four artifact
   types are exactly one per group (§30.13's cardinality rule), and a tick
   box next to each of them says the opposite of that — it invites a second
   tick and then reports a collision for taking the invitation. The control
   now matches the rule it is enforcing. */
.rdo{width:16px;height:16px;flex-shrink:0;border:2px solid var(--border-default);
  border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;
  transition:border-color .15s;}
.rdo.is-on{border-color:var(--accent);}
.rdo__dot{width:8px;height:8px;border-radius:var(--radius-full);background:var(--accent);
  opacity:0;transform:scale(.5);transition:opacity .18s,transform .18s;}
.rdo.is-on .rdo__dot{opacity:1;transform:scale(1);}

/* ══ CHECKBOX ══ */
.cbx{width:16px;height:16px;flex-shrink:0;border:2px solid var(--border-subtle);border-radius:var(--radius-xs);
  background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background .2s,border-color .2s;color:var(--on-accent);}
.cbx .ms{opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s;font-size:14px;}
.cbx.is-on{background:var(--accent);border-color:var(--accent);}
.cbx.is-on .ms{opacity:1;transform:scale(1);}

/* ══ CARD ══ */
.card{background:var(--bg-surface);border-radius:var(--radius-md);box-shadow:var(--elev-2);overflow:hidden;}
.card__head{display:flex;align-items:center;gap:var(--s-2);padding:var(--s-3) var(--s-4);
  border-bottom:1px solid var(--border-subtle);}
.card__title{font-size:var(--uxt-theme-typography-sub-title-2-font-size);font-weight:600;}
.card__body{padding:var(--s-4);}
.eyebrow{font-size:var(--uxt-theme-typography-caption-font-size);font-weight:500;letter-spacing:.06em;
  color:var(--fg-muted);}

/* ══ BANNER — severity-led, full-width, actions right ══ */
/* Severity-led: a 3px leading edge carries the severity, an icon states it,
   the body holds the message and any rows, actions sit right. Rows live
   INSIDE __body — they are the message, not siblings of it. */
.Banner{display:flex;align-items:flex-start;gap:var(--s-3);padding:var(--s-3) var(--s-4);
  background:var(--bg-surface);border-radius:var(--radius-md);box-shadow:var(--elev-2);margin-bottom:var(--s-4);
  border-left:3px solid var(--border-default);}
.Banner--critical{border-left-color:var(--critical);}
.Banner--info{border-left-color:var(--info);}
.Banner--critical .Banner__icon{color:var(--uxt-theme-palette-glyph-error);}
.Banner--info .Banner__icon{color:var(--info);}
.Banner__icon{flex-shrink:0;color:var(--fg-muted);margin-top:1px;}
.Banner__body{flex:1;min-width:0;}
.Banner__title{font-size:var(--uxt-theme-typography-body-2-font-size);font-weight:600;}
.Banner__text{font-size:var(--uxt-theme-typography-body-2-font-size);color:var(--fg-muted);line-height:1.5;margin-top:2px;}
.Banner__actions{display:flex;align-items:center;gap:var(--s-2);flex-shrink:0;}
.Banner__rows{margin-top:var(--s-2);}
.Banner__row{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-2) 0;}
.Banner__row+.Banner__row{border-top:1px solid var(--border-subtle);}
.Banner__row-b{flex:1;min-width:0;font-size:var(--uxt-theme-typography-body-2-font-size);line-height:1.5;}
.Banner__row-sub{margin-top:3px;font-size:var(--uxt-theme-typography-caption-font-size);color:var(--fg-muted);}

/* ══ DROPDOWN PANEL — the generic floating surface ══ */
.pop{position:fixed;z-index:330;display:none;flex-direction:column;min-width:220px;max-width:420px;
  max-height:80vh;overflow:hidden;background:var(--bg-surface);border-radius:var(--radius-md);
  box-shadow:var(--elev-4),0 12px 32px rgba(0,0,0,.14);}
.pop.open{display:flex;}
.pop__head{padding:var(--s-3) var(--s-3) var(--s-2);border-bottom:1px solid var(--border-subtle);}
.pop__title{font-size:var(--uxt-theme-typography-body-2-font-size);font-weight:600;}
.pop__sub{font-size:var(--uxt-theme-typography-caption-font-size);color:var(--fg-muted);margin-top:2px;line-height:1.45;}
.pop__body{flex:1;overflow-y:auto;padding:var(--s-2);}
.pop__body--pad{padding:var(--s-3);}
.pop__foot{padding:var(--s-3);border-top:1px solid var(--border-subtle);display:flex;gap:var(--s-2);}
.pop__foot .Button{flex:1;}
.menu{position:fixed;z-index:340;display:none;flex-direction:column;min-width:236px;padding:var(--s-1);
  background:var(--bg-surface);border-radius:var(--radius-md);box-shadow:var(--elev-4),0 12px 32px rgba(0,0,0,.14);}
.menu.open{display:flex;}
.menu__label{padding:var(--s-2) 10px var(--s-1);font-size:var(--uxt-theme-typography-caption-font-size);
  color:var(--fg-faint);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.menu__item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);
  cursor:pointer;font-size:var(--uxt-theme-typography-body-2-font-size);color:var(--fg-default);}
.menu__item:hover{background:var(--bg-hover);}
.menu__item .ms{color:var(--fg-muted);}
.menu__item--danger,.menu__item--danger .ms{color:var(--critical);}
.menu__item.is-disabled{opacity:.45;cursor:not-allowed;}
.menu__item.is-disabled:hover{background:transparent;}
.menu__meta{margin-left:auto;font-family:var(--font-mono);font-size:var(--uxt-theme-typography-caption-font-size);
  color:var(--fg-faint);}
.menu__sep{height:1px;background:var(--border-subtle);margin:var(--s-1) 6px;}
.menu__row{display:flex;align-items:center;gap:var(--s-3);padding:10px 2px;}
.menu__row+.menu__row{border-top:1px solid var(--border-subtle);}
.menu__row-b{flex:1;min-width:0;}
.menu__row-t{font-size:var(--uxt-theme-typography-body-2-font-size);font-weight:500;}
.menu__row-d{font-size:var(--uxt-theme-typography-caption-font-size);color:var(--fg-muted);line-height:1.4;margin-top:1px;}
.pop__note{font-size:var(--uxt-theme-typography-caption-font-size);color:var(--fg-muted);line-height:1.5;
  margin-top:var(--s-3);border-left:2px solid var(--border-subtle);padding-left:10px;}
.pop__warn{display:flex;gap:var(--s-2);align-items:flex-start;margin-top:var(--s-3);
  font-size:var(--uxt-theme-typography-caption-font-size);color:var(--uxt-theme-palette-text-error);line-height:1.5;}
.pop__l{display:block;margin:var(--s-3) 0 5px;font-size:var(--uxt-theme-typography-caption-font-size);
  font-weight:500;color:var(--fg-muted);}
.pop__l:first-child{margin-top:0;}

/* ══ MODAL ══ */
.modal{position:fixed;inset:0;z-index:400;display:none;align-items:center;justify-content:center;
  padding:var(--s-5);background:rgba(12,13,14,.55);}
.modal.open{display:flex;}
.mbox{display:flex;flex-direction:column;overflow:hidden;max-width:100%;max-height:100%;
  background:var(--bg-surface);border-radius:var(--radius-lg);box-shadow:var(--elev-4),0 30px 80px rgba(0,0,0,.35);}
.mbox--narrow{width:520px;}
.mbox--wide{width:auto;min-width:470px;}
.mbox__head{flex-shrink:0;display:flex;align-items:flex-start;gap:var(--s-3);padding:var(--s-4);
  border-bottom:1px solid var(--border-subtle);}
.mbox__head-b{flex:1;min-width:0;}
.mbox__title{font-family:var(--font-display);font-size:var(--uxt-theme-typography-h-6-font-size);font-weight:500;
  line-height:1.3;}
.mbox__sub{font-size:var(--uxt-theme-typography-body-2-font-size);color:var(--fg-muted);margin-top:4px;line-height:1.5;}
.mbox__body{flex:1;min-height:0;overflow-y:auto;padding:var(--s-4);background:var(--bg-panel);}
.mbox__body--plain{background:var(--bg-surface);}
.mbox__foot{flex-shrink:0;display:flex;justify-content:flex-end;gap:var(--s-2);padding:var(--s-3) var(--s-4);
  border-top:1px solid var(--border-subtle);}
.mbox__foot--split{justify-content:space-between;align-items:center;}
.bullets{list-style:none;margin:var(--s-3) 0 0;padding:0;}
.bullets li{position:relative;padding:5px 0 5px 20px;font-size:var(--uxt-theme-typography-body-2-font-size);
  color:var(--fg-muted);line-height:1.55;}
.bullets li::before{content:"";position:absolute;left:5px;top:11px;width:5px;height:5px;border-radius:50%;
  background:var(--fg-faint);}
.bullets li b{color:var(--fg-default);}
.bullets code,.pop__note code,.mbox__body code{font-family:var(--font-mono);font-size:.92em;}

/* ══ TOAST ══ */
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,16px);z-index:500;max-width:80vw;
  padding:10px 18px;border-radius:var(--radius-full);text-align:center;
  background:var(--uxt-theme-palette-octave-main);color:var(--uxt-theme-palette-octave-contrast-text);
  font-size:var(--uxt-theme-typography-body-2-font-size);font-weight:500;
  box-shadow:var(--elev-4),0 8px 26px rgba(0,0,0,.3);
  opacity:0;visibility:hidden;transition:opacity .2s,transform .2s,visibility .2s;}
.toast.on{opacity:1;visibility:visible;transform:translate(-50%,0);}

/* ══════════════════════════════════════════════════════════════════════
   GALLERY
   ══════════════════════════════════════════════════════════════════════ */
.gbody{flex:1;min-height:0;overflow-y:auto;padding:var(--s-5);}
.wrapw{max-width:1340px;}
.tbar{display:flex;align-items:flex-start;gap:var(--s-4);margin-bottom:var(--s-5);flex-wrap:wrap;}
.tbar__t{font-family:var(--font-display);font-size:var(--uxt-theme-typography-h-5-font-size);font-weight:400;
  line-height:1.25;letter-spacing:-.01em;}
.tbar__d{font-size:var(--uxt-theme-typography-body-2-font-size);color:var(--fg-muted);line-height:1.55;
  max-width:660px;margin-top:6px;}
.tbar__r{margin-left:auto;display:flex;align-items:center;gap:var(--s-2);flex-shrink:0;}
.galgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(348px,1fr));gap:var(--s-4);}

/* Flow vs Free Form reads as SHAPE — solid vs dashed leading edge. No second
   hue, and no severity borrowed for something that is not a severity. */
.wfc{display:flex;flex-direction:column;cursor:pointer;overflow:hidden;background:var(--bg-surface);
  border-radius:var(--radius-md);box-shadow:var(--elev-2);border-left:3px solid var(--fg-default);
  transition:box-shadow .15s,transform .12s;}
.wfc:hover{box-shadow:var(--elev-4);transform:translateY(-1px);}
.wfc--ff{border-left-style:dashed;border-left-color:var(--border-default);}
.wfc__head{display:flex;align-items:flex-start;gap:var(--s-2);padding:var(--s-4) var(--s-3) var(--s-2) var(--s-4);}
.wfc__title{flex:1;min-width:0;font-family:var(--font-display);
  font-size:var(--uxt-theme-typography-h-6-font-size);font-weight:500;line-height:1.3;letter-spacing:-.01em;}
.wfc__pills{display:flex;align-items:center;gap:var(--s-2);flex-wrap:wrap;padding:0 var(--s-4) var(--s-4);}
.wfc__body{flex:1;padding:var(--s-3) var(--s-4);border-top:1px solid var(--border-subtle);background:var(--bg-panel);}
.wfc__chips{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:var(--s-2);}
.wfc__foot{display:flex;align-items:center;gap:var(--s-2);padding:var(--s-3) var(--s-4);
  border-top:1px solid var(--border-subtle);font-size:var(--uxt-theme-typography-caption-font-size);color:var(--fg-muted);}
.wfc__foot-r{margin-left:auto;display:flex;align-items:center;gap:var(--s-3);}
.wfc__warn{display:flex;align-items:center;gap:4px;color:var(--critical);font-weight:500;}
.wfc-new{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s-2);
  min-height:186px;padding:var(--s-5);cursor:pointer;color:var(--fg-muted);background:transparent;
  border:1.5px dashed var(--border-default);border-radius:var(--radius-md);
  transition:border-color .15s,color .15s,background .15s;}
.wfc-new:hover{border-color:var(--accent);color:var(--accent);background:var(--bg-surface);}
.wfc-new__t{font-size:var(--uxt-theme-typography-sub-title-2-font-size);font-weight:600;}
.wfc-new__d{font-size:var(--uxt-theme-typography-caption-font-size);text-align:center;line-height:1.5;max-width:250px;}

/* Step chip on a card — a dense Chip, same recipe the step rail summary uses. */
.sstep{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;
  border:1px solid var(--border-subtle);border-radius:var(--radius-full);
  font-size:var(--uxt-theme-typography-caption-font-size);color:var(--fg-default);white-space:nowrap;}
.sstep--fork{border-color:var(--node-accent,var(--border-default));color:var(--node-accent,var(--fg-muted));}
.sstep--more{border-style:dashed;color:var(--fg-muted);}
.sarr{color:var(--fg-faint);display:inline-flex;}
.sgate{color:var(--warning);display:inline-flex;}
.sreq{color:var(--critical);font-weight:700;}

/* ══════════════════════════════════════════════════════════════════════
   EDIT MODE
   ══════════════════════════════════════════════════════════════════════ */
.edit{flex:1;min-height:0;display:flex;flex-direction:column;}
.banner{flex-shrink:0;display:flex;align-items:flex-start;gap:var(--s-4);padding:var(--s-4);
  background:var(--bg-panel);border-bottom:1px solid var(--border-subtle);}
.banner__main{flex:1;min-width:0;display:grid;gap:var(--s-4);
  grid-template-columns:minmax(240px,1.5fr) minmax(190px,.85fr) minmax(240px,1.2fr);}
@media(max-width:1240px){.banner__main{grid-template-columns:1fr 1fr;}}
.banner__right{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:var(--s-2);}
.banner__acts{display:flex;align-items:center;gap:var(--s-2);}
.banner__meta{font-family:var(--font-mono);font-size:var(--uxt-theme-typography-caption-font-size);color:var(--fg-faint);}
/* The Free Form control is a Switch inside a field box, so it sits on the
   same baseline as the other three values instead of floating as a preference. */
.swfield{display:flex;align-items:center;gap:var(--s-3);flex:1;min-width:0;cursor:pointer;}
.swfield__b{flex:1;min-width:0;}
.swfield__t{font-size:var(--uxt-theme-typography-body-2-font-size);font-weight:600;line-height:1.25;}
.swfield__d{font-size:var(--uxt-theme-typography-caption-font-size);color:var(--fg-muted);line-height:1.35;margin-top:1px;}

.work{flex:1;min-height:0;display:flex;overflow:hidden;}

/* ══ STEP LIBRARY ══ */
.lib{width:262px;flex-shrink:0;display:flex;flex-direction:column;min-height:0;
  background:var(--bg-panel);border-right:1px solid var(--border-subtle);}
.lib__head{padding:var(--s-3) var(--s-4);border-bottom:1px solid var(--border-subtle);}
.lib__head-t{font-size:var(--uxt-theme-typography-caption-font-size);font-weight:500;letter-spacing:.06em;color:var(--fg-muted);}
.lib__head-d{font-size:var(--uxt-theme-typography-caption-font-size);color:var(--fg-faint);line-height:1.5;margin-top:5px;}
.lib__body{flex:1;overflow-y:auto;padding:var(--s-2) var(--s-3) var(--s-4);}
.lib__grp{padding:var(--s-3) 6px var(--s-1);font-size:var(--uxt-theme-typography-caption-font-size);
  font-weight:500;letter-spacing:.02em;color:var(--fg-faint);}
.lib__item{display:flex;align-items:center;gap:var(--s-3);padding:9px 10px;margin-bottom:5px;cursor:grab;
  border-radius:var(--radius-md);background:var(--bg-surface);box-shadow:var(--elev-1);user-select:none;
  transition:box-shadow .13s,transform .1s;}
.lib__item:hover{box-shadow:var(--elev-2);}
.lib__item:active{cursor:grabbing;}
.lib__item.dragging{opacity:.4;}
.lib__ico{width:28px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius-sm);background:var(--bg-hover);color:var(--fg-muted);}
.lib__ico .ms,.tilechip .ms{font-size:inherit;}
.lib__item-t{flex:1;min-width:0;font-size:var(--uxt-theme-typography-body-2-font-size);font-weight:500;line-height:1.3;}
.lib__item--fork .lib__ico,.lib__item--act .lib__ico{background:transparent;
  box-shadow:inset 0 0 0 1px var(--node-accent,var(--border-default));color:var(--node-accent,var(--fg-muted));}
/* A Home CREATE tile is not a workflow action — it had been sharing
   .lib__item--act, so it inherited the action accent and then fought the
   tile's own inline colour (§30.25). */
.lib__item--create .lib__ico{box-shadow:inset 0 0 0 1px var(--border-default);}
.lib__item--uds .lib__ico{background:transparent;box-shadow:inset 0 0 0 1px var(--wo-type-ppm);color:var(--wo-type-ppm);}
.lib__used{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;
  padding:0 5px;border-radius:var(--radius-full);background:var(--bg-hover);color:var(--fg-muted);
  font-family:var(--font-mono);font-size:var(--uxt-theme-typography-caption-font-size);font-weight:500;}

/* ══ CANVAS ══ */
.cvwrap{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;background:var(--bg-app);}
.cvbar{flex-shrink:0;display:flex;align-items:center;gap:var(--s-3);padding:var(--s-2) var(--s-4);
  background:var(--bg-panel);border-bottom:1px solid var(--border-subtle);}
.cvbar__t{font-size:var(--uxt-theme-typography-caption-font-size);font-weight:500;letter-spacing:.06em;color:var(--fg-muted);}
.cvbar__d{font-size:var(--uxt-theme-typography-caption-font-size);color:var(--fg-faint);}
.cvbar__r{margin-left:auto;display:flex;align-items:center;gap:var(--s-2);}
.cv{flex:1;min-height:0;overflow:auto;padding:var(--s-5) 94px 72px;position:relative;}
.cv-col{max-width:440px;margin:0 auto;}
.flow{position:relative;display:flex;flex-direction:column;align-items:stretch;}

.node{position:relative;z-index:1;display:flex;align-items:flex-start;gap:var(--s-3);padding:var(--s-3);
  cursor:grab;user-select:none;background:var(--bg-surface);border-radius:var(--radius-md);
  box-shadow:var(--elev-2);transition:box-shadow .13s,opacity .13s;}
.node:hover{box-shadow:var(--elev-3);}
.node.sel{box-shadow:var(--elev-3),0 0 0 2px var(--accent);}
.node.dragging{opacity:.35;}
.node__seq{width:26px;height:26px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius-full);background:var(--uxt-theme-palette-octave-main);
  color:var(--uxt-theme-palette-octave-contrast-text);
  font-family:var(--font-mono);font-size:var(--uxt-theme-typography-caption-font-size);font-weight:600;}
.node__seq--dot{background:transparent;box-shadow:inset 0 0 0 1px var(--border-default);color:var(--fg-muted);}
.node__b{flex:1;min-width:0;}
/* THE RENAME PILL — the delivered step label, kept visible once the name
   diverges from it. Never removed: the name answers "what does the
   technician read", the pill answers "which step am I configuring". */
.node__orig{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 var(--s-2);margin-bottom:5px;
  border-radius:var(--radius-full);background:var(--bg-hover);color:var(--fg-muted);
  font-size:var(--uxt-theme-typography-caption-font-size);font-weight:500;}
.node__name{font-size:var(--uxt-theme-typography-sub-title-2-font-size);font-weight:600;line-height:1.3;word-break:break-word;}
.node__sub{display:flex;align-items:center;gap:var(--s-2);flex-wrap:wrap;margin-top:6px;}
.node__acts{flex-shrink:0;display:flex;align-items:center;}

/* FORK NODE — --wo-type-routine, the one hue borrowed for "this is a
   different KIND of thing", matching the step-chip treatment. */
.node--uds{box-shadow:var(--elev-2),inset 0 0 0 1px var(--wo-type-ppm);}
.node--uds:hover{box-shadow:var(--elev-3),inset 0 0 0 1px var(--wo-type-ppm);}
.node__seq--uds{background:var(--wo-type-ppm);color:#fff;}
/* The card itself carries the error, so a gap is findable by scrolling the
   canvas and not only by reading the banner. */
.node--nocap{box-shadow:var(--elev-2),inset 0 0 0 2px var(--critical);}
.node--nocap:hover{box-shadow:var(--elev-3),inset 0 0 0 2px var(--critical);}
/* AN ACTION AND A FORK CARRY --node-accent, set inline per node from
   nodeAccentStyle() (§30.25). They used to borrow WO Type hues, which made
   all three actions one yellow and both fork kinds one purple — so the two
   distinctions that matter (start vs stop, asked vs evaluated) were not
   drawn at all. The fallback keeps a node visible if a new kind ever lands
   without an accent, rather than rendering borderless. */
.node--act{box-shadow:var(--elev-2),inset 0 0 0 1px var(--node-accent,var(--border-default));}
.node--act:hover{box-shadow:var(--elev-3),inset 0 0 0 1px var(--node-accent,var(--border-default));}
.node__seq--act{background:var(--node-accent,var(--fg-muted));color:#fff;}
.node--fork{box-shadow:var(--elev-2),inset 0 0 0 1px var(--node-accent,var(--border-default));}
.node--fork:hover{box-shadow:var(--elev-3),inset 0 0 0 1px var(--node-accent,var(--border-default));}
.node--fork .node__seq{background:var(--node-accent,var(--fg-muted));color:#fff;}
.fork__q{display:block;width:100%;padding:7px var(--s-3);border-radius:var(--radius-full);
  background:var(--bg-hover);box-shadow:inset 0 0 0 1px var(--node-accent,var(--border-default));
  font-size:var(--uxt-theme-typography-body-2-font-size);font-weight:500;line-height:1.35;text-align:center;
  color:var(--fg-default);}
.fork__q--empty{color:var(--fg-faint);font-style:italic;font-weight:400;box-shadow:inset 0 0 0 1px var(--border-default);}
.fork__ans-row{display:flex;gap:var(--s-2);margin-top:var(--s-2);}
.fork__ans{flex:1;min-width:0;height:30px;padding:0 var(--s-3);border:0;border-radius:var(--radius-full);
  background:var(--bg-hover);box-shadow:inset 0 0 0 1px var(--border-subtle);cursor:pointer;
  color:var(--fg-default);font-family:var(--font-sans);font-size:var(--uxt-theme-typography-caption-font-size);
  font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;
  transition:box-shadow .13s,color .13s;}
.fork__ans:hover{box-shadow:inset 0 0 0 1px var(--node-accent,var(--fg-muted));color:var(--node-accent,inherit);}

/* CONNECTOR + the wire layer */
.conn{position:relative;flex-shrink:0;height:36px;display:flex;align-items:center;justify-content:center;}
.conn__line{position:absolute;top:0;bottom:0;width:2px;background:var(--border-default);}
.conn__head{position:absolute;bottom:-1px;width:0;height:0;border-left:4.5px solid transparent;
  border-right:4.5px solid transparent;border-top:6px solid var(--border-default);}
.conn__plus{position:relative;z-index:2;width:24px;height:24px;padding:0;border:0;border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;
  background:var(--bg-surface);box-shadow:var(--elev-2);color:var(--fg-muted);
  transition:opacity .14s,color .14s,box-shadow .14s;}
.conn:hover .conn__plus{opacity:1;}
.conn__plus:hover{color:var(--wo-type-routine);box-shadow:var(--elev-2),0 0 0 1px var(--wo-type-routine);}
.conn--fork .conn__line,.conn--fork .conn__head{background:var(--wo-type-routine);}
.conn--fork .conn__head{background:transparent;border-top-color:var(--wo-type-routine);}
.forkwires{position:absolute;inset:0;overflow:visible;pointer-events:none;z-index:0;}
.forkwires path{fill:none;stroke:var(--wo-type-routine);stroke-width:1.8;}
.forkwires path.dashed{stroke-dasharray:5 4;}
.fork-end{align-self:center;margin-top:var(--s-2);height:28px;padding:0 var(--s-4);display:inline-flex;
  align-items:center;border-radius:var(--radius-full);background:var(--bg-hover);color:var(--fg-muted);
  font-size:var(--uxt-theme-typography-caption-font-size);font-weight:500;
  box-shadow:inset 0 0 0 1px var(--border-subtle);}
.dropline{height:0;margin:5px 0;border-top:2px dashed var(--accent);border-radius:2px;}

/* ══ MORE ZONE + FREE FORM CANVAS ══
   Under the flow, same width. Tinted with the INFO severity's pale fill —
   Octave's "on track / informational, not a judgment" band — rather than a
   new hue: a More step is not a problem, it is simply outside the sequence. */
.refzone,.ffzone{border-radius:var(--radius-md);overflow:hidden;background:var(--uxt-theme-palette-ui-blue-50);
  box-shadow:inset 0 0 0 1px var(--uxt-theme-palette-ui-blue-100);}
.refzone{max-width:440px;margin:var(--s-5) auto 0;}
.ffzone{max-width:860px;margin:0 auto;}
.refzone.dragover,.ffzone.dragover{box-shadow:inset 0 0 0 2px var(--accent);}
.refzone__head,.ffzone__head{padding:var(--s-3) var(--s-4);border-bottom:1px solid var(--uxt-theme-palette-ui-blue-100);}
.refzone__t{display:flex;align-items:center;gap:6px;color:var(--uxt-theme-palette-ui-blue-900);
  font-size:var(--uxt-theme-typography-caption-font-size);font-weight:600;letter-spacing:.04em;}
.refzone__d{font-size:var(--uxt-theme-typography-caption-font-size);color:var(--fg-muted);line-height:1.5;margin-top:4px;}
.refzone__body{padding:var(--s-3);display:flex;flex-direction:column;gap:var(--s-2);min-height:56px;}
.ffzone__body{padding:var(--s-4);display:grid;grid-template-columns:repeat(auto-fill,minmax(244px,1fr));gap:var(--s-3);}
.refzone__empty{padding:var(--s-3) var(--s-2);text-align:center;font-style:italic;line-height:1.5;
  font-size:var(--uxt-theme-typography-caption-font-size);color:var(--fg-muted);}
[data-uxt-theme="dark"] .refzone,[data-uxt-theme="dark"] .ffzone{background:rgba(137,177,255,.08);
  box-shadow:inset 0 0 0 1px rgba(137,177,255,.22);}
[data-uxt-theme="dark"] .refzone__head,[data-uxt-theme="dark"] .ffzone__head{border-bottom-color:rgba(137,177,255,.18);}
[data-uxt-theme="dark"] .refzone__t{color:var(--uxt-theme-palette-primary-main);}

.cv-empty{max-width:470px;margin:48px auto 0;padding:var(--s-6) var(--s-5);text-align:center;color:var(--fg-muted);
  border:1.5px dashed var(--border-default);border-radius:var(--radius-lg);}
.cv-empty__i{width:48px;height:48px;margin:0 auto var(--s-3);display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius-md);background:var(--bg-surface);box-shadow:var(--elev-2);color:var(--fg-muted);}
.cv-empty__t{font-family:var(--font-display);font-size:var(--uxt-theme-typography-h-6-font-size);font-weight:500;color:var(--fg-default);}
.cv-empty__d{font-size:var(--uxt-theme-typography-body-2-font-size);line-height:1.6;margin-top:6px;}

/* ══ SCREEN DESIGNER PANEL — 40%, resizable, persisted ══ */
.dsn{position:relative;flex:0 0 40%;min-width:436px;max-width:72%;display:flex;flex-direction:column;min-height:0;
  background:var(--bg-panel);border-left:1px solid var(--border-subtle);}
.dsn.closed{display:none;}
.dsn__grip{position:absolute;left:-3px;top:0;bottom:0;width:7px;cursor:col-resize;z-index:5;}
.dsn__grip::after{content:"";position:absolute;top:50%;left:2px;width:2px;height:36px;border-radius:2px;
  background:transparent;transform:translateY(-50%);transition:background 120ms ease;}
.dsn__grip:hover::after{background:var(--border-default);}
.dsn__grip.dragging::after{background:var(--accent);}
.dsn__head{flex-shrink:0;display:flex;align-items:flex-start;gap:var(--s-2);padding:var(--s-3) var(--s-4);
  border-bottom:1px solid var(--border-subtle);}
.dsn__head-b{flex:1;min-width:0;}
.dsn__eyebrow{font-size:var(--uxt-theme-typography-caption-font-size);font-weight:500;letter-spacing:.06em;color:var(--fg-faint);}
.dsn__title{font-family:var(--font-display);font-size:var(--uxt-theme-typography-h-6-font-size);font-weight:500;
  line-height:1.25;margin-top:2px;}
.dsn__key{font-family:var(--font-mono);font-size:var(--uxt-theme-typography-caption-font-size);color:var(--fg-muted);margin-top:3px;}
.dsn__body{flex:1;min-height:0;overflow-y:auto;padding:var(--s-4);background:var(--bg-app);}
.dsn__note{font-size:var(--uxt-theme-typography-caption-font-size);color:var(--fg-muted);line-height:1.55;
  margin-bottom:var(--s-3);border-left:2px solid var(--border-subtle);padding-left:10px;}
.dsn__note--lock{border-left-color:var(--wo-type-ppm);}
.dsn__note--err{border-left-color:var(--critical);}
.dsn__meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:var(--s-2);
  margin-bottom:var(--s-3);}
.dsn__meta-i{padding:var(--s-2) var(--s-3);background:var(--bg-surface);border-radius:var(--radius-sm);
  box-shadow:var(--elev-1);}
.dsn__meta-l{font-size:var(--uxt-theme-typography-caption-font-size);color:var(--fg-faint);}
.dsn__meta-v{font-size:var(--uxt-theme-typography-body-2-font-size);font-weight:600;margin-top:1px;}
/* Language chips in the fork editor — the missing-translation report (§29.4). */
.langbar{display:flex;align-items:center;gap:var(--s-2);flex-wrap:wrap;margin-bottom:var(--s-2);}
.langbar__miss{font-size:var(--uxt-theme-typography-caption-font-size);color:var(--fg-muted);}
.dsn__legend{display:flex;align-items:center;gap:var(--s-4);flex-wrap:wrap;padding:var(--s-2) var(--s-3);
  margin-bottom:var(--s-3);background:var(--bg-surface);border-radius:var(--radius-sm);box-shadow:var(--elev-1);}
.dsn__lg{display:flex;align-items:center;gap:6px;font-size:var(--uxt-theme-typography-caption-font-size);color:var(--fg-muted);}
.dsn__lg-bar{width:3px;height:12px;border-radius:2px;background:var(--border-default);}
.dsn__sec{margin-top:var(--s-4);}
.dsn__sec-h{display:flex;align-items:center;gap:var(--s-2);margin-bottom:var(--s-2);}
.dsn__sec-t{font-size:var(--uxt-theme-typography-caption-font-size);font-weight:500;letter-spacing:.06em;color:var(--fg-muted);}
.dsn__row{display:flex;align-items:center;gap:var(--s-2);padding:10px var(--s-3);background:var(--bg-surface);
  border-radius:var(--radius-sm);box-shadow:var(--elev-1);margin-bottom:6px;}
.dsn__row-b{flex:1;min-width:0;}
.dsn__row-t{font-size:var(--uxt-theme-typography-body-2-font-size);font-weight:500;}
.dsn__row-d{font-size:var(--uxt-theme-typography-caption-font-size);color:var(--fg-muted);line-height:1.4;margin-top:1px;}

/* ══════════════════════════════════════════════════════════════════════
   AVAILABLE FIELDS SIDEBAR
   ══════════════════════════════════════════════════════════════════════
   A fourth column, right of the designer panel, present only while the panel
   is open — it is about the panel's screen, so it has no meaning without one.
   Collapsible to a 34px strip, because on a narrow window the canvas matters
   more than a field list you are not currently using.

   THE LIST IS THE COMPLEMENT OF THE SCREEN: a field leaves it the moment it
   is placed and returns when removed. That makes "what is left to add" the
   question it answers, rather than "what exists", which the layout already
   shows. A search box, because a real function has hundreds of columns.
   ══════════════════════════════════════════════════════════════════════ */
.fldbar{position:relative;flex:0 0 268px;min-width:268px;display:flex;flex-direction:column;min-height:0;
  background:var(--bg-panel);border-left:1px solid var(--border-subtle);}
.fldbar.closed{display:none;}
.fldbar--min{flex:0 0 34px;min-width:34px;}
.fldbar__panel{flex:1;min-height:0;display:flex;flex-direction:column;}
.fldbar--min .fldbar__panel{display:none;}
.fldbar__strip{display:none;flex:1;flex-direction:column;align-items:center;gap:var(--s-3);padding:var(--s-3) 0;
  cursor:pointer;color:var(--fg-muted);}
.fldbar--min .fldbar__strip{display:flex;}
.fldbar__strip:hover{background:var(--bg-hover);color:var(--fg-default);}
.fldbar__strip-l{writing-mode:vertical-rl;white-space:nowrap;letter-spacing:.04em;
  font-size:var(--uxt-theme-typography-caption-font-size);font-weight:500;}
.fldbar__strip-n{font-family:var(--font-mono);font-size:var(--uxt-theme-typography-caption-font-size);
  font-weight:600;padding:2px 4px;border-radius:var(--radius-full);
  box-shadow:inset 0 0 0 1px var(--border-subtle);writing-mode:vertical-rl;}
.fldbar__head{flex-shrink:0;padding:var(--s-3);border-bottom:1px solid var(--border-subtle);}
.fldbar__head-r{display:flex;align-items:center;gap:var(--s-2);}
.fldbar__head-t{flex:1;min-width:0;font-size:var(--uxt-theme-typography-caption-font-size);
  font-weight:500;letter-spacing:.06em;color:var(--fg-muted);}
.fldbar__search{display:flex;align-items:center;gap:var(--s-2);margin-top:var(--s-2);padding:0 var(--s-3);
  height:34px;border:1px solid var(--border-default);border-radius:var(--radius-md);background:transparent;}
.fldbar__search:focus-within{border-color:var(--uxt-theme-palette-action-focus);}
.fldbar__search input{flex:1;min-width:0;border:0;background:0;outline:0;
  font-size:var(--uxt-theme-typography-body-2-font-size);color:inherit;}
.fldbar__search .ms{color:var(--fg-faint);}
.fldbar__body{flex:1;overflow-y:auto;padding:var(--s-2) var(--s-3) var(--s-4);}
.fldbar__item{display:flex;align-items:center;gap:var(--s-2);padding:8px 10px;margin-bottom:5px;cursor:grab;
  border-radius:var(--radius-sm);background:var(--bg-surface);box-shadow:var(--elev-1);user-select:none;}
.fldbar__item:hover{box-shadow:var(--elev-2);}
.fldbar__item:active{cursor:grabbing;}
.fldbar__item.dragging{opacity:.4;}
.fldbar__item-t{flex:1;min-width:0;font-size:var(--uxt-theme-typography-body-2-font-size);font-weight:500;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* The field TYPE, not its function code. A type tells an admin what control
   they are about to place; the code tells them nothing they can act on here. */
.fldbar__item-k{flex-shrink:0;font-size:var(--uxt-theme-typography-caption-font-size);color:var(--fg-faint);}
.fldbar__empty{padding:var(--s-4) var(--s-2);text-align:center;line-height:1.55;
  font-size:var(--uxt-theme-typography-caption-font-size);color:var(--fg-muted);}
/* ADD CONTAINER is a drag source, not a button — you place it where it goes,
   the same gesture as everything else on this surface. */
.addcont{display:flex;align-items:center;justify-content:center;gap:var(--s-2);height:34px;cursor:grab;
  border:1.5px dashed var(--border-default);border-radius:var(--radius-md);color:var(--fg-muted);
  font-size:var(--uxt-theme-typography-caption-font-size);font-weight:500;user-select:none;
  transition:border-color .13s,color .13s;}
.addcont:hover{border-color:var(--accent);color:var(--accent);}
.addcont:active{cursor:grabbing;}
.addcont.dragging{opacity:.4;}

/* ══════════════════════════════════════════════════════════════════════
   MOBILE EMULATOR — the DEVICE's palette, deliberately quarantined
   ══════════════════════════════════════════════════════════════════════
   THE ONE PLACE OCTAVE TOKENS DO NOT APPLY, and it is a decision rather than
   an omission. This is a picture of the technician's app, which has its own
   locked palette (§23): green = complete, the WO Type badge hues, Octave
   Black nav. Restyling it into Octave severity would mean the preview no
   longer shows what the technician sees — and a preview of something else is
   §30.3's argument against a scaled emulator, one step worse.

   So the device palette is declared as local custom properties ON .emu,
   scoped so they cannot leak into the portal around it. Everything here is
   copied from eam-shared.css, not re-picked.
   ══════════════════════════════════════════════════════════════════════ */
.emu{
  --d-ink:#1A1A1F; --d-white:#FFFFFF; --d-bg-page:#F5F6F8; --d-bg-card:#FFFFFF;
  --d-bg-nav:#1A1A1F; --d-bg-section:#F0F2F5; --d-border:#E7EBF2; --d-border-strong:#CBD0D8;
  --d-gray-2:#CBD0D8; --d-gray-3:#B2B8C4; --d-gray-4:#6F7480; --d-green:#16C130; --d-red:#DC2626;
  width:390px;margin:0 auto;border-radius:20px;overflow:hidden;background:var(--d-bg-page);
  box-shadow:var(--elev-4),0 12px 34px rgba(0,0,0,.22);
  font-family:"Inter","Noto Sans",system-ui,sans-serif;color:var(--d-ink);
}
.emu-nav{background:var(--d-bg-nav);padding:9px 14px;display:flex;align-items:center;gap:9px;}
.emu-nav .ms{color:rgba(255,255,255,.72);}
.emu-nav-t{flex:1;min-width:0;color:#fff;font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.emu-nav-c{font-family:var(--font-mono);font-size:10px;color:rgba(255,255,255,.55);}
.emu-lock{display:flex;align-items:center;gap:6px;padding:7px 14px;background:var(--d-bg-section);
  border-bottom:1px solid var(--d-border);font-size:10px;color:var(--d-gray-4);}
.emu-rail{background:var(--d-bg-card);border-radius:28px;margin:10px 12px;padding:0 18px;overflow:hidden;
  box-shadow:0 4px 14px rgba(0,0,0,.12);}
.emu-rail-row{height:56px;display:flex;align-items:center;gap:10px;}
.emu-rail-pill{flex-shrink:0;padding:2px 8px;border-radius:100px;background:var(--d-ink);color:var(--d-white);
  font-family:var(--font-mono);font-size:10px;font-weight:700;}
.emu-rail-n{flex:1;min-width:0;font-size:15px;font-weight:600;line-height:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.emu-rail-segs{display:flex;gap:2px;flex-shrink:0;}
.emu-seg{height:3px;width:13px;border-radius:2px;background:var(--d-gray-2);}
.emu-seg.done{background:var(--d-green);}
.emu-seg.active{background:var(--d-ink);}
.emu-seg.na{background:var(--d-gray-3);opacity:.45;}
.emu-rail-type{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;}
.emu-body{padding:2px 14px 4px;min-height:132px;}
.emu-sec{display:flex;align-items:center;gap:7px;margin:14px 0 4px;padding-bottom:5px;
  border-bottom:1px solid var(--d-border);color:var(--d-gray-4);font-size:11px;font-weight:700;letter-spacing:.05em;}
.emu-sec-n{flex:1;min-width:0;}
.emu-sec-a{width:22px;height:22px;border:0;background:0;border-radius:5px;cursor:pointer;color:var(--d-gray-3);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.emu-sec:hover .emu-sec-a{color:var(--d-gray-4);}
.emu-sec-a:hover{background:var(--d-bg-section);}
/* CONTAINER REORDER. The header is the handle — the body holds draggable
   fields, so making the whole container draggable would fight them. */
.emu-sec{cursor:grab;user-select:none;}
.emu-sec.dragging{opacity:.4;}
.emu-sec.over-top{box-shadow:inset 0 2px 0 var(--d-ink);}
.emu-sec.over-bot{box-shadow:inset 0 -2px 0 var(--d-ink);}
/* Container 0 is pinned. Nothing may be placed above it — see §5.2. */
.emu-sec--pinned{cursor:default;}
.emu-sec-pin{flex-shrink:0;color:var(--d-gray-3);display:flex;}
/* DISPLAY STATE (§5.2). Collapsed hides the body but keeps the header, which
   is the point of a collapsible container. Hidden fades the whole thing,
   header included, because the technician will not see it at all. */
.emu-sec--hidden{opacity:.42;}
.emu-sec-state{flex-shrink:0;display:flex;color:var(--d-gray-4);}
.emu-secbody--collapsed{display:none;}
/* THE NON-STANDARD CONTAINER (WO Record View's Activities, §15.2). Marked so
   nobody treats it as an ordinary field container — it is a single-select
   record list with its own add/edit popup and its own completion state. */
.emu-sec--nonstd{box-shadow:inset 2px 0 0 var(--wo-type-breakdown);padding-left:7px;}
.emu-sec-nonstd{flex-shrink:0;display:flex;color:var(--wo-type-breakdown);}
.emu-dropline{height:0;margin:6px 0;border-top:2px dashed var(--d-ink);border-radius:2px;}
.emu-nonstd-note{margin:2px 0 10px;padding:8px 10px;border-radius:9px;
  background:rgba(245,130,31,.07);box-shadow:inset 0 0 0 1px var(--wo-type-breakdown);
  font-size:11px;line-height:1.5;color:var(--d-gray-4);}
.emu-nonstd-note b{color:var(--d-ink);}
.emu-f{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--d-border);
  cursor:grab;position:relative;user-select:none;}
.emu-f.dragging{opacity:.35;}
.emu-f.over-top{box-shadow:inset 0 2px 0 var(--d-ink);}
.emu-f.over-bot{box-shadow:inset 0 -2px 0 var(--d-ink);}
.emu-f-bar{width:3px;align-self:stretch;border-radius:2px;background:transparent;flex-shrink:0;}
.emu-f-bar.req{background:var(--d-red);}
.emu-f-bar.prot{background:#F5821F;}
.emu-f-l{flex:1;min-width:0;font-size:12px;color:var(--d-gray-4);}
.emu-f-v{flex-shrink:0;max-width:44%;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.emu-f .ms{color:var(--d-gray-3);}
.emu-f.hid{opacity:.4;}
.emu-f.na{opacity:.5;padding:5px 0;}
.emu-f.na .emu-f-l{text-decoration:line-through;}
.emu-f.na .emu-f-v{font-size:10px;color:var(--d-gray-3);font-style:italic;font-weight:500;}
.emu-f-star{color:var(--d-red);font-weight:700;margin-left:2px;}
.emu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:6px 0 10px;}
.emu-cell{position:relative;display:flex;flex-direction:column;gap:2px;padding:8px 10px 8px 13px;cursor:grab;
  background:var(--d-bg-card);border:1px solid var(--d-border);border-radius:9px;user-select:none;}
.emu-cell.dragging{opacity:.35;}
.emu-cell.over-top{box-shadow:inset 0 2px 0 var(--d-ink);}
.emu-cell.over-bot{box-shadow:inset 0 -2px 0 var(--d-ink);}
.emu-cell .emu-f-bar{position:absolute;left:0;top:7px;bottom:7px;width:3px;align-self:auto;}
.emu-cell-l{font-size:9.5px;font-weight:700;letter-spacing:.3px;color:var(--d-gray-4);}
.emu-cell-v{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.emu-cell.hid{opacity:.4;}
.emu-cell.na{opacity:.5;}
.emu-cell.na .emu-cell-l{text-decoration:line-through;}
.grid-grip{position:absolute;right:-5px;top:0;bottom:0;width:11px;cursor:ew-resize;z-index:2;}
.grid-grip::after{content:"";position:absolute;right:4px;top:50%;transform:translateY(-50%);
  width:3px;height:16px;border-radius:2px;background:var(--d-gray-2);transition:background .15s;}
.emu-cell:hover .grid-grip::after,.grid-grip:hover::after{background:var(--d-gray-4);}
/* UDS preview rows — read-only by construction (§27.4 role 1). No drag
   handle, no context menu, and they are rendered as placeholders rather than
   as named fields because this screen does not know the names. */
/* A BUTTON FIELD. It participates in the field-behavior system so it can be
   shown or hidden per group — which is the whole reason it is modelled as a
   field rather than as screen furniture. It supports Optional (visible) and
   Hidden only: Required and Protected are meaningless for something that is
   not a value, and N/A has no rendering for a control. */
.emu-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:30px;padding:0 14px;
  border-radius:100px;background:var(--d-ink);color:#fff;font-size:12px;font-weight:600;
  font-family:var(--font-sans);white-space:nowrap;cursor:grab;user-select:none;position:relative;}
.emu-btn--out{background:transparent;color:var(--d-ink);box-shadow:inset 0 0 0 1.5px var(--d-gray-2);}
.emu-btn.dragging{opacity:.35;}
.emu-btn.hid{opacity:.4;}
.emu-btn.over-top{box-shadow:inset 2px 0 0 var(--d-ink);}
.emu-btn.over-bot{box-shadow:inset -2px 0 0 var(--d-ink);}
.emu-btnrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0 10px;}
.emu-uds{padding:2px 14px 10px;}
.emu-uds-row{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:9px 0;
  border-bottom:1px solid var(--d-border);}
.emu-uds-row:last-child{border-bottom:none;}
.emu-uds-l{font-size:12px;color:var(--d-gray-4);}
.emu-uds-v{font-size:12px;color:var(--d-gray-3);}
/* An empty container needs a real target. The old placeholder was a single
   ~30px row, which is a small thing to hit at the end of a drag. */
.emu-dropzone{display:flex;align-items:center;justify-content:center;min-height:64px;margin:6px 0 10px;
  border:1.5px dashed var(--d-gray-2);border-radius:9px;color:var(--d-gray-4);font-size:11.5px;}
.emu-gate{margin-top:12px;margin-bottom:7px;padding:8px 10px;border:1px solid #F5821F;border-radius:9px;
  background:rgba(245,130,31,.07);}
.emu-gate-l{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;color:var(--d-ink);}
.emu-gate-l .ms{color:#F5821F;}
.emu-gate-r{margin-left:auto;font-size:9px;font-weight:700;letter-spacing:.04em;color:#F5821F;}
.emu-gate-i{margin-top:6px;padding:7px 9px;background:var(--d-bg-card);border:1px solid var(--d-border);
  border-radius:7px;font-size:11px;color:var(--d-gray-3);}
.emu-bar{margin:14px 14px 13px;padding:12px;border-radius:100px;display:flex;align-items:center;
  justify-content:center;gap:7px;background:var(--d-ink);color:#fff;font-size:13.5px;font-weight:700;}
.emu-bar.locked{background:var(--d-gray-2);color:var(--d-gray-4);}
.emu-q{padding:22px 16px 18px;text-align:center;font-size:15px;font-weight:700;line-height:1.45;}
.emu-q.empty{color:var(--d-gray-3);font-weight:500;font-style:italic;}
.emu-ans{padding:0 14px;display:flex;flex-direction:column;gap:8px;}
.emu-ans-b{padding:11px;border:1.5px solid var(--d-gray-2);border-radius:100px;text-align:center;
  font-size:13.5px;font-weight:700;}
.emu-ans-s{margin-top:-4px;text-align:center;font-size:10px;font-weight:500;color:var(--d-gray-4);}
/* ── A PULL-UP SHEET, drawn (2026-09-17) ──
   Both "User selected" actions interrupt the technician with a sheet rather
   than a screen, so the preview has to draw one or the difference between
   the two modes is invisible. The screen behind it is faded, not removed —
   that IS the difference from a fork, which is a screen of its own.
   Device palette only; the §30.8 quarantine holds. */
