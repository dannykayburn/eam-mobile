.emu-behind{padding:4px 14px 14px;opacity:.34;}
.emu-scrim{height:14px;background:linear-gradient(rgba(26,26,31,0),rgba(26,26,31,.12));}
.emu-sheet{background:var(--d-bg-card);border-radius:18px 18px 0 0;padding:9px 16px 16px;
  box-shadow:0 -7px 22px rgba(0,0,0,.15);}
.emu-sheet__grab{width:38px;height:4px;border-radius:3px;background:var(--d-gray-2);margin:0 auto 12px;}
.emu-sheet__t{font-size:15px;font-weight:700;line-height:1.3;}
.emu-sheet__d{font-size:11px;color:var(--d-gray-4);line-height:1.5;margin-top:4px;}
.emu-sheet__sel{margin-top:11px;display:flex;align-items:center;gap:8px;padding:11px 12px;
  border:1.5px solid var(--d-border-strong);border-radius:10px;font-size:12.5px;font-weight:600;
  color:var(--d-gray-4);}
/* The one EDITABLE row in a sheet whose other rows are protected. Reads as a
   real input rather than a value, because "which of these can I change" is
   the only question worth answering on that sheet. */
.emu-sheet__in{margin-top:9px;display:flex;align-items:center;gap:8px;padding:10px 12px;
  border:1.5px solid var(--d-ink);border-radius:10px;background:var(--d-bg-card);}
.emu-sheet__in-l{flex:1;min-width:0;font-size:11px;color:var(--d-gray-4);}
.emu-sheet__in-v{flex-shrink:0;font-size:14px;font-weight:700;}
.emu-sheet__sel .ms{margin-left:auto;color:var(--d-gray-3);}
.emu-sheet__note{margin-top:11px;padding:8px 10px;border-radius:9px;background:var(--d-bg-section);
  font-size:10.5px;color:var(--d-gray-4);line-height:1.5;}
.emu-sheet__note b{color:var(--d-ink);}
.emu-sheet__acts{display:flex;gap:8px;margin-top:13px;}
.emu-sheet__b{flex:1;padding:11px;border-radius:100px;text-align:center;font-size:13px;font-weight:700;
  background:var(--d-ink);color:var(--d-white);}
.emu-sheet__b--out{background:transparent;color:var(--d-ink);box-shadow:inset 0 0 0 1.5px var(--d-gray-2);}
/* A "no screen at all" state — the system-action modes. Says what the
   technician sees, which is nothing, rather than drawing an empty phone. */
.emu-silent{padding:26px 20px;text-align:center;}
.emu-silent__i{width:44px;height:44px;margin:0 auto 11px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;background:var(--d-bg-section);color:var(--d-gray-4);}
.emu-silent__t{font-size:14px;font-weight:700;}
.emu-silent__d{font-size:11px;color:var(--d-gray-4);line-height:1.6;margin-top:6px;}
.emu-map{background:var(--d-bg-card);border-top:1px solid var(--d-border);padding:10px 0 12px;}
.emu-mi{display:flex;align-items:center;gap:10px;padding:6px 14px;margin:0 6px;border-radius:4px;}
.emu-mi.active{background:var(--d-bg-section);}
.emu-mi-ico{width:22px;height:22px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  border-radius:50%;font-family:var(--font-mono);font-size:10px;font-weight:700;}
.smi-done{background:var(--d-green);color:#fff;}
.smi-active{background:var(--d-ink);color:#fff;}
.smi-locked{background:none;box-shadow:inset 0 0 0 2px var(--d-gray-3);color:var(--d-gray-3);}
.smi-na{background:none;box-shadow:inset 0 0 0 2px var(--d-gray-3);color:var(--d-gray-3);}
.emu-mi-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:inset 0 0 0 1.5px var(--d-border-strong);}
.emu-mi.active .emu-mi-dot{background:var(--d-ink);box-shadow:inset 0 0 0 1.5px var(--d-ink);}
.emu-mi-l{flex:1;min-width:0;font-size:15px;font-weight:500;color:var(--d-ink);}
.emu-mi.active .emu-mi-l{font-weight:700;}
.emu-mi.naRow .emu-mi-l{color:var(--d-gray-4);}
.emu-mi-tag{flex-shrink:0;padding:0 5px;border-radius:100px;box-shadow:inset 0 0 0 1px var(--d-border-strong);
  font-family:var(--font-mono);font-size:9px;font-weight:700;color:var(--d-gray-4);}
.emu-mi-ch{flex-shrink:0;color:var(--d-gray-4);display:flex;}
.emu-mgrp{padding:14px 20px 6px;margin-top:4px;border-top:1px solid var(--d-border);color:var(--d-gray-4);
  font-size:11px;font-weight:700;letter-spacing:.4px;}
/* The emulator keeps a light device even in dark mode: the technician's app
   has its own theme, and a dark portal does not make their phone dark. */
[data-uxt-theme="dark"] .emu{box-shadow:var(--elev-4),0 12px 34px rgba(0,0,0,.5);}

/* ══ PREVIEW MODAL EXTRAS ══ */
.prev-tabs{display:flex;align-items:center;gap:var(--s-1);padding:3px;overflow-x:auto;scrollbar-width:none;
  border:1px solid var(--border-subtle);border-radius:var(--radius-full);background:var(--bg-surface);}
.prev-tabs::-webkit-scrollbar{display:none;}
.prev-tab{flex-shrink:0;display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 var(--s-3);border:0;
  border-radius:var(--radius-full);background:transparent;color:var(--fg-muted);cursor:pointer;
  font-family:var(--font-sans);font-size:var(--uxt-theme-typography-caption-font-size);font-weight:500;white-space:nowrap;}
.prev-tab:hover{background:var(--uxt-theme-palette-action-hover);color:var(--fg-default);}
.prev-tab.is-active{background:var(--bg-panel);color:var(--accent);
  box-shadow:0 2px 1px -1px rgba(0,0,0,.2),0 1px 1px 0 rgba(0,0,0,.14),0 1px 3px 0 rgba(0,0,0,.12);}
.prev-tab__n{font-family:var(--font-mono);}

/* ══ DESIGN NOTES ══ */
.notes{position:fixed;right:16px;bottom:16px;z-index:420;width:460px;max-width:calc(100vw - 32px);max-height:78vh;
  display:none;flex-direction:column;overflow:hidden;background:var(--bg-surface);
  border-radius:var(--radius-lg);box-shadow:var(--elev-4),0 20px 54px rgba(0,0,0,.26);}
.notes.open{display:flex;}
.notes__head{display:flex;align-items:center;gap:var(--s-2);padding:var(--s-3) var(--s-4);
  border-bottom:1px solid var(--border-subtle);}
.notes__title{flex:1;font-family:var(--font-display);font-size:var(--uxt-theme-typography-sub-title-1-font-size);font-weight:500;}
.notes__body{flex:1;overflow-y:auto;padding:var(--s-3) var(--s-4) var(--s-4);}
.note{padding:var(--s-3) 0;border-bottom:1px solid var(--border-subtle);}
.note:last-child{border-bottom:none;}
.note__n{font-family:var(--font-mono);font-size:var(--uxt-theme-typography-caption-font-size);color:var(--fg-faint);}
.note__t{font-size:var(--uxt-theme-typography-body-2-font-size);font-weight:600;margin:2px 0 4px;}
.note__d{font-size:var(--uxt-theme-typography-body-2-font-size);color:var(--fg-muted);line-height:1.6;}
.note__d b{color:var(--fg-default);}
.note__tag{display:inline-block;margin-top:6px;padding:1px 8px;border-radius:var(--radius-full);
  background:var(--bg-hover);color:var(--fg-muted);
  font-family:var(--font-mono);font-size:var(--uxt-theme-typography-caption-font-size);}

/* ══════════════════════════════════════════════════════════════════════
   NEW AREAS — offline registry, home layout editor, group binding view
   ══════════════════════════════════════════════════════════════════════ */
/* The per-entity registry. A table would fight the dropdowns and the long
   rationale lines, so it is a row list with three columns that collapse. */
.reg{padding:0 0 var(--s-2);}
/* The measurement caption under a dataspy control. Muted by default because it
   is a budget readout, and coloured only when a cap is actually breached — the
   number is always worth seeing, the alarm is not always warranted. */
.reg__meas{font-size:var(--uxt-theme-typography-caption-font-size);color:var(--fg-muted);
  line-height:1.4;margin-top:2px;}
.reg__meas.is-breach{color:var(--uxt-theme-palette-status-red-900);font-weight:600;}
.reg__grp{padding:var(--s-3) var(--s-4) var(--s-1);background:var(--bg-panel);
  border-top:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle);
  font-size:var(--uxt-theme-typography-caption-font-size);font-weight:600;letter-spacing:.06em;color:var(--fg-muted);}
.reg__row{display:grid;grid-template-columns:minmax(0,1fr) 190px 220px;gap:var(--s-3);align-items:start;
  padding:var(--s-3) var(--s-4);border-bottom:1px solid var(--border-subtle);}
@media(max-width:1100px){.reg__row{grid-template-columns:1fr;}}
/* A server-only row is not a failure, it is the default — so it recedes
   rather than shouting. */
.reg__row--off{opacity:.66;}
.reg__name{min-width:0;display:flex;align-items:center;gap:var(--s-2);flex-wrap:wrap;}
.reg__label{font-size:var(--uxt-theme-typography-body-2-font-size);font-weight:600;}
.reg__note{flex-basis:100%;font-size:var(--uxt-theme-typography-caption-font-size);color:var(--fg-muted);
  line-height:1.5;margin-top:2px;}
.reg__pol,.reg__spy{min-width:0;}
.reg__dash{font-size:var(--uxt-theme-typography-caption-font-size);color:var(--fg-faint);}

/* Home layout editor: available tiles left, a real phone right. */
.homewrap{display:flex;align-items:flex-start;gap:var(--s-4);flex-wrap:wrap;}
.homepane{flex:1 1 320px;min-width:300px;}
.homephone{flex:0 0 430px;}
/* A condition fork reuses the question fork's card shape — they are the
   same routing object with a different answerer — but takes the PPM hue
   rather than Routine's, so the two are distinguishable at a glance
   without inventing a fifth colour (§23). */
/* The condition fork's own ring — the accent comes from the node, so this
   rule only owns the elevation difference (a condition is quieter than a
   question: nobody has to answer it). */
.node--cond{box-shadow:inset 0 0 0 1px var(--node-accent,var(--border-default)),var(--elev-1);}
/* A rule inside a modal body, where two groups of fields need separating
   without a heading for each. */
.pop__sep{height:1px;background:var(--border-subtle);margin:var(--s-4) 0 var(--s-2);}

/* ══ PROTECTED FIELD ══
   §5.2's treatment, brought over for the caps: a protected field loses its
   border and carries a lock, so "you cannot edit this" is legible without
   clicking it to find out. */
.input--prot{display:flex;align-items:center;gap:var(--s-2);background:transparent;
  box-shadow:none;border:none;padding:7px 0;min-height:var(--uxt-theme-height-input,36px);}
.input__v{flex:1;min-width:0;font-size:var(--uxt-theme-typography-body-2-font-size);
  font-weight:600;color:var(--fg-default);}
.input__lock{flex-shrink:0;color:var(--fg-faint);}

/* ══ POLICY DEFINITIONS ══
   A definition list, not a legend of colours — the question an author has
   at the dropdown is "what does work-set actually mean", and the answer is
   three sentences, not a swatch. */
.pdef{display:grid;gap:1px;background:var(--border-subtle);}
.pdef__r{display:grid;grid-template-columns:150px 108px 1fr;gap:var(--s-4);
  padding:var(--s-3) var(--s-4);background:var(--bg-surface);align-items:start;}
.pdef__h{background:var(--bg-app);}
.pdef__h .pdef__n,.pdef__h .pdef__rw,.pdef__h .pdef__d{
  font-size:var(--uxt-theme-typography-caption-font-size);font-weight:500;
  letter-spacing:.06em;color:var(--fg-muted);text-transform:none;}
.pdef__n{font-size:var(--uxt-theme-typography-body-2-font-size);font-weight:700;color:var(--fg-default);}
.pdef__who{font-size:var(--uxt-theme-typography-caption-font-size);color:var(--fg-faint);
  line-height:1.5;margin-top:3px;}
.pdef__rw{display:flex;flex-direction:column;gap:4px;}
.pdef__d{font-size:var(--uxt-theme-typography-body-2-font-size);line-height:1.6;color:var(--fg-default);}
.pdef__why{font-size:var(--uxt-theme-typography-caption-font-size);line-height:1.6;
  color:var(--fg-muted);margin-top:5px;}
.pdef__f{margin-top:6px;}
@media (max-width:900px){.pdef__r{grid-template-columns:1fr;gap:var(--s-2);}}

/* A section marker in the gallery card's chip run, so a card shows the
   SHAPE of the layout and not just a flat list of tile names. */
.sstep--sec{background:var(--bg-hover);font-weight:600;color:var(--fg-default);}
/* "optional" beside a field label — the offline registry needed the same
   distinction and this is its 2nd consumer, so it is a class not an inline. */
.pop__opt{margin-left:5px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--fg-faint);}
/* A menu row that is offered but cannot apply (first section cannot move
   up). Kept visible rather than omitted, so the menu does not change shape
   row to row — the clamp itself lives at the mutation. */
.menu__item--off{opacity:.4;pointer-events:none;}

/* ══ HOME PREVIEW ══
   Rebuilt 2026-09-16 against eam-home-screen-prototype-v1.html, which the
   old 2-up grid of big-number cards did not resemble at all. The device is:
   a PINNED create bar outside the scroll container, then a Favorites row of
   56px circles, then labelled sections of 100px square tiles in
   HORIZONTALLY SCROLLING rows.

   THE ONE DELIBERATE DIVERGENCE — the editor wraps where the device
   scrolls, because HTML5 drag-and-drop does not auto-scroll a container
   and a tile past the fold would otherwise be undroppable. Three columns
   is not a design choice, it is the device arithmetic: 390 − 28 padding =
   362px, and 100px tiles with 10px gaps put the 4th at 430px. So LINE ONE
   OF THIS GRID IS EXACTLY WHAT THE TECHNICIAN SEES without scrolling, and
   everything below it is behind a swipe. .emu-sec__fold draws that line. */
.emu-body{background:var(--d-bg-page);padding:0 0 14px;}

/* The create bar: pinned, outside the scroll body on the device (§9.4). */
.emu-cbar{padding:10px 14px 12px;border-bottom:1px solid var(--d-border);background:var(--d-bg-page);}
.emu-cpill{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--d-bg-nav);border-radius:100px;padding:11px 0;color:#fff;font-size:13px;font-weight:700;}
.emu-cpill .ms{color:#fff;}
.emu-ctray{margin-top:8px;border-radius:10px;border:1px dashed var(--d-border-strong);padding:6px;min-height:52px;}
.emu-ctray.is-over{border-color:var(--d-ink);background:var(--d-bg-section);}
.emu-ctray.is-bad{border-color:var(--d-red);background:rgba(220,38,38,.06);}
.emu-ctray__e{padding:14px 6px;text-align:center;font-size:10.5px;color:var(--d-gray-4);line-height:1.5;}
.emu-crow{display:flex;align-items:center;gap:9px;padding:8px 8px;border-radius:8px;cursor:grab;
  background:var(--d-bg-card);box-shadow:0 1px 2px rgba(0,0,0,.08);margin-bottom:5px;user-select:none;}
.emu-crow:last-child{margin-bottom:0;}
.emu-crow.dragging{opacity:.35;}
.emu-crow__l{flex:1;min-width:0;font-size:12px;font-weight:600;color:var(--d-ink);}
.emu-crow__x{flex-shrink:0;color:var(--d-gray-3);}

/* Favorites — TECHNICIAN-OWNED. Shown as ghosts because the admin cannot
   put anything in it; the row is a placeholder for the technician's own
   starred dataspies. Position and presence are the only authorable facts. */
.emu-fav{padding:12px 14px 4px;}
.emu-fav__r{display:flex;gap:16px;margin-top:8px;}
.emu-fav__g{width:56px;display:flex;flex-direction:column;align-items:center;gap:6px;}
.emu-fav__c{width:56px;height:56px;border-radius:50%;border:1px dashed var(--d-border-strong);}
.emu-fav__t{width:38px;height:7px;border-radius:4px;background:var(--d-border);}
.emu-fav__n{font-size:10px;color:var(--d-gray-4);margin-top:6px;line-height:1.5;}

/* A section: label, then the wrapped tile grid. */
.emu-sec{padding:14px 14px 0;}
.emu-sec__h{display:flex;align-items:center;gap:6px;margin-bottom:2px;}
.emu-sec__t{flex:1;min-width:0;font-size:15px;font-weight:800;letter-spacing:.1px;color:var(--d-ink);}
.emu-sec__t--none{color:var(--d-red);font-weight:600;font-style:italic;}
.emu-sec__c{flex-shrink:0;font-family:var(--font-mono);font-size:10px;color:var(--d-gray-4);}
/* FIXED 100px COLUMNS, NOT 3 x 1fr. The device tile is 100px with a 10px
   gap (which is where HOME_FOLD's own arithmetic comes from), so 1fr made
   every square 114px — a preview at the wrong scale, and the 42px of
   leftover room is exactly the sliver the device shows of tile 4. */
.emu-sec__row{display:grid;grid-template-columns:repeat(3,100px);gap:10px;padding-top:10px;position:relative;}
.emu-sec__row.is-over{outline:2px dashed var(--d-ink);outline-offset:3px;border-radius:8px;}
.emu-sec__row.is-bad{outline:2px dashed var(--d-red);outline-offset:3px;border-radius:8px;}
/* The fold: everything after this line needs a horizontal swipe on the
   device. Spans the grid so it reads as a rule, not a gap. */
.emu-sec__fold{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin:2px 0 -2px;}
.emu-sec__fold::before,.emu-sec__fold::after{content:"";flex:1;height:1px;background:var(--d-border-strong);}
.emu-sec__fold-t{flex-shrink:0;font-size:9.5px;font-weight:700;letter-spacing:.04em;color:var(--d-gray-4);}

.hometile{display:flex;flex-direction:column;align-items:center;cursor:grab;user-select:none;position:relative;}
.hometile.dragging{opacity:.35;}
/* ONE FACE, THREE PLACES. The square's own colour is set inline by
   tileSquareStyle() — the device's rule exactly: background is the chosen
   colour at 13%, the glyph is the colour at full strength. The glyph
   INHERITS, so neither can be set without the other. */
.hometile__sq{width:100%;max-width:100px;aspect-ratio:1;border-radius:20px;display:flex;align-items:center;
  justify-content:center;background:var(--d-bg-card);box-shadow:0 1px 3px rgba(0,0,0,.1);
  position:relative;color:var(--d-gray-4);}
.hometile__sq[style*="background:color-mix"]{box-shadow:none;}
.hometile__ico{color:inherit;display:flex;}
/* 36px, because the device draws 38px in the same 100px square and a 24px
   glyph read as a different component rather than a smaller one. */
.hometile__sq .hometile__ico .ms{font-size:36px;}
.hometile__b{position:absolute;top:-6px;right:-6px;background:var(--d-ink);color:var(--d-white);font-size:10px;
  font-weight:700;font-family:var(--font-mono);border-radius:100px;padding:1px 5px;min-width:17px;text-align:center;
  border:2px solid var(--d-bg-page);}
.hometile__l{font-size:12px;font-weight:500;color:var(--d-ink);text-align:center;margin-top:7px;line-height:1.3;}
.hometile--past .hometile__sq{opacity:.55;}
.hometile--gap .hometile__sq{box-shadow:inset 0 0 0 2px var(--d-red);}

/* Editor-only affordance on a device surface — same licence the designer
   panel takes: real emulator, plus the controls authoring needs. */
.emu-secbtn{flex-shrink:0;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;
  justify-content:center;color:var(--d-gray-4);cursor:pointer;}
.emu-secbtn:hover{background:var(--d-bg-section);color:var(--d-ink);}
/* The icon picker in the nav-item modal. A grid rather than a <select>,
   because the thing being chosen IS the glyph — a list of names makes an
   admin guess what "route" looks like. */
.icopick{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 4px;}
.icopick__b{width:38px;height:38px;border-radius:var(--radius-md);border:1px solid var(--border-default);
  background:transparent;color:var(--fg-muted);
  display:flex;align-items:center;justify-content:center;cursor:pointer;}
.icopick__b:hover{border-color:var(--uxt-theme-palette-text-link);color:var(--fg-default);}
.icopick__b.is-on{border-color:var(--uxt-theme-palette-action-focus);border-width:2px;color:var(--fg-default);
  background:var(--uxt-theme-palette-action-selected);}

/* THE COLOUR BADGES (§30.25). One set, six values, used wherever anything
   in this portal is given a colour — see BADGE_COLORS. A swatch grid rather
   than a <select> for the same reason the icon picker is one: the thing being
   chosen is the colour. */
.swatch{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 4px;}
.swatch__b{width:38px;height:38px;border-radius:var(--radius-md);border:1px solid var(--border-default);
  background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.swatch__b:hover{border-color:var(--uxt-theme-palette-text-link);}
.swatch__b.is-on{border-color:var(--uxt-theme-palette-action-focus);border-width:2px;}
.swatch__d{width:18px;height:18px;border-radius:var(--radius-full);}
.swatch__d--none{box-shadow:inset 0 0 0 2px var(--border-default);}

/* ── THE APP NAVIGATION BAR (§30.24) ──
   Drawn with the DEVICE palette like the rest of .emu, and deliberately
   the real thing: dark bar, glass-pill active slot, fixed equal slots.
   It is the one surface in this editor that is NOT part of Home — see the
   note the editor prints under it. */
.emu-navwrap{margin-top:14px;}
.emu-navbar{display:flex;align-items:flex-start;justify-content:center;gap:14px;
  background:var(--d-bg-nav);padding:9px 6px 11px;border-top:1px solid rgba(255,255,255,.22);}
.emu-navitem{width:84px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;border-radius:100px;cursor:grab;user-select:none;position:relative;
  color:rgba(255,255,255,.55);}
.emu-navitem:hover{color:rgba(255,255,255,.85);}
.emu-navitem--on{color:#fff;background:rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.25);}
.emu-navitem--pinned{cursor:default;}
.emu-navitem__l{font-size:10.5px;font-weight:600;text-align:center;line-height:1.25;max-width:100%;}
.emu-navitem__p{position:absolute;top:1px;right:6px;color:rgba(255,255,255,.4);display:flex;}
.emu-navitem--gap{box-shadow:inset 0 0 0 2px var(--d-red);}
.emu-navitem--long .emu-navitem__l{text-decoration:underline dotted rgba(255,255,255,.5);text-underline-offset:2px;}
.emu-navitem.dragging{opacity:.35;}
.emu-navitem.over-l{box-shadow:inset 2px 0 0 #fff;}
.emu-navitem.over-r{box-shadow:inset -2px 0 0 #fff;}
.emu-navadd{width:84px;padding:8px 2px;border-radius:12px;border:1px dashed rgba(255,255,255,.35);
  background:none;color:rgba(255,255,255,.55);font-family:inherit;font-size:9.5px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;}
.emu-navadd:hover{border-color:#fff;color:#fff;}
.emu-navbar.is-over{outline:2px dashed #fff;outline-offset:-3px;}
.emu-navnote{padding:9px 14px 12px;background:var(--d-bg-section);border-top:1px solid var(--d-border);
  font-size:10px;line-height:1.55;color:var(--d-gray-4);}
.emu-navnote b{color:var(--d-ink);}
.emu-navnote__m{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap;}
.emu-navnote__c{font-family:var(--font-mono);font-size:9.5px;color:var(--d-gray-4);
  background:var(--d-bg-card);border:1px solid var(--d-border);border-radius:5px;padding:2px 6px;}
.emu-addsec{margin:14px 14px 0;padding:11px;border-radius:10px;border:1px dashed var(--d-border-strong);
  display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;
  font-size:12px;font-weight:600;color:var(--d-gray-4);background:transparent;width:calc(100% - 28px);
  font-family:inherit;}
.emu-addsec:hover{border-color:var(--d-ink);color:var(--d-ink);}
.tilechip{width:34px;height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius-sm);background:var(--bg-hover);color:var(--fg-muted);}

/* Group binding view: the group list is a rail, the detail is bands. */
.grpwrap{display:flex;align-items:flex-start;gap:var(--s-4);flex-wrap:wrap;}
.grppane{flex:0 0 280px;min-width:250px;}
.grpmain{flex:1 1 520px;min-width:420px;}
.menu__item.is-warn .menu__row-t{color:var(--critical);}

/* ══ PROTO BAR ══ */
.protobar{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:var(--s-2);
  padding:6px 0;background:var(--bg-app);}
.protobar__l{font-family:var(--font-mono);font-size:var(--uxt-theme-typography-caption-font-size);
  font-weight:500;color:var(--fg-faint);}
.protobar button{height:24px;padding:0 var(--s-3);border:1px solid var(--border-subtle);
  border-radius:var(--radius-full);background:var(--bg-surface);color:var(--fg-muted);cursor:pointer;
  font-family:var(--font-sans);font-size:var(--uxt-theme-typography-caption-font-size);font-weight:500;}
.protobar button:hover{color:var(--fg-default);background:var(--bg-hover);}
</style>
</head>
<body>

<div class="protobar">
  <span class="protobar__l">Base · Workflow Designer Portal · v1</span>
  <button onclick="toggleTheme()" id="themeBtn">Light</button>
  <button onclick="openWf('wf-bk-full')">Flow workflow</button>
  <button onclick="openWf('wf-pm-routed')">With a fork</button>
  <button onclick="openWf('wf-free-insp')">Free Form</button>
  <button onclick="resetPortal()">Reset demo data</button>
  <button onclick="toggleNotes()">Design notes</button>
</div>

<div class="shell">

  <!-- ══════════════════════════════════════════════════════════════════
       RAIL — Octave AppShell's labelled rail
       ══════════════════════════════════════════════════════════════════
       Replaces the 76px icon rail + slide-out flyout + dark top bar. The
       rail IS the navigation now, and every AREA row
       is an AREA OF THIS FILE (§30.6).

       THERE ARE NO LINKS OUT AT ALL (confirmed 2026-09-16). Screen Designer
       is NOT a standalone destination — it is invoked per step node from the
       workflow configurator and opens in this file's own right-hand panel.
       So it gets no rail row: a nav entry would imply you can go there
       without a node selected, which is exactly the thing that is not true.
       Reach it from a node's ⋯ ▸ Screen Designer.
       ══════════════════════════════════════════════════════════════════ -->
  <nav class="rail" id="rail">
    <div class="rail__brand">
      <button class="rail__brand-mark" onclick="toast('HxGN EAM — base configuration')" title="HxGN EAM">
        <span class="ms ms-20">grid_view</span>
      </button>
      <div>
        <div class="rail__brand-name">HxGN EAM</div>
        <div class="rail__brand-sub">Mobile configuration</div>
      </div>
    </div>

    <button class="rail__row rail__row--primary" onclick="createForArea()">
      <span class="ms ms-18">add</span><span id="railCreateLabel">Create workflow</span>
    </button>

    <div class="rail__section">Mobile configuration</div>
    <button class="rail__row rail__row--active" id="railWorkflows" onclick="setArea('workflows')">

<script>
/* ═══════════════════════════════════════════════════════════════════════
   ICONS — inline SVG, no icon-font CDN
   ═══════════════════════════════════════════════════════════════════════
   eam-screen-designer-v1.html pulls Tabler in over a CDN. This file keeps
   to CLAUDE.md's prototype convention — CDN fonts and nothing else — so
   glyphs are paths in a map. `ic(name, size)` is the only way one is drawn.
   ═══════════════════════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════════════════
   ICONS — Material Symbols Outlined (the system-wide rule)
   ═══════════════════════════════════════════════════════════════════════
   DESIGN-2026-08-11: "Every icon in every component is Material Symbols
   Outlined", axes 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 20. It supersedes
   the inline-SVG set this file shipped with, and it is flagged upstream as
   TEMPORARY — a custom outline set is meant to replace it — so keeping every
   glyph behind this one map is what makes that swap a single edit.

   ic(name, size) keeps its old signature on purpose: every call site passes
   a semantic name, so the glyph set changed underneath ~120 usages without
   any of them being touched.

   THE ONE EXCEPTION IS WO TYPE (see woTypeIconSvg below): §23.3 requires
   those four glyphs to be byte-identical to what the technician's device
   draws, so they stay SVG paths copied from eam-shared.js. A Material
   Symbol that merely resembles the device's Breakdown triangle would make
   the two surfaces disagree about the same Type.
   ═══════════════════════════════════════════════════════════════════════ */
const ICONS = {
  chevR:'chevron_right', chevL:'chevron_left', chevD:'expand_more', chevU:'expand_less',
  plus:'add', dots:'more_vert', x:'close', check:'check', copy:'content_copy',
  eye:'visibility', trash:'delete', pencil:'edit', layout:'dashboard_customize',
  sliders:'tune', route:'account_tree', grid:'grid_view', lock:'lock', pin:'push_pin',
  message:'chat_bubble', clip:'attach_file', file:'description', clipboard:'checklist',
  box:'inventory_2', clock:'schedule', checkc:'check_circle', list:'format_list_bulleted',
  wrench:'build', fork:'help', split:'alt_route', alert:'warning', info:'info',
  users:'group', save:'save', down:'arrow_downward', flag:'flag', arrowR:'arrow_forward',
  stop:'cancel', na:'remove', undo:'undo', layers:'layers', open:'open_in_new',
  timerOff:'timer_off',
  /* Nav-bar glyphs (§30.24). The bar's icon is authorable, so the set an
     admin can pick from lives here — see NAV_ICONS for which are offered. */
  home:'home', bell:'notifications', sync:'sync', search:'search',
  /* A UDS is a customer-authored screen, so the glyph is a board split rather
     than a document — it is a layout, not a record. The block glyph is the
     capability gap: the function cannot render this tab at all. */
  uds:'space_dashboard', block:'block', translate:'translate',
  /* §30.25: the two fork kinds get different glyphs, and they were the
     wrong way round — 'fork' is a question mark and was on the CONDITION,
     while 'split' (a routing arrow) was on the question. A condition is a
     RULE the system reads; a question is asked. */
  rule:'rule', timer:'timer',
};
/* Sizes snap to the four ms-* steps rather than emitting a bare font-size, so
   an icon can never land between the type scale's own steps. */
function msClass(size){
  const n = +size || 20;
  if(n <= 14) return 'ms-14';
  if(n <= 16) return 'ms-16';
  if(n <= 18) return 'ms-18';
  if(n <= 20) return 'ms-20';
  return 'ms-24';
}
function ic(name, size){
  const g = ICONS[name];
  if(!g) return '';
  return '<span class="ms ' + msClass(size) + '">' + g + '</span>';
}
/* A Button is never a bare <button>: Octave's hover/active are an OVERLAY
   span over the base colour rather than a colour swap, so the overlay has to
   be in the markup. One helper keeps that from being forgotten per call. */
function btn(label, o){
  o = o || {};
  const cls = ['Button'].concat(o.cls ? o.cls.split(' ') : []).join(' ');
  return '<button class="' + cls + '"' +
    (o.on ? ' onclick="' + o.on + '"' : '') +
    (o.title ? ' title="' + o.title + '"' : '') +
    (o.disabled ? ' disabled' : '') + '>' +
    (o.icon ? ic(o.icon, o.iconSize || 18) : '') +
    (label ? '<span class="Button__label">' + label + '</span>' : '') +
    '</button>';
}
function iconBtn(icon, o){
  o = o || {};
  return '<button class="IconButton ' + (o.cls || '') + '"' +
    (o.on ? ' onclick="' + o.on + '"' : '') +
    (o.title ? ' title="' + o.title + '"' : '') + '>' +
    ic(icon, o.size || 20) + '</button>';
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function $(id){ return document.getElementById(id); }

/* ═══════════════════════════════════════════════════════════════════════
   WO TYPE — §23.3, reused VERBATIM from eam-shared.js
   ═══════════════════════════════════════════════════════════════════════
   Copied rather than re-drawn on purpose. §23.3's rule is that the WO Type
   colour + icon badge is identical across the Type field, the WO List row
   and the step rail; an admin screen that invents its own Breakdown glyph
   makes the badge mean "some kind of Breakdown" instead of "the Breakdown
   the technician sees". Four families, four tokens, and a Type outside the
   set gets NO colour — an outline pill, not a fifth hue.
   ═══════════════════════════════════════════════════════════════════════ */
const WO_TYPE_ICON_GLYPHS = {
  BREAKDOWN: '<path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
  PPM: '<rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><polyline points="9,16 11,18 15,14"/>',
  ROUTINE: '<line x1="12" y1="4" x2="12" y2="20"/><line x1="5" y1="8" x2="19" y2="16"/><line x1="19" y1="8" x2="5" y2="16"/>',
  CORRECTIVE: '<path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/>',
};
const WO_TYPE_PALETTE = {
  BREAKDOWN:  {color:'var(--wo-type-breakdown)'},
  PPM:        {color:'var(--wo-type-ppm)'},
  ROUTINE:    {color:'var(--wo-type-routine)'},
  CORRECTIVE: {color:'var(--wo-type-corrective)'},
};
const TYPECODE_TO_WOTYPE_FAMILY = {BK:'BREAKDOWN', BREAKDOWN:'BREAKDOWN', CM:'CORRECTIVE', PM:'PPM', ROUT:'ROUTINE'};
/* SVG, not a Material Symbol — the documented exception to the icon rule.
   §23.3 requires this badge to be identical across the Type field, the WO
   List row, the mobile step rail and this screen; a lookalike symbol would
   make the admin surface and the device disagree about the same WO Type. */
function woTypeIconSvg(family, size){
  const g = WO_TYPE_ICON_GLYPHS[family]; if(!g) return '';
  return '<svg width="'+(size||14)+'" height="'+(size||14)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+g+'</svg>';
}

/* WO_TYPES matches eam-screen-designer-v1.html's list exactly — one
   environment, one set of Types. CAL/INS/MOD have no §23 colour, which is
   the honest state of the palette, not an omission to fix here. */
const WO_TYPES = [
  {code:'BK',   name:'Breakdown'},
  {code:'CM',   name:'Corrective Maintenance'},
  {code:'PM',   name:'Preventive Maintenance'},
  {code:'CAL',  name:'Calibration'},
  {code:'INS',  name:'Inspection'},
  {code:'MOD',  name:'Modification'},
  {code:'ROUT', name:'Routine Maintenance'},
];
function woTypeName(code){ const t = WO_TYPES.find(x=>x.code===code); return t ? t.name : ''; }

function woTypePill(code){
  if(!code) return '<span class="chip chip--dense chip--lead chip--static">'+ic('na',16)+'Any WO Type</span>';
  const fam = TYPECODE_TO_WOTYPE_FAMILY[code];
  const pal = fam ? WO_TYPE_PALETTE[fam] : null;
  const glyph = fam ? woTypeIconSvg(fam, 10) : ic('file',10);
  const badgeStyle = pal ? 'background:'+pal.color : '';
  const pillStyle = pal ? 'border-color:'+pal.color : '';
  /* Description only (§5.2's "System codes — always description-only"). The
     badge already carries identity; repeating the code beside it puts an
     identifier in a place nobody types one. */
  return '<span class="tpill" style="'+pillStyle+'"><span class="tpill__badge" style="'+badgeStyle+'">'+glyph+'</span>'+
    esc(woTypeName(code))+'</span>';
}

/* The badge alone, for use INSIDE a control rather than beside one. Reads the
   same palette and the same glyph set as woTypePill(); a Type outside the four
   §23.3 families gets the neutral slot, never a fifth hue. */
function woTypeBadge(code, size){
  const fam = code ? TYPECODE_TO_WOTYPE_FAMILY[code] : null;
  const pal = fam ? WO_TYPE_PALETTE[fam] : null;
  if(!pal) return '<span class="input__wt input__wt--none" title="' +
    (code ? esc(woTypeName(code)) + ' has no §23 colour' : 'Any WO Type') + '">' +
    ic(code ? 'file' : 'na', size || 14) + '</span>';
  return '<span class="input__wt" style="background:' + pal.color + '" title="' +
    esc(woTypeName(code)) + '">' + woTypeIconSvg(fam, size || 14) + '</span>';
}

/* ═══════════════════════════════════════════════════════════════════════
   STEP LIBRARY — the MVP nine, plus the fork
   ═══════════════════════════════════════════════════════════════════════
   Grouped into "Execution" and "Record tabs" as a BROWSING aid only. The
   grouping carries no rule: §14.8 made step-vs-More placement configuration
   rather than definition, so every one of the nine can land in either area
   of the canvas. `id` matches the app's own keys (WO_STEP_FILES and
   WO_MORE_TABS in eam-shared.js) so a workflow authored here names the same
   things the app routes on.
   ═══════════════════════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════════════════
   BASE FUNCTIONS — the screens a workflow can be authored against (§26.2)
   ═══════════════════════════════════════════════════════════════════════
   Ported from eam-screen-designer-v1.html on 2026-09-16, when the embedded
   panel was brought to parity and the standalone surface went away (§30.9).

   WHY THIS IS WORKFLOW-LEVEL AND NOT PANEL-LEVEL: a workflow resolves to a
   function, and the function decides which steps can exist at all. Putting
   the picker in the designer panel would scope it to one step, which is the
   wrong grain and would let two steps of one workflow disagree about which
   screen they belong to.

   `family` is the KIND ('wo'|'equip'); `code` is the FUN_CODE. Everything
   downstream switches on family, never on the code (§26.2) — adding a fifth
   WO clone is a row here and nothing else. ZJ1000 is deliberately
   capability-limited: a designer that only ever sees full clones ships
   without the "this step cannot exist here" path.

   Row counts are the real PLO_PAGELAYOUT counts from
   docs/Data_refs/Page Layouts perms/.
   ═══════════════════════════════════════════════════════════════════════ */
const WO_TAB_IDS = ['recordview','checklist','parts','booklabor','closing','activities','comments','documents','equipment'];
const EQUIP_TAB_IDS = ['recordview','comments','documents','equipment'];
const BASE_FUNCTIONS = [
  {code:'WSJOBS', desc:'Work Orders', family:'wo', entity:'EVNT', parent:null, rows:0,
   tabs:WO_TAB_IDS, note:'The base screen. No clone lineage.'},
  {code:'CCJOBS', desc:'Contract Jobs', family:'wo', entity:'EVNT', parent:'WSJOBS', rows:382, tabs:WO_TAB_IDS},
  {code:'TRJOBS', desc:"Transportation WO's", family:'wo', entity:'EVNT', parent:'WSJOBS', rows:382, tabs:WO_TAB_IDS},
  {code:'ZJ1000', desc:'Customer Quotes', family:'wo', entity:'EVNT', parent:'WSJOBS', rows:237,
   tabs:['recordview','comments','activities','closing','parts'],
   note:'Capability-limited clone — no Checklist, Book Labor, Documents or Equipment.'},
  {code:'WSJODC', desc:'Work Orders (DC)', family:'wo', entity:'EVNT', parent:'WSJOBS', rows:0,
   tabs:WO_TAB_IDS.filter(t => t !== 'equipment')},
  /* `aliases` exists for one reason: the mobile screens call the equipment
     function WSEQUIP while the designer has always called it EQUIPMENT.
     Renaming either side would silently invalidate demo data. */
  {code:'EQUIPMENT', desc:'Equipment', family:'equip', entity:'OBJ', parent:null, rows:0,
   tabs:EQUIP_TAB_IDS, aliases:['WSEQUIP','OBJEQUIP'], note:'The base screen. No clone lineage.'},
];
function functionsOf(family){ return BASE_FUNCTIONS.filter(f => f.family === family); }
function fnByCode(code){ return BASE_FUNCTIONS.find(f => f.code === code) || null; }
function fnByAnyCode(code){
  if(!code) return null;
  const c = String(code).trim().toUpperCase();
  return BASE_FUNCTIONS.find(f => f.code.toUpperCase() === c ||
    (f.aliases||[]).some(a => a.toUpperCase() === c)) || null;
}
/* Does the function this workflow is authored against actually HAVE this tab?
   Unknown function or unlisted tab ⇒ allow, so a tab added to STEP_LIB does
   not silently vanish from every clone until someone updates the arrays. */
function fnHasTab(w, tabId){
  const f = fnByCode(w && w.fn);
  if(!f) return true;
  const known = f.family === 'equip' ? EQUIP_TAB_IDS : WO_TAB_IDS;
  if(known.indexOf(tabId) === -1) return true;
  return f.tabs.indexOf(tabId) !== -1;
}
/* Steps this workflow places that its function cannot render. REPORTED, never
   worked around (§26.5.1) — the fix is Screen Designer or Function
   Permissions, and silently dropping the step would hide a dead end. */
function capabilityGaps(w){
  if(!w) return [];
  return w.nodes.filter(nd => nd.kind === 'step' && !fnHasTab(w, nd.step));
}

/* ═══════════════════════════════════════════════════════════════════════
   USER DEFINED SCREENS available to PLACE (§27.4 role 1, §29.5)
   ═══════════════════════════════════════════════════════════════════════
   In real EAM these come from base's own UDS setup, which owns fields,
   types, LOVs, labels and required-ness. Rebuilding that authoring here is
   explicitly out of scope (§27.2) — it is the mistake that retired the old
   Workflow Designer. `fields` is shown only so an admin can see they are
   placing a real screen.
   ═══════════════════════════════════════════════════════════════════════ */
/* THE LABELS ARE DELIBERATELY GENERIC (2026-09-17). They used to be
   plausible customer screens — Hot Work Permit, LOTO Verification, Shift
   Handover Notes — and that read as a claim that the product ships those
   three. It does not: a UDS is whatever the customer authored in base EAM,
   and this surface only ever PLACES one (§27.4 role 1). Numbering them says
   the true thing — "there are three of them, base owns what they are". */
const UDS_DEFS = [
  {id:'uds-permit',   label:'UDS Tab 1', fields:7, modified:'2026-08-19'},
  {id:'uds-loto',     label:'UDS Tab 2', fields:5, modified:'2026-07-30'},
  {id:'uds-handover', label:'UDS Tab 3', fields:4, modified:'2026-08-22'},
];
function udsDefOf(id){ return UDS_DEFS.find(u => u.id === id) || null; }

/* ═══════════════════════════════════════════════════════════════════════
   TRANSLATIONS — admin-authored text only (§29.4)
   ═══════════════════════════════════════════════════════════════════════
   A question fork is the first thing in this programme where an ADMIN types
   prose a TECHNICIAN reads. Every other mobile string is a delivered product
   label (already translated) or record data (never translated). So the
   translation surface lives on the fork and nowhere else.

   THE LOAD-BEARING RULE: a missing translation falls back to the base
   language and NEVER blanks — an empty question on a gated step is
   unanswerable, so a technician whose language has no row must still see
   readable text rather than a blocker.

   Where the real EAM equivalent lives is an open backend question (§20);
   the language-keyed map is a prototype stand-in, not a schema proposal.
   ═══════════════════════════════════════════════════════════════════════ */
const LANGUAGES = [
  {code:'EN', label:'English'}, {code:'ES', label:'Español'}, {code:'FR', label:'Français'},
  {code:'DE', label:'Deutsch'}, {code:'PT', label:'Português'},
];
const BASE_LANG = 'EN';
function langLabel(c){ const l = LANGUAGES.find(x=>x.code===c); return l ? l.label : c; }
/* Text is a {EN:'…', ES:'…'} map. Reads ALWAYS fall back to BASE_LANG. */
function tx(map, lang){
  if(map == null) return '';
  if(typeof map === 'string') return map;            // tolerate pre-§29.4 data
  return (map[lang] && map[lang].trim()) ? map[lang] : (map[BASE_LANG] || '');
}
function txMissing(map){
  if(typeof map === 'string' || !map) return LANGUAGES.filter(l=>l.code!==BASE_LANG).map(l=>l.code);
  return LANGUAGES.filter(l => l.code !== BASE_LANG && !(map[l.code] && map[l.code].trim())).map(l => l.code);
}
/* Normalises a string OR a map to a map — the one entry point, so persisted
   pre-translation data migrates on read instead of needing a version stamp. */
function toTx(v){
  if(v && typeof v === 'object') return v;
  const m = {}; m[BASE_LANG] = v || ''; return m;
}

/* ═══════════════════════════════════════════════════════════════════════
   COMPLETION STATUS DOMAINS (§12)
   ═══════════════════════════════════════════════════════════════════════
   Which entity's status values the Start Work / Completion pickers draw
   from. Keyed on WO Type with NO Group dimension (§12), which is why this is
   workflow-level and not per-group or per-step.
   ═══════════════════════════════════════════════════════════════════════ */
const EVST_STATUSES = [
  {code:'WAPPR', desc:'Work Request'}, {code:'RELEASED', desc:'Released'},
  {code:'INPROG', desc:'In Progress'}, {code:'CLOSE', desc:'Closed'},
];
const AAST_STATUSES = [
  {code:'NOTSTARTED', desc:'Not Started'}, {code:'INPROG', desc:'In Progress'},
  {code:'COMPLETE', desc:'Complete'},
];
function statusListForEntity(e){ return e === 'activity' ? AAST_STATUSES : EVST_STATUSES; }
function statusDesc(e, code){
  const f = statusListForEntity(e).find(x=>x.code===code); return f ? f.desc : code;
}
const COMPLETION_DEFAULTS = {
  wo:       {start:'INPROG', complete:'CLOSE'},
  activity: {start:'INPROG', complete:'COMPLETE'},
};

const STEP_LIB = [

/* ═══════════════════════════════════════════════════════════════════════
   NODE MODEL
   ═══════════════════════════════════════════════════════════════════════
   One flat `nodes` array per workflow, in author order. Zone is a property
   of the node, not a separate array — exactly §29.2's reason for putting
   Placement on the instance row: "an instance is either a Step or a More
   entry, never both" is then true by construction, and moving a node
   between the flow and the reference zone is a field change, not a
   migration between two lists that can disagree.

     nid        stable id
     kind       'step' | 'fork'
     step       library id (step kind only)
     inst       instance number — MINTED at creation and never recomputed.
                Part of the layout key: bare id for instance 1, `id#n`
                after (§29.2), so reordering migrates nothing.
     name       what the technician reads in the step rail
     renamed    true once name diverges from the delivered label
     zone       'flow' | 'ref'   ('ref' is the app's More group, §14.8)
     required   §14.7 bar-locking
     reqComment §29.3 gate
     reqDoc     §29.3 gate
     pinned     Record View instance 1 only — §14 fixes it as step 1
     layout     this instance's OWN deep-copied field layout
     fork kind adds: question, yesLabel, noLabel, yesTarget, noTarget
   ═══════════════════════════════════════════════════════════════════════ */
let nidSeq = 1;
function nid(){ return 'n' + (nidSeq++) + '-' + Math.random().toString(36).slice(2,6); }
function deepCopy(o){ return JSON.parse(JSON.stringify(o)); }

function mkNode(stepOrFork, opts){
  opts = opts || {};
  if(stepOrFork === 'fork'){
    return {
      nid:nid(), kind:'fork', zone:'flow',
      /* Language-keyed maps (§29.4). toTx() accepts a plain string too, so
         demo seeds stay readable and persisted pre-translation data migrates
         on read rather than needing a version stamp. */
      question:toTx(opts.question || ''),
      yesLabel:toTx(opts.yesLabel || 'Yes'),
      noLabel:toTx(opts.noLabel || 'No'),
      /* null means "continue to the next step" — the default, and the only
         safe default: a fork that silently jumped somewhere on creation
         would reorder a workflow the moment it was dropped. */
      yesTarget:opts.yesTarget || null,
      noTarget:opts.noTarget || null,
    };
  }
  const e = libEntry(stepOrFork);
  return {
    nid:nid(), kind:'step', step:stepOrFork, inst:opts.inst || 1,
    name:opts.name || (e ? e.label : stepOrFork),
    renamed:!!(opts.name && e && opts.name !== e.label),
    zone:opts.zone || 'flow',
    required:!!opts.required,
    reqComment:!!opts.reqComment,
    reqDoc:!!opts.reqDoc,
    pinned:!!opts.pinned,
    layout:deepCopy(LAYOUTS[stepOrFork] || []),
    /* Per-INSTANCE, not per-workflow (§29): Book Labor can be placed twice,
       and two placements sharing one mode would be a coupling nothing on
       screen explains. Only meaningful on booklabor; harmless elsewhere. */
    timeEntry: stepOrFork === 'booklabor' ? (opts.timeEntry || 'startend') : undefined,
  };
}

/* ═══════════════════════════════════════════════════════════════════════
   CONDITION FORK (§30.19) — a fork the SYSTEM answers
   ═══════════════════════════════════════════════════════════════════════
   §29.4's question fork asks the technician and routes on the answer. This
   one reads a FIELD and routes on its value. Same routing model, same
   forward-only enforcement, same N/A-marks-nothing-retracted — it is a
   second fork KIND, not a parallel mechanism, which is why isForkKind()
   and forkBranches() exist below rather than a second copy of everything.

   ── WHEN IT EVALUATES, and why that is the whole design ──
   User direction, 2026-09-16: "the form is dirty until the user navs to
   another screen... the user enters required fields/changes optional/etc;
   and hits 'Next'. At that point, online or offline, app sees the next step
   is a condition fork, checks the field and its value ONLY OF THE USER'S
   CURRENT FORM/SCREEN they are on, and moves to the appropriate next step."

   That single sentence is what makes this safe, and it is worth spelling
   out because the obvious alternatives are not:

     · It evaluates at ONE moment — the Next tap — so the value is pinned
       exactly the way a question fork's answer is. §13.3 item 4 warns that
       step-level retraction is a data problem; a live re-evaluating rule
       would mark a step N/A while a technician typed, possibly a step
       already holding booked labour. Evaluating on Next has no such window.
     · It reads only the CURRENT screen's fields, so the value is
       guaranteed present, current, and VISIBLE to the person it routes.
       Routing on a field the technician cannot see is invisible logic.
     · It is client-evaluable by construction — same-record, same-screen,
       no lookup. §2.7's last row makes anything server-evaluated
       blocked-visible offline, and a ROUTE that resolves differently
       offline means two technicians on one WO do different work. Field
       state failing silently offline is a bad form; routing failing
       silently is a different category.

   ── WHAT IT DELIBERATELY CANNOT DO ──
   Conditions on WO Type, user group, function or equipment system type are
   NOT offered, because §11 already resolves the whole workflow on
   (WO Type, user group) and §13.5 protects WO Type from Start Work onward.
   A condition on any of them re-implements workflow resolution one level
   down and can never change. Job-captured values are the only ones that
   earn a fork (user direction).

   ── THE THIRD OUTCOME NOBODY ASKS FOR ──
   An Optional field can be empty at Next. "Boolean" implies two paths, and
   sending every empty value down the false path is the trap. So an
   unevaluable condition CONTINUES IN SEQUENCE — the same meaning §29.4
   gives a null target — and the editor says so rather than leaving it to
   be discovered.
   ═══════════════════════════════════════════════════════════════════════ */

/* Operators per field type. Rendered from the field's OWN declared type, so
   an admin is never offered "is greater than" on a checkbox.
   NO RELATIVE DATES on purpose (today, today+7, start of shift): they are a
   sub-feature with their own evaluation-time semantics, and a literal date
   is the plainest thing that works. Flagged in §20 rather than half-built. */
const COND_OPS = {
  text: [
    {k:'eq', label:'is', val:true},
    {k:'ne', label:'is not', val:true},
    {k:'has', label:'contains', val:true},
    {k:'empty', label:'is empty', val:false},
    {k:'notempty', label:'is not empty', val:false},
  ],
  num: [
    {k:'eq', label:'is', val:true},
    {k:'ne', label:'is not', val:true},
    {k:'gt', label:'is greater than', val:true},
    {k:'lt', label:'is less than', val:true},
    {k:'ge', label:'is at least', val:true},
    {k:'le', label:'is at most', val:true},
    {k:'empty', label:'is empty', val:false},
    {k:'notempty', label:'is not empty', val:false},
  ],
  lov: [
    {k:'eq', label:'is', val:true},
    {k:'ne', label:'is not', val:true},
    {k:'empty', label:'is empty', val:false},
    {k:'notempty', label:'is not empty', val:false},
  ],
  bool: [
    {k:'true', label:'is checked', val:false},
    {k:'false', label:'is not checked', val:false},
  ],
  date: [
    {k:'eq', label:'is on', val:true},
    {k:'lt', label:'is before', val:true},
    {k:'gt', label:'is after', val:true},
    {k:'empty', label:'is empty', val:false},
    {k:'notempty', label:'is not empty', val:false},
  ],
  time: [
    {k:'eq', label:'is at', val:true},
    {k:'lt', label:'is before', val:true},
    {k:'gt', label:'is after', val:true},
    {k:'empty', label:'is empty', val:false},
    {k:'notempty', label:'is not empty', val:false},
  ],
};
/* A button is a control, not a value (§30.12) — there is nothing to test,
   the same reason it takes only Optional or Hidden. */
function condOpsFor(type){ return COND_OPS[type] || []; }
function condOpMeta(type, k){ return condOpsFor(type).find(o => o.k === k) || null; }
function condTypeIsTestable(type){ return condOpsFor(type).length > 0; }

function mkCondNode(opts){
  opts = opts || {};
  return {
    nid:nid(), kind:'cond', zone:'flow',
    /* The field is addressed by its API name — stable across a rename, and
       the same string R5PAGELAYOUT would key on. */
    field:opts.field || '',
    op:opts.op || '',
    value:opts.value === undefined ? '' : opts.value,
    /* null = continue in sequence, exactly as §29.4 means it. */
    tTrue:opts.tTrue || null,
    tFalse:opts.tFalse || null,
  };
}

/* ── BOTH FORK KINDS, ONE SET OF RULES ──
   Every routing rule in §29.4 — forward-only, re-validated on reorder,
   dangling targets cleared, skipped steps marked N/A, wires drawn to real
   destinations — applies identically whether a human or a field answered.
   So the code asks isForkKind(), and reads branches through forkBranches(),
   rather than carrying two implementations that can drift. */
function isForkKind(n){ return !!n && (n.kind === 'fork' || n.kind === 'cond'); }
/* [branchKey, targetProperty] pairs, in render order. */
function forkBranches(n){
  return n && n.kind === 'cond'
    ? [['true','tTrue'], ['false','tFalse']]
    : [['yes','yesTarget'], ['no','noTarget']];
}
function forkBranchLabel(n, br){
  if(!n) return br;
  if(n.kind === 'cond') return br === 'true' ? 'True' : 'False';
  return br === 'yes' ? tx(n.yesLabel, BASE_LANG) : tx(n.noLabel, BASE_LANG);
}

/* ── THE STEP WHOSE FORM THIS READS ──
   "ONLY OF THE USER'S CURRENT FORM/SCREEN they are on" — so the readable
   fields are those of the nearest STEP before the fork. Not any earlier
   step: the technician is not on those any more, and their values are no
   longer dirty-and-current.

   Returns null when there is no such step, which is a real authoring state
   (a condition fork dropped first, or after another fork) and is reported
   rather than rendering an empty field list. Same treatment §29.4 gives a
   fork appended last with nothing to route to. */
function condSourceStep(w, cn){ return prevStepOf(w, cn); }
/* Every testable field on that step's form, flattened out of its
   containers. A HIDDEN field is excluded: routing on something the
   technician cannot see is the invisible-logic failure this design exists
   to avoid, and §2.9's principle is that narrowing may happen but not
   silently. */
function condFieldsFor(w, cn){
  const src = condSourceStep(w, cn);
  if(!src || !Array.isArray(src.layout)) return [];
  const out = [];
  src.layout.forEach((sec, ci) => (sec.fields || []).forEach(f => {
    if(!condTypeIsTestable(f.type)) return;
    if(f.behavior === 'hid') return;
    out.push({api:f.api, name:f.name, type:f.type, container:sec.container, cIdx:ci});
  }));
  return out;
}
/* ── THE PICKER'S OWN SHAPE (2026-09-17) ──
   Every option used to read "Field name · Container", which put the
   container on every row and still left the list flat. The container is a
   GROUPING, so it is drawn as one: an <optgroup> label, which is natively
   unselectable — the protected section label, for free and with no JS.

   Order follows the container order on the screen, so the list reads top to
   bottom exactly as the technician's form does. Grouped on the container
   INDEX rather than its title: two containers can legitimately share a
   title, and merging them would claim a field lives somewhere it does not. */
function condFieldOptions(fields, cur){
  const groups = [];
  fields.forEach(f => {
    const last = groups[groups.length - 1];
    if(last && last.cIdx === f.cIdx) last.fields.push(f);
    else groups.push({container:f.container, cIdx:f.cIdx, fields:[f]});
  });
  return groups.map(g =>
    '<optgroup label="' + esc(g.container) + '">' +
    g.fields.map(f => '<option value="' + esc(f.api) + '"' + (cur === f.api ? ' selected' : '') + '>' +
      esc(f.name) + '</option>').join('') +
    '</optgroup>').join('');
}
function condFieldMeta(w, cn){
  if(!cn || !cn.field) return null;
  return condFieldsFor(w, cn).find(f => f.api === cn.field) || null;
}
/* One line an admin can read back. Deliberately the shape of a sentence,
   because the card shows it as a pill and the point of the pill is that the
   rule is legible without opening the editor. */
function condSummary(w, cn){
  const f = condFieldMeta(w, cn);
  if(!f) return cn && cn.field ? 'Field no longer on the previous step' : 'No condition yet';
  const o = condOpMeta(f.type, cn.op);
  if(!o) return f.name + ' — no operator yet';
  return f.name + ' ' + o.label + (o.val ? ' ' + (cn.value === '' ? '…' : cn.value) : '');
}
/* Evaluated for the PREVIEW only — the runtime does this on the device at
   the Next tap. Returns true, false, or null for "cannot tell", which is
   the third outcome the two-branch shape hides. */
function condEval(cn, fieldType, raw){
  const o = condOpMeta(fieldType, cn.op);
  if(!o) return null;
  const empty = raw === undefined || raw === null || raw === '';
  if(o.k === 'empty') return empty;
  if(o.k === 'notempty') return !empty;
  if(o.k === 'true') return raw === true || raw === 'true';
  if(o.k === 'false') return !(raw === true || raw === 'true');
  if(empty) return null;                       /* nothing to compare against */
  if(fieldType === 'num'){
    const a = parseFloat(raw), b = parseFloat(cn.value);
    if(isNaN(a) || isNaN(b)) return null;
    if(o.k === 'eq') return a === b;
    if(o.k === 'ne') return a !== b;
    if(o.k === 'gt') return a > b;
    if(o.k === 'lt') return a < b;
    if(o.k === 'ge') return a >= b;
    if(o.k === 'le') return a <= b;
    return null;
  }
  const a = String(raw), b = String(cn.value);
  if(o.k === 'eq') return a === b;
  if(o.k === 'ne') return a !== b;
  if(o.k === 'has') return a.indexOf(b) > -1;
  if(o.k === 'lt') return a < b;               /* ISO dates/times sort as text */
  if(o.k === 'gt') return a > b;
  return null;
}

/* ── A STATUS UPDATE action (replaces §12's declared completion pair) ──
   Until 2026-09-16 a workflow declared exactly two statuses — one for Start
   Work, one for completion — as fields on the workflow. That could only ever
   express two transitions, both at fixed moments. Placing the transition
   instead says WHERE it happens, which is the thing the two fields were
   standing in for, and it allows a third.

   It is NOT a step: the technician never visits it, so it takes no rail
   entry, no number and no gate. It is an action on the transition between
   steps, which is why it is placed positionally and nothing else.

   The entity is §12's completion entity (EVST work orders vs. AAST
   activities) and defaults to Work Order; the status is one code from that
   entity's own domain. Switching entity re-bases the status, because an EVST
   code is not an AAST code. ── */
/* ── TWO MODES (2026-09-17, replacing "End of Workflow when Closing is not
   present") ──
   `system`  — the workflow sets the authored status, unattended. What this
              action has always done.
   `user`    — the technician is asked. At the Next tap a pull-up opens with
              the record's CURRENT status shown protected, and they pick the
              new one from a dropdown.

   WHAT THE DROPDOWN HOLDS IS NOT AUTHORED HERE (answered 2026-09-17). It is
   resolved on the device from base EAM's own user-group status
   authorisation for the record's current status — the same boundary §27.4
   draws around a UDS definition and §30.14 draws around a dataspy: base
   owns what exists, this portal only says WHERE it is asked for. So an
   authored subset would be a fifth place to maintain a status list, and the
   first one able to disagree with the other four.

   `status` is kept while in `user` mode rather than cleared, so flipping
   the mode back does not lose the authored value.

   CANCEL RETURNS, IT DOES NOT ADVANCE. Nothing is set and the technician is
   back on the step they were on, free to change something and tap Next
   again. That is what keeps an empty authorisation set a "nothing to pick
   here" state instead of a dead end a WO cannot be finished through — the
   §27.4 Required-UDS failure, which this action would otherwise reinvent. */
function mkStatusNode(opts){
  opts = opts || {};
  const entity = opts.entity || 'wo';
  return {
    nid:nid(), kind:'action', action:'status', zone:'flow',
    mode:opts.mode || 'system',
    entity:entity,
    status:opts.status || (COMPLETION_DEFAULTS[entity] || COMPLETION_DEFAULTS.wo).complete,
  };
}
function statusNodeLabel(nd){
  return nd.mode === 'user' ? 'Technician selects' : statusDesc(nd.entity, nd.status);
}

/* ── ONE MODE FIELD, EVERY ACTION (§30.21) ──
   All three actions answer the same question — does the technician get
   asked, or does the workflow just do it — so all three carry the same
   `mode` field and every read goes through `actionAsks()`. Start Timer
   shipped with its own boolean `ask` for a few hours; two field shapes for
   one concept across three kinds is the four-parallel-arrays failure
   (§30.13) at a smaller scale, and `normalizeWf()` migrates it. */
const ACTION_MODES = ['system', 'user'];
function actionAsks(nd){ return !!nd && nd.mode === 'user'; }

/* ── A START TIMER action (§14.2's timer pill, placed) ──
   The app already draws a timer on the step rail; what was never authorable
   is WHEN it starts.

   DECLINING STILL ADVANCES, unlike the status action's Cancel. The two are
   asymmetric on purpose: a status action exists to move a record to a
   status, so a decline leaves its whole reason unmet; the timer is an aid
   to labour capture, and "not on the clock for this one" is a legitimate
   answer rather than an incomplete one. Blocking the flow on a preference
   would be a gate on something no record depends on. */
function mkTimerNode(opts){
  opts = opts || {};
  return {
    nid:nid(), kind:'action', action:'timer', zone:'flow',
    mode:opts.mode || 'system',
  };
}
function timerNodeLabel(nd){
  return actionAsks(nd) ? 'Asks before starting' : 'Starts automatically';
}

/* ── A STOP TIMER action — it BOOKS, which is why it can exist ──
   Reversed 2026-09-17, same session it was refused. The refusal stood on one
   premise: stopping a timer produces a labour record, a labour record needs a
   screen, and that screen is Book Labor — so a Stop placed anywhere else
   needs a second labour form invented behind it.

   The premise is wrong, and §30.11's own paradigm is why. §18.4's Add Labor
   field set is ENTIRELY DERIVABLE from a running timer plus the session:

     Employee      the signed-in technician
     Trade / Dept  from that employee's own record
     Activity      the activity in context on the WO
     Date Worked   the date the timer started
     Start / End    the timer's own start and stop
     Hours Worked  the elapsed time
     Type of Hours Normal — see below
     Crew          empty; it is the either/or partner of Employee

   Nothing has to be ASKED, so nothing needs a form, so the action can just
   do it — which is exactly what §30.11 established for a status transition.

   THE PAYOFF, and the reason this exists: Book Labor can now sit in the
   MORE group, or not be placed at all. Time capture stops depending on the
   technician visiting a screen.

   TYPE OF HOURS IS NOT AUTHORABLE, and that is deliberate. Whether a given
   hour is overtime depends on the shift worked, not on the workflow the
   technician happened to run — so a workflow-level constant would misbook
   every callout it did not anticipate. It books Normal; §18.3's correction
   path is how a misbooking is fixed, since booked labour is immutable. */
function mkStopTimerNode(opts){
  opts = opts || {};
  return {
    nid:nid(), kind:'action', action:'stoptimer', zone:'flow',
    mode:opts.mode || 'system',
  };
}
function stopTimerNodeLabel(nd){
  return actionAsks(nd) ? 'Confirms the hours first' : 'Books the time automatically';
}

const ACTION_KIND_LABELS = {timer:'Start Timer', stoptimer:'Stop Timer', status:'Status update'};
/* ═════ ONE ACCENT PER KIND (§30.25) ═════
   Five non-step kinds, five colours out of the ONE badge set (BADGE_COLORS),
   replacing three borrowed §23.3 WO Type hues. The mapping is meaning-led
   and that is the whole point of the change:

     Start Timer   green   — something starts running
     Stop Timer    red     — something stops, and it BOOKS (§30.21)
     Status update orange  — the record changes state
     Question fork purple  — a HUMAN answers (keeps the old fork hue)
     Condition     blue    — the SYSTEM answers, off a field (§30.19)

   Timer green / timer red is the one pair a technician's own mental model
   already has, which is why it was worth spending two of six colours on. */
const NODE_ACCENTS = {timer:'green', stoptimer:'red', status:'orange', fork:'purple', cond:'blue'};
function nodeAccentKey(n){
  if(!n) return '';
  if(n.kind === 'action') return NODE_ACCENTS[n.action] || 'orange';
  return NODE_ACCENTS[n.kind] || '';
}
/* The inline custom property every accented surface reads. One declaration
   site means adding a kind cannot half-land. */
function nodeAccentStyle(n){
  const c = badgeColor(nodeAccentKey(n));
  return c ? '--node-accent:' + c + ';' : '';
}
function accentStyleFor(key){
  const c = badgeColor(key);
  return c ? '--node-accent:' + c + ';' : '';
}
function actionKindLabel(nd){ return ACTION_KIND_LABELS[nd && nd.action] || 'Action'; }
function actionIcon(nd){
  return nd && nd.action === 'timer' ? 'timer'
    : nd && nd.action === 'stoptimer' ? 'timerOff' : 'flag';
}
/* The label a node's main line carries — the thing that DIFFERS between two
   of the same kind, since the eyebrow already names the kind. */
function actionNodeLine(nd){
  if(nd.action === 'timer') return timerNodeLabel(nd);
  if(nd.action === 'stoptimer') return stopTimerNodeLabel(nd);
  return statusEntityLabel(nd.entity) + ' \u2192 ' + statusNodeLabel(nd);
}
/* WHAT AN AUTOMATED BOOKING WRITES — one list, because the editor, the
   emulator's pull-up and the mobile screen all have to describe the same
   row. `derived` is where the value comes from; nothing here is authored. */
const STOP_TIMER_BOOKING = [
  {label:'Employee',      derived:'The signed-in technician'},
  {label:'Trade',         derived:'From the employee record'},
  {label:'Department',    derived:'From the employee record'},
  {label:'Activity',      derived:'The activity in context'},
  {label:'Date Worked',   derived:'The date the timer started'},
  {label:'Start / End',   derived:'The timer\'s own start and stop'},
  {label:'Type of Hours', derived:'Normal \u2014 not authorable'},
];
function statusEntityLabel(e){ return e === 'activity' ? 'Activity' : 'Work Order'; }

/* ── A UDS node. A separate KIND, not a tab with an odd field set: it carries
   no layout of its own because base EAM owns the definition (§27.4 role 1),
   and the panel renders it read-only. It still takes an ordinary §12 tier-2
   row, so it can be a numbered, gated, Required step exactly like a
   delivered tab — no separate placement model (§29.5). ── */
function mkUdsNode(udsId, opts){
  opts = opts || {};
  const d = udsDefOf(udsId);
  return {
    nid:nid(), kind:'uds', uds:udsId, inst:opts.inst || 1,
    name:opts.name || (d ? d.label : 'User Defined Screen'),
    renamed:!!(opts.name && d && opts.name !== d.label),
    zone:opts.zone || 'flow',
    required:!!opts.required, reqComment:!!opts.reqComment, reqDoc:!!opts.reqDoc,
    pinned:false,
  };
}

/* ── Layout key (§29.2) — bare tab id for instance 1, `id#n` after. This is
   the string that would be the R5PAGELAYOUT page-variant value, which is
   why it is computed in one place and shown in the designer panel header:
   an admin editing "Record View (2)" should be able to see it is a
   different layout row, not the same one. ── */
function layoutKey(n){ return n.inst > 1 ? n.step + '#' + n.inst : n.step; }

/* Instance minting: the smallest unused positive integer for this step id
   within this workflow. Smallest-unused rather than count+1 so deleting
   instance 2 of 3 and adding one back reuses 2 instead of minting 4 and
   leaving a hole in the layout keys. */
function mintInst(wf, stepId){
  const used = new Set(wf.nodes.filter(n=>n.kind==='step' && n.step===stepId).map(n=>n.inst));
  let i = 1; while(used.has(i)) i++;
  return i;
}

/* THE (2) RULE — a second copy of a step whose original still carries the
   delivered name gets " (2)" appended. Keyed on the INSTANCE number, so
   "(2)" and the layout key `id#2` always agree; a renamed original is left
   alone, because the admin has already said what that one is called. */
function mintName(wf, stepId, inst){
  const base = stepLabel(stepId);
  if(inst === 1) return base;
  return base + ' (' + inst + ')';
}

function addNodeToWf(wf, stepId, index, zone){
  /* 'uds:<id>' is how a UDS arrives from the library — one drag channel for
     every kind, so the drop handlers do not each need to know the kinds. */
  if(typeof stepId === 'string' && stepId.indexOf('uds:') === 0){
    const udsId = stepId.slice(4);
    const used = new Set(wf.nodes.filter(x=>x.kind==='uds' && x.uds===udsId).map(x=>x.inst));
    let i = 1; while(used.has(i)) i++;
    const un = mkUdsNode(udsId, {inst:i, zone:zone || 'flow'});
    if(i > 1) un.name = un.name + ' (' + i + ')';
    if(index == null || index < 0 || index > wf.nodes.length) wf.nodes.push(un);
    else wf.nodes.splice(index, 0, un);
    return un;
  }
  if(stepId === 'status' || stepId === 'timer' || stepId === 'stoptimer'){
    const sn = stepId === 'timer' ? mkTimerNode({})
      : stepId === 'stoptimer' ? mkStopTimerNode({}) : mkStatusNode({});
    if(index == null || index < 0 || index > wf.nodes.length) wf.nodes.push(sn);
    else wf.nodes.splice(index, 0, sn);
    return sn;
  }
  const node = stepId === 'cond'
    ? mkCondNode({})
    : stepId === 'fork'
    ? mkNode('fork', {})
    : (function(){
        const inst = mintInst(wf, stepId);
        const n = mkNode(stepId, {inst:inst, zone:zone || 'flow'});
        n.name = mintName(wf, stepId, inst);
        n.renamed = false;
        return n;
      })();
  if(zone) node.zone = zone;
  if(index == null || index < 0 || index > wf.nodes.length) wf.nodes.push(node);
  else wf.nodes.splice(index, 0, node);
  return node;
}

/* wf-pm-routed is built after the fact so its fork can point at a real nid
   — the whole point of §29.4's target model is that a target is a POINTER
   to another step, not a step id, so it cannot be written as a literal. */
function seedRoutedWorkflow(wf){
  const rv   = mkNode('recordview', {pinned:true, required:true});
  const chk  = mkNode('checklist',  {required:true, name:'PM Checklist'});
  const fork = mkNode('fork', {question:'Did the inspection find a defect?', yesLabel:'Yes — defect found', noLabel:'No — all within spec'});

  const cls  = mkNode('closing',    {required:true, reqComment:true});

  fork.yesTarget = null;        // continue → Parts
  fork.noTarget  = lab.nid;     // skip Parts, which becomes N/A

  /* ── A CONDITION FORK, seeded so the feature is live on load rather than
     only reachable by building one — the same reason ZJ1000 ships as a
     capability-limited clone.

     It sits straight after the checklist because it reads THAT form: the
     follow-up flag the technician just ticked or left alone. Flagged, and
     the flow continues into Parts and Labor; not flagged, and it jumps to
     Closing. That is precisely the case a question fork would otherwise
     have to ASK about a box the technician has already answered — which is
     the whole argument for this node existing. ── */
  const cn = mkCondNode({
    field:'CHK_FLAG', op:'true',
    tTrue:null,          /* flagged → continue in sequence */
    tFalse:cls.nid,      /* not flagged → straight to Closing */
  });
  wf.nodes = [rv, chk, cn, fork, prt, lab, cls, cmt];
}

   PERSISTENCE + STATE
