/* ── CAPS ARE PROTECTED (2026-09-16, user direction) ──
   And the reason is the interesting part: these are not preferences of
   this profile, they are PLATFORM limits — §2.7 takes each number from a
   shipping product (D365's ~200,000 device ceiling, Salesforce's 50,000
   per entity, D365's 15 traversal relationships, §2.3 rule 5's single
   to-many). A profile author raising the device ceiling would not raise
   what the device can actually hold; it would only move where the failure
   shows up, from authoring time to the technician's morning.

   So they render as PROTECTED fields — a lock, no border, per §5.2's
   protected treatment — and they are shown rather than hidden, because
   the whole point of §2.7's caps is that the author can see the budget
   they are spending. Changing one is a spec change, not a config change. */
/* ── WHAT EACH POLICY MEANS ──
   Every value in the dropdown below, defined once, where the choice is
   made. Ordered least-to-most present on the device, so the table reads as
   a scale rather than a list — and the two facts an author actually needs
   are in the first two columns: who put it there, and whether it can be
   written. */
function policyDefsHtml(){
  const yn = (ok, label) =>
    '<span class="chip chip--dense chip--lead ' + (ok ? 'sev-success' : 'chip--static') + '">' +
      '<span class="chip__dot"></span>' + (ok ? label : 'no ' + label.toLowerCase()) + '</span>';

  return '<div class="card" style="margin-bottom:var(--s-4)">' +
    '<div class="card__head">' + ic('info',16) + '<span class="card__title">What each policy means</span>' +
      '<span class="eyebrow" style="margin-left:auto">The label says what the app can do; the line under it says who put it there</span></div>' +
    '<div class="pdef">' +
      '<div class="pdef__r pdef__h">' +
        '<div class="pdef__n">Policy, and who decided</div>' +
        '<div class="pdef__rw">Offline</div>' +
        '<div class="pdef__d">What it means, and why it is that way</div>' +
      '</div>' +
      OFFLINE_POLICIES.map(pol =>
        '<div class="pdef__r">' +
          '<div>' +
            '<div class="pdef__n">' + esc(pol.label) + '</div>' +
            '<div class="pdef__who">' + esc(pol.who) + '</div>' +
          '</div>' +
          '<div class="pdef__rw">' + yn(pol.read, 'Read') + yn(pol.write, 'Write') +
            (policyNeedsFilter(pol.k)
              ? '<span class="chip chip--dense chip--lead sev-critical pdef__f">' +
                  '<span class="chip__dot"></span>needs a filter</span>'
              : '') +
          '</div>' +
          '<div>' +
            '<div class="pdef__d">' + pol.def + '</div>' +
            '<div class="pdef__why">' + pol.why + '</div>' +
          '</div>' +
        '</div>').join('') +
    '</div>' +
    '<div class="card__body">' +
      '<div class="menu__row"><div class="menu__row-b">' +
        '<div class="menu__row-t">Three things that catch people out</div>' +
        '<div class="menu__row-d"><b>How to read a label.</b> The name states what the app can do offline; the line ' +
          'beneath it states who put the data there. Those are two different questions, and mixing them is why this ' +
          'table used to have five rows — <b>Offline read</b> was two, split on provenance, which is a column on the ' +
          'row and not a policy (§2.6).<br>' +
          '<b>Only Offline read/write accepts writes to EAM.</b> Everything a technician changes offline is in the ' +
          'work set; every other class is readable at best. External is writable too, but through another engine\'s ' +
          'queue, never the EAM outbox. That is the same rule §2.9 states from the other side — actions may narrow ' +
          'offline, field state never does.<br>' +
          '<b>Whether a dataspy is REQUIRED is arithmetic, not a judgement.</b> An entity may ship its whole ' +
          'domain when the whole domain <b>fits</b> — under the per-entity row cap <i>and</i> within the local ' +
          'store budget. When it does not fit, a filter is required, and the filter has to fit too. Both ' +
          'dimensions do real work here: <b>Parts</b> exceeds the 50,000-row cap outright, while <b>Equipment</b> ' +
          'fits that cap at 40,000 rows and exceeds the 500 MB budget instead. Every row shows the number it was ' +
          'measured against, because a rule you cannot check is a description.<br>' +
          'Two things are outside the arithmetic: <b>Online only</b> replicates nothing, and a <b>traversed</b> ' +
          'entity is budgeted with its parent rather than on its own.</div>' +
      '</div></div>' +
    '</div>' +
  '</div>';
}

/* WHAT THIS PROFILE ACTUALLY SPENDS. Two of the four caps are now computed
   against, not merely displayed — a cap nothing is measured against is not a
   cap, the same way §30.14 argues a budget you cannot see is not a budget.
   Traversed entities are excluded: their rows arrive with the parent and are
   already counted in the work set. */
function profileTotals(p){
  let rows = 0, mb = 0;
  OFFLINE_ENTITIES.forEach(e => {
    const row = p.entities[e.id];
    if(!row || !policyNeedsFilter(row.policy) || e.traversed) return;
    const r = entityRows(e, row), m = entityMb(e, row);
    if(r != null) rows += r;
    if(m != null) mb += m;
  });
  return {rows, mb:Math.round(mb)};
}
/* `spent` and `over` are optional: a cap with no measurement renders exactly as
   it did before, so the two that cannot yet be computed against (traversal
   depth and to-many) are unchanged rather than faked. §30.20 holds — an
   over-budget total is reported on the cap it breaches, which is the control
   that expresses it, not in a banner above the screen. */
function capField(p, key, label, note, spent, over){
  const has = spent !== undefined && spent !== null;
  const bad = has && over === true;
  return '<div class="field">' +
    '<div class="field__label">' + esc(label) + '</div>' +
    '<div class="input input--prot' + (bad ? ' is-error' : '') + '" ' +
      'title="Platform limit — not editable per profile">' +
      '<span class="input__v mono">' + esc(Number(p.caps[key]).toLocaleString()) + '</span>' +
      '<span class="ms ms-16 input__lock">lock</span></div>' +
    (has
      ? '<div class="reg__meas' + (bad ? ' is-breach' : '') + '">this profile spends ' +
        esc(Number(spent).toLocaleString()) + (bad ? ' — over budget' : '') + '</div>'
      : '') +
    '<div class="menu__row-d">' + esc(note) + '</div>' +
  '</div>';
}
/* Kept, and kept REFUSING, rather than deleted: the protection has to hold
   against a direct call too, not only against an input that is no longer
   rendered. Same house rule as every other guard here — at the mutation,
   not at the gesture. */
function setCap(key, v){
  toast('Caps are platform limits from §2.7, not per-profile settings');
  return false;
}
function entityRow(p, e){
  const row = p.entities[e.id];
  const locked = e.allow.length === 1;
  const needs = rowNeedsDataspy(e, row, p);
  const spies = dataspiesFor(e.id);
  /* Measured once per row and used by both the control and its caption, so a
     row can never show one number and be validated against another. */
  const breach = policyNeedsFilter(row.policy) ? capBreach(e, row, p) : '';
  const mRows = entityRows(e, row), mMb = entityMb(e, row);
  const measTxt = (!policyNeedsFilter(row.policy) || mRows == null) ? ''
    /* &lt; ESCAPED, not a literal '<'. A bare '<1 MB' opens what a parser
       reads as a tag and silently swallows the rest of the caption — it looked
       fine in the four rows big enough to avoid it. */
    : mRows.toLocaleString() + ' rows' + (mMb != null ? ' · ' + (mMb < 1
        ? '&lt;1 MB' : Math.round(mMb).toLocaleString() + ' MB') : '') +
      (breach === 'rows' ? ' — over the ' + p.caps.rowCap.toLocaleString() + ' row cap'
        : breach === 'volume' ? ' — over the ' + p.caps.volumeMb + ' MB budget' : '');
  return '<div class="reg__row' + (row.policy === 'server-only' ? ' reg__row--off' : '') + '">' +
    '<div class="reg__name">' +
      '<span class="reg__label">' + esc(e.label) + '</span>' +
      (e.traversed ? '<span class="chip chip--dense chip--static">' + ic('route',14) + 'traversed</span>' : '') +
      '<div class="reg__note">' + esc(e.note) + '</div>' +
    '</div>' +
    '<div class="reg__pol">' +
      (locked
        /* §2.7's non-offline list is enforced AT AUTHORING TIME — so a
           server-only entity is not a disabled dropdown, it has no dropdown. */
        ? '<span class="chip chip--dense chip--lead chip--static" title="' + esc(e.note) + '">' +
          ic('lock',14) + esc(policyMeta(row.policy).label) + '</span>'
        : '<div class="input"><select onchange="setEntityPolicy(\'' + e.id + '\',this.value)">' +
          e.allow.map(k => '<option value="' + k + '"' + (row.policy===k?' selected':'') + '>' +
            esc(policyMeta(k).label) + '</option>').join('') +
          '</select>' + ic('chevD',18) + '</div>') +
    '</div>' +
    '<div class="reg__spy">' +
      (needs
        ? '<div class="input' + (row.dataspy ? '' : ' is-error') + '">' +
            '<select onchange="setEntityDataspy(\'' + e.id + '\',this.value)">' +
              '<option value=""' + (row.dataspy?'':' selected') + '>Required — pick a dataspy</option>' +
              spies.map(d => '<option value="' + esc(d) + '"' + (row.dataspy===d?' selected':'') + '>' + esc(d) + '</option>').join('') +
            '</select>' + ic('chevD',18) +
          '</div>'
        /* Three non-selectable states, each saying WHY rather than showing a
           dash: reached by traversal, a whole domain that MEASURABLY fits, or
           not on the device at all. A bare dash for all three read as "nothing
           to configure here" for two cases where something real is happening. */
        : e.traversed
          ? '<span class="reg__dash">from the work order</span>'
          : (policyNeedsFilter(row.policy)
            ? '<div class="input"><select onchange="setEntityDataspy(\'' + e.id + '\',this.value)">' +
                '<option value=""' + (row.dataspy?'':' selected') + '>All records</option>' +
                spies.map(d => '<option value="' + esc(d) + '"' + (row.dataspy===d?' selected':'') + '>' +
                  esc(d) + '</option>').join('') +
              '</select>' + ic('chevD',18) + '</div>'
            /* NOTHING REPLICATES, AND THERE IS STILL A LIST TO NAME (§2.6).
               The empty option says what empty MEANS here — pins only — rather
               than "All records", which would be a lie about a row that ships
               no records at all. */
            : isMembershipEntity(e)
            ? '<div class="input"><select onchange="setEntityDataspy(\'' + e.id + '\',this.value)">' +
                '<option value=""' + (row.dataspy?'':' selected') + '>No automatic list — pins only</option>' +
                spies.map(d => '<option value="' + esc(d) + '"' + (row.dataspy===d?' selected':'') + '>' +
                  esc(d) + '</option>').join('') +
              '</select>' + ic('chevD',18) + '</div>'
            : '<span class="reg__dash">—</span>')) +
      /* THE MEASUREMENT, ON THE ROW. This is what stops the rule being a
         description: the number the cap is compared against is the number an
         author reads. Absent for a traversed entity, which has no count of
         its own, and for one that is not on the device at all. */
      (measTxt ? '<div class="reg__meas' + (breach ? ' is-breach' : '') + '">' + measTxt + '</div>' : '') +
    '</div>' +
  '</div>';
}
function setEntityPolicy(entityId, v){
  const p = artifactOf('offline', state.openProfile); if(!p) return;
  const e = offlineEntity(entityId); if(!e || e.allow.indexOf(v) === -1) return;
  p.entities[entityId].policy = v;
  if(!policyNeedsFilter(v)) p.entities[entityId].dataspy = '';
  p.updated = todayStr(); savePortal(); render();
}
function setEntityDataspy(entityId, v){
  const p = artifactOf('offline', state.openProfile); if(!p) return;
  p.entities[entityId].dataspy = v;
  p.updated = todayStr(); savePortal(); render();
}
/* REMOVED 2026-09-16 — the two roll-up bands are gone. profileIssues() is

/* CREATE IS A MODAL — a tile is fully definable in one form, which is
   exactly the rule: modal for what fits, canvas for what needs one. */
function createTile(){ tileModal(null); }
function editTile(id){ tileModal(id); }

        ? 'Used by <b>' + use.length + '</b> layout' + (use.length===1?'':'s') +
          (use.length ? ' — ' + use.map(h=>esc(h.name)).join(', ') + '. This edit reaches all of them.' : '.')
        : 'Tiles are reusable: create once, pull into any layout.') + '</div>' +
    '</div></div>' +
    '<div class="mbox__body mbox__body--plain">' +
      '<label class="pop__l">Label</label>' +
      '<input class="tinput" id="tlLabel" maxlength="28" value="' + esc(v.label) + '" placeholder="e.g. My Open Work">' +

      /* OPENS COMES SECOND, because everything below it is scoped by it. */
      '<label class="pop__l">Opens</label>' +

        TILE_TARGETS.map(x => '<option value="' + x.id + '"' + (v.target===x.id?' selected':'') + '>' + esc(x.label) + '</option>').join('') +
      '</select>' +

      '<label class="pop__l">Insert mode</label>' +
      '<div class="menu__item" id="tlInsertRow" onclick="tileToggleInsert()">' +
        '<span class="cbx' + (v.insertMode ? ' is-on' : '') + '" id="tlInsertBox">' + ic('check',14) + '</span>' +

          '<b>+</b> badge. It is what makes this tile a <b>Create</b>, and a Create drops <b>only into the ' +

        'here is given a colour; the device draws the square as that colour at 13% with the glyph in it at full ' +

    '</div>' +

    '<div class="mbox__foot mbox__foot--split">' +
      (t ? btn('Delete', {cls:'Button--error', icon:'trash', on:'closeModal();deleteTile(\'' + id + '\')'}) : '<span></span>') +
      '<span style="display:flex;gap:var(--s-2)">' +
        btn('Cancel', {on:'closeModal()'}) +

/* ── DATASPY IS SCOPED BY THE SCREEN, AND PROTECTED UNTIL THERE IS ONE ──
   Three states, each stated at the point of choice rather than left as an
   empty or wrong dropdown: no screen yet (protected), a screen that carries
   no dataspies (Notifications, Sync — a real answer), or the screen's own
   list. An insert-mode tile has neither, so the block collapses entirely
   rather than offering fields that are then ignored. */
function tileSpyHtml(target, spy, countSql, insertMode){
  if(insertMode){
    return '<div class="pop__note">A <b>Create</b> carries no dataspy and no counter — it opens the screen in ' +
      'insert mode, so there is nothing to filter and nothing to count.</div>';
  }
  const t = tileTarget(target);
  const list = t && t.entity ? dataspiesFor(t.entity) : [];
  let spyField;
  if(!t){
    spyField = '<div class="pop__note">' + ic('lock',14) + ' <b>Pick a screen first.</b> A dataspy belongs to a ' +
      'record list, so there is nothing to choose from until <b>Opens</b> is set.</div>';
  } else if(!list.length){
    spyField = '<div class="pop__note">' + ic('lock',14) + ' <b>' + esc(t.label) + '</b> carries no dataspies — ' +
      'it is not a record list. The tile opens it whole.</div>';
  } else {
    spyField = '<select class="tinput" id="tlSpy">' +
        '<option value="">None — open the screen unfiltered</option>' +
        list.map(d => '<option value="' + esc(d) + '"' + (spy===d?' selected':'') + '>' + esc(d) + '</option>').join('') +
      '</select>' +
      '<div class="pop__note">Where the tile <b>goes</b>, and the list is <b>' + esc(t.label) + '</b>\'s own. ' +
        'Dataspies are authored on the record list screen, never here — this selects one (same boundary as UDS ' +
        'definitions).</div>';
  }
  return '<label class="pop__l">Dataspy <span class="pop__opt">optional</span></label>' + spyField +
    (t
      ? '<label class="pop__l">Count statement <span class="pop__opt">optional</span></label>' +
        '<input class="tinput" id="tlCount" value="' + esc(countSql || '') + '" placeholder="SELECT COUNT(*) FROM \u2026">' +
        '<div class="pop__note"><b>Separate from the dataspy</b>, which is the part worth knowing: the dataspy is ' +
          'where the tile goes, this is what the badge says. Leave it empty for a plain link. ' +
          'Returns 0 → <b>no badge at all</b> (not a zero); 1000 or more → <b>999+</b>. Refreshed by the header ' +
          'refresh, not live.</div>'
      : '');
}
/* Both handlers rebuild the same block from the same function, reading the
   live values out first — so switching screen keeps a typed count statement
   and only drops a dataspy the new screen does not have. */
function tileModalSync(){
  const w = $('tlSpyWrap'); if(!w) return;
  const target = ($('tlTarget') && $('tlTarget').value) || '';
  const spy = ($('tlSpy') && $('tlSpy').value) || '';
  const count = ($('tlCount') && $('tlCount').value) || '';
  const t = tileTarget(target);
  const keep = t && t.entity && dataspiesFor(t.entity).indexOf(spy) > -1 ? spy : '';
  w.innerHTML = tileSpyHtml(target, keep, count, tileInsertOn());
}
function tileInsertOn(){
  const b = $('tlInsertBox');
  return !!(b && b.classList.contains('is-on'));
}
/* A real row, not a 16px .cbx used as a <label>. That is what made this
   control render as a box with text spilling out of it: .cbx IS the box. */
function tileToggleInsert(){
  const b = $('tlInsertBox'); if(!b) return;
  b.classList.toggle('is-on');
  tileModalSync();
}
function commitTile(id){
  const label = ($('tlLabel') && $('tlLabel').value || '').trim();
  if(!label){ toast('A tile needs a label'); return; }
  const target = ($('tlTarget') && $('tlTarget').value) || '';
  if(!target){ toast('Pick what the tile opens'); return; }
  const insertMode = tileInsertOn();
  /* THE ICON IS AUTHORED, NOT DERIVED. It used to be overwritten here from
     the target on every save — so a seeded tile lost its glyph the first
     time anybody opened it, and the icon field was unreachable. */
  const data = {label:label, insertMode:insertMode,
    icon:pickerRead('tlIcons', 'list'),
    target:target,
    dataspy:(!insertMode && $('tlSpy')) ? $('tlSpy').value : '',
    countSql:(!insertMode && $('tlCount')) ? $('tlCount').value.trim() : '',
    color:pickerRead('tlColors', 'none')};
  if(id){
    const t = tileById(id); if(!t) return;
    Object.assign(t, data); t.updated = todayStr();
  } else {
    TILES.push(mkTile(data));
  }
  savePortal(); closeModal(); render();
  toast(id ? 'Tile saved — every layout using it is updated' : 'Tile created');
}
function deleteTile(id){
  const t = tileById(id); if(!t) return;
  const use = tileUsage(id);
  confirmBox({title:'Delete this tile?', sub:esc(t.label), danger:true, ok:'Delete tile',
    body: use.length
      ? '<div style="font-size:var(--uxt-theme-typography-body-2-font-size);line-height:1.6">It is used by <b>' +
        use.length + '</b> layout' + (use.length===1?'':'s') + ': ' + use.map(h=>esc(h.name)).join(', ') + '.</div>' +
        '<ul class="bullets"><li>It is <b>removed from each of them</b>. A reference to a deleted tile would be a ' +
        'hole in a layout with no visible cause, so the reference goes rather than dangling.</li></ul>'
      : '<div style="font-size:var(--uxt-theme-typography-body-2-font-size);line-height:1.6">No layout uses it.</div>',
    onOk:function(){

}

/* CREATE IS A CANVAS — a layout is an arrangement, so it opens blank and you
   drag into it. Same rule, other branch. */
function createHome(){
  const h = mkHome('New home layout', '');
  HOMES.unshift(h); savePortal();
  state.openHome = h.id; render();
}
function copyHome(id){
  const src = artifactOf('home', id); if(!src) return;
  const dup = JSON.parse(JSON.stringify(src));
  dup.id = 'hl-' + Math.random().toString(36).slice(2,8);
  dup.name = src.name + ' (copy)';
  dup.updated = todayStr();
  /* The tile references copy — they are references, so both layouts point
     at the same tiles, which is the whole reason tiles are shared. But
     SECTION IDS are re-minted: a section belongs to one layout, so two
     layouts sharing a section id would let an edit addressed by id land on
     the wrong one. Same reasoning as re-minting node ids on a copy (§30.2). */
  (dup.sections || []).forEach(sc => { sc.id = 'sc-' + Math.random().toString(36).slice(2,8); });
  HOMES.splice(HOMES.indexOf(src) + 1, 0, dup);
  savePortal(); render(); toast('Copied — same tiles, no groups assigned');
}
function deleteHome(id){
  const h = artifactOf('home', id); if(!h) return;
  const g = groupsOf('home', id);
  confirmBox({title:'Delete this layout?', sub:esc(h.name), danger:true, ok:'Delete layout',
    body: g.length
      ? '<div style="font-size:var(--uxt-theme-typography-body-2-font-size);line-height:1.6">Assigned to <b>' +
        g.length + '</b> group' + (g.length===1?'':'s') + ' (' + g.map(esc).join(', ') + ').</div>' +
        '<ul class="bullets"><li>Those groups fall back to the <b><code>*</code> default layout</b> if one is assigned, ' +
        'and to no Home screen if not.</li><li>The tiles themselves are untouched — they belong to the catalogue.</li></ul>'
      : '<div style="font-size:var(--uxt-theme-typography-body-2-font-size);line-height:1.6">No groups are assigned to it. ' +
        'The tiles it used are untouched.</div>',
    onOk:function(){
      HOMES.splice(HOMES.indexOf(h), 1);
      dropAssignmentsFor('home', id);
      savePortal(); render(); toast('Layout deleted');
    }});
}
function openHome(id){ state.openHome = id; closeMenu(); render(); }

/* ── THE LAYOUT EDITOR — available tiles left, phone preview right ── */
function renderHomeEditor(){
  const h = normalizeHome(artifactOf('home', state.openHome));
  if(!h){ state.openHome = null; return renderHomeArea(); }
  const groups = groupsOf('home', h.id);
  const iss = homeIssues(h);
  const onLayout = homeTileIds(h);
  /* Available = the catalogue minus what is already on this layout. Same
     complement idea as the designer's field sidebar — "what is left to
     add". Split by insertMode, because the two halves have DIFFERENT
     DESTINATIONS and a single pooled list would imply they are
     interchangeable. */
  const avail = TILES.map(normalizeTile).filter(t => onLayout.indexOf(t.id) === -1);

    '<div class="lib__item' + (t.insertMode ? ' lib__item--create' : '') + '" draggable="true" ' +

        ic(t.insertMode ? 'plus' : t.icon, 16) + '</span>' +
      '<span class="lib__item-t">' + esc(t.label) + '</span>' +
      '<span class="lib__used" title="Layouts using it">' + tileUsage(t.id).length + '</span>' +
    '</div>';

  $('gallery').innerHTML =
    '<div class="wrapw">' +
      '<div class="tbar">' +
        '<div>' +
          '<div class="field" style="max-width:420px">' +
            '<div class="field__label">Layout name</div>' +
            '<div class="input"><input value="' + esc(h.name) + '" oninput="setHomeField(\'name\',this.value)"></div>' +
          '</div>' +
        '</div>' +
        '<div class="tbar__r">' +
          btn(groups.length + ' group' + (groups.length===1?'':'s'), {icon:'users', on:'openAssign(event,\'home\',\'' + h.id + '\')'}) +
          btn('Back to layouts', {icon:'chevL', on:'closeHome()'}) +
        '</div>' +
      '</div>' +
      /* No "N to look at" band (2026-09-16). homeIssues() still runs — an
         untitled section renders its title slot in error, an empty section
         shows its own drop hint, and a silently-hidden tile outlines red
         with the reason in its menu. The finding is on the thing. */
      '<div class="homewrap">' +
        '<div class="card homepane">' +
          '<div class="card__head">' + ic('grid',16) + '<span class="card__title">Available tiles</span>' +
            '<span style="margin-left:auto">' + btn('New', {cls:'Button--sm', icon:'plus', on:'createTile()'}) + '</span></div>' +
          '<div class="card__body">' +
            '<div class="lib__grp">Available screens</div>' +

            '<div class="lib__head-d" style="padding:0 6px 6px">A tile with Insert Mode set. It drops into the ' +
              'Create control only \u2014 never into a section, because Home\'s tiles mean ' +
              '"go look at a list", not "start a new record" (\u00a79.4.1).</div>' +
            (creates.length ? creates.map(libItem).join('')
              : '<div class="menu__row-d">No create tiles left to add.</div>') +
          '</div>' +
        '</div>' +
        '<div class="homephone">' +
          '<div class="eyebrow" style="text-align:center;margin-bottom:var(--s-2)">Home screen preview</div>' +
          emuHomeHtml(h) +
          '<div class="reg__dash" style="margin-top:var(--s-3);text-align:center">' +
            'The device scrolls each section sideways; this wraps at ' + HOME_FOLD +

        '</div>' +

}

/* ── THE PREVIEW ──
   Ordered exactly as the device orders it: pinned create bar, then the
   technician-owned Favorites row, then the authored sections. */
function emuHomeHtml(h){
  const gapIds = {};
  groupsOf('home', h.id).forEach(g => homeTileGaps(h, g).forEach(t => {
    gapIds[t.id] = (gapIds[t.id] || []).concat(g);
  }));

  return '<div class="emu">' +
    '<div class="emu-nav">' + ic('grid',20) + '<span class="emu-nav-t">Home</span></div>' +

    /* CREATE BAR — one pill, whose CONTENTS the admin authors. The chooser
       stays a chooser (§9.4.1 locked that: defaulting blindly was the
       original defect), so what is authored here is the menu, not a row of
       competing buttons. */
    '<div class="emu-cbar">' +
      '<div class="emu-cpill">' + ic('plus',16) + 'Create</div>' +
      '<div class="emu-ctray" id="ctray" ondragover="createDragOver(event)" ' +
        'ondragleave="createDragLeave(event)" ondrop="createDrop(event)">' +
        (h.creates.length
          ? h.creates.map((id,ci) => {
              const t = normalizeTile(tileById(id)); if(!t) return '';
              const bad = !!gapIds[t.id];
              return '<div class="emu-crow" draggable="true" ondragstart="createMoveStart(event,' + ci + ')" ' +
                'ondragend="tileDragEnd()" oncontextmenu="createOnLayoutMenu(event,\'' + h.id + '\',' + ci + ')" ' +
                'title="Right-click to remove">' +
                '<span class="hometile__ico" style="' + tileGlyphStyle(t) + '">' + ic('plus',16) + '</span>' +
                '<span class="emu-crow__l">' + esc(t.label) +
                  (bad ? ' \u00b7 hidden for ' + esc(gapIds[t.id].join(', ')) : '') + '</span>' +
                '<span class="emu-crow__x">' + ic('chevR',14) + '</span>' +
              '</div>';
            }).join('')
          : '<div class="emu-ctray__e">Drag a create tile here.<br>These become the Create sheet\'s rows.</div>') +
      '</div>' +
    '</div>' +

    '<div class="emu-body">' +

      /* FAVORITES — the admin can position and toggle it, never fill it.
         On the device it is built from the technician's own starred
         dataspies (loadWoFavorites/loadEquipFavorites), so drawing
         authorable tiles here would be a preview of something else. */
      (h.showFavorites
        ? '<div class="emu-fav">' +
            '<div class="emu-sec__h"><span class="emu-sec__t">Favorites</span>' +
              '<span class="emu-secbtn" onclick="toggleHomeFavorites()" title="Hide the Favorites row">' +
                ic('eye',16) + '</span></div>' +
            '<div class="emu-fav__r">' +
              '<div class="emu-fav__g"><div class="emu-fav__c"></div><div class="emu-fav__t"></div></div>' +
              '<div class="emu-fav__g"><div class="emu-fav__c"></div><div class="emu-fav__t"></div></div>' +
              '<div class="emu-fav__g"><div class="emu-fav__c"></div><div class="emu-fav__t"></div></div>' +
            '</div>' +
            '<div class="emu-fav__n">The technician\'s own starred dataspies. Not authorable here \u2014 ' +
              'position and presence are the only choices.</div>' +
          '</div>'
        : '') +

      /* SECTIONS */
      h.sections.map((sec, si) => {
        const titled = (sec.title || '').trim();
        const over = sec.tiles.length - HOME_FOLD;
        return '<div class="emu-sec">' +
          '<div class="emu-sec__h">' +
            '<span class="emu-sec__t' + (titled ? '' : ' emu-sec__t--none') + '">' +
              (titled ? esc(sec.title) : 'Untitled section') + '</span>' +
            (sec.tiles.length ? '<span class="emu-sec__c">' + sec.tiles.length + '</span>' : '') +
            '<span class="emu-secbtn" oncontextmenu="sectionMenu(event,' + si + ')" ' +
              'onclick="sectionMenu(event,' + si + ')" title="Section options">' + ic('dots',16) + '</span>' +
          '</div>' +
          '<div class="emu-sec__row" ondragover="secDragOver(event,' + si + ')" ' +
            'ondragleave="secDragLeave(event)" ondrop="tileDrop(event,' + si + ',-1)">' +
            (sec.tiles.length
              ? sec.tiles.map((id, ti) => {
                  const t = normalizeTile(tileById(id)); if(!t) return '';
                  const badge = tileCountBadge(t);
                  const gap = gapIds[t.id];
                  return (ti === HOME_FOLD && sec.tiles.length > HOME_FOLD
                    ? '<div class="emu-sec__fold"><span class="emu-sec__fold-t">SWIPE TO SEE ' +
                        (sec.tiles.length - HOME_FOLD) + ' MORE</span></div>'
                    : '') +
                    '<div class="hometile' + (ti >= HOME_FOLD ? ' hometile--past' : '') +
                      (gap ? ' hometile--gap' : '') + '" draggable="true" ' +
                      'ondragstart="tileMoveStart(event,' + si + ',' + ti + ')" ondragend="tileDragEnd()" ' +
                      'ondragover="secDragOver(event,' + si + ')" ondrop="tileDrop(event,' + si + ',' + ti + ')" ' +
                      'oncontextmenu="tileOnLayoutMenu(event,\'' + h.id + '\',' + si + ',' + ti + ')" ' +
                      'title="' + (gap ? 'Hidden for ' + esc(gap.join(', ')) + ' \u2014 not in that menu' : 'Right-click for options') + '">' +
                      '<span class="hometile__sq" style="' + tileSquareStyle(t) + '">' +
                        '<span class="hometile__ico">' + ic(t.icon,24) + '</span>' +
                        (badge ? '<span class="hometile__b">' + esc(badge) + '</span>' : '') +
                      '</span>' +
                      '<span class="hometile__l">' + esc(t.label) + '</span>' +
                    '</div>';
                }).join('')
              : '<div class="emu-dropzone" style="grid-column:1/-1">Drag a screen tile here</div>') +
          '</div>' +
        '</div>';
      }).join('') +

      '<button class="emu-addsec" onclick="addSection()">' + ic('plus',16) + 'Add a section</button>' +
      (h.showFavorites ? '' :
        '<button class="emu-addsec" onclick="toggleHomeFavorites()">' + ic('eye',16) + 'Show the Favorites row</button>') +
    '</div>' +

    /* THE APP NAVIGATION BAR — the literal bottom edge of the same picture,
       which is the argument for it living here (§30.24). */
    navBarHtml(h) +
  '</div>';
}

/* ── THE NAVIGATION BAR, DRAWN AS THE DEVICE DRAWS IT ──
   Two different widths are in play and conflating them would be a lie in
   either direction: the bar is DRAWN at what a 390px device gives each slot,
   and the note REPORTS what the 320px floor gives it. The second is the one
   that constrains the label, so it is the one printed. */
function navDrawPx(n){
  n = Math.max(1, n || 1);
  return Math.min(NAV_SLOT_PX, (378 - NAV_GAP_PX * (n - 1)) / n);   /* 390 − 6px padding each side */
}
function navBarHtml(h){
  const n = h.nav.length;
  const draw = navDrawPx(n);
  const budget = navLabelBudget(n);
  /* Which slots a group would never reach — the §30.17 gate, per item. */
  const gapG = {};
  groupsOf('home', h.id).forEach(g => navGaps(h, g).forEach(it => {
    gapG[it.target] = (gapG[it.target] || []).concat(g);
  }));

  return '<div class="emu-navwrap">' +
    '<div class="emu-navbar" id="navbar" ondragover="navDragOver(event,-1)" ondrop="navDrop(event,-1)">' +
      h.nav.map((it, i) => {
        const t = navTarget(it.target) || {};
        const bad = gapG[it.target];
        const label = (it.label || '').trim();
        const long = label.length > budget;
        const pinned = it.target === 'home';
        return '<div class="emu-navitem' + (i === 0 ? ' emu-navitem--on' : '') +
            (pinned ? ' emu-navitem--pinned' : '') + (bad ? ' emu-navitem--gap' : '') +
            (long ? ' emu-navitem--long' : '') + '" style="width:' + draw.toFixed(1) + 'px" ' +
          'draggable="' + (pinned ? 'false' : 'true') + '" ' +
          (pinned ? '' : 'ondragstart="navDragStart(event,' + i + ')" ondragend="navDragEnd()" ' +
                         'ondragover="navDragOver(event,' + i + ')" ondrop="navDrop(event,' + i + ')" ') +
          'onclick="navItemModal(' + i + ')" oncontextmenu="navMenu(event,' + i + ')" ' +
          'title="' + esc(pinned
            ? 'Home is slot 1 and cannot be moved or removed — it is the only way back to Home while browsing. Its label and icon are yours.'
            : (bad ? 'Dead for ' + bad.join(', ') + ' — ' + (t.label || it.target) + ' is not in that menu. '
                   : '') + 'Click to edit · drag to reorder · right-click for options') + '">' +
          (pinned ? '<span class="emu-navitem__p">' + ic('pin',14) + '</span>' : '') +
          ic(it.icon, 20) +
          '<span class="emu-navitem__l">' + (label ? esc(label) : '—') + '</span>' +
        '</div>';
      }).join('') +
      (n < NAV_MAX
        ? '<button class="emu-navadd" onclick="addNavItem()" style="width:' + draw.toFixed(1) + 'px" ' +
            'title="Add a navigation item">' + ic('plus',16) + 'ADD</button>'
        : '') +
    '</div>' +
    '<div class="emu-navnote">' +
      '<b>This bar is not part of Home.</b> It is app-level chrome (§4.2): it shows on every browsing ' +
      'screen and hides the moment a record opens. It is authored here because a group gets exactly one ' +
      'Home layout and exactly one bar — same cardinality, so one artifact rather than two. ' +
      'Label, screen and icon are yours; <b>colour is not</b> — the bar is monochrome glass (§23). ' +
      'Notifications draws its own unread badge; a nav item carries no count statement.' +
      '<div class="emu-navnote__m">' +
        '<span class="emu-navnote__c">' + n + ' of ' + NAV_MAX + ' slots</span>' +
        '<span class="emu-navnote__c">' + navSlotPx(n).toFixed(1) + 'px per slot at the 320px floor</span>' +
        '<span class="emu-navnote__c">~' + budget + ' characters before a label wraps</span>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function setHomeField(k, v){

/* ── SECTION CRUD ── */
function addSection(){

      ic('chevD',16) + 'Move down</div>' +

}
function renameSection(si){
  const h = artifactOf('home', state.openHome); if(!h) return;

    '<div class="mbox__head"><div class="mbox__head-b">' +
      '<div class="mbox__title">Section title</div>' +

        'so an empty title is reported rather than allowed to render.</div>' +
    '</div></div>' +

      '<label class="pop__l">Title</label>' +

    '</div>' +

      btn('Cancel', {on:'closeModal()'}) +
      btn('Save', {cls:'Button--contained Button--primary', on:'commitSectionTitle(' + si + ')'}) +
    '</div>');
  const el = $('scTitle'); if(el){ el.focus(); el.select(); }

function commitSectionTitle(si){
  const h = artifactOf('home', state.openHome); if(!h) return;
  const sec = h.sections[si]; if(!sec) return;
  const v = (($('scTitle') && $('scTitle').value) || '').trim();
  if(!v){ toast('A section needs a title'); return; }

}
/* Clamped AT THE MUTATION, not in the menu that offers it — the house
   rule, learned three times over (pinned step, container 0, the More
   group). A disabled menu row is a courtesy; this is the guard. */
function moveSection(si, dir){
  const h = artifactOf('home', state.openHome); if(!h) return;
  const to = si + dir;
  if(si < 0 || si >= h.sections.length || to < 0 || to >= h.sections.length) return;
  const [m] = h.sections.splice(si, 1);
  h.sections.splice(to, 0, m);
  h.updated = todayStr(); savePortal(); render();
}
function deleteSection(si){
  const h = artifactOf('home', state.openHome); if(!h) return;
  const sec = h.sections[si]; if(!sec) return;
  const go = function(){
    h.sections.splice(si, 1);
    h.updated = todayStr(); savePortal(); render();
    toast('Section deleted \u2014 its tiles are back in the catalogue');
  };
  if(!sec.tiles.length) return go();
  confirmBox({title:'Delete this section?', sub:esc(sec.title || 'Untitled section'), danger:true, ok:'Delete section',
    body:'<div style="font-size:var(--uxt-theme-typography-body-2-font-size);line-height:1.6">It holds <b>' +
      sec.tiles.length + '</b> tile' + (sec.tiles.length===1?'':'s') + '.</div>' +
      '<ul class="bullets"><li>The <b>placements</b> go; the tiles themselves are untouched and return to the ' +
      'available list, because a tile belongs to the catalogue and not to this layout.</li></ul>',
    onOk:go});
}

/* ── DRAG AND DROP ──
   tileDrag is one of three shapes: a catalogue tile, a move within a
   section, or a move within the create tray.

   NOTHING HERE RE-RENDERS DURING dragover. That was the container bug in
   the designer panel: re-rendering destroys the drag source mid-gesture.
   Only classes are toggled. */
let tileDrag = null;
function tileDragStart(ev, tileId){
  tileDrag = {tileId:tileId};
  ev.dataTransfer.effectAllowed = 'copy';
  try{ ev.dataTransfer.setData('text/plain', tileId); }catch(e){}
  if(ev.currentTarget.classList) ev.currentTarget.classList.add('dragging');
}
function tileMoveStart(ev, si, ti){
  tileDrag = {fromSec:si, from:ti};
  ev.dataTransfer.effectAllowed = 'move';
  try{ ev.dataTransfer.setData('text/plain','m'); }catch(e){}
  if(ev.currentTarget.classList) ev.currentTarget.classList.add('dragging');
  ev.stopPropagation();
}
function createMoveStart(ev, ci){
  tileDrag = {fromCreate:ci};
  ev.dataTransfer.effectAllowed = 'move';
  try{ ev.dataTransfer.setData('text/plain','c'); }catch(e){}
  if(ev.currentTarget.classList) ev.currentTarget.classList.add('dragging');
  ev.stopPropagation();
}
function tileDragEnd(){
  tileDrag = null;
  document.querySelectorAll('.dragging').forEach(e => e.classList.remove('dragging'));
  document.querySelectorAll('.is-over,.is-bad').forEach(e => { e.classList.remove('is-over'); e.classList.remove('is-bad'); });
}
/* What is being dragged, as a tile record — so the drop rule can be
   shown DURING the gesture, not only reported after it. */
function dragTile(){
  if(!tileDrag) return null;
  if(tileDrag.tileId) return normalizeTile(tileById(tileDrag.tileId));
  const h = artifactOf('home', state.openHome); if(!h) return null;
  if(typeof tileDrag.fromCreate === 'number') return normalizeTile(tileById(h.creates[tileDrag.fromCreate]));
  const sec = h.sections[tileDrag.fromSec];
  return sec ? normalizeTile(tileById(sec.tiles[tileDrag.from])) : null;
}
function rowOf(el){
  while(el && el.classList && !el.classList.contains('emu-sec__row')) el = el.parentNode;
  return el;
}
function secDragOver(ev, si){
  if(!tileDrag) return;
  ev.preventDefault(); ev.stopPropagation();
  const t = dragTile(); const row = rowOf(ev.currentTarget);
  if(row && row.classList) row.classList.add(t && t.insertMode ? 'is-bad' : 'is-over');
}
function secDragLeave(ev){
  const row = rowOf(ev.currentTarget);
  if(row && row.classList){ row.classList.remove('is-over'); row.classList.remove('is-bad'); }
}
function createDragOver(ev){
  if(!tileDrag) return;
  ev.preventDefault(); ev.stopPropagation();
  const t = dragTile(); const el = $('ctray');
  if(el && el.classList) el.classList.add(t && t.insertMode ? 'is-over' : 'is-bad');
}
function createDragLeave(ev){
  const el = $('ctray');
  if(el && el.classList){ el.classList.remove('is-over'); el.classList.remove('is-bad'); }
}

/* ── THE DROP RULE, GUARDED AT THE MUTATION ──
   "One tile with insert mode flag means it can't be drug onto layout, but
   only to the create icon. And vice versa for non-flagged tiles."
   (user direction 2026-09-16)

   Both directions, and refused HERE rather than in the gesture, because a
   gesture guard is bypassed the moment anything calls the mutation
   directly — which is how the More-group guard was got round. */
/* Returns true iff something was placed or moved. The return value is what
   makes the REFUSAL testable independently of normalizeHome's prune \u2014 see
   the note above setCap for the same "guard at the mutation" discipline. */
function tileDrop(ev, si, atIdx){
  if(!tileDrag) return false;
  ev.preventDefault(); ev.stopPropagation();
  const h = artifactOf('home', state.openHome); if(!h){ tileDragEnd(); return false; }
  const sec = h.sections[si]; if(!sec){ tileDragEnd(); return false; }
  const d = tileDrag; tileDragEnd();

  if(d.tileId){
    const t = normalizeTile(tileById(d.tileId)); if(!t) return false;
    if(t.insertMode){
      toast('"' + t.label + '" has Insert Mode set \u2014 it belongs in the Create control, not a section');
      return false;
    }
    if(homeTileIds(h).indexOf(d.tileId) > -1){ toast('That tile is already on this layout'); return false; }
    if(atIdx < 0 || atIdx >= sec.tiles.length) sec.tiles.push(d.tileId);
    else sec.tiles.splice(atIdx, 0, d.tileId);
  } else if(typeof d.fromCreate === 'number'){
    /* Dragging a Create out of the tray and into a section is the same
       refusal from the other side. */
    const t = normalizeTile(tileById(h.creates[d.fromCreate]));
    toast(t ? '"' + t.label + '" is a create action \u2014 it cannot sit among the tiles' : 'Not a section tile');
    return false;
  } else if(typeof d.fromSec === 'number'){
    const src = h.sections[d.fromSec]; if(!src) return false;
    const [m] = src.tiles.splice(d.from, 1);
    if(m === undefined) return false;
    let to = atIdx < 0 ? sec.tiles.length : atIdx;
    if(d.fromSec === si && atIdx > d.from) to = atIdx - 1;
    sec.tiles.splice(Math.max(0, Math.min(sec.tiles.length, to)), 0, m);
  }
  h.updated = todayStr(); savePortal(); render();
  return true;
}
function createDrop(ev){
  if(!tileDrag) return false;
  ev.preventDefault(); ev.stopPropagation();
  const h = artifactOf('home', state.openHome); if(!h){ tileDragEnd(); return false; }
  const d = tileDrag; tileDragEnd();

  if(d.tileId){
    const t = normalizeTile(tileById(d.tileId)); if(!t) return false;
    if(!t.insertMode){
      toast('"' + t.label + '" opens a screen \u2014 the Create control only takes tiles with Insert Mode set');
      return false;
    }
    if(homeTileIds(h).indexOf(d.tileId) > -1){ toast('That tile is already on this layout'); return false; }
    h.creates.push(d.tileId);
  } else if(typeof d.fromCreate === 'number'){
    /* Reorder within the tray: the sheet shows them in this order. */
    const [m] = h.creates.splice(d.fromCreate, 1);
    if(m === undefined) return false;
    h.creates.push(m);
  } else {
    const t = dragTileFromSection(h, d);
    toast(t ? '"' + t.label + '" has no Insert Mode \u2014 it stays in its section' : 'Not a create tile');
    return false;
  }
  h.updated = todayStr(); savePortal(); render();
  return true;
}
function dragTileFromSection(h, d){
  const sec = h.sections[d.fromSec];
  return sec ? normalizeTile(tileById(sec.tiles[d.from])) : null;
}

function tileOnLayoutMenu(ev, homeId, si, ti){
  ev.preventDefault(); ev.stopPropagation();
  const h = artifactOf('home', homeId); if(!h) return;
  const sec = h.sections[si]; if(!sec) return;
  const t = normalizeTile(tileById(sec.tiles[ti]));
  const gaps = groupsOf('home', h.id).filter(g => t && groupMenu(g).indexOf(targetScreen(t.target)) === -1);
  openMenu(ev,

      ? '<div class="menu__row is-warn"><div class="menu__row-b"><div class="menu__row-t">' +
          'Hidden for ' + esc(gaps.join(', ')) + '</div><div class="menu__row-d">' +
          esc((tileTarget(targetScreen(t.target))||{label:t.target}).label) + ' is not in that menu, so the product drops the ' +
          'tile silently. Reported, not auto-fixed \u2014 removing it would be wrong for the groups that can see it.' +
          '</div></div></div><div class="menu__sep"></div>'
      : '') +
    '<div class="menu__item" onclick="closeMenu();editTile(\'' + (t?t.id:'') + '\')">' + ic('pencil',16) +
      'Edit tile<span class="menu__meta">' + (t?tileUsage(t.id).length:0) + ' layouts</span></div>' +
    '<div class="menu__sep"></div>' +
    '<div class="menu__item menu__item--danger" onclick="closeMenu();removeTileFromHome(\'' + homeId + '\',' + si + ',' + ti + ')">' +
      ic('trash',16) + 'Remove from this layout</div>');
}
function createOnLayoutMenu(ev, homeId, ci){
  ev.preventDefault(); ev.stopPropagation();
  const h = artifactOf('home', homeId); if(!h) return;
  const t = normalizeTile(tileById(h.creates[ci]));
  openMenu(ev,
    '<div class="menu__label">' + esc(t ? t.label : 'Create') + '</div>' +
    '<div class="menu__item" onclick="closeMenu();editTile(\'' + (t?t.id:'') + '\')">' + ic('pencil',16) + 'Edit tile</div>' +
    '<div class="menu__sep"></div>' +
    '<div class="menu__item menu__item--danger" onclick="closeMenu();removeCreateFromHome(\'' + homeId + '\',' + ci + ')">' +
      ic('trash',16) + 'Remove from the Create control</div>');
}
function removeTileFromHome(homeId, si, ti){
  const h = artifactOf('home', homeId); if(!h) return;
  const sec = h.sections[si]; if(!sec) return;
  sec.tiles.splice(ti, 1); h.updated = todayStr(); savePortal(); render();
  toast('Removed from this layout \u2014 the tile itself is untouched');
}
function removeCreateFromHome(homeId, ci){
  const h = artifactOf('home', homeId); if(!h) return;
  h.creates.splice(ci, 1); h.updated = todayStr(); savePortal(); render();
  toast('Removed from the Create control \u2014 the tile itself is untouched');
}


/* ══════════════════════════════════════════════════════════════════════
   THE NAVIGATION BAR — CRUD (§30.24)
   One item, three authorable things: label, screen, icon. Every rule is
   enforced at the MUTATION and again in normalizeNav on read, which is the
   §30.16 discipline — a gesture guard alone is bypassed by anything that
   calls the mutation directly.
   ══════════════════════════════════════════════════════════════════════ */
/* Which screens are still free. A nav item carries no dataspy, so two items
   on one screen would be two identical destinations — the option is removed
   rather than offered and then refused. */
function navFreeTargets(h, exceptIdx){
  const taken = {};
  (h.nav || []).forEach((it, i) => { if(i !== exceptIdx) taken[it.target] = 1; });
  return NAV_TARGETS.filter(t => !t.shell && !taken[t.id]);
}
function addNavItem(){
  const h = artifactOf('home', state.openHome); if(!h) return;
  if(h.nav.length >= NAV_MAX){
    toast('The bar holds ' + NAV_MAX + ' items — remove one first');
    return;
  }
  const free = navFreeTargets(h, -1);
  if(!free.length){ toast('Every screen the bar can open is already on it'); return; }
  const t = free[0];
  h.nav.push(mkNavItem({target:t.id, label:t.label, icon:navDefaultIcon(t.id)}));
  h.updated = todayStr(); savePortal(); render();
  navItemModal(h.nav.length - 1);
}
/* A sensible starting glyph per screen, so a new slot is never a blank
   square the admin has to decode. */
function navDefaultIcon(target){
  return {home:'home', wolist:'list', equiplist:'wrench', notif:'bell', sync:'sync'}[target] || 'list';
}
function removeNavItem(i){
  const h = artifactOf('home', state.openHome); if(!h) return;
  const it = h.nav[i]; if(!it) return;
  /* Home is slot 1 and is the only route back to Home while browsing —
     clamped here, not merely left out of the menu. */
  if(it.target === 'home'){ toast('Home cannot be removed — it is the only way back to Home while browsing'); return; }
  h.nav.splice(i, 1);
  h.updated = todayStr(); savePortal(); render();
  toast('Removed from the navigation bar');
}
function moveNavItem(i, d){
  const h = artifactOf('home', state.openHome); if(!h) return;
  const to = i + d;
  /* Slot 1 is Home's, from both sides: it cannot move, and nothing can move
     into it. */
  if(i === 0 || to < 1 || to >= h.nav.length) return;
  const m = h.nav.splice(i, 1)[0];
  h.nav.splice(to, 0, m);
  h.updated = todayStr(); savePortal(); render();
}
function navMenu(ev, i){
  ev.preventDefault(); ev.stopPropagation();
  const h = artifactOf('home', state.openHome); if(!h) return;
  const it = h.nav[i]; if(!it) return;
  const t = navTarget(it.target) || {};
  const pinned = it.target === 'home';
  const gaps = groupsOf('home', h.id).filter(g => !t.shell && groupMenu(g).indexOf(t.screen) === -1);
  openMenu(ev,
    '<div class="menu__label">' + esc(it.label || 'Navigation item') + '</div>' +
    (gaps.length
      ? '<div class="menu__row is-warn"><div class="menu__row-b"><div class="menu__row-t">' +
          'Dead for ' + esc(gaps.join(', ')) + '</div><div class="menu__row-d">' +
          esc(t.label || it.target) + ' is not in that menu, so the slot goes nowhere for those groups. ' +
          'Reported, not auto-fixed — removing it would be wrong for the groups that can reach it.' +
          '</div></div></div><div class="menu__sep"></div>'
      : '') +
    (pinned
      ? '<div class="menu__row"><div class="menu__row-b"><div class="menu__row-t">Slot 1, pinned</div>' +
          '<div class="menu__row-d">Home is the only route back to Home while browsing, so its position and ' +
          'screen are protected. Its label and icon are still yours.</div></div></div><div class="menu__sep"></div>'
      : '') +
    '<div class="menu__item" onclick="closeMenu();navItemModal(' + i + ')">' + ic('pencil',16) + 'Edit item</div>' +
    (pinned ? '' :
      '<div class="menu__item' + (i <= 1 ? ' menu__item--off' : '') + '" onclick="closeMenu();moveNavItem(' + i + ',-1)">' +
        ic('chevU',16) + 'Move left</div>' +
      '<div class="menu__item' + (i === h.nav.length-1 ? ' menu__item--off' : '') + '" onclick="closeMenu();moveNavItem(' + i + ',1)">' +
        ic('chevD',16) + 'Move right</div>' +
      '<div class="menu__sep"></div>' +
      '<div class="menu__item menu__item--danger" onclick="closeMenu();removeNavItem(' + i + ')">' +
        ic('trash',16) + 'Remove from the bar</div>'));
}

/* ═════ GRID PICKERS — ONE MECHANIC, TWO USES (§30.25) ═════
   An icon picker and a colour picker are the same control with a different
   cell, and a modal reads its value back by element id rather than through a
   named global per picker — which is what let the nav bar's own picker be
   reused for tiles with no second copy of the toggle logic. */
let PICKED = {};
function pickerRead(id, fallback){
  return PICKED[id] === undefined ? fallback : PICKED[id];
}
function pickerSet(id, v){
  PICKED[id] = v;
  const w = $(id); if(!w) return;
  const btns = w.querySelectorAll('[data-pick]');
  Array.prototype.forEach.call(btns, b => b.classList.toggle('is-on', b.getAttribute('data-pick') === v));
}
function iconPickerHtml(id, list, sel){
  PICKED[id] = sel;
  return '<div class="icopick" id="' + id + '">' +
    list.map(k => '<button class="icopick__b' + (sel === k ? ' is-on' : '') + '" data-pick="' + k + '" ' +
      'onclick="pickerSet(\'' + id + '\',\'' + k + '\')" title="' + esc(k) + '">' + ic(k,20) + '</button>').join('') +
  '</div>';
}
function swatchPickerHtml(id, sel){
  PICKED[id] = sel;
  return '<div class="swatch" id="' + id + '">' +
    BADGE_COLORS.map(c => '<button class="swatch__b' + (sel === c.k ? ' is-on' : '') + '" data-pick="' + c.k + '" ' +
      'onclick="pickerSet(\'' + id + '\',\'' + c.k + '\')" title="' + esc(c.label) + '">' +
      '<span class="swatch__d' + (c.v ? '' : ' swatch__d--none') + '"' +
        (c.v ? ' style="background:' + c.v + '"' : '') + '></span>' +
    '</button>').join('') +
  '</div>';
}

/* ── THE ITEM EDITOR ──
   A modal, per §30.13's "Create follows size": three fields fit one form. */
function navItemModal(i){
  const h = artifactOf('home', state.openHome); if(!h) return;
  const it = h.nav[i]; if(!it) return;
  const pinned = it.target === 'home';
  const free = navFreeTargets(h, i);
  openModal('narrow',
    '<div class="mbox__head"><div class="mbox__head-b">' +
      '<div class="mbox__title">Navigation slot ' + (i+1) + ' of ' + h.nav.length + '</div>' +
      '<div class="mbox__sub">The app&#39;s bottom bar (§4.2) — app-level chrome, not a Home tile. ' +
        'Three things are authorable: the label, the screen it opens and the icon.</div>' +
    '</div></div>' +
    '<div class="mbox__body mbox__body--plain">' +
      '<label class="pop__l">Label</label>' +
      '<input class="tinput" id="nvLabel" value="' + esc(it.label) + '" maxlength="24" ' +
        'placeholder="e.g. Work" oninput="navLabelHint()">' +
      '<div class="pop__note" id="nvHint"></div>' +
      '<label class="pop__l">Opens</label>' +
      (pinned
        ? '<div class="pop__note"><b>' + ic('lock',14) + ' Protected — Home.</b> Slot 1 is the only route back ' +
            'to Home while browsing, so the screen and the position are both fixed. The label and icon are yours.</div>'
        : '<select class="tinput" id="nvTarget">' +
            free.map(t => '<option value="' + t.id + '"' + (it.target === t.id ? ' selected' : '') + '>' +
              esc(t.label) + '</option>').join('') +
          '</select>' +
          '<div class="pop__note">Screens only. <b>There is no create target</b>, and that is structural rather ' +
            'than a rule being enforced: a nav item is a destination you come back to, a create is an action, and ' +
            '§9.4.1 put creates behind the Create control. A screen already on the bar is not offered — a nav ' +
            'item carries no dataspy, so two items on one screen would be two identical destinations.</div>') +
      '<label class="pop__l">Icon</label>' +
      iconPickerHtml('nvIcons', NAV_ICONS, it.icon || 'list') +
      '<div class="pop__note"><b>Colour is not authorable.</b> The bar is monochrome white-on-dark glass ' +
        '(§23); Home&#39;s colour exception is for tiles, and this is not a tile. Notifications draws its own ' +
        'unread badge — a nav item has no count statement.</div>' +
    '</div>' +
    '<div class="mbox__foot mbox__foot--split">' +
      (pinned ? '<span></span>' : btn('Remove', {cls:'Button--error', icon:'trash', on:'closeModal();removeNavItem(' + i + ')'})) +
      '<span style="display:flex;gap:var(--s-2)">' +
        btn('Cancel', {on:'closeModal()'}) +
        btn('Save', {cls:'Button--contained Button--primary', on:'commitNavItem(' + i + ')'}) +
      '</span>' +
    '</div>');
  navLabelHint();
  const el = $('nvLabel'); if(el){ el.focus(); el.select(); }
}
/* THE BUDGET, LIVE. The device does not truncate — .bottom-nav-item has no
   nowrap rule — so an over-long label wraps to a second line at 320px. That
   is worth saying while it is being typed rather than reporting afterwards. */
function navLabelHint(){
  const h = artifactOf('home', state.openHome); if(!h) return;
  const el = $('nvLabel'), hint = $('nvHint'); if(!el || !hint) return;
  const n = h.nav.length, budget = navLabelBudget(n), len = el.value.trim().length;
  hint.innerHTML = 'At <b>' + n + '</b> item' + (n===1?'':'s') + ' each slot is <b>' +
    navSlotPx(n).toFixed(1) + 'px</b> at §31&#39;s 320px floor — about <b>' + budget +
    '</b> characters. ' +
    (len > budget
      ? '<b>' + len + ' characters wraps to a second line.</b> §4.2 shortened "Work Orders" to "Work" for ' +
        'exactly this reason.'
      : len + ' fits.');
}
function commitNavItem(i){
  const h = artifactOf('home', state.openHome); if(!h) return;
  const it = h.nav[i]; if(!it) return;
  const label = ($('nvLabel') && $('nvLabel').value || '').trim();
  if(!label){ toast('A navigation item needs a label — the bar is icon AND label'); return; }
  if(it.target !== 'home' && $('nvTarget')){
    const target = $('nvTarget').value;
    if(h.nav.some((o, oi) => oi !== i && o.target === target)){
      toast('Another slot already opens that screen'); return;
    }
    it.target = target;
  }
  it.label = label;
  it.icon = pickerRead('nvIcons', it.icon);
  h.updated = todayStr(); savePortal(); closeModal(); render();
  toast('Navigation bar updated');
}

/* ── REORDER BY DRAG ──
   Its own drag state, deliberately not tileDrag's: a nav item is not a tile,
   and pooling the two would let a catalogue tile be dropped onto the bar.
   NOTHING RE-RENDERS DURING dragover (§30.12). */
let navDrag = null;
function navDragStart(ev, i){
  navDrag = i;
  ev.dataTransfer.effectAllowed = 'move';
  try{ ev.dataTransfer.setData('text/plain','n'); }catch(e){}
  if(ev.currentTarget.classList) ev.currentTarget.classList.add('dragging');
  ev.stopPropagation();
}
function navDragOver(ev, i){
  if(navDrag === null) return;
  ev.preventDefault(); ev.stopPropagation();
  const el = ev.currentTarget;
  if(!el || !el.classList) return;
  if(i < 0){ el.classList.add('is-over'); return; }
  el.classList.remove('over-l'); el.classList.remove('over-r');
  el.classList.add(i <= navDrag ? 'over-l' : 'over-r');
}
function navDragEnd(){
  navDrag = null;
  document.querySelectorAll('.emu-navitem.dragging,.emu-navitem.over-l,.emu-navitem.over-r')
    .forEach(e => { e.classList.remove('dragging'); e.classList.remove('over-l'); e.classList.remove('over-r'); });
  const bar = $('navbar'); if(bar) bar.classList.remove('is-over');
}
function navDrop(ev, i){
  if(navDrag === null) return false;
  ev.preventDefault(); ev.stopPropagation();
  const h = artifactOf('home', state.openHome); if(!h){ navDragEnd(); return false; }
  const from = navDrag; navDragEnd();
  /* Dropping on the bar itself (i < 0) means "the end". Slot 1 stays Home's
     from both sides — clamped at the mutation rather than in the drag
     geometry, which is where the step-1 pin was got round once (§29.2). */
  let to = i < 0 ? h.nav.length - 1 : i;
  to = Math.max(1, Math.min(h.nav.length - 1, to));
  if(from === 0 || from === to) return false;
  const m = h.nav.splice(from, 1)[0];
  h.nav.splice(to, 0, m);
  h.updated = todayStr(); savePortal(); render();
  return true;
}

/* ═══════════════════════════════════════════════════════════════════════
   AREA — USER GROUPS: the other view of the same table
   ═══════════════════════════════════════════════════════════════════════
   This is the half §26.5 said nothing in the product does: answering "what
   does group X get?" It reads the SAME membership table the galleries write,
   so the two can never disagree — that was the condition on choosing the
   both-directions model.

   Carried over from the retired User Group Setup prototype (§21 listed what
   was worth keeping), and each one earns its place:
     · A BINDING SCREEN, NOT A CONFIG FORM — the only editable thing here is
       assignment. Never steps, never a policy, never a layout.
     · NO INSERT — a group is created in Security ▸ User Groups, so there is
       no Create button at all rather than a disabled one.
     · DECLARED vs. EFFECTIVE — explicit for this group, inherited from `*`,
       or not set. Three states, and the middle one is the reason the `*` row
       exists at all.
     · CROSS-DOMAIN CONSISTENCY — a workflow and an offline profile are
       authored separately and can disagree; only a group-side view can see
       it, which is most of why this area is worth having.
     · CAPABILITY GAPS REPORTED, NEVER WORKED AROUND.
   ═══════════════════════════════════════════════════════════════════════ */
function renderGroupsArea(){

function pickGroup(g){ state.selGroup = g; render(); }

/* NO GROUP ROLL-UP (2026-09-16). This was the biggest of them — every
   finding across all four artifact types, aggregated per group. It read as
   a dashboard, and a dashboard is the thing to build last, not first.
   groupIssues() is kept and still called by the assignment control, which
   is where a group-level violation can actually be prevented. */
function groupDetailHtml(g){
  return Object.keys(ARTIFACT_TYPES).map(type => groupTypeBand(g, type)).join('');
}

/* ── DECLARED vs. EFFECTIVE (§26.5 mechanic 2) ──
   Three states, and the middle one is why `*` exists: explicit for this
   group, inherited from the default, or not set. §11's fallback rule already
   makes "no row" meaningful; this is where it stops being invisible. */
function effectiveFor(g, type){
  const mine = artifactsForGroup(g, type);
  if(mine.length) return {state:'explicit', arts:mine.map(r => artifactOf(type, r.artifactId)).filter(Boolean)};
  if(g !== '*'){
    const dflt = artifactsForGroup('*', type);
    if(dflt.length) return {state:'inherited', arts:dflt.map(r => artifactOf(type, r.artifactId)).filter(Boolean)};
  }
  return {state:'unset', arts:[]};
}
const EFF_META = {
  explicit:  {label:'Explicit',  cls:'sev-info'},
  inherited: {label:'Inherited', cls:'sev-neutral'},
  unset:     {label:'Not set',   cls:'sev-neutral'},
};
function groupTypeBand(g, type){
  const t = ARTIFACT_TYPES[type];
  const eff = effectiveFor(g, type);
  const m = EFF_META[eff.state];
  const clash = allConflicts().filter(c => c.group === g && c.type === type);
  return '<div class="card" style="margin-bottom:var(--s-4)">' +
    '<div class="card__head">' + ic(t.icon,16) + '<span class="card__title">' + esc(t.plural) + '</span>' +
      '<span class="chip chip--fill chip--dense chip--lead ' + m.cls + '"><span class="chip__dot"></span>' +
        m.label + (eff.state === 'inherited' ? ' from *' : '') + '</span>' +
      '<span class="eyebrow" style="margin-left:auto">' + esc(assignRuleText(type)) + '</span>' +
    '</div>' +
    '<div class="card__body">' +
      (eff.arts.length
        ? eff.arts.map(a => groupArtRow(g, type, a, eff.state)).join('')
        : '<div class="menu__row-d">' + unsetCopy(type) + '</div>') +
      (clash.length
        ? '<div class="menu__row" style="color:var(--critical)">' + ic('alert',16) +
          '<div class="menu__row-b"><div class="menu__row-t">' + esc(clash[0].msg) + '</div>' +
          '<div class="menu__row-d">Un-assign one of them — which one is your call, not the screen\'s.</div></div></div>'
        : '') +
      '<div style="margin-top:var(--s-3)">' +
        btn('Assign a ' + t.label.toLowerCase(), {cls:'Button--sm', icon:'plus',
          on:'openGroupAssign(event,\'' + g + '\',\'' + type + '\')'}) +
      '</div>' +
    '</div>' +
  '</div>';
}
function unsetCopy(type){
  if(type === 'offline') return 'No profile — <b>online only</b>. That is a valid, deliberate provisioning choice, ' +
    'not a gap: Tier 0 and the outbox still apply, so the app works; it just cannot load work without a connection (§2.10).';
  if(type === 'home') return 'No Home layout assigned. The group gets no Home screen.';
  return 'No workflow assigned. This group falls back to §11\'s flat, unordered, ungated step rail.';
}
function groupArtRow(g, type, a, effState){
  const t = ARTIFACT_TYPES[type];
  return '<div class="menu__row">' +
    '<div class="menu__row-b">' +
      '<div class="menu__row-t">' + esc(artifactName(type, a)) +
        (type === 'workflow'
          ? ' ' + (a.freeForm ? '<span class="chip chip--dense chip--static">Free Form</span>'
                              : '<span class="chip chip--dense chip--static">' + esc(a.woType ? woTypeName(a.woType) : 'Any Type') + '</span>')
          : '') +
      '</div>' +
      '<div class="menu__row-d">' + esc(artSummary(type, a)) + '</div>' +
    '</div>' +
    (effState === 'explicit'
      ? btn('Un-assign', {cls:'Button--sm', on:'unassignFromGroup(\'' + type + '\',\'' + a.id + '\',\'' + g + '\')'})
      /* An inherited row is NOT editable from here — it belongs to `*`, and
         editing it from a member's side would re-provision every other
         member. Same rule §29.6 applied to the offline profile. */
      : '<span class="chip chip--dense chip--static" title="Belongs to the * default — edit it there">' +
        ic('lock',14) + 'from *</span>') +
  '</div>';
}
function artSummary(type, a){
  if(type === 'workflow') return (a.freeForm ? 'Free Form · ' : seqNodes(a).length + ' steps · ') + (a.fn || '');
  if(type === 'offline') return profileEnabledCount(a) + ' entities offline · cap ' + a.caps.rowCap + '/entity';
  if(type === 'home') return homeTileIds(a).length + ' tiles · ' + a.nav.length + ' nav slots';
  return '';
}
/* ── ONE POPOVER, ONE GROUP (reworked 2026-09-17) ──
   It used to open, take a click, and then open a SECOND popover — because
   the click went to toggleAssign(), which re-opens the artifact→groups
   control from the gallery side. Two different views of the same table,
   stacked, with the second one asking about every OTHER group. Nobody could
   tell what the second one was for, and the honest answer is that it was
   never meant to appear here.

   Now it is one popover, scoped to the group in the rail, and its SHAPE
   follows §30.13's cardinality rule rather than being uniform:

     workflow (per-wotype)  — checkboxes. A group legitimately holds several,
                              one per WO Type plus Free Form, so it stays
                              open and a clash is refused at the click.
     everything else        — radios, and it CLOSES on the pick. Exactly one
                              per group, so a pick is a replacement and there
                              is nothing further to do in the popover.

   The radio set includes NONE, so the control can express every state it is
   enforcing. Without it, "exactly one" would be settable but never
   unsettable from the control that sets it. */
function openGroupAssign(ev, g, type){
  const t = artType(type);
  const arts = allArtifacts(type);
  const multi = t.cardinality === 'per-wotype';
  const mine = artifactsForGroup(g, type).map(r => r.artifactId);
  const inherits = g !== '*' && !mine.length && artifactsForGroup('*', type).length > 0;

  const row = a => {
    const on = mine.indexOf(a.id) > -1;
    /* Predicted before the click, from this side too (§30.2). Only a
       multi-select can clash: a radio pick replaces, so it cannot. */
    const clash = multi && !on ? wouldClash(type, a.id, g) : null;
    return '<div class="menu__item' + (clash ? ' is-warn' : '') + '" ' +
      'onclick="groupAssignPick(\'' + type + '\',\'' + a.id + '\',\'' + g + '\')">' +
      (multi
        ? '<span class="cbx' + (on?' is-on':'') + '">' + ic('check',14) + '</span>'
        : '<span class="rdo' + (on?' is-on':'') + '"><span class="rdo__dot"></span></span>') +
      /* NO SUMMARY LINE UNDER THE OPTION (2026-09-23, user direction). A
         picker's job is to name the choices; describing each one turned a
         six-row radio list into six paragraphs, and the description was the
         first thing to go stale (the home branch counted h.tiles, which
         stopped existing when sections landed — every layout read "0
         tiles"). A CLASH still shows, because that is a consequence, not a
         description. */
      '<span class="menu__row-b"><span class="menu__row-t">' + esc(artifactName(type, a)) + '</span>' +
      (clash ? '<span class="menu__row-d" style="color:var(--critical)">' + esc(clash) + '</span>' : '') +
      '</span></div>';
  };

  const noneRow = multi ? '' :
    '<div class="menu__item" onclick="groupAssignPick(\'' + type + '\',\'\',\'' + g + '\')">' +
      '<span class="rdo' + (mine.length?'':' is-on') + '"><span class="rdo__dot"></span></span>' +
      '<span class="menu__row-b"><span class="menu__row-t">None</span>' +
      '<span class="menu__row-d">' + (inherits
        ? 'Fall back to the * default'
        : (type === 'offline' ? 'Online only — valid and deliberate (§2.10)' : 'No layout — the standard menu')) +
      '</span></span></div>' +
    '<div class="menu__sep"></div>';

  openPopAt(ev,
    '<div class="pop__head"><div class="pop__title">' + esc(t.plural) + ' for ' + esc(g) + '</div>' +
      '<div class="pop__sub">' + esc(assignRuleText(type)) +
        (multi ? '' : ' Picking one replaces what is there.') + '</div></div>' +
    '<div class="pop__body">' +
      (arts.length ? noneRow + arts.map(row).join('')
      : '<div class="menu__row-d" style="padding:var(--s-3)">Nothing to assign — none exist yet.</div>') +
    '</div>' +
    /* A multi-select needs a way out; a radio closes itself, so giving it a
       Done button would be a second click for a finished job. */
    (multi
      ? '<div class="pop__foot"><button class="Button Button--contained Button--primary" onclick="closePop()">Done</button></div>'
      : ''));
}
/* THE ONE WRITER FROM THE GROUP SIDE. It never re-opens the gallery-side
   control, which is what produced the second popover. */
function groupAssignPick(type, artifactId, g){
  const t = artType(type);
  if(t.cardinality === 'per-wotype'){
    const on = isAssigned(type, artifactId, g);
    if(!on){
      const clash = wouldClash(type, artifactId, g);
      if(clash){ toast(esc(g) + ' ' + clash + ' — un-assign that one first'); return; }
    }
    setAssigned(type, artifactId, g, !on);
    render();
    /* Re-open THIS popover, so the ticks update in place. lastMenuEv is the
       original click, which is still where the control belongs. */
    openGroupAssign(lastMenuEv, g, type);
    return;
  }
  /* PER-GROUP: a pick REPLACES. Every other row for this group and type goes,
     which is the difference between a radio and a checkbox being honest and
     the screen reporting a collision the user was invited to create. */
  const had = artifactsForGroup(g, type).map(r => r.artifactId);
  had.forEach(id => setAssigned(type, id, g, false));
  if(artifactId) setAssigned(type, artifactId, g, true);
  closePop();
  render();
  const a = artifactId ? artifactOf(type, artifactId) : null;
  toast(a
    ? esc(g) + ' → ' + artifactName(type, a) + (had.length ? ' (replaced)' : '')
    : esc(g) + ' → no ' + t.label.toLowerCase());
}
function unassignFromGroup(type, id, g){
  setAssigned(type, id, g, false);
  render(); toast('Un-assigned from ' + g);
}

/* ── CROSS-DOMAIN CONSISTENCY ──
   The strongest reason this area exists: these faults are BETWEEN domains,
   and no single designer can see one because each sees its own domain. */
function groupIssues(g){
  const out = [];
  allConflicts().filter(c => c.group === g).forEach(c => out.push({
    sev:'error', area:ARTIFACT_TYPES[c.type].area,
    msg:'<b>' + esc(ARTIFACT_TYPES[c.type].plural) + '</b> — ' + esc(c.msg),
    fix:c.arts.map(a => esc(artifactName(c.type, a))).join('  ·  '),
  }));

  /* A workflow assigned but no offline profile: legal, and worth stating
     rather than leaving to be discovered on a device with no signal. */
  const wf = effectiveFor(g, 'workflow');
  const off = effectiveFor(g, 'offline');
  if(wf.state !== 'unset' && off.state === 'unset'){
    out.push({sev:'info', area:'offline',
      msg:'Has a workflow but <b>no offline profile</b> — this group is online only.',
      fix:'Valid and deliberate (§2.10). Flagged because the two are authored separately and only this view sees both.'});
  }
  /* A profile whose own authoring is incomplete, surfacing on the group that
     would actually receive it. */
  off.arts.forEach(p => {
    const errs = profileIssues(p).filter(i => i.sev === 'error');
    if(errs.length) out.push({sev:'error', area:'offline',
      msg:'Offline profile <b>' + esc(p.name) + '</b> has ' + errs.length + ' unresolved rule' + (errs.length===1?'':'s') + '.',
      fix:errs.map(e => esc(e.entity.label) + ' ' + esc(e.msg)).join('  ·  ')});
  });
  /* NOTE: this no longer re-reports capability gaps or home-layout gaps.
     Those belong to the artifact, are already shown on the offending node
     or tile, and aggregating them here was how this function turned into a
     dashboard feed. It is kept for the assignment control's own checks. */
  /* A home layout with a tile that has nothing to count. */
  effectiveFor(g, 'home').arts.forEach(h => {
    homeIssues(h).filter(i => i.sev === 'error').forEach(i => out.push({
      sev:'error', area:'home', msg:'Home layout <b>' + esc(h.name) + '</b> — ' + esc(i.msg)}));
  });
  return out;
}

/* COPY CARRIES NO ASSIGNMENTS. A copy that inherited them would instantly
   break the one-per-Type rule for every group on the original — the copy
   would be a second workflow for the same (group, Type) pair before the
   admin had touched anything. §26.5.1's "assign is not copy" seen from the
   copy side. */
function copyWf(id){
  const src = WFS.find(x=>x.id===id); if(!src) return;
  const dup = deepCopy(src);
  dup.id = 'wf-' + Math.random().toString(36).slice(2,8);
  dup.desc = src.desc + ' (copy)';
  /* A copy carries NO membership (§30.2): inheriting it would violate the
     one-per-(group, Type) rule on creation, before the admin touched
     anything. With the table, "carries none" means simply not inserting
     rows — there is no array to clear. */
  dup.updated = todayStr();
  /* The function and the §12 completion trio are part of what the workflow
     IS, so unlike assignments they DO copy. deepCopy already brought them;
     this normalises in case the source predates them. */
  normalizeWf(dup);
  /* Fresh nids, or the copy's forks point at the ORIGINAL's steps and
     editing one workflow re-routes the other. */
  const map = {};
  dup.nodes.forEach(n => { const old = n.nid; n.nid = nid(); map[old] = n.nid; });
  dup.nodes.forEach(n => {
    if(n.kind !== 'fork') return;
    ['yesTarget','noTarget'].forEach(k => {
      if(n[k] && n[k] !== '__end') n[k] = map[n[k]] || null;
    });
  });
  WFS.splice(WFS.indexOf(src)+1, 0, dup);
  saveWFS(); renderGallery();
  toast('Copied — no groups assigned to the copy');
}
function deleteWf(id){
  const w = WFS.find(x=>x.id===id); if(!w) return;
  const n = groupsOf('workflow', w.id).length;
  confirmBox({
    title:'Delete this workflow?',
    sub: esc(w.desc),
    body: n
      ? '<div style="font-size:12.5px;line-height:1.6">It is assigned to <b>' + n + '</b> user group' + (n===1?'':'s') +
        ' (' + groupsOf('workflow', w.id).map(esc).join(', ') + ').</div>' +
        '<ul class="bullets"><li>Those groups fall back to <b>§11\'s flat, unordered, ungated rail</b> for this WO Type until another workflow is assigned.</li></ul>'
      : '<div style="font-size:12.5px;line-height:1.6">No user groups are assigned to it, so nothing on a device changes.</div>',
    danger:true, ok:'Delete workflow',
    onOk:function(){
      WFS.splice(WFS.indexOf(w),1); dropAssignmentsFor('workflow', w.id); saveWFS();
      if(state.wfId===w.id) backToGallery(); else renderGallery();
      toast('Workflow deleted');
    }});
}
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function createWf(){
  const w = normalizeWf({
    id:'wf-' + Math.random().toString(36).slice(2,8),
    desc:'', woType:null, freeForm:false, notes:'',
    /* WSJOBS is the base screen, so it is the only defensible default — a
       clone would silently narrow what the author can place (§26.2). */
    fn:'WSJOBS',
    updated:todayStr(), nodes:[],
  });
  WFS.unshift(w); saveWFS();
  state.wfId = w.id; state.view='edit'; state.selNid=null; state.dsnOpen=false;
  render();
  const d = document.querySelector('#banner input');
  if(d) d.focus();
}
function openWf(id){
  if(!WFS.find(x=>x.id===id)) return;
  state.wfId = id; state.view='edit'; state.selNid=null; state.dsnOpen=false;
  closeMenu(); closeModal(); render();
}
